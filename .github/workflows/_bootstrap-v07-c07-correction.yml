name: Bootstrap V0.7 C-07 correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - fix/project-roadmap-v07-c07-identity-semantics-20260730-v1
    paths:
      - tools/_bootstrap_v07_parts/**
      - .github/workflows/_bootstrap-v07-c07-correction.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/project-roadmap-v07-c07-identity-semantics-20260730-v1' || github.ref_name == 'fix/project-roadmap-v07-c07-identity-semantics-20260730-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/project-roadmap-v07-c07-identity-semantics-20260730-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble approved correction
        run: |
          cat tools/_bootstrap_v07_parts/part* > tools/_bootstrap_apply_v07_c07_correction.py
          test "$(sha256sum tools/_bootstrap_apply_v07_c07_correction.py | cut -d' ' -f1)" = "62f13bd26fb599e1148866974e379770bbd944062f779795a53ab486248fdd4e"
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          path = Path("tools/_bootstrap_apply_v07_c07_correction.py")
          wrapper = path.read_text(encoding="utf-8")
          match = re.search(r"b64decode\(\n('.*')\n\)\)", wrapper, re.DOTALL)
          if match is None:
              raise SystemExit("bootstrap payload missing")
          source = gzip.decompress(base64.b64decode(ast.literal_eval(match.group(1)))).decode("utf-8")
          old = '''    path = "host/greenhouse-manager/pyproject.toml"
              text = replace_once(text, 'version = "0.4.96"', 'version = "0.4.97"', label="version bump")
          '''.replace("              text", "    text")
          new = '''    path = "host/greenhouse-manager/pyproject.toml"
              text = read(path)
              text = replace_once(text, 'version = "0.4.96"', 'version = "0.4.97"', label="version bump")
          '''.replace("              text", "    text")
          if source.count(old) != 1:
              raise SystemExit("version patch anchor mismatch")
          source = source.replace(old, new, 1)
          digest = hashlib.sha256(source.encode("utf-8")).hexdigest()
          if digest != "b16b347e02ae969a89ccb0b35f3444dc3d05dc8502921ed4f76a12c8dcfbf4c9":
              raise SystemExit(f"fixed source digest mismatch: {digest}")
          path.write_text(source, encoding="utf-8")
          PY
          rm -rf tools/_bootstrap_v07_parts
      - name: Apply approved correction
        run: python tools/_bootstrap_apply_v07_c07_correction.py
      - name: Preserve compatible NODE_ID conflict wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("host/greenhouse-manager/src/greenhouse_manager/runtime/registration.py")
          text = path.read_text(encoding="utf-8")
          old = "node_id has already been used and is permanently reserved"
          new = "node_id is already assigned or has been used and is permanently reserved"
          if old not in text:
              raise SystemExit("NODE_ID conflict wording anchor missing")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Compile changed Python
        run: python -m compileall -q host/greenhouse-manager/src host/greenhouse-manager/tests infra/compose/c07-node-retirement/verify.py
      - name: Install greenhouse-manager
        run: python -m pip install -e 'host/greenhouse-manager[dev]'
      - name: Run focused tests
        run: pytest -q host/greenhouse-manager/tests/runtime/test_registration.py host/greenhouse-manager/tests/runtime/test_credential_lifecycle.py host/greenhouse-manager/tests/runtime/test_node_retirement_runtime.py host/greenhouse-manager/tests/ops/test_registration_cli.py host/greenhouse-manager/tests/ops/test_node_retirement_cli.py
      - name: Ruff
        run: ruff check host/greenhouse-manager/src host/greenhouse-manager/tests infra/compose/c07-node-retirement/verify.py
      - name: Verify bootstrap files removed
        run: |
          test ! -e tools/_bootstrap_apply_v07_c07_correction.py
          test ! -e tools/_bootstrap_v07_parts
          test ! -e .github/workflows/_bootstrap-v07-c07-correction.yml
      - name: Commit approved correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(c07): align roadmap V0.7 identity lifecycle"
          git push origin HEAD:fix/project-roadmap-v07-c07-identity-semantics-20260730-v1
