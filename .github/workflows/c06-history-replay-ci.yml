name: C-06 history replay host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/0005-c06-history-replay.md"
      - "docs/adr/0005-c06-history-replay-final-review-addendum.md"
      - "host/greenhouse-manager/**"
      - "tools/c06_history_replay_host_only_harness.py"
      - ".github/workflows/c06-history-replay-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/0005-c06-history-replay.md"
      - "docs/adr/0005-c06-history-replay-final-review-addendum.md"
      - "host/greenhouse-manager/**"
      - "tools/c06_history_replay_host_only_harness.py"
      - ".github/workflows/c06-history-replay-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorized stack and reviewed predecessors
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_REF: feature/h0h1-v07-init-portable-restore-hostonly-20260802-v1
          EXPECTED_BASE_SHA: d628b896314efd0aff58da151e3669eb7fe21d44
          PRIOR_REVIEWED_HEAD_SHA: dac038c3595c80ac7d1a0666795effbbab4a4e4e
          FINAL_REVIEWED_HEAD_SHA: ffdfbc3dc64620881ea0732d0d964623439d0bba
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$ACTUAL_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$ACTUAL_BASE_SHA" "$ACTUAL_HEAD_SHA")" = "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$PRIOR_REVIEWED_HEAD_SHA" "$ACTUAL_HEAD_SHA"
          git merge-base --is-ancestor "$FINAL_REVIEWED_HEAD_SHA" "$ACTUAL_HEAD_SHA"
          echo "C06_PRIOR_REVIEWED_HEAD_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"
          echo "C06_FINAL_REVIEWED_HEAD_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install greenhouse-manager development dependencies
        working-directory: host/greenhouse-manager
        run: python -m pip install -e '.[dev]'

      - name: Lint C-06 implementation
        run: |
          ruff check \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_replay.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_store.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_worker.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/topics.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/config.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/mqtt_service.py \
            host/greenhouse-manager/tests/runtime/history_samples.py \
            host/greenhouse-manager/tests/runtime/test_history_config.py \
            host/greenhouse-manager/tests/runtime/test_history_replay.py \
            host/greenhouse-manager/tests/runtime/test_history_schema_contract.py \
            host/greenhouse-manager/tests/runtime/test_history_store.py \
            host/greenhouse-manager/tests/runtime/test_history_topics.py \
            host/greenhouse-manager/tests/runtime/test_history_worker.py \
            host/greenhouse-manager/tests/runtime/test_mqtt_history_service.py \
            host/greenhouse-manager/tests/runtime/test_history_final_review.py \
            tools/c06_history_replay_host_only_harness.py

      - name: Run C-06 host-only tests
        working-directory: host/greenhouse-manager
        run: |
          pytest -q \
            tests/runtime/test_history_config.py \
            tests/runtime/test_history_replay.py \
            tests/runtime/test_history_schema_contract.py \
            tests/runtime/test_history_store.py \
            tests/runtime/test_history_topics.py \
            tests/runtime/test_history_worker.py \
            tests/runtime/test_mqtt_history_service.py \
            tests/runtime/test_history_final_review.py \
            tests/runtime/test_mqtt_service.py \
            tests/runtime/test_ingest.py

      - name: Build secret-free host-only evidence
        env:
          PYTHONPATH: host/greenhouse-manager/src
          C06_AUTHORIZATION: D1-C06A-PR261-FINAL-REVIEW-BLOCKERS-REMEDIATION-AND-HOST-ONLY-REVALIDATION-20260803-01
          C06_PRIOR_REVIEWED_HEAD_SHA: dac038c3595c80ac7d1a0666795effbbab4a4e4e
          C06_FINAL_REVIEWED_HEAD_SHA: ffdfbc3dc64620881ea0732d0d964623439d0bba
          C06_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          C06_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          C06_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          C06_BASE_REF: ${{ github.base_ref || github.ref_name }}
          C06_EXACT_BASE_VERIFIED: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha == 'd628b896314efd0aff58da151e3669eb7fe21d44' && github.event.pull_request.base.ref == 'feature/h0h1-v07-init-portable-restore-hostonly-20260802-v1' }}
        run: |
          binding_flags=()
          if [ "$C06_EXACT_BASE_VERIFIED" = "true" ]; then
            binding_flags+=(--exact-base-verified)
          fi
          if [ "$C06_PRIOR_REVIEWED_HEAD_ANCESTOR_VERIFIED" = "true" ]; then
            binding_flags+=(--prior-reviewed-head-ancestor-verified)
          fi
          if [ "$C06_FINAL_REVIEWED_HEAD_ANCESTOR_VERIFIED" = "true" ]; then
            binding_flags+=(--final-reviewed-head-ancestor-verified)
          fi
          python tools/c06_history_replay_host_only_harness.py \
            --output artifacts/c06-history-replay-host-only-report.json \
            --authorization "$C06_AUTHORIZATION" \
            --prior-reviewed-head-sha "$C06_PRIOR_REVIEWED_HEAD_SHA" \
            --final-reviewed-head-sha "$C06_FINAL_REVIEWED_HEAD_SHA" \
            --source-sha "$C06_SOURCE_SHA" \
            --source-ref "$C06_SOURCE_REF" \
            --base-sha "$C06_BASE_SHA" \
            --base-ref "$C06_BASE_REF" \
            "${binding_flags[@]}"
          (
            cd artifacts
            sha256sum c06-history-replay-host-only-report.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: c06-history-replay-host-only-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
