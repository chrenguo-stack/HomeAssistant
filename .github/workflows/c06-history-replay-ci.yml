name: C-06 history replay host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/0005-c06-history-replay.md"
      - "host/greenhouse-manager/**"
      - "tools/c06_history_replay_host_only_harness.py"
      - ".github/workflows/c06-history-replay-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/0005-c06-history-replay.md"
      - "host/greenhouse-manager/**"
      - "tools/c06_history_replay_host_only_harness.py"
      - ".github/workflows/c06-history-replay-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install greenhouse-manager development dependencies
        working-directory: host/greenhouse-manager
        run: python -m pip install -e '.[dev]'

      - name: Lint C-06 implementation
        run: |
          ruff check \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_replay.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_store.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/topics.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/config.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/mqtt_service.py \
            host/greenhouse-manager/tests/runtime/history_samples.py \
            host/greenhouse-manager/tests/runtime/test_history_config.py \
            host/greenhouse-manager/tests/runtime/test_history_replay.py \
            host/greenhouse-manager/tests/runtime/test_history_schema_contract.py \
            host/greenhouse-manager/tests/runtime/test_history_store.py \
            host/greenhouse-manager/tests/runtime/test_history_topics.py \
            host/greenhouse-manager/tests/runtime/test_mqtt_history_service.py \
            tools/c06_history_replay_host_only_harness.py

      - name: Run C-06 host-only tests
        working-directory: host/greenhouse-manager
        run: |
          pytest -q \
            tests/runtime/test_history_config.py \
            tests/runtime/test_history_replay.py \
            tests/runtime/test_history_schema_contract.py \
            tests/runtime/test_history_store.py \
            tests/runtime/test_history_topics.py \
            tests/runtime/test_mqtt_history_service.py \
            tests/runtime/test_mqtt_service.py \
            tests/runtime/test_ingest.py

      - name: Build secret-free host-only evidence
        env:
          PYTHONPATH: host/greenhouse-manager/src
        run: |
          python tools/c06_history_replay_host_only_harness.py \
            --output artifacts/c06-history-replay-host-only-report.json
          sha256sum artifacts/c06-history-replay-host-only-report.json \
            > artifacts/SHA256SUMS

      - name: Upload host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: c06-history-replay-host-only-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
