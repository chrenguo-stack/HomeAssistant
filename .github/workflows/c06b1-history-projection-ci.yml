name: C06-B1 history projection host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/0006-c06b1-history-projection-core.md"
      - "host/greenhouse-manager/pyproject.toml"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection*.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_store.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_replay.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/ha_discovery.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.telemetry-1.schema.json"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json"
      - "host/greenhouse-manager/tests/runtime/history_samples.py"
      - "host/greenhouse-manager/tests/runtime/test_history_projection.py"
      - "host/greenhouse-manager/tests/runtime/test_history_projection_store.py"
      - "tools/c06b1_history_projection_host_only_harness.py"
      - ".github/workflows/c06b1-history-projection-ci.yml"
      - ".github/workflows/c06-history-replay-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/0006-c06b1-history-projection-core.md"
      - "host/greenhouse-manager/pyproject.toml"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection*.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_store.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_replay.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/ha_discovery.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.telemetry-1.schema.json"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json"
      - "host/greenhouse-manager/tests/runtime/history_samples.py"
      - "host/greenhouse-manager/tests/runtime/test_history_projection.py"
      - "host/greenhouse-manager/tests/runtime/test_history_projection_store.py"
      - "tools/c06b1_history_projection_host_only_harness.py"
      - ".github/workflows/c06b1-history-projection-ci.yml"
      - ".github/workflows/c06-history-replay-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorized C06-B1 stack or exact reviewed descendant
        if: github.event_name == 'pull_request'
        env:
          C06_BASE_REF: feature/c06-history-replay-protocol-storage-hostonly-20260803-v1
          C06_BASE_SHA: d0e00d264d41755101c80ad37a1f6fa661892276
          C06B1_BASE_REF: feature/c06b1-history-projection-core-hostonly-20260803-v1
          C06B1_BASE_SHA: 0ec7bb3d17f08f6e26d475ce6f2a55e5bea39434
          C06B2A_BASE_REF: feature/c06b2a-ha-target-ledger-custom-integration-20260803-v1
          C06B2A_BASE_SHA: 77259fe2ad0403a620c78626e01862804c7af6e4
          C06B2B_PR268_BASE_REF: feature/c06b2b-recorder-replacement-expected-value-readback-pr267-successor-20260804-v1
          C06B2B_PR268_BASE_SHA: 249606dbab585e3b3beed47e77b9ae77a64e4291
          C06B2B_PR268_MERGED_SHA: ed8b25b9183e035fe413e674dfdd875f54870f19
          C06B2B_PR268_UPSTREAM_BASE_REF: feature/c06b2b-recorder-readback-utc-canonicalization-pr266-successor-20260804-v1
          C06B2B_PR268_UPSTREAM_BASE_SHA: 4c29fced18e8d45cac78f71ec82112bcf65a8cef
          C06B2B_PR269_BASE_REF: feature/c06b2b-pr268-c06b1-inherited-descendant-gates-20260804-v1
          C06B2B_PR269_BASE_SHA: 0cc8daa58fdf1d1200af3c3c2c3ed53db2963b41
          C06B2B_PR267_STACK_BASE_REF: feature/c06b2b-recorder-import-queue-barrier-c06b2c-successor-20260804-v1
          C06B2B_PR267_STACK_BASE_SHA: 21f288c1c47f7801e21e77ada460c6353e371e14
          C06B2B_PR267_REPAIR_BASE_SHA: f98d93e43d10c32cd60580c80c484d829c8f6900
          CURRENT_MAIN_INTEGRATION_REF: main
          CURRENT_MAIN_INTEGRATION_SHA: 0ba33b6ddf19f10afd69d802a79d5699a22c80bb
          PRESERVED_PR267_HEAD_SHA: 2d444f3e392249c8d7bf1a1aa036e738a418d1cb
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTUAL_BASE_REF" = "$C06_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B1_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B1_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B2A_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B2A_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B2B_PR268_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B2B_PR268_BASE_SHA" || \
              test "$ACTUAL_BASE_SHA" = "$C06B2B_PR268_MERGED_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B2B_PR268_UPSTREAM_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B2B_PR268_UPSTREAM_BASE_SHA" || \
              test "$ACTUAL_BASE_SHA" = "$C06B2B_PR267_REPAIR_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B2B_PR269_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B2B_PR269_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$C06B2B_PR267_STACK_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$C06B2B_PR267_STACK_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$CURRENT_MAIN_INTEGRATION_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$CURRENT_MAIN_INTEGRATION_SHA"
            git merge-base --is-ancestor "$PRESERVED_PR267_HEAD_SHA" "$ACTUAL_HEAD_SHA"
          else
            echo "unsupported C06-B1 stack base: $ACTUAL_BASE_REF" >&2
            exit 1
          fi
          test "$(git merge-base "$ACTUAL_BASE_SHA" "$ACTUAL_HEAD_SHA")" = "$ACTUAL_BASE_SHA"
          git merge-base --is-ancestor "$C06B1_BASE_SHA" "$ACTUAL_HEAD_SHA" || \
            test "$ACTUAL_BASE_SHA" = "$C06_BASE_SHA"
          if [ "$ACTUAL_BASE_SHA" = "$C06B2B_PR267_STACK_BASE_SHA" ] || [ "$ACTUAL_BASE_SHA" = "$C06B2B_PR267_REPAIR_BASE_SHA" ]; then
            git merge-base --is-ancestor "$C06B2B_PR267_REPAIR_BASE_SHA" "$ACTUAL_HEAD_SHA"
          fi
          echo "C06B1_BASE_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install greenhouse-manager development dependencies
        working-directory: host/greenhouse-manager
        run: python -m pip install -e '.[dev]'

      - name: Validate C06-B1 projection schema JSON
        run: |
          python -m json.tool \
            host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json \
            >/dev/null

      - name: Lint C06-B1 implementation
        run: |
          ruff check \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection*.py \
            host/greenhouse-manager/tests/runtime/test_history_projection.py \
            host/greenhouse-manager/tests/runtime/test_history_projection_store.py \
            tools/c06b1_history_projection_host_only_harness.py

      - name: Run C06-B1 host-only tests and shared regressions
        working-directory: host/greenhouse-manager
        run: |
          pytest -q \
            tests/runtime/test_history_projection.py \
            tests/runtime/test_history_projection_store.py \
            tests/runtime/test_history_store.py \
            tests/runtime/test_history_final_review.py \
            tests/runtime/test_ha_discovery.py

      - name: Build secret-free C06-B1 remediation evidence
        env:
          PYTHONPATH: host/greenhouse-manager/src
          C06B1_AUTHORIZATION: D1-C06B1-PR262-READ-ONLY-REVIEW-BLOCKERS-REMEDIATION-AND-HOST-ONLY-REVALIDATION-20260803-01
          C06B1_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          C06B1_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          C06B1_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          C06B1_BASE_REF: ${{ github.base_ref || github.ref_name }}
          C06B1_EXACT_BASE_VERIFIED: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.base.sha == 'd0e00d264d41755101c80ad37a1f6fa661892276' && github.event.pull_request.base.ref == 'feature/c06-history-replay-protocol-storage-hostonly-20260803-v1') || (github.event.pull_request.base.sha == '0ec7bb3d17f08f6e26d475ce6f2a55e5bea39434' && github.event.pull_request.base.ref == 'feature/c06b1-history-projection-core-hostonly-20260803-v1') || (github.event.pull_request.base.sha == '77259fe2ad0403a620c78626e01862804c7af6e4' && github.event.pull_request.base.ref == 'feature/c06b2a-ha-target-ledger-custom-integration-20260803-v1') || (github.event.pull_request.base.sha == '249606dbab585e3b3beed47e77b9ae77a64e4291' && github.event.pull_request.base.ref == 'feature/c06b2b-recorder-replacement-expected-value-readback-pr267-successor-20260804-v1') || (github.event.pull_request.base.sha == 'ed8b25b9183e035fe413e674dfdd875f54870f19' && github.event.pull_request.base.ref == 'feature/c06b2b-recorder-replacement-expected-value-readback-pr267-successor-20260804-v1') || (github.event.pull_request.base.sha == '4c29fced18e8d45cac78f71ec82112bcf65a8cef' && github.event.pull_request.base.ref == 'feature/c06b2b-recorder-readback-utc-canonicalization-pr266-successor-20260804-v1') || (github.event.pull_request.base.sha == '0cc8daa58fdf1d1200af3c3c2c3ed53db2963b41' && github.event.pull_request.base.ref == 'feature/c06b2b-pr268-c06b1-inherited-descendant-gates-20260804-v1') || (github.event.pull_request.base.sha == '21f288c1c47f7801e21e77ada460c6353e371e14' && github.event.pull_request.base.ref == 'feature/c06b2b-recorder-import-queue-barrier-c06b2c-successor-20260804-v1') || (github.event.pull_request.base.sha == 'f98d93e43d10c32cd60580c80c484d829c8f6900' && github.event.pull_request.base.ref == 'feature/c06b2b-recorder-readback-utc-canonicalization-pr266-successor-20260804-v1') || (github.event.pull_request.base.sha == '0ba33b6ddf19f10afd69d802a79d5699a22c80bb' && github.event.pull_request.base.ref == 'main')) }}
        run: |
          binding_flags=()
          if [ "$C06B1_EXACT_BASE_VERIFIED" = "true" ]; then
            binding_flags+=(--exact-base-verified)
          fi
          if [ "$C06B1_BASE_ANCESTOR_VERIFIED" = "true" ]; then
            binding_flags+=(--base-ancestor-verified)
          fi
          python tools/c06b1_history_projection_host_only_harness.py \
            --output artifacts/c06b1-history-projection-host-only-report.json \
            --authorization "$C06B1_AUTHORIZATION" \
            --source-sha "$C06B1_SOURCE_SHA" \
            --source-ref "$C06B1_SOURCE_REF" \
            --base-sha "$C06B1_BASE_SHA" \
            --base-ref "$C06B1_BASE_REF" \
            "${binding_flags[@]}"
          (
            cd artifacts
            sha256sum c06b1-history-projection-host-only-report.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload C06-B1 host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: c06b1-history-projection-host-only-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
