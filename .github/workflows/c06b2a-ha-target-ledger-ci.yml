name: C06-B2A HA target ledger host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/c06b2_ha_projection_protocol.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-*.schema.json"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json"
      - "host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py"
      - "host/homeassistant/custom_components/greenhouse_history/**"
      - "tools/c06b2a_ha_target_ledger_host_only_harness.py"
      - ".github/workflows/c06b2a-ha-target-ledger-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/c06b2_ha_projection_protocol.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-*.schema.json"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json"
      - "host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py"
      - "host/homeassistant/custom_components/greenhouse_history/**"
      - "tools/c06b2a_ha_target_ledger_host_only_harness.py"
      - ".github/workflows/c06b2a-ha-target-ledger-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: host/homeassistant

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorized C06-B2A stack or exact B2B descendant
        if: github.event_name == 'pull_request'
        env:
          ORIGINAL_BASE_REF: feature/c06b1-history-projection-core-hostonly-20260803-v1
          ORIGINAL_BASE_SHA: 0ec7bb3d17f08f6e26d475ce6f2a55e5bea39434
          B2A_BASE_REF: feature/c06b2a-ha-target-ledger-custom-integration-20260803-v1
          B2A_BASE_SHA: 77259fe2ad0403a620c78626e01862804c7af6e4
          PR267_BASE_REF: feature/c06b2b-recorder-readback-utc-canonicalization-pr266-successor-20260804-v1
          PR267_BASE_SHA: 4c29fced18e8d45cac78f71ec82112bcf65a8cef
          PR267_STACK_BASE_REF: feature/c06b2b-recorder-import-queue-barrier-c06b2c-successor-20260804-v1
          PR267_STACK_BASE_SHA: 21f288c1c47f7801e21e77ada460c6353e371e14
          PR267_REPAIR_BASE_SHA: f98d93e43d10c32cd60580c80c484d829c8f6900
          CURRENT_MAIN_INTEGRATION_REF: main
          CURRENT_MAIN_INTEGRATION_SHA: 0ba33b6ddf19f10afd69d802a79d5699a22c80bb
          PRESERVED_PR267_HEAD_SHA: 2d444f3e392249c8d7bf1a1aa036e738a418d1cb
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTUAL_BASE_REF" = "$ORIGINAL_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$ORIGINAL_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$B2A_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$B2A_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$PR267_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$PR267_BASE_SHA" || \
              test "$ACTUAL_BASE_SHA" = "$PR267_REPAIR_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$PR267_STACK_BASE_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$PR267_STACK_BASE_SHA"
          elif [ "$ACTUAL_BASE_REF" = "$CURRENT_MAIN_INTEGRATION_REF" ]; then
            test "$ACTUAL_BASE_SHA" = "$CURRENT_MAIN_INTEGRATION_SHA"
            git merge-base --is-ancestor "$PRESERVED_PR267_HEAD_SHA" "$ACTUAL_HEAD_SHA"
          else
            echo "unsupported C06-B2A stack base: $ACTUAL_BASE_REF" >&2
            exit 1
          fi
          test "$(git merge-base "$ACTUAL_BASE_SHA" "$ACTUAL_HEAD_SHA")" = "$ACTUAL_BASE_SHA"
          git merge-base --is-ancestor "$ORIGINAL_BASE_SHA" "$ACTUAL_HEAD_SHA"
          if [ "$ACTUAL_BASE_SHA" != "$ORIGINAL_BASE_SHA" ]; then
            git merge-base --is-ancestor "$B2A_BASE_SHA" "$ACTUAL_HEAD_SHA"
          fi
          if [ "$ACTUAL_BASE_SHA" = "$PR267_BASE_SHA" ]; then
            git merge-base --is-ancestor "$PR267_BASE_SHA" "$ACTUAL_HEAD_SHA"
          fi
          if [ "$ACTUAL_BASE_SHA" = "$PR267_STACK_BASE_SHA" ] || [ "$ACTUAL_BASE_SHA" = "$PR267_REPAIR_BASE_SHA" ]; then
            git merge-base --is-ancestor "$PR267_REPAIR_BASE_SHA" "$ACTUAL_HEAD_SHA"
          fi
          echo "C06B2A_EXACT_BASE_VERIFIED=true" >> "$GITHUB_ENV"
          echo "C06B2A_BASE_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host-only dependencies
        run: python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Validate schemas and exact Manager-HA projection parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          manager_root = Path("host/greenhouse-manager/src/greenhouse_manager/schemas")
          ha_root = Path("host/homeassistant/custom_components/greenhouse_history")
          paths = (
              manager_root / "gh.c06b2-ha-projection-request-1.schema.json",
              manager_root / "gh.c06b2-ha-projection-result-1.schema.json",
              manager_root / "gh.c06-hourly-projection-1.schema.json",
              ha_root / "gh.c06-hourly-projection-1.schema.json",
          )
          for path in paths:
              document = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(document)
              print(f"SCHEMA_VALID={path}")
          if paths[2].read_bytes() != paths[3].read_bytes():
              raise SystemExit("Manager and Home Assistant projection schemas differ")
          print("MANAGER_HA_PROJECTION_SCHEMA_BYTE_PARITY=true")
          PY

      - name: Compile inactive custom integration
        run: |
          python -m compileall -q \
            host/homeassistant/custom_components/greenhouse_history \
            host/greenhouse-manager/src/greenhouse_manager/runtime/c06b2_ha_projection_protocol.py

      - name: Ruff
        run: |
          python -m ruff check \
            host/greenhouse-manager/src/greenhouse_manager/runtime/c06b2_ha_projection_protocol.py \
            host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py \
            host/homeassistant/custom_components/greenhouse_history \
            tools/c06b2a_ha_target_ledger_host_only_harness.py

      - name: Focused host-only tests
        run: |
          python -m pytest -q \
            host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py \
            host/greenhouse-manager/tests/runtime/test_history_projection_monotonic_adapter.py \
            host/greenhouse-manager/tests/runtime/test_history_projection.py

      - name: Generate secret-free host-only evidence
        env:
          AUTHORIZATION: D1-C06B2A-PR263-IMMUTABLE-LOCAL-MANIFEST-PER-BLOB-READBACK-AND-ATOMIC-TREE-SUCCESSOR-WRITE-CLOSURE-20260804-01
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p evidence/c06b2a-ha-target-ledger
          flags=()
          if [ "${C06B2A_EXACT_BASE_VERIFIED:-false}" = "true" ]; then
            flags+=(--exact-base-verified)
          fi
          if [ "${C06B2A_BASE_ANCESTOR_VERIFIED:-false}" = "true" ]; then
            flags+=(--base-ancestor-verified)
          fi
          python tools/c06b2a_ha_target_ledger_host_only_harness.py \
            --output evidence/c06b2a-ha-target-ledger/report.json \
            --authorization "$AUTHORIZATION" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            "${flags[@]}"
          cp host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-request-1.schema.json \
            evidence/c06b2a-ha-target-ledger/
          cp host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-result-1.schema.json \
            evidence/c06b2a-ha-target-ledger/
          cp host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06-hourly-projection-1.schema.json \
            evidence/c06b2a-ha-target-ledger/manager-gh.c06-hourly-projection-1.schema.json
          cp host/homeassistant/custom_components/greenhouse_history/gh.c06-hourly-projection-1.schema.json \
            evidence/c06b2a-ha-target-ledger/ha-gh.c06-hourly-projection-1.schema.json
          cp docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
            evidence/c06b2a-ha-target-ledger/
          (
            cd evidence/c06b2a-ha-target-ledger
            sha256sum \
              report.json \
              gh.c06b2-ha-projection-request-1.schema.json \
              gh.c06b2-ha-projection-result-1.schema.json \
              manager-gh.c06-hourly-projection-1.schema.json \
              ha-gh.c06-hourly-projection-1.schema.json \
              ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: c06b2a-ha-target-ledger-host-only-evidence
          path: evidence/c06b2a-ha-target-ledger
          if-no-files-found: error
          retention-days: 30
