name: C06-B2A HA target ledger host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection_protocol.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-*.schema.json"
      - "host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py"
      - "host/homeassistant/custom_components/greenhouse_history/**"
      - "tools/c06b2a_ha_target_ledger_host_only_harness.py"
      - ".github/workflows/c06b2a-ha-target-ledger-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection_protocol.py"
      - "host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-*.schema.json"
      - "host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py"
      - "host/homeassistant/custom_components/greenhouse_history/**"
      - "tools/c06b2a_ha_target_ledger_host_only_harness.py"
      - ".github/workflows/c06b2a-ha-target-ledger-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorized C06-B2A stack
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_REF: feature/c06b1-history-projection-core-hostonly-20260803-v1
          EXPECTED_BASE_SHA: 0ec7bb3d17f08f6e26d475ce6f2a55e5bea39434
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$ACTUAL_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$ACTUAL_BASE_SHA" "$ACTUAL_HEAD_SHA")" = "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$ACTUAL_HEAD_SHA"
          echo "C06B2A_EXACT_BASE_VERIFIED=true" >> "$GITHUB_ENV"
          echo "C06B2A_BASE_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host-only dependencies
        run: python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Validate C06-B2A JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("host/greenhouse-manager/src/greenhouse_manager/schemas")
          names = (
              "gh.c06b2-ha-projection-request-1.schema.json",
              "gh.c06b2-ha-projection-result-1.schema.json",
          )
          for name in names:
              document = json.loads((root / name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(document)
              print(f"SCHEMA_VALID={name}")
          PY

      - name: Compile inactive custom integration
        run: |
          python -m compileall -q \
            host/homeassistant/custom_components/greenhouse_history \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection_protocol.py

      - name: Ruff
        run: |
          python -m ruff check \
            host/greenhouse-manager/src/greenhouse_manager/runtime/history_projection_protocol.py \
            host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py \
            host/homeassistant/custom_components/greenhouse_history \
            tools/c06b2a_ha_target_ledger_host_only_harness.py

      - name: Focused host-only tests
        run: |
          python -m pytest -q \
            host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py \
            host/greenhouse-manager/tests/runtime/test_history_projection_monotonic_adapter.py \
            host/greenhouse-manager/tests/runtime/test_history_projection.py

      - name: Generate secret-free host-only evidence
        env:
          AUTHORIZATION: D1-C06B2A-MQTT-RPC-PROTOCOL-HA-TARGET-LEDGER-AND-CUSTOM-INTEGRATION-STACKED-DRAFT-CREATION-20260803-01
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p evidence/c06b2a-ha-target-ledger
          flags=()
          if [ "${C06B2A_EXACT_BASE_VERIFIED:-false}" = "true" ]; then
            flags+=(--exact-base-verified)
          fi
          if [ "${C06B2A_BASE_ANCESTOR_VERIFIED:-false}" = "true" ]; then
            flags+=(--base-ancestor-verified)
          fi
          python tools/c06b2a_ha_target_ledger_host_only_harness.py \
            --output evidence/c06b2a-ha-target-ledger/report.json \
            --authorization "$AUTHORIZATION" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            "${flags[@]}"
          cp host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-request-1.schema.json \
            evidence/c06b2a-ha-target-ledger/
          cp host/greenhouse-manager/src/greenhouse_manager/schemas/gh.c06b2-ha-projection-result-1.schema.json \
            evidence/c06b2a-ha-target-ledger/
          cp docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
            evidence/c06b2a-ha-target-ledger/
          (
            cd evidence/c06b2a-ha-target-ledger
            sha256sum \
              report.json \
              gh.c06b2-ha-projection-request-1.schema.json \
              gh.c06b2-ha-projection-result-1.schema.json \
              ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: c06b2a-ha-target-ledger-host-only-evidence
          path: evidence/c06b2a-ha-target-ledger
          if-no-files-found: error
          retention-days: 30
