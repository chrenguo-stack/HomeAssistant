name: C06-B2B MQTT Recorder runtime host-only CI

on:
  pull_request:
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py"
      - "host/homeassistant/custom_components/greenhouse_history/recorder_adapter.py"
      - "tools/c06b2b_runtime_wiring_host_only_harness.py"
      - ".github/workflows/c06b2b-runtime-wiring-ci.yml"
      - ".github/workflows/c06b2c-isolated-e2e-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md"
      - "host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py"
      - "host/homeassistant/custom_components/greenhouse_history/recorder_adapter.py"
      - "tools/c06b2b_runtime_wiring_host_only_harness.py"
      - ".github/workflows/c06b2b-runtime-wiring-ci.yml"
      - ".github/workflows/c06b2c-isolated-e2e-ci.yml"

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: host/homeassistant

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorized Recorder barrier successor stack
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_REF: feature/c06b2c-isolated-mosquitto-ha-recorder-e2e-20260804-v1
          EXPECTED_BASE_SHA: 8f7c8603c92eba4246cb3b0f7b15c914b19b0ff3
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$ACTUAL_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$ACTUAL_BASE_SHA" "$ACTUAL_HEAD_SHA")" = "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$ACTUAL_HEAD_SHA"
          echo "C06B2B_EXACT_BASE_VERIFIED=true" >> "$GITHUB_ENV"
          echo "C06B2B_BASE_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Verify authorized Recorder barrier file boundary
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_SHA: 8f7c8603c92eba4246cb3b0f7b15c914b19b0ff3
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$EXPECTED_BASE_SHA" "$ACTUAL_HEAD_SHA" > /tmp/c06b2b-barrier-files.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/c06b2b-runtime-wiring-ci.yml",
              ".github/workflows/c06b2c-isolated-e2e-ci.yml",
              "docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md",
              "host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py",
              "host/homeassistant/custom_components/greenhouse_history/recorder_adapter.py",
              "tools/c06b2b_runtime_wiring_host_only_harness.py",
          }
          changed = {
              line.strip()
              for line in Path("/tmp/c06b2b-barrier-files.txt").read_text().splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unauthorized Recorder barrier paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Recorder barrier paths are missing: {missing}")
          print("C06B2B_RECORDER_BARRIER_FILE_BOUNDARY=true")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host-only dependencies
        run: python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Compile Recorder barrier repair
        run: |
          python -m compileall -q \
            host/homeassistant/custom_components/greenhouse_history/recorder_adapter.py \
            host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py \
            tools/c06b2b_runtime_wiring_host_only_harness.py

      - name: Ruff
        run: |
          python -m ruff check \
            host/homeassistant/custom_components/greenhouse_history/recorder_adapter.py \
            host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py \
            tools/c06b2b_runtime_wiring_host_only_harness.py

      - name: Focused host-only and regression tests
        run: |
          python -m pytest -q \
            host/greenhouse-manager/tests/runtime/test_c06b2b_runtime_wiring.py \
            host/greenhouse-manager/tests/runtime/test_c06b2_ha_target_core.py \
            host/greenhouse-manager/tests/runtime/test_history_projection_monotonic_adapter.py \
            host/greenhouse-manager/tests/runtime/test_history_projection.py

      - name: Generate secret-free Recorder barrier evidence
        env:
          AUTHORIZATION: D1-C06B2B-PR265-RECORDER-IMPORT-QUEUE-COMMIT-BARRIER-REAL-E2E-BLOCKER-SUCCESSOR-REPAIR-STACKED-DRAFT-IMPLEMENTATION-20260804-01
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p evidence/c06b2b-recorder-barrier
          flags=()
          if [ "${C06B2B_EXACT_BASE_VERIFIED:-false}" = "true" ]; then
            flags+=(--exact-base-verified)
          fi
          if [ "${C06B2B_BASE_ANCESTOR_VERIFIED:-false}" = "true" ]; then
            flags+=(--base-ancestor-verified)
          fi
          python tools/c06b2b_runtime_wiring_host_only_harness.py \
            --output evidence/c06b2b-recorder-barrier/report.json \
            --authorization "$AUTHORIZATION" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            "${flags[@]}"
          cp docs/adr/ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
            evidence/c06b2b-recorder-barrier/
          cp .github/workflows/c06b2b-runtime-wiring-ci.yml \
            evidence/c06b2b-recorder-barrier/
          (
            cd evidence/c06b2b-recorder-barrier
            sha256sum \
              report.json \
              ADR-0006-c06b2-real-home-assistant-history-projection-adapter.md \
              c06b2b-runtime-wiring-ci.yml \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: c06b2b-recorder-queue-barrier-host-only-evidence
          path: evidence/c06b2b-recorder-barrier
          if-no-files-found: error
          retention-days: 30
