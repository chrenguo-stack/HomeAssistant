name: C-07 node retirement CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "host/greenhouse-manager/**"
      - "infra/compose/c07-node-retirement/**"
      - "docs/development/c07-node-retirement.md"
      - ".github/workflows/c07-node-retirement-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(host/greenhouse-manager/|infra/compose/c07-node-retirement/|docs/development/c07-node-retirement\.md$|\.github/workflows/c07-node-retirement-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  isolated-retirement:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify real Mosquitto and Home Assistant retirement lifecycle
        run: |
          set -o pipefail
          bash infra/compose/c07-node-retirement/verify.sh 2>&1 |
            tee /tmp/c07-node-retirement-verification.log

      - name: Upload redacted failure log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: c07-node-retirement-failure-log
          path: /tmp/c07-node-retirement-verification.log
          retention-days: 3