name: D2-14 temporary source bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/d2-14-bootstrap.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-14-payload-extraction-ownership-repair-20260730-v1.json"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize reviewed D2-14 source files
        env:
          PAYLOAD_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/d2-14-payload.tar.gz
          test "$(sha256sum /tmp/d2-14-payload.tar.gz | awk '{print $1}')" = "79b7080d1c710789917694f5455b5f62186dcdc74d84d8ca51ab7109ac91651b"
          tar -xzf /tmp/d2-14-payload.tar.gz -C "$GITHUB_WORKSPACE"
          chmod 700 tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_14_payload_extraction_ownership_repair_execution_binding_shell_20260730_v1.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools tests/h3_n2_stage2d9r_tls_candidate
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(n2): materialize D2-14 extraction ownership repair"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
