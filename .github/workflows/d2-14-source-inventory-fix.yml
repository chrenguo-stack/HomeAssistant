name: D2-14 temporary source inventory fix

on:
  pull_request:
    paths:
      - ".github/workflows/d2-14-source-inventory-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Include the packager in its public source inventory
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("tools/h3_n2_stage2d9r_g3r_d2_14_payload_extraction_ownership_repair_execution_binding_packager_20260730_v1.py")
          source = path.read_text(encoding="utf-8")
          old = '    *SOURCE_FILES,\n)\n\n\ndef write_json'
          new = '    "tools/h3_n2_stage2d9r_g3r_d2_14_payload_extraction_ownership_repair_execution_binding_packager_20260730_v1.py",\n    *SOURCE_FILES,\n)\n\n\ndef write_json'
          if source.count(old) != 1:
              raise SystemExit("SOURCE_INVENTORY_PATCH_TARGET_MISMATCH")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/h3_n2_stage2d9r_g3r_d2_14_payload_extraction_ownership_repair_execution_binding_packager_20260730_v1.py
          git commit -m "fix(n2): include D2-14 packager in review inventory"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
