name: Development handoff contract

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/development/HANDOFF_DOCUMENT_CONTRACT.md"
      - "docs/development/templates/**"
      - "docs/development/**/*Handoff*.md"
      - "docs/development/**/*交接*.md"
      - "tools/check_development_handoff.py"
      - "tools/check_public_repository_safety.py"
      - ".github/workflows/development-handoff-contract.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/development/HANDOFF_DOCUMENT_CONTRACT.md"
      - "docs/development/templates/**"
      - "docs/development/**/*Handoff*.md"
      - "docs/development/**/*交接*.md"
      - "tools/check_development_handoff.py"
      - "tools/check_public_repository_safety.py"
      - ".github/workflows/development-handoff-contract.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  handoff-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Linter self-test
        run: python3 tools/check_development_handoff.py --self-test

      - name: Validate schema handoffs
        run: python3 tools/check_development_handoff.py --all

      - name: Public repository safety
        run: python3 tools/check_public_repository_safety.py --repository .
