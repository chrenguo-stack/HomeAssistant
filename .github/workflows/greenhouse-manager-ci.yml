name: greenhouse-manager CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "host/greenhouse-manager/**"
      - "protocols/mqtt/**"
      - "protocols/pairing/**"
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "firmware/esphome_rc/board_lab/n3w_phase3_simple/**"
      - "firmware/esphome_rc/board_lab/n3w_phase4_physical/**"
      - "tests/n3w_phase3/**"
      - "tests/n3w_phase4/**"
      - "tests/n3w_registration/**"
      - ".github/workflows/greenhouse-manager-ci.yml"

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.detect.outputs.run }}
      phase3: ${{ steps.detect.outputs.phase3 }}
      physical_acceptance_overlay: ${{ steps.detect.outputs.physical_acceptance_overlay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "phase3=true" >> "$GITHUB_OUTPUT"
            echo "physical_acceptance_overlay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(host/greenhouse-manager/|protocols/mqtt/|protocols/pairing/|firmware/esphome_rc/components/greenhouse_n3w_core/|firmware/esphome_rc/board_lab/n3w_phase3_simple/|firmware/esphome_rc/board_lab/n3w_phase4_physical/|tests/n3w_phase3/|tests/n3w_phase4/|tests/n3w_registration/|\.github/workflows/greenhouse-manager-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(firmware/esphome_rc/components/greenhouse_n3w_core/|firmware/esphome_rc/board_lab/n3w_phase3_simple/|firmware/esphome_rc/board_lab/n3w_phase4_physical/|tests/n3w_phase3/|tests/n3w_phase4/|tests/n3w_registration/|\.github/workflows/greenhouse-manager-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "phase3=true" >> "$GITHUB_OUTPUT"
          else
            echo "phase3=false" >> "$GITHUB_OUTPUT"
          fi
          target="firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
          acceptance_overlay=false
          if grep -Fxq "$target" "$RUNNER_TEMP/changed-files.txt"; then
            read -r additions deletions changed_path < <(
              git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- "$target"
            )
            added_bypass_count="$(
              git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$target" |
                grep '^+' |
                grep -v '^+++' |
                grep -Fxc '+  battery_low_threshold: "-1.00"' || true
            )"
            base_bypass_count="$(
              git show "$BASE_SHA:$target" |
                grep -Fxc '  battery_low_threshold: "-1.00"' || true
            )"
            head_bypass_count="$(
              git show "$HEAD_SHA:$target" |
                grep -Fxc '  battery_low_threshold: "-1.00"' || true
            )"
            if [[
              "$changed_path" == "$target" &&
              "$additions" == "1" &&
              "$deletions" == "0" &&
              "$added_bypass_count" == "1" &&
              "$base_bypass_count" == "0" &&
              "$head_bypass_count" == "1"
            ]]; then
              acceptance_overlay=true
            fi
          fi
          echo "physical_acceptance_overlay=$acceptance_overlay" >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host/greenhouse-manager

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: N3-W R8 full simulated first-registration E2E
        run: pytest -q tests/runtime/test_n3w_scan_triggered_registration_r8_e2e.py

  n3w-phase3-cross-language:
    needs: scope
    if: needs.scope.outputs.phase3 == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install host and ESP32-C6 tool dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmbedtls-dev
          python -m pip install -q "pytest>=8,<9" "esphome==2026.4.3"
      - name: Phase 3 source safety contracts
        run: pytest -q tests/n3w_phase3/test_phase3_source_contract.py
      - name: Phase 4 source-only activation contracts
        run: pytest -q tests/n3w_phase4/test_phase4_source_contract.py
      - name: Phase 4 watchdog breadcrumb contracts
        run: pytest -q tests/n3w_phase4/test_task_wdt_rtc_breadcrumb_contract.py
      - name: Phase 4 relay unicast channel observability contracts
        run: pytest -q tests/n3w_phase4/test_relay_unicast_channel_ownership_observability_contract.py
      - name: Phase 4 single-radio ownership contracts
        run: pytest -q tests/n3w_phase4/test_single_radio_ownership_contract.py
      - name: Phase 4 recovery exit and Direct liveness contracts
        run: pytest -q tests/n3w_phase4/test_recovery_exit_behavior.py tests/n3w_phase4/test_direct_recovery_liveness_behavior.py
      - name: N3-W scan-triggered first-registration R4 source contracts
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r4_portal_contract.py
      - name: N3-W scan-triggered first-registration R5 source contracts
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r5_discovery_contract.py
      - name: N3-W scan-triggered first-registration R6 TLS bootstrap contracts
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r6_tls_bootstrap_contract.py
      - name: N3-W scan-triggered first-registration R7 LCD state contracts
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r7_lcd_state_contract.py
      - name: N3-W scan-triggered first-registration R8 E2E safety contracts
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r8_safety_contract.py
      - name: N3-W scan-triggered first-registration R10 production phone UI and LCD contracts
        if: needs.scope.outputs.physical_acceptance_overlay != 'true'
        run: pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r10_phone_ui_contract.py
      - name: N3-W R10 physical-acceptance phone UI and LCD contracts
        if: needs.scope.outputs.physical_acceptance_overlay == 'true'
        run: |
          pytest -q tests/n3w_registration/test_scan_triggered_first_pairing_r10_phone_ui_contract.py -k 'not product_ui_source_does_not_embed_bench_low_battery_bypass'
          pytest -q tests/n3w_registration/test_r10_board_d_tls_pin_acceptance_artifact_source.py
      - name: Build and run R7 registration display controller
        shell: bash
        run: |
          set -euo pipefail
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I"$core" \
            "$core/n3w_registration_display.cpp" \
            tests/n3w_registration/n3w_registration_display_host_test.cpp \
            -o /tmp/n3w-registration-display-host-test
          /tmp/n3w-registration-display-host-test
      - name: Build and run C++ cross-language vectors
        shell: bash
        run: |
          set -euo pipefail
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I"$core" \
            "$core/n3w_core.cpp" \
            "$core/n3w_radio.cpp" \
            "$core/n3w_simple_crypto.cpp" \
            "$core/n3w_compact_telemetry.cpp" \
            "$core/n3w_simple_runtime.cpp" \
            tests/n3w_phase3/n3w_phase3_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w-phase3-host-test
          /tmp/n3w-phase3-host-test
      - name: Build and run Phase 4 simplified product runtime
        shell: bash
        run: |
          set -euo pipefail
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I"$core" \
            "$core/n3w_core.cpp" \
            "$core/n3w_radio.cpp" \
            "$core/n3w_simple_crypto.cpp" \
            "$core/n3w_compact_telemetry.cpp" \
            "$core/n3w_simple_runtime.cpp" \
            "$core/n3w_simple_state_host.cpp" \
            "$core/n3w_simple_product_runtime.cpp" \
            tests/n3w_phase4/n3w_phase4_runtime_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w-phase4-runtime-host-test
          /tmp/n3w-phase4-runtime-host-test
      - name: Compile generic ESP32-C6 Child context
        shell: bash
        run: |
          set -euo pipefail
          cd firmware/esphome_rc/board_lab/n3w_phase3_simple
          esphome config child.yml
          esphome compile child.yml
      - name: Compile generic ESP32-C6 Relay context
        shell: bash
        run: |
          set -euo pipefail
          cd firmware/esphome_rc/board_lab/n3w_phase3_simple
          esphome config relay.yml
          esphome compile relay.yml
      - name: Compile generic ESP32-C6 Phase 4 physical harness
        shell: bash
        run: |
          set -euo pipefail
          cd firmware/esphome_rc/board_lab/n3w_phase4_physical
          esphome config generic.yml
          esphome compile generic.yml
