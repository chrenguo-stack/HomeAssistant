name: H0 H1 initialization and portable restore CI

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/adr/**"
      - "docs/development/h0h1-init-portable-restore.md"
      - "docs/status/h0h1-source-baseline-20260802.md"
      - "docs/roadmap/**"
      - "host/greenhouse-manager/**"
      - "infra/compose/c07-node-retirement/**"
      - "tools/h0h1_host_only_harness.py"
      - ".github/workflows/h0h1-init-portable-restore-ci.yml"
      - ".github/workflows/project-roadmap-v07-c07-identity-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install greenhouse-manager
        run: python -m pip install -e 'host/greenhouse-manager[dev,bootstrap]'

      - name: Compile bootstrap sources
        run: >-
          python -m compileall -q
          host/greenhouse-manager/src/greenhouse_manager/bootstrap
          tools/h0h1_host_only_harness.py

      - name: Ruff
        run: >-
          ruff check
          host/greenhouse-manager/src/greenhouse_manager/bootstrap
          host/greenhouse-manager/src/greenhouse_manager/runtime/registration.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/credential_lifecycle.py
          host/greenhouse-manager/src/greenhouse_manager/ops/registration_cli.py
          host/greenhouse-manager/tests/bootstrap
          host/greenhouse-manager/tests/runtime/test_registration.py
          host/greenhouse-manager/tests/runtime/test_credential_lifecycle.py
          host/greenhouse-manager/tests/runtime/test_node_retirement_runtime.py
          host/greenhouse-manager/tests/ops/test_registration_cli.py
          tools/h0h1_host_only_harness.py

      - name: Focused identity and bootstrap tests
        run: >-
          pytest -q
          host/greenhouse-manager/tests/bootstrap
          host/greenhouse-manager/tests/runtime/test_registration.py
          host/greenhouse-manager/tests/runtime/test_credential_lifecycle.py
          host/greenhouse-manager/tests/runtime/test_node_retirement_runtime.py
          host/greenhouse-manager/tests/ops/test_registration_cli.py
          host/greenhouse-manager/tests/ops/test_t1_manager_identity_migration_preparation_version.py

      - name: Module and execution boundary
        run: |
          python - <<'PY'
          import ast
          import tomllib
          from pathlib import Path

          root = Path("host/greenhouse-manager")
          pyproject = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          scripts = pyproject["project"]["scripts"]
          expected = {
              "greenhouse-init": "greenhouse_manager.bootstrap.cli:main",
              "greenhouse-portable-restore":
                  "greenhouse_manager.bootstrap.portable_restore_cli:main",
              "greenhouse-system-identity-guard":
                  "greenhouse_manager.bootstrap.identity_guard_cli:main",
          }
          for name, target in expected.items():
              assert scripts.get(name) == target, (name, scripts.get(name))

          runtime = root / "src/greenhouse_manager/runtime"
          for path in runtime.rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              assert "greenhouse_manager.bootstrap" not in text, path

          forbidden_modules = {"socket", "subprocess"}
          bootstrap = root / "src/greenhouse_manager/bootstrap"
          for path in bootstrap.rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported = {alias.name.split(".", 1)[0] for alias in node.names}
                      assert not imported & forbidden_modules, (path, imported)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported = node.module.split(".", 1)[0]
                      assert imported not in forbidden_modules, (path, imported)
              assert "docker " not in text.lower(), path
          PY

      - name: Run two-host host-only harness
        run: |
          mkdir -p review
          python tools/h0h1_host_only_harness.py \
            --output review/h0h1-host-only-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("review/h0h1-host-only-result.json").read_text(encoding="utf-8")
          )
          assert result["status"] == "PASS"
          for key in (
              "independent_initializations_distinct",
              "portable_backup_encrypted",
              "portable_backup_verified",
              "portable_restore_round_trip",
              "identity_conflict_detected",
              "successor_identity_claimed_after_release",
              "anonymous_publish_denied",
              "anonymous_subscribe_denied",
              "all_required_clients_authenticated",
          ):
              assert result[key] is True, key
          for key in (
              "production_services_modified",
              "network_operation",
              "subprocess_operation",
              "t1_operation",
              "board_operation",
              "live_apply_enabled",
          ):
              assert result[key] is False, key
          forbidden = ("password", "passphrase", "private_key", "secret", "token")
          lowered = Path("review/h0h1-host-only-result.json").read_text(
              encoding="utf-8"
          ).lower()
          assert not any(value in lowered for value in forbidden)
          PY

      - name: Build secret-free review bundle
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$BASE_SHA" > review/BASE_SHA
          printf '%s\n' "$HEAD_SHA" > review/SOURCE_SHA
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
            > review/changed-files.txt
          git diff --binary "${BASE_SHA}...${HEAD_SHA}" \
            > review/review.patch
          find review -type l -print -quit | grep -q . && exit 1 || true
          find review -type f -name '*.py[co]' -print -quit | grep -q . && exit 1 || true
          (
            cd review
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: h0h1-v07-init-portable-restore-review-v1
          path: review/
          if-no-files-found: error
          retention-days: 14
