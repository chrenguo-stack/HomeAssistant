name: H3 N2 Stage2D9R G3R D2-11 Python bytecode repair

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-20260729-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-contract-20260729-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_shell_20260729_v1.sh"
      - "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_contract_20260729_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_packager_20260729_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_wrapper_20260729_v1.py"
      - "tools/run_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR208_HEAD: "34286f73e710dca63c6348f0fc6457496cb1c493"
      PR208_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-11-prepare-transport-pacing-successor-execution-binding-20260729-v1"
      PR208_ARTIFACT_ID: "8726419477"
      PR208_ARTIFACT_SHA256: "60dc9f3c3ef96c896bd810e1912488395fed9857dee6a8933e6c55cd6c3b8583"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$PR208_HEAD"
          test "$EVENT_BASE_REF" = "$PR208_BRANCH"
          git merge-base --is-ancestor "$PR208_HEAD" "$PR_HEAD_SHA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          expected = {
              ".github/workflows/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-ci-v1.yml",
              "docs/decisions/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-20260729-v1.json",
              "docs/development/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-contract-20260729-v1.md",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_shell_20260729_v1.sh",
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_contract_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_packager_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_wrapper_20260729_v1.py",
              "tools/run_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1.sh",
          }
          observed = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      f"{os.environ['PR208_HEAD']}...{os.environ['PR_HEAD_SHA']}",
                  ],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  "SOURCE_INVENTORY_MISMATCH\n"
                  f"missing={sorted(expected - observed)}\n"
                  f"extra={sorted(observed - expected)}"
              )
          for name in expected:
              if not Path(name).is_file():
                  raise SystemExit(f"SOURCE_FILE_MISSING:{name}")
          PY

      - name: Verify PR 208, main and load-bearing Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/208" \
            -o /tmp/pr208.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            -o /tmp/main.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR208_ARTIFACT_ID}" \
            -o /tmp/artifact.json
          python3 - <<'PY'
          import json
          import os

          pr = json.load(open("/tmp/pr208.json", encoding="utf-8"))
          assert pr["state"] == "open"
          assert pr["draft"] is True
          assert pr["merged"] is False
          assert pr["head"]["sha"] == os.environ["PR208_HEAD"]
          main = json.load(open("/tmp/main.json", encoding="utf-8"))
          assert main["sha"] == os.environ["MAIN_SHA"]
          artifact = json.load(open("/tmp/artifact.json", encoding="utf-8"))
          assert artifact["id"] == int(os.environ["PR208_ARTIFACT_ID"])
          assert artifact["expired"] is False
          assert artifact["workflow_run"]["head_sha"] == os.environ["PR208_HEAD"]
          assert artifact["digest"] == "sha256:" + os.environ["PR208_ARTIFACT_SHA256"]
          PY
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR208_ARTIFACT_ID}/zip" \
            -o /tmp/pr208.zip
          test "$(sha256sum /tmp/pr208.zip | awk '{print $1}')" = \
            "$PR208_ARTIFACT_SHA256"

      - name: Parse, compile and run focused tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          json.load(
              open(
                  "docs/decisions/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-20260729-v1.json",
                  encoding="utf-8",
              )
          )
          for path in (
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_contract_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_packager_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_wrapper_20260729_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1.py",
          ):
              source = Path(path).read_text(encoding="utf-8")
              compile(source, path, "exec")
          PY
          python3 -m unittest \
            tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_20260729_v1
          PR208_ARTIFACT_ZIP=/tmp/pr208.zip sh \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_shell_20260729_v1.sh

      - name: Build two deterministic source-only review lanes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          for lane in 1 2
          do
            python3 \
              tools/h3_n2_stage2d9r_g3r_d2_11_python_bytecode_self_contamination_repair_packager_20260729_v1.py \
              --source-root "$GITHUB_WORKSPACE" \
              --source-sha "$PR_HEAD_SHA" \
              --output "/tmp/d2-11-bytecode-review-${lane}"
          done
          diff -qr \
            /tmp/d2-11-bytecode-review-1 \
            /tmp/d2-11-bytecode-review-2
          cd /tmp/d2-11-bytecode-review-1
          sha256sum -c SHA256SUMS
          test -f \
            source/.github/workflows/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-ci-v1.yml
          test -z "$(find . -type f \( \
            -iname '*authorization*.json' -o \
            -iname '*physical*d2*request*.json' -o \
            -iname '*execution*package*.json' -o \
            -iname '*execution*closure*.json' \
          \) -print -quit)"
          python3 - <<'PY'
          import json

          value = json.load(
              open(
                  "D2_11_PYTHON_BYTECODE_SELF_CONTAMINATION_REPAIR_REVIEW.json",
                  encoding="utf-8",
              )
          )
          assert value["source_sha"] == __import__("os").environ["PR_HEAD_SHA"]
          assert value["failed_authorization_claimed"] is False
          assert value["failed_authorization_consumed"] is False
          assert value["failed_authorization_reuse_permitted"] is False
          assert value["failed_package_replay_permitted"] is False
          assert value["d2_12_request_created"] is False
          assert value["d2_12_authorization_created"] is False
          assert value["d2_12_execution_package_created"] is False
          assert value["physical_execute_enabled"] is False
          assert value["board_operation"] is False
          assert value["network_operation"] is False
          assert len(value["files"]) == 9
          PY
          if grep -R -I -E '/U[s]ers/[[:alnum:]_.-]|/d[e]v/(cu|tty)[[:alnum:]_.-]|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then
            echo "private material or host path found" >&2
            exit 1
          fi

      - name: Upload deterministic public review
        uses: actions/upload-artifact@v4
        with:
          name: d2-11-python-bytecode-self-contamination-repair-review-v1
          path: /tmp/d2-11-bytecode-review-1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
