name: H3 N2 Stage2D9R G3R D2-12 bytecode repaired binding

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-execution-binding-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-successor-execution-binding-20260729-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-successor-execution-binding-contract-20260729-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_20260729_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_shell_20260729_v1.sh"
      - "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_contract_20260729_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_packager_20260729_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_physical_d2_wrapper_20260729_v1.py"
      - "tools/run_stage2d9r_g3r_d2_12_python_bytecode_repaired_physical_d2_20260729_v1.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR209_HEAD: "bd339afb29aa1c12e2db0c8766f80e776d1435d7"
      PR209_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-11-python-bytecode-self-contamination-repair-20260729-v1"
      PR209_ARTIFACT_ID: "8728679363"
      PR209_ARTIFACT_SHA256: "917672434bf1a5066af626437dd375dade76bab1119233ad6bb9be79a6eb64b4"
      PR208_HEAD: "34286f73e710dca63c6348f0fc6457496cb1c493"
      PR208_ARTIFACT_ID: "8726419477"
      PR208_ARTIFACT_SHA256: "60dc9f3c3ef96c896bd810e1912488395fed9857dee6a8933e6c55cd6c3b8583"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$PR209_HEAD"
          test "$EVENT_BASE_REF" = "$PR209_BRANCH"
          git merge-base --is-ancestor "$PR209_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          expected = {
              ".github/workflows/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-execution-binding-ci-v1.yml",
              "docs/decisions/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-successor-execution-binding-20260729-v1.json",
              "docs/development/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-successor-execution-binding-contract-20260729-v1.md",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_20260729_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_shell_20260729_v1.sh",
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_contract_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_packager_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_physical_d2_wrapper_20260729_v1.py",
              "tools/run_stage2d9r_g3r_d2_12_python_bytecode_repaired_physical_d2_20260729_v1.sh",
          }
          observed = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      f"{os.environ['PR209_HEAD']}...{os.environ['PR_HEAD_SHA']}",
                  ],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  "SOURCE_INVENTORY_MISMATCH\n"
                  f"missing={sorted(expected - observed)}\n"
                  f"extra={sorted(observed - expected)}"
              )
          for name in expected:
              if not Path(name).is_file():
                  raise SystemExit(f"SOURCE_FILE_MISSING:{name}")
          PY

      - name: Verify upstream PRs, main and load-bearing Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 208 209
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
              -o "/tmp/pr${pr}.json"
          done
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            -o /tmp/main.json
          for artifact in "$PR208_ARTIFACT_ID" "$PR209_ARTIFACT_ID"
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" \
              -o "/tmp/artifact-${artifact}.json"
          done
          python3 -B - <<'PY'
          import json
          import os

          for number, head in ((208, os.environ["PR208_HEAD"]), (209, os.environ["PR209_HEAD"])):
              pr = json.load(open(f"/tmp/pr{number}.json", encoding="utf-8"))
              assert pr["state"] == "open"
              assert pr["draft"] is True
              assert pr["merged"] is False
              assert pr["head"]["sha"] == head
          main = json.load(open("/tmp/main.json", encoding="utf-8"))
          assert main["sha"] == os.environ["MAIN_SHA"]
          for artifact_id, head, digest in (
              (
                  os.environ["PR208_ARTIFACT_ID"],
                  os.environ["PR208_HEAD"],
                  os.environ["PR208_ARTIFACT_SHA256"],
              ),
              (
                  os.environ["PR209_ARTIFACT_ID"],
                  os.environ["PR209_HEAD"],
                  os.environ["PR209_ARTIFACT_SHA256"],
              ),
          ):
              value = json.load(
                  open(f"/tmp/artifact-{artifact_id}.json", encoding="utf-8")
              )
              assert value["id"] == int(artifact_id)
              assert value["expired"] is False
              assert value["workflow_run"]["head_sha"] == head
              assert value["digest"] == "sha256:" + digest
          PY
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR208_ARTIFACT_ID}/zip" \
            -o /tmp/pr208.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR209_ARTIFACT_ID}/zip" \
            -o /tmp/pr209.zip
          test "$(sha256sum /tmp/pr208.zip | awk '{print $1}')" = "$PR208_ARTIFACT_SHA256"
          test "$(sha256sum /tmp/pr209.zip | awk '{print $1}')" = "$PR209_ARTIFACT_SHA256"

      - name: Parse, compile and run focused tests
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          json.load(
              open(
                  "docs/decisions/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-successor-execution-binding-20260729-v1.json",
                  encoding="utf-8",
              )
          )
          for path in (
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_contract_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_packager_20260729_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_physical_d2_wrapper_20260729_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_20260729_v1.py",
          ):
              source = Path(path).read_text(encoding="utf-8")
              compile(source, path, "exec")
          PY
          python3 -B -m unittest \
            tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_20260729_v1
          PR208_ARTIFACT_ZIP=/tmp/pr208.zip \
          PR209_ARTIFACT_ZIP=/tmp/pr209.zip \
          SOURCE_SHA="$PR_HEAD_SHA" \
            sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_shell_20260729_v1.sh

      - name: Build two deterministic unauthorized review lanes
        run: |
          set -euo pipefail
          for lane in 1 2
          do
            python3 -B \
              tools/h3_n2_stage2d9r_g3r_d2_12_python_bytecode_repaired_execution_binding_packager_20260729_v1.py \
              --source-root "$GITHUB_WORKSPACE" \
              --pr208-artifact /tmp/pr208.zip \
              --pr209-artifact /tmp/pr209.zip \
              --source-sha "$PR_HEAD_SHA" \
              --output "/tmp/d2-12-bytecode-review-${lane}"
          done
          diff -qr \
            /tmp/d2-12-bytecode-review-1 \
            /tmp/d2-12-bytecode-review-2
          cd /tmp/d2-12-bytecode-review-1
          sha256sum -c SHA256SUMS
          test -f \
            source/.github/workflows/h3-n2-stage2d9r-g3r-d2-12-python-bytecode-repaired-execution-binding-ci-v1.yml
          test -f PHYSICAL_D2_REQUEST_12.json
          test -z "$(find . -type f -iname '*authorization*.json' -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test -z "$(find . \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit)"
          python3 -B - <<'PY'
          import json
          import os

          review = json.load(
              open(
                  "D2_12_PYTHON_BYTECODE_REPAIRED_EXECUTION_BINDING_REVIEW.json",
                  encoding="utf-8",
              )
          )
          request = json.load(
              open("PHYSICAL_D2_REQUEST_12.json", encoding="utf-8")
          )
          assert review["source_sha"] == os.environ["PR_HEAD_SHA"]
          assert review["physical_request_created"] is True
          assert review["physical_request_authorized"] is False
          assert review["physical_authorization_created"] is False
          assert review["predecessor_status"] == "PRECLAIM_CONTRACT_FAILED"
          assert review["predecessor_authorization_claimed"] is False
          assert review["predecessor_authorization_consumed"] is False
          assert review["physical_baseline_locked_recovery_outcome"] == "UNKNOWN"
          assert review["bytecode_write_disabled_before_python"] is True
          assert review["private_outer_runner_bytecode_guard_required"] is True
          assert request["authorized"] is False
          assert request["authorization_created"] is False
          assert request["authorization_claimed"] is False
          assert request["authorization_consumed"] is False
          assert len(review["source_files"]) == 9
          PY
          if find . -type f ! -name '*.tar' -print0 | \
            xargs -0 grep -I -E '/U[s]ers/[[:alnum:]_.-]|/d[e]v/(cu|tty)[[:alnum:]_.-]|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          then
            echo "private material or host path found" >&2
            exit 1
          fi

      - name: Upload deterministic public review
        uses: actions/upload-artifact@v4
        with:
          name: d2-12-python-bytecode-repaired-execution-binding-review-v1
          path: /tmp/d2-12-bytecode-review-1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
