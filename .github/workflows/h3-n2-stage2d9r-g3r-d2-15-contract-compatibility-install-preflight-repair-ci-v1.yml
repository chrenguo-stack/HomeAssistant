name: H3 N2 Stage2D9R G3R D2-15 contract compatibility install preflight repair

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-contract-20260730-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_shell_20260730_v1.sh"
      - "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_contract_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_packager_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repaired_physical_d2_wrapper_20260730_v1.py"
      - "tools/run_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repaired_physical_d2_20260730_v1.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PR213_HEAD: "1d62ba600f68e4dd5e91f0cd63331e85a1d9f95d"
      PR213_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-14-payload-extraction-ownership-repair-20260730-v1"
      PR213_ARTIFACT_ID: "8745445393"
      PR213_ARTIFACT_SHA256: "ed25703b130b4fed65e51f9192d6ca45e1ebf0eeb05f46f71caf8d1687dc2a56"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$PR213_HEAD"
          test "$EVENT_BASE_REF" = "$PR213_BRANCH"
          git merge-base --is-ancestor "$PR213_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          expected = {
              ".github/workflows/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-ci-v1.yml",
              "docs/decisions/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-20260730-v1.json",
              "docs/development/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-contract-20260730-v1.md",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_20260730_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_shell_20260730_v1.sh",
              "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_contract_20260730_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_packager_20260730_v1.py",
              "tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repaired_physical_d2_wrapper_20260730_v1.py",
              "tools/run_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repaired_physical_d2_20260730_v1.sh",
          }
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['PR213_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed != expected:
              raise SystemExit(f"SOURCE_INVENTORY_MISMATCH\nmissing={sorted(expected-observed)}\nextra={sorted(observed-expected)}")
          for name in expected:
              if not Path(name).is_file():
                  raise SystemExit(f"SOURCE_FILE_MISSING:{name}")
          PY

      - name: Verify PR 213, main and load-bearing Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/213" -o /tmp/pr213.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" -o /tmp/main.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR213_ARTIFACT_ID}" -o /tmp/artifact.json
          python3 -B - <<'PY'
          import json, os
          pr=json.load(open('/tmp/pr213.json',encoding='utf-8'))
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['head']['sha']==os.environ['PR213_HEAD']
          main=json.load(open('/tmp/main.json',encoding='utf-8')); assert main['sha']==os.environ['MAIN_SHA']
          artifact=json.load(open('/tmp/artifact.json',encoding='utf-8'))
          assert artifact['id']==int(os.environ['PR213_ARTIFACT_ID']) and artifact['expired'] is False
          assert artifact['workflow_run']['head_sha']==os.environ['PR213_HEAD']
          assert artifact['digest']=='sha256:'+os.environ['PR213_ARTIFACT_SHA256']
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR213_ARTIFACT_ID}/zip" -o /tmp/pr213.zip
          test "$(sha256sum /tmp/pr213.zip | awk '{print $1}')" = "$PR213_ARTIFACT_SHA256"

      - name: Compile and run focused tests
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_20260730_v1
          PR213_ARTIFACT_ZIP=/tmp/pr213.zip SOURCE_SHA="$PR_HEAD_SHA" sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_shell_20260730_v1.sh

      - name: Build two deterministic unauthorized review lanes
        run: |
          set -euo pipefail
          for lane in 1 2; do
            python3 -B tools/h3_n2_stage2d9r_g3r_d2_15_contract_compatibility_install_preflight_repair_execution_binding_packager_20260730_v1.py --source-root "$GITHUB_WORKSPACE" --pr213-artifact /tmp/pr213.zip --source-sha "$PR_HEAD_SHA" --output "/tmp/d2-15-contract-compatibility-review-${lane}"
          done
          diff -qr /tmp/d2-15-contract-compatibility-review-1 /tmp/d2-15-contract-compatibility-review-2
          cd /tmp/d2-15-contract-compatibility-review-1
          sha256sum -c SHA256SUMS
          test -f source/.github/workflows/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-ci-v1.yml
          test -f PHYSICAL_D2_REQUEST_15.json
          test -z "$(find . -type f -iname '*authorization*.json' -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test -z "$(find . \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit)"
          python3 -B - <<'PY'
          import json, os
          review=json.load(open('D2_15_CONTRACT_COMPATIBILITY_INSTALL_PREFLIGHT_REPAIR_EXECUTION_BINDING_REVIEW.json',encoding='utf-8'))
          request=json.load(open('PHYSICAL_D2_REQUEST_15.json',encoding='utf-8'))
          failure=json.load(open('D2_14_CONTRACT_COMPATIBILITY_INSTALL_PREFLIGHT_FAILURE_DISPOSITION.json',encoding='utf-8'))
          assert review['source_sha']==os.environ['PR_HEAD_SHA'] and review['physical_request_authorized'] is False
          assert review['d2_14_terminal_state']=='CONSUMED_FAILED_OR_STOPPED'
          assert review['d2_14_authorization_claimed'] is False and review['d2_14_authorization_consumed'] is False
          assert review['canonical_package_digest_exported'] is True
          assert request['authorized'] is False and request['authorization_created'] is False
          assert failure['failure_code']=='CONTRACT_COMPATIBILITY_SYMBOL_MISSING_CANONICAL_PACKAGE_DIGEST'
          assert failure['result_file_present'] is False and failure['replay_permitted'] is False
          assert len(review['source_files'])==9
          PY

      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-15-contract-compatibility-install-preflight-repair-execution-binding-review-v1
          path: /tmp/d2-15-contract-compatibility-review-1
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
