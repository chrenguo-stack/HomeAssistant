name: H3 N2 Stage2D9R G3R D2-16 full inherited authorization preflight repair

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-contract-20260730-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_shell_20260730_v1.sh"
      - "tools/h3_n2_stage2d9r_g3r_d2_16_contract_base_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_contract_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_packager_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repaired_physical_d2_wrapper_20260730_v1.py"
      - "tools/run_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repaired_physical_d2_20260730_v1.sh"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PR214_HEAD: "822935928134efe833a5f3c3179de0d0028e6deb"
      PR214_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-15-contract-compatibility-install-preflight-repair-20260730-v1"
      PR214_ARTIFACT_ID: "8747207488"
      PR214_ARTIFACT_SHA256: "891760469a6b29e6e312cbde21bbb0fbb73fd0856cf1d507cda4094313dda091"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$PR214_HEAD"
          test "$EVENT_BASE_REF" = "$PR214_BRANCH"
          git merge-base --is-ancestor "$PR214_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          expected={
          ".github/workflows/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-ci-v1.yml",
          "docs/decisions/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-20260730-v1.json",
          "docs/development/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-contract-20260730-v1.md",
          "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_20260730_v1.py",
          "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_shell_20260730_v1.sh",
          "tools/h3_n2_stage2d9r_g3r_d2_16_contract_base_20260730_v1.py",
          "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_contract_20260730_v1.py",
          "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_packager_20260730_v1.py",
          "tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repaired_physical_d2_wrapper_20260730_v1.py",
          "tools/run_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repaired_physical_d2_20260730_v1.sh"}
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['PR214_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed!=expected: raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          for name in expected:
              if not Path(name).is_file(): raise SystemExit(f"SOURCE_FILE_MISSING:{name}")
          PY
      - name: Verify PR 214, main and load-bearing Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/214" -o /tmp/pr214.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" -o /tmp/main.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR214_ARTIFACT_ID}" -o /tmp/artifact.json
          python3 -B - <<'PY'
          import json,os
          pr=json.load(open('/tmp/pr214.json')); assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['head']['sha']==os.environ['PR214_HEAD']
          main=json.load(open('/tmp/main.json')); assert main['sha']==os.environ['MAIN_SHA']
          artifact=json.load(open('/tmp/artifact.json')); assert artifact['id']==int(os.environ['PR214_ARTIFACT_ID']) and artifact['expired'] is False
          assert artifact['workflow_run']['head_sha']==os.environ['PR214_HEAD']; assert artifact['digest']=='sha256:'+os.environ['PR214_ARTIFACT_SHA256']
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR214_ARTIFACT_ID}/zip" -o /tmp/pr214.zip
          test "$(sha256sum /tmp/pr214.zip | awk '{print $1}')" = "$PR214_ARTIFACT_SHA256"
      - name: Compile and run focused tests
        run: |
          set -euo pipefail
          PR214_ARTIFACT_ZIP=/tmp/pr214.zip SOURCE_SHA="$PR_HEAD_SHA" python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_20260730_v1
          PR214_ARTIFACT_ZIP=/tmp/pr214.zip SOURCE_SHA="$PR_HEAD_SHA" sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_shell_20260730_v1.sh
      - name: Build two deterministic unauthorized review lanes
        run: |
          set -euo pipefail
          for lane in 1 2; do python3 -B tools/h3_n2_stage2d9r_g3r_d2_16_full_inherited_authorization_preflight_repair_execution_binding_packager_20260730_v1.py --source-root "$GITHUB_WORKSPACE" --pr214-artifact /tmp/pr214.zip --source-sha "$PR_HEAD_SHA" --output "/tmp/d2-16-auth-preflight-${lane}"; done
          diff -qr /tmp/d2-16-auth-preflight-1 /tmp/d2-16-auth-preflight-2
          cd /tmp/d2-16-auth-preflight-1 && sha256sum -c SHA256SUMS
          test -f source/.github/workflows/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-ci-v1.yml
          test -f PHYSICAL_D2_REQUEST_16.json
          test -z "$(find . -type f -iname '*physical-authorization*.json' -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test -z "$(find . \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit)"
      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-16-full-inherited-authorization-preflight-repair-execution-binding-review-v1
          path: /tmp/d2-16-auth-preflight-1
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
