name: H3 N2 Stage2D9R G3R D2-17 execution identity freeze stabilization

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-execution-identity-freeze-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-execution-identity-freeze-20260730-v1.json"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-16-static-check-failure-disposition-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-execution-chain-stabilization-contract-20260730-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_shell_20260730_v1.sh"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_base_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_canonical_builder_20260730_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_wrapper_20260730_v1.py"
      - "tools/run_d2_17_canonical_delivery_outer_20260730_v1.sh"
      - "tools/run_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_20260730_v1.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_HEAD: "bea9a5c2af242f0830163ebdfd49c5023a6e437f"
      BASE_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-16-full-inherited-authorization-preflight-repair-20260730-v1"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      PR215_ARTIFACT_ID: "8749684942"
      PR215_ARTIFACT_SHA256: "26e0e7ffe9a04f49c402cb06ba171bdab9305a63798342b88d7f94db1e30355b"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          expected={
            ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-execution-identity-freeze-ci-v1.yml",
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-execution-identity-freeze-20260730-v1.json",
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-16-static-check-failure-disposition-20260730-v1.json",
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-execution-chain-stabilization-contract-20260730-v1.md",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_20260730_v1.py",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_shell_20260730_v1.sh",
            "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_base_20260730_v1.py",
            "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_20260730_v1.py",
            "tools/h3_n2_stage2d9r_g3r_d2_17_canonical_builder_20260730_v1.py",
            "tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_wrapper_20260730_v1.py",
            "tools/run_d2_17_canonical_delivery_outer_20260730_v1.sh",
            "tools/run_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_20260730_v1.sh",
          }
          observed=set(subprocess.check_output(
              ["git","diff","--name-only",f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],
              text=True,
          ).splitlines())
          if observed != expected:
              raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          for name in expected:
              if not Path(name).is_file():
                  raise SystemExit(f"SOURCE_FILE_MISSING:{name}")
          PY

      - name: Verify main, PR 215 and load-bearing Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/215" -o /tmp/pr215.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" -o /tmp/main.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR215_ARTIFACT_ID}" -o /tmp/artifact.json
          python3 -B - <<'PY'
          import json, os
          pr=json.load(open('/tmp/pr215.json'))
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['sha']==os.environ['BASE_HEAD']
          main=json.load(open('/tmp/main.json'))
          assert main['sha']==os.environ['MAIN_SHA']
          artifact=json.load(open('/tmp/artifact.json'))
          assert artifact['id']==int(os.environ['PR215_ARTIFACT_ID']) and artifact['expired'] is False
          assert artifact['workflow_run']['head_sha']==os.environ['BASE_HEAD']
          assert artifact['digest']=='sha256:'+os.environ['PR215_ARTIFACT_SHA256']
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR215_ARTIFACT_ID}/zip" -o /tmp/pr215.zip
          test "$(sha256sum /tmp/pr215.zip | awk '{print $1}')" = "$PR215_ARTIFACT_SHA256"

      - name: Compile and run focused full-chain host-only tests
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_base_20260730_v1.py \
            tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_contract_20260730_v1.py \
            tools/h3_n2_stage2d9r_g3r_d2_17_canonical_builder_20260730_v1.py \
            tools/h3_n2_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_wrapper_20260730_v1.py
          python3 -B -m unittest \
            tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_20260730_v1
          PR215_ARTIFACT_ZIP=/tmp/pr215.zip SOURCE_SHA="$PR_HEAD_SHA" sh \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_execution_identity_freeze_shell_20260730_v1.sh

      - name: Build exact-head canonical review Artifact
        run: |
          set -euo pipefail
          python3 -B tools/h3_n2_stage2d9r_g3r_d2_17_canonical_builder_20260730_v1.py \
            --source-root "$GITHUB_WORKSPACE" --pr215-artifact /tmp/pr215.zip --source-sha "$PR_HEAD_SHA" \
            --output /tmp/d2-17-execution-identity-freeze-review
          cd /tmp/d2-17-execution-identity-freeze-review
          sha256sum -c SHA256SUMS
          test -f D2_16_STATIC_CHECK_FAILURE_DISPOSITION.json
          test -f PHYSICAL_D2_REQUEST_17.json
          test -f D2_17_EXECUTION_IDENTITY_FREEZE_REVIEW.json
          test -z "$(find . -type l -print -quit)"
          test -z "$(find . \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit)"
          test -z "$(find . -type f -iname '*physical-authorization*.json' -print -quit)"

      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-execution-identity-freeze-stabilization-review-v1
          path: /tmp/d2-17-execution-identity-freeze-review
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
