name: H3 N2 Stage2D9R G3R D2-17 G03 nested SHA256SUMS set normalization repair

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g03-private-nested-sha256sums-failure-20260730-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-contract-20260730-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_nested_sha256sums_set_contract_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g03_nested_sha256sums_set_normalization_repair_20260730_v1.py"

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_HEAD: "205963a0680e177476a50c6c38a9eb5d294cb804"
      BASE_BRANCH: "fix/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-20260730-v1"
      LOAD_ARTIFACT_ID: "8757007857"
      LOAD_ARTIFACT_SHA256: "655c9de49d1a180f1c9657870616d8874a271e834bfdf5dbaaf85f78fca46ef8"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          python3 -B - <<'PY'
          import os, subprocess
          expected={
            ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-ci-v1.yml",
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g03-private-nested-sha256sums-failure-20260730-v1.json",
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-20260730-v1.json",
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-contract-20260730-v1.md",
            "tools/h3_n2_stage2d9r_g3r_d2_17_nested_sha256sums_set_contract_20260730_v1.py",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g03_nested_sha256sums_set_normalization_repair_20260730_v1.py",
          }
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed != expected:
              raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          PY

      - name: Verify PR 221 and load-bearing Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{GITHUB_REPOSITORY}}/pulls/221" -o /tmp/pr221.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{GITHUB_REPOSITORY}}/actions/artifacts/${{LOAD_ARTIFACT_ID}}" -o /tmp/artifact.json
          python3 -B - <<'PY'
          import json, os
          pr=json.load(open("/tmp/pr221.json"))
          assert pr["state"]=="open" and pr["draft"] is True and pr["merged"] is False
          assert pr["head"]["sha"]==os.environ["BASE_HEAD"]
          artifact=json.load(open("/tmp/artifact.json"))
          assert artifact["expired"] is False
          assert artifact["digest"]=="sha256:"+os.environ["LOAD_ARTIFACT_SHA256"]
          PY

      - name: Run host-only regression tests
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_17_g03_nested_sha256sums_set_normalization_repair_20260730_v1
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"

      - name: Build exact-head review Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g03-nested-set-repair-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g03-private-nested-sha256sums-failure-20260730-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-20260730-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-contract-20260730-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_nested_sha256sums_set_contract_20260730_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g03_nested_sha256sums_set_normalization_repair_20260730_v1.py \
            --target-directory "$OUT/source"
          python3 -B - "$OUT" "$PR_HEAD_SHA" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          out=Path(sys.argv[1]); head=sys.argv[2]
          value={
            "schema":"gh.h3.n2.stage2d9r-g3r-d2-17-g03-nested-sha256sums-set-normalization-repair-review/1",
            "status":"PASS",
            "source_sha":head,
            "decision_id":"D1-H3N2-STAGE2D9R-G3R-D2-17-G03-NESTED-SHA256SUMS-SET-NORMALIZATION-REPAIR-20260730-01",
            "g04_private_package_authorized":False,
            "authorization_created":False,
            "authorization_claimed":False,
            "authorization_consumed":False,
            "board_operation":False,
            "usb_enumeration":False,
            "serial_operation":False,
            "esptool_operation":False,
            "flash_operation":False,
          }
          value["review_binding_sha256"]=hashlib.sha256(json.dumps(value,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          (out/"D2_17_G03_NESTED_SHA256SUMS_SET_REPAIR_REVIEW.json").write_text(json.dumps(value,sort_keys=True,indent=2)+"\n")
          sums=[]
          for path in sorted(out.rglob("*")):
              if path.is_file():
                  sums.append(hashlib.sha256(path.read_bytes()).hexdigest()+"  "+path.relative_to(out).as_posix())
          (out/"SHA256SUMS").write_text("\n".join(sums)+"\n")
          PY

      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g03-nested-sha256sums-set-normalization-repair-review-v1
          path: /tmp/d2-17-g03-nested-set-repair-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
