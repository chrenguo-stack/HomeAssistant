name: H3 N2 Stage2D9R G3R D2-17 G04 private-source dual-binding repair

on:
  pull_request:
    paths:
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g04-physical-preclaim-private-source-drift-failure-20260730-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-private-source-dual-binding-contract-20260730-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_private_source_dual_binding_contract_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_shell_20260730_v1.sh"
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-ci-v1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: "2acda017ba287c36718fda1031d55acf4101697d"
      BASE_BRANCH: "feat/h3-n2-stage2d9r-g3r-d2-17-g04-physical-execution-decision-20260730-v1"
      ACCEPTANCE_ARTIFACT_ID: "8762446382"
      ACCEPTANCE_ARTIFACT_SHA256: "29fc05a244c50775a155bc5aaf6ff781cc10f8cbd528e53047cec3556789b202"
      PHYSICAL_ARTIFACT_ID: "8763290671"
      PHYSICAL_ARTIFACT_SHA256: "2f811e3b6dbeeaa4f8d2f05935c2024d4fa6b6f83803cd609ed4c268a1264baa"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          expected = {
            ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-ci-v1.yml",
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g04-physical-preclaim-private-source-drift-failure-20260730-v1.json",
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-20260730-v1.json",
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-private-source-dual-binding-contract-20260730-v1.md",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_20260730_v1.py",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_shell_20260730_v1.sh",
            "tools/h3_n2_stage2d9r_g3r_d2_17_private_source_dual_binding_contract_20260730_v1.py",
          }
          observed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],
              text=True,
          ).splitlines())
          if observed != expected:
              raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          for name in expected:
              if not Path(name).is_file():
                  raise SystemExit("SOURCE_FILE_MISSING:" + name)
          PY

      - name: Verify predecessor PR and load-bearing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/224" -o /tmp/pr224.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID" -o /tmp/acceptance.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PHYSICAL_ARTIFACT_ID" -o /tmp/physical.json
          python3 -B - <<'PY'
          import json, os
          pr=json.load(open("/tmp/pr224.json"))
          assert pr["state"]=="open" and pr["draft"] is True and pr["merged"] is False
          assert pr["head"]["sha"]==os.environ["BASE_HEAD"]
          for path,id_key,digest_key in (
              ("/tmp/acceptance.json","ACCEPTANCE_ARTIFACT_ID","ACCEPTANCE_ARTIFACT_SHA256"),
              ("/tmp/physical.json","PHYSICAL_ARTIFACT_ID","PHYSICAL_ARTIFACT_SHA256"),
          ):
              value=json.load(open(path))
              assert value["id"]==int(os.environ[id_key]) and value["expired"] is False
              assert value["digest"]=="sha256:"+os.environ[digest_key]
          assert json.load(open("/tmp/acceptance.json"))["workflow_run"]["head_sha"]=="e58b934c7e00125bf7d7c5a75f6ee338dd5dbdd7"
          assert json.load(open("/tmp/physical.json"))["workflow_run"]["head_sha"]=="2acda017ba287c36718fda1031d55acf4101697d"
          PY

      - name: Run repair tests
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_20260730_v1
          bash "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_shell_20260730_v1.sh"
          ! grep -R --line-number --fixed-strings "/Users/" \
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g04-physical-preclaim-private-source-drift-failure-20260730-v1.json" \
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-20260730-v1.json" \
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-private-source-dual-binding-contract-20260730-v1.md" \
            "tools/h3_n2_stage2d9r_g3r_d2_17_private_source_dual_binding_contract_20260730_v1.py" \
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_20260730_v1.py" \
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_shell_20260730_v1.sh"
          ! find . -type l -print -quit | grep -q .
          ! find . \( -type d -name __pycache__ -o -type f -name '*.pyc' \) -print -quit | grep -q .

      - name: Build exact-head repair Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g04-private-source-dual-binding-repair
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g04-physical-preclaim-private-source-drift-failure-20260730-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g04-private-source-dual-binding-repair-20260730-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-private-source-dual-binding-contract-20260730-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_private_source_dual_binding_contract_20260730_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_20260730_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g04_private_source_dual_binding_repair_shell_20260730_v1.sh \
            --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Upload exact-head repair Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g04-private-source-dual-binding-repair-review-v1
          path: /tmp/d2-17-g04-private-source-dual-binding-repair
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
