name: H3 N2 Stage2D9R G3R D2-17 G07 consumed TypeError forensic closure
on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-failure-disposition-20260731-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-closure-20260731-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-contract-20260731-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py"
      - "tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_ci_20260731_v1.sh"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: "813595aa9bfe2867473923c787daaf6a86afaa82"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact base ancestry and add-only inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os, subprocess
          expected = {
            ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-ci-v1.yml",
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-failure-disposition-20260731-v1.json",
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-closure-20260731-v1.json",
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-contract-20260731-v1.md",
            "tools/h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py",
            "tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_ci_20260731_v1.sh",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py",
          }
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed != expected:
              raise SystemExit(f"INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          PY
      - name: Run host-only forensic tests
        run: tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_ci_20260731_v1.sh
      - name: Build review artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g07-consumed-typeerror-forensic-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-failure-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-closure-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-consumed-typeerror-forensic-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py \
            tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_ci_20260731_v1.sh \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_consumed_typeerror_forensic_20260731_v1.py \
            --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: d2-17-g07-consumed-typeerror-forensic-review-v1
          path: /tmp/d2-17-g07-consumed-typeerror-forensic-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
