name: H3 N2 Stage2D9R G3R D2-17 G07 physical execution decision
on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-authorized-pending-20260731-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-20260731-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-contract-20260731-v1.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_driver_20260731_v1.py"
      - "tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.sh"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_HEAD: "fa85d0f335f47d60e2b2b1c6d43946246b246fe3"
      BASE_BRANCH: "docs/h3-n2-stage2d9r-g3r-d2-17-g07-static-check-acceptance-20260731-v1"
      ACCEPTANCE_ARTIFACT_ID: "8767063701"
      ACCEPTANCE_ARTIFACT_SHA256: "fb16558862c3110fc778d9bf8a24af7ff3c763ad1d923884ccdc4212a3571a6d"
      EXECUTION_ARTIFACT_ID: "8752919376"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os,subprocess
          expected=set(['.github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-ci-v1.yml', 'docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-authorized-pending-20260731-v1.json', 'docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-20260731-v1.json', 'docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-contract-20260731-v1.md', 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.py', 'tools/h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_driver_20260731_v1.py', 'tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.sh'])
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed!=expected: raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          PY
      - name: Verify predecessor and acceptance Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/228" -o /tmp/pr228.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTANCE_ARTIFACT_ID}" -o /tmp/accept.json
          python3 -B - <<'PY'
          import json,os
          pr=json.load(open('/tmp/pr228.json')); assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['head']['sha']==os.environ['BASE_HEAD']
          art=json.load(open('/tmp/accept.json')); assert art['expired'] is False and art['digest']=='sha256:'+os.environ['ACCEPTANCE_ARTIFACT_SHA256'] and art['workflow_run']['head_sha']==os.environ['BASE_HEAD']
          PY
      - name: Download frozen execution package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXECUTION_ARTIFACT_ID}/zip" -o /tmp/execution.zip
          mkdir /tmp/execution-artifact
          unzip -q /tmp/execution.zip -d /tmp/execution-artifact
          EXECUTION_ROOT=/tmp/execution-artifact/d2-17-execution-identity-frozen-physical-d2-execution-package
          test -d "$EXECUTION_ROOT"
          # upload-artifact/download-artifact does not preserve POSIX modes. Restore the
          # frozen 0600 modes only in this disposable /tmp CI fixture; content is unchanged.
          chmod 0600 \
            "$EXECUTION_ROOT/run_d2_17_canonical_delivery_outer_20260730_v1.sh" \
            "$EXECUTION_ROOT/run_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_20260730_v1.sh"
          test "$(stat -c '%a' "$EXECUTION_ROOT/run_d2_17_canonical_delivery_outer_20260730_v1.sh")" = 600
          test "$(stat -c '%a' "$EXECUTION_ROOT/run_stage2d9r_g3r_d2_17_execution_identity_frozen_physical_d2_20260730_v1.sh")" = 600
      - name: Run real two-hop host-only tests
        env:
          D2_17_G07_EXECUTION_ROOT: /tmp/execution-artifact/d2-17-execution-identity-frozen-physical-d2-execution-package
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          ! grep -R --line-number --fixed-strings '/Users/' docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-authorized-pending-20260731-v1.json docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-20260731-v1.json docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-contract-20260731-v1.md tools/h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_driver_20260731_v1.py
      - name: Build exact-head review Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g07-physical-execution-decision-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-authorized-pending-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g07-physical-execution-decision-contract-20260731-v1.md \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.py \
            tools/h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_driver_20260731_v1.py \
            tools/run_h3_n2_stage2d9r_g3r_d2_17_g07_physical_execution_decision_20260731_v1.sh \
            --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g07-physical-execution-decision-review-v1
          path: /tmp/d2-17-g07-physical-execution-decision-review
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
