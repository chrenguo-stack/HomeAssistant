name: H3 N2 Stage2D9R G3R D2-17 G08 physical execution decision
on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-ci-v1.yml"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-20260731-v1.json"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-authorized-pending-20260731-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-contract-20260731-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_driver_20260731_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_runtime_identity_adapter_entry_20260731_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_decision_marker_finalizer_20260731_v1.py"
      - "tools/run_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_HEAD: "5508344b84189f42fce04721b8a70ba02cb7b933"
      BASE_BRANCH: "docs/h3-n2-stage2d9r-g3r-d2-17-g08-static-check-acceptance-20260731-v1"
      EXECUTION_ARTIFACT_ID: "8752919376"
      EXECUTION_ARTIFACT_SHA256: "b5e003ad806b7cb924b388fa4be155046cf03799b89ff0253d759a533f37d121"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PYI'
          import os,subprocess
          expected=['.github/workflows/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-ci-v1.yml', 'docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-20260731-v1.json', 'docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-authorized-pending-20260731-v1.json', 'docs/development/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-contract-20260731-v1.md', 'tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_driver_20260731_v1.py', 'tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_runtime_identity_adapter_entry_20260731_v1.py', 'tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_decision_marker_finalizer_20260731_v1.py', 'tools/run_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh', 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.py', 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh']
          observed=subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines()
          if set(observed)!=set(expected): raise SystemExit(f"INVENTORY_MISMATCH missing={sorted(set(expected)-set(observed))} extra={sorted(set(observed)-set(expected))}")
          PYI
      - name: Download exact frozen execution Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXECUTION_ARTIFACT_ID}/zip" -o /tmp/execution.zip
          test "$(sha256sum /tmp/execution.zip | awk '{print $1}')" = "$EXECUTION_ARTIFACT_SHA256"
          mkdir /tmp/execution && unzip -q /tmp/execution.zip -d /tmp/execution
      - name: Run identity-adapted host-only execution regression
        env:
          D2_17_EXECUTION_ROOT: /tmp/execution/d2-17-execution-identity-frozen-physical-d2-execution-package
        run: |
          set -euo pipefail
          /bin/sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh
      - name: Build exact-head review Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g08-physical-execution-decision-review
          mkdir -p "$OUT/source"
          cp --parents docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-20260731-v1.json docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-authorized-pending-20260731-v1.json docs/development/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-contract-20260731-v1.md tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_driver_20260731_v1.py tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_runtime_identity_adapter_entry_20260731_v1.py tools/h3_n2_stage2d9r_g3r_d2_17_g08_physical_decision_marker_finalizer_20260731_v1.py tools/run_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.py tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g08_physical_execution_decision_20260731_v1.sh --target-directory "$OUT/source"
          cp --parents .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g08-physical-execution-decision-ci-v1.yml --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g08-physical-execution-decision-review-v1
          path: /tmp/d2-17-g08-physical-execution-decision-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
