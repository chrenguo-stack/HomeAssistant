name: H3 N2 Stage2D9R G3R D2-17 G10 expired unexecuted G11 reauthorization

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-g11-reauthorization-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-disposition-20260731-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-private-package-static-check-authorization-pending-20260731-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g10-expiry-g11-reauthorization-contract-20260731-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_contract_20260731_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: "36181664b7ac1ad8753b0ca5e525437615aab6ac"
      BASE_BRANCH: "docs/h3-n2-stage2d9r-g3r-d2-17-g10-static-check-acceptance-20260731-v1"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          python3 -B - <<'PY'
          import os
          import subprocess

          expected = {
              ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-g11-reauthorization-ci-v1.yml",
              "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-disposition-20260731-v1.json",
              "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-private-package-static-check-authorization-pending-20260731-v1.json",
              "docs/development/h3-n2-stage2d9r-g3r-d2-17-g10-expiry-g11-reauthorization-contract-20260731-v1.md",
              "tools/h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_contract_20260731_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.py",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.sh",
          }
          observed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}"
              )
          status = subprocess.check_output(
              ["git", "diff", "--name-status", f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],
              text=True,
          ).splitlines()
          if any(not line.startswith("A\t") for line in status):
              raise SystemExit(f"NON_ADD_ONLY_CHANGE: {status}")
          PY

      - name: Run expiry and successor regression
        run: |
          set -euo pipefail
          /bin/sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.sh
          ! grep -R --line-number --fixed-strings '/Users/' \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-private-package-static-check-authorization-pending-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g10-expiry-g11-reauthorization-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_contract_20260731_v1.py
          ! grep -R --line-number -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password|credential|secret_value' \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-private-package-static-check-authorization-pending-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g10-expiry-g11-reauthorization-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_contract_20260731_v1.py

      - name: Build exact-head review Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g10-expired-unexecuted-g11-reauthorization-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-g11-reauthorization-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g10-expired-unexecuted-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-private-package-static-check-authorization-pending-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g10-expiry-g11-reauthorization-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_contract_20260731_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g10_expired_unexecuted_g11_reauthorization_20260731_v1.sh \
            --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g10-expired-unexecuted-g11-reauthorization-review-v1
          path: /tmp/d2-17-g10-expired-unexecuted-g11-reauthorization-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
