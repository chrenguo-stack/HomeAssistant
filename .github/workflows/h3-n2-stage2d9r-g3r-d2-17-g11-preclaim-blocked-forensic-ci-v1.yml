name: H3 N2 Stage2D9R G3R D2-17 G11 preclaim-blocked forensic gate

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-forensic-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-disposition-20260731-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-read-only-preclaim-forensic-export-pending-20260731-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-forensic-contract-20260731-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_contract_20260731_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_20260731_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_20260731_v1.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: "60241de4eedf195bcc636ddbacc97b1de81b8a0d"
      BASE_BRANCH: "docs/h3-n2-stage2d9r-g3r-d2-17-g11-physical-execution-decision-20260731-v1"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD_SHA"
          test -z "$(git diff --diff-filter=DMRT --name-only "$BASE_HEAD...$PR_HEAD_SHA")"
          test "$(git diff --name-only "$BASE_HEAD...$PR_HEAD_SHA" | wc -l | tr -d ' ')" = "7"

      - name: Run G11 disposition regression
        run: |
          set -euo pipefail
          /bin/sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_20260731_v1.sh
          ! grep -R --line-number --fixed-strings '/Users/' \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-read-only-preclaim-forensic-export-pending-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-forensic-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_contract_20260731_v1.py

      - name: Build exact-head review Artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-g11-preclaim-blocked-forensic-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-forensic-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-disposition-20260731-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g11-read-only-preclaim-forensic-export-pending-20260731-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g11-preclaim-blocked-forensic-contract-20260731-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_contract_20260731_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_20260731_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g11_preclaim_blocked_forensic_20260731_v1.sh \
            --target-directory "$OUT/source"
          printf '%s\n' "$PR_HEAD_SHA" > "$OUT/SOURCE_SHA"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Upload exact-head review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-g11-preclaim-blocked-forensic-review-v1
          path: /tmp/d2-17-g11-preclaim-blocked-forensic-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
