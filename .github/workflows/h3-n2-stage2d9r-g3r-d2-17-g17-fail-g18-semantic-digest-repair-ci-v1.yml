name: H3 N2 Stage2D9R G3R D2-17 G17 fail G18 semantic digest repair

on:
  pull_request:
    paths:
      - '.github/workflows/h3-n2-stage2d9r-g3r-d2-17-g17-fail-g18-semantic-digest-repair-ci-v1.yml'
      - 'docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g17-raw-vs-semantic-digest-failure-20260801-v1.json'
      - 'docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g18-semantic-record-digest-successor-pending-20260801-v1.json'
      - 'docs/development/h3-n2-stage2d9r-g3r-d2-17-g17-fail-g18-semantic-digest-repair-contract-20260801-v1.md'
      - 'tools/h3_n2_stage2d9r_g3r_d2_17_g18_semantic_terminal_file_verification_20260801_v1.py'
      - 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.py'
      - 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact add-only stacked boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='e4d1e7cee8928984538e5f63879b192533ee031e'
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git diff --diff-filter=DMRTUXB --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 0
          test "$(git diff --diff-filter=A --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 7

      - name: Run G18 contract tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.sh
          python3 -B -m py_compile \
            tools/h3_n2_stage2d9r_g3r_d2_17_g18_semantic_terminal_file_verification_20260801_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify public safety boundary
        shell: bash
        run: |
          set -euo pipefail
          SCAN_FILES=(
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g17-raw-vs-semantic-digest-failure-20260801-v1.json
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g18-semantic-record-digest-successor-pending-20260801-v1.json
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g17-fail-g18-semantic-digest-repair-contract-20260801-v1.md
            tools/h3_n2_stage2d9r_g3r_d2_17_g18_semantic_terminal_file_verification_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.sh
          )
          if grep -En '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*[:=]|token[[:space:]]*[:=]|/Users/|/dev/cu\.|/dev/tty)' "${SCAN_FILES[@]}"; then
            exit 1
          fi
          if grep -En '(subprocess|import serial|import socket|esptool\.main|mosquitto_sub|mosquitto_pub)' \
            tools/h3_n2_stage2d9r_g3r_d2_17_g18_semantic_terminal_file_verification_20260801_v1.py; then
            exit 1
          fi

      - name: Assemble load-bearing review artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g18-review"
          mkdir -p "$ROOT/source"
          FILES=(
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g17-fail-g18-semantic-digest-repair-ci-v1.yml
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g17-raw-vs-semantic-digest-failure-20260801-v1.json
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-g18-semantic-record-digest-successor-pending-20260801-v1.json
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g17-fail-g18-semantic-digest-repair-contract-20260801-v1.md
            tools/h3_n2_stage2d9r_g3r_d2_17_g18_semantic_terminal_file_verification_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g17_fail_g18_semantic_digest_repair_20260801_v1.sh
          )
          for file in "${FILES[@]}"; do
            mkdir -p "$ROOT/source/$(dirname "$file")"
            cp "$file" "$ROOT/source/$file"
          done
          printf '%s\n' "$PR_HEAD_SHA" > "$ROOT/SOURCE_SHA"
          (
            cd "$ROOT"
            find source -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test "$(wc -l < "$ROOT/SHA256SUMS" | tr -d ' ')" = 7

      - uses: actions/upload-artifact@v4
        with:
          name: d2-17-g17-fail-g18-semantic-digest-repair-review-v1
          path: ${{ runner.temp }}/g18-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
