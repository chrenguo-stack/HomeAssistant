name: H3 N2 Stage2D9R G3R D2-17 G18 final closure

on:
  pull_request:
    paths:
      - '.github/workflows/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-ci-v1.yml'
      - 'docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g18-target-mac-host-only-closure-pass-20260801-v1.json'
      - 'docs/decisions/h3-n2-stage2d9r-g3r-d2-17-final-closure-20260801-v1.json'
      - 'docs/development/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-contract-20260801-v1.md'
      - 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.py'
      - 'tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact add-only stacked boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='edd14457aae8b8e3b254d274599c23c9205cfd75'
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git diff --diff-filter=DMRTUXB --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 0
          test "$(git diff --diff-filter=A --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 6

      - name: Run G18 final closure tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.sh
          python3 -B -m py_compile \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify public safety boundary
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-ci-v1.yml
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g18-target-mac-host-only-closure-pass-20260801-v1.json
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-final-closure-20260801-v1.json
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-contract-20260801-v1.md
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.sh
          )
          ! grep -En '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*[:=]|token[[:space:]]*[:=]|/Users/|/dev/cu\.|/dev/tty)' "${FILES[@]}"
          ! grep -En '(subprocess|import serial|import socket|esptool\.main|mosquitto_sub|mosquitto_pub)' \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.py

      - name: Assemble load-bearing review artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g18-final-closure-review"
          mkdir -p "$ROOT/source"
          FILES=(
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-ci-v1.yml
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g18-target-mac-host-only-closure-pass-20260801-v1.json
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-final-closure-20260801-v1.json
            docs/development/h3-n2-stage2d9r-g3r-d2-17-g18-pass-final-closure-contract-20260801-v1.md
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.py
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_g18_pass_final_closure_20260801_v1.sh
          )
          for file in "${FILES[@]}"; do
            mkdir -p "$ROOT/source/$(dirname "$file")"
            cp "$file" "$ROOT/source/$file"
          done
          printf '%s\n' "$PR_HEAD_SHA" > "$ROOT/SOURCE_SHA"
          (
            cd "$ROOT"
            find source -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test "$(wc -l < "$ROOT/SHA256SUMS" | tr -d ' ')" = 6

      - uses: actions/upload-artifact@v4
        with:
          name: d2-17-g18-pass-final-closure-review-v1
          path: ${{ runner.temp }}/g18-final-closure-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
