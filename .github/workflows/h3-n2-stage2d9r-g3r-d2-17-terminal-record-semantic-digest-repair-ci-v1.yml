name: H3 N2 Stage2D9R G3R D2-17 terminal record semantic digest repair

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g02-physical-preclaim-terminal-digest-failure-20260730-v1.json"
      - "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-20260730-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-contract-20260730-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_contract_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_20260730_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_shell_20260730_v1.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_HEAD: "c7a3f55a7eea879f3065785e4fa109a0c93449ce"
      BASE_BRANCH: "docs/h3-n2-stage2d9r-g3r-d2-17-g02-physical-execution-decision-20260730-v1"
      MAIN_SHA: "64c6b093c3ba6a8476c9392c8d106394b2542fb5"
      BASE_ARTIFACT_ID: "8755900629"
      BASE_ARTIFACT_SHA256: "52862f40468753b3158b81603041a6375a510b6d80cb377e00319c015bfd722a"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact stacked base and add-only inventory
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$EVENT_BASE_SHA" = "$BASE_HEAD"
          test "$EVENT_BASE_REF" = "$BASE_BRANCH"
          python3 -B - <<'PY'
          import os, subprocess
          expected={
            ".github/workflows/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-ci-v1.yml",
            "docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g02-physical-preclaim-terminal-digest-failure-20260730-v1.json",
            "docs/decisions/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-20260730-v1.json",
            "docs/development/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-contract-20260730-v1.md",
            "tools/h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_contract_20260730_v1.py",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_20260730_v1.py",
            "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_shell_20260730_v1.sh",
          }
          observed=set(subprocess.check_output(["git","diff","--name-only",f"{os.environ['BASE_HEAD']}...{os.environ['PR_HEAD_SHA']}"],text=True).splitlines())
          if observed != expected:
              raise SystemExit(f"SOURCE_INVENTORY_MISMATCH missing={sorted(expected-observed)} extra={sorted(observed-expected)}")
          PY

      - name: Verify current main, PR 220 and load-bearing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/220" -o /tmp/pr220.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" -o /tmp/main.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" -o /tmp/artifact.json
          python3 -B - <<'PY'
          import json, os
          pr=json.load(open('/tmp/pr220.json'))
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['head']['sha']==os.environ['BASE_HEAD']
          assert json.load(open('/tmp/main.json'))['sha']==os.environ['MAIN_SHA']
          artifact=json.load(open('/tmp/artifact.json'))
          assert artifact['expired'] is False and artifact['workflow_run']['head_sha']==os.environ['BASE_HEAD']
          assert artifact['digest']=='sha256:'+os.environ['BASE_ARTIFACT_SHA256']
          PY

      - name: Run focused unit and real shell tests
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.h3_n2_stage2d9r_tls_candidate.test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_20260730_v1
          sh tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_shell_20260730_v1.sh
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"

      - name: Build exact-head review artifact
        run: |
          set -euo pipefail
          OUT=/tmp/d2-17-terminal-record-semantic-repair-review
          mkdir -p "$OUT/source"
          cp --parents \
            .github/workflows/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-ci-v1.yml \
            docs/acceptance/h3-n2-stage2d9r-g3r-d2-17-g02-physical-preclaim-terminal-digest-failure-20260730-v1.json \
            docs/decisions/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-20260730-v1.json \
            docs/development/h3-n2-stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-contract-20260730-v1.md \
            tools/h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_contract_20260730_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_20260730_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_d2_17_terminal_record_semantic_digest_repair_shell_20260730_v1.sh \
            --target-directory "$OUT/source"
          python3 -B - "$OUT" "$PR_HEAD_SHA" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          out=Path(sys.argv[1]); head=sys.argv[2]
          value={'schema':'gh.h3.n2.stage2d9r-g3r-d2-17-terminal-record-semantic-digest-repair-review/1','status':'PASS','source_sha':head,'g02_authorization_claimed':False,'g02_authorization_consumed':False,'board_operation':False,'usb_enumeration':False,'flash_operation':False,'g03_private_package_created':False,'physical_execution_authorized':False}
          value['review_binding_sha256']=hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'D2_17_TERMINAL_RECORD_SEMANTIC_DIGEST_REPAIR_REVIEW.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          sums=[]
          for path in sorted(out.rglob('*')):
              if path.is_file(): sums.append(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.relative_to(out).as_posix())
          (out/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          PY

      - name: Upload exact-head review artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-17-terminal-record-semantic-digest-repair-review-v1
          path: /tmp/d2-17-terminal-record-semantic-repair-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
