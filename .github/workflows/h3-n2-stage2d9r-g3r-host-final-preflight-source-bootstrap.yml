name: H3 N2 Stage2D9R Host Final Preflight Source Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-host-final-preflight-source-bootstrap.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  stage-final-workflow-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Verify current seven-file source layer
        env:
          EXPECTED_BASE_SHA: 261f24dc7e01fe9eaaf0a607a2868cd4411286bf
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "$(git merge-base HEAD "$EXPECTED_BASE_SHA")" = "$EXPECTED_BASE_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/h3-n2-stage2d9r-g3r-host-final-preflight-source-bootstrap.yml
          docs/decisions/h3-n2-stage2d9r-g3r-payload-handoff-host-final-preflight-20260728-v1.json
          docs/development/h3-n2-stage2d9r-g3r-payload-handoff-host-final-preflight-contract-20260728-v1.md
          tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_payload_handoff_host_final_preflight_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_payload_handoff_final_physical_d2_wrapper_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_payload_handoff_host_final_preflight_contract_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_payload_handoff_host_final_preflight_packager_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_payload_handoff_host_final_preflight_probe_20260728_v1.py
          EOF
          diff -u /tmp/expected /tmp/actual

      - name: Reconstruct exact final workflow blob from issue 192
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARCHIVE_SHA256: c561b42462a9d1058f73e6bce99f53b83a6685a2693b904de6af4b75ad368231
          EXPECTED_WORKFLOW_BLOB_SHA: 626e14a7b9768ce7337e9de3c088a7dbb61ab7e9
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/192/comments" > /tmp/comments.json
          python - <<'PY'
          import base64, gzip, hashlib, io, json, os, tarfile
          from pathlib import Path, PurePosixPath

          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          chunks = {}
          for comment in comments:
              try:
                  value = json.loads(comment['body'])
              except (KeyError, TypeError, json.JSONDecodeError):
                  continue
              if value.get('schema') != 'gh.stage2d9r-source-bootstrap-chunk/1':
                  continue
              assert value.get('total') == 4
              index = value.get('index')
              data = value.get('data')
              assert isinstance(index, int) and 1 <= index <= 4
              assert isinstance(data, str) and data and index not in chunks
              chunks[index] = data
          assert set(chunks) == {1, 2, 3, 4}
          raw = base64.b64decode(''.join(chunks[i] for i in range(1, 5)), validate=True)
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_ARCHIVE_SHA256']
          with gzip.GzipFile(fileobj=io.BytesIO(raw), mode='rb') as gz:
              tar_bytes = gz.read()
          wanted = '.github/workflows/h3-n2-stage2d9r-g3r-payload-handoff-host-final-preflight-review-ci-v1.yml'
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as archive:
              member = archive.getmember(wanted)
              pure = PurePosixPath(member.name)
              assert member.isfile() and not pure.is_absolute() and '..' not in pure.parts
              handle = archive.extractfile(member)
              assert handle is not None
              data = handle.read()
          observed = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
          assert observed == os.environ['EXPECTED_WORKFLOW_BLOB_SHA']
          target = Path('bootstrap/payload-handoff-host-final-preflight-review-ci-v1.yml.txt')
          assert not target.exists()
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          target.chmod(0o644)
          PY
          test "$(git hash-object bootstrap/payload-handoff-host-final-preflight-review-ci-v1.yml.txt)" = "$EXPECTED_WORKFLOW_BLOB_SHA"

      - name: Commit staged normal-path workflow blob
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/payload-handoff-host-final-preflight-review-ci-v1.yml.txt
          test "$(git diff --cached --name-only)" = "bootstrap/payload-handoff-host-final-preflight-review-ci-v1.yml.txt"
          git commit -m "chore: stage exact host-final workflow blob"
          git push origin "HEAD:$HEAD_BRANCH"
