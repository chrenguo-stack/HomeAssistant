name: H3 N2 Stage2D9R G3R Main Drift Rebind Source Bootstrap

on:
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-20260728-v1
    paths:
      - .github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-bootstrap.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact bootstrap boundary
        env:
          BASE_SHA: bdfcda55ff248838f0d703abf6d2414f3f73eff7
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chrenguo-stack/HomeAssistant"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual-bootstrap
          cat > /tmp/expected-bootstrap <<'LIST'
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-0.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-1.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-2.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-3.b64
          .github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-bootstrap.yml
          LIST
          diff -u /tmp/expected-bootstrap /tmp/actual-bootstrap
          echo '14b5350e280c668d1965e3eb4d40e8d54563c840261bea21bb89b5ce17202049  .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-0.b64' | sha256sum -c -
          echo '67e2c9f0cc11ab46324b7f18e34cca2c44a5450897b6ade72af003a5a600b705  .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-1.b64' | sha256sum -c -
          echo 'b977db0a91ae3787fcab426979dcc6f49be7354e3118f1af5e71ca0a7ba17c96  .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-2.b64' | sha256sum -c -
          echo '96b09cee1e49450007913c8dee06b43c3a19dd41919488fff2f0760ebe13640c  .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-3.b64' | sha256sum -c -

      - name: Materialize exact reviewed source archive
        run: |
          set -euo pipefail
          cat .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-{0,1,2,3}.b64 > /tmp/source.b64
          python - <<'PY'
          import base64, gzip, hashlib, io, tarfile
          from pathlib import Path, PurePosixPath

          expected = {
              ".github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-review-ci-v1.yml": "59864cab7082915bd14add17506fac3696d441d3ece9f5a26eb75d47f5d6a878",
              "docs/decisions/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-20260728-v1.json": "b320d7aacefec957ee56003d683f4a283c20a39bfbfca15709d3d6a3e1c6a431",
              "docs/development/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-contract-20260728-v1.md": "4f4f365d203a048978162163b3e2f7ef6158353bee900991350b07e9eeb2dccf",
              "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_main_drift_successor_rebind_20260728_v1.py": "6d56c14247bbdfa7b6fddd459f657b8154098543ef0f11a95d36e7a220e01020",
              "tools/h3_n2_stage2d9r_g3r_main_drift_rebound_final_physical_d2_wrapper_20260728_v1.py": "11b9c096cfe80600c3ceb43d79c9b3b3b20773a83b4404ea9c057ade3e60a379",
              "tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_contract_20260728_v1.py": "055590fd10ed2759f6a91b15e3c4ba96719253247e8875fc7381377d6f9c7750",
              "tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_packager_20260728_v1.py": "2d04220981b48e491c34e7066dd399d22f8066e60f1efbfe9962447517456390",
              "tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_probe_20260728_v1.py": "358abe7eb9839bdafff4bd54e349dafd958d71a546b715e3de388f8d18079dfd",
          }
          encoded = Path('/tmp/source.b64').read_bytes()
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '5b7a93c888888007cba105be59d4e460c640418b960ac671a10f80cb5a7208bf'
          tar_bytes = gzip.decompress(raw)
          assert hashlib.sha256(tar_bytes).hexdigest() == '70c0fd0f62ccc4f76f4a59e0de69ef33cdf1a222624584341ffd4f65a8c6b08c'
          files = {}
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as archive:
              for member in archive.getmembers():
                  pure = PurePosixPath(member.name)
                  assert member.isfile() and not pure.is_absolute() and '..' not in pure.parts
                  assert member.name not in files
                  handle = archive.extractfile(member)
                  assert handle is not None
                  files[member.name] = handle.read()
          assert set(files) == set(expected)
          for name, digest in expected.items():
              data = files[name]
              assert hashlib.sha256(data).hexdigest() == digest
              target = Path(name)
              assert not target.exists()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o644)
          PY
          rm -rf .bootstrap
          rm .github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-bootstrap.yml

      - name: Commit exact final eight-file source layer
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | sort > /tmp/actual-final
          cat > /tmp/expected-final <<'LIST'
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-0.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-1.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-2.b64
          .bootstrap/h3-n2-stage2d9r-g3r-main-drift-rebind-source-3.b64
          .github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-bootstrap.yml
          .github/workflows/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-review-ci-v1.yml
          docs/decisions/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-20260728-v1.json
          docs/development/h3-n2-stage2d9r-g3r-main-drift-successor-rebind-contract-20260728-v1.md
          tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_main_drift_successor_rebind_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_main_drift_rebound_final_physical_d2_wrapper_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_contract_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_packager_20260728_v1.py
          tools/h3_n2_stage2d9r_g3r_main_drift_successor_rebind_probe_20260728_v1.py
          LIST
          diff -u /tmp/expected-final /tmp/actual-final
          git commit -m "feat(n2): freeze accepted main-drift successor rebind"
          git push origin "HEAD:$HEAD_BRANCH"
