name: H3 N2 Stage2D9R G3R Repaired Immutable Recovery Freeze CI V1

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-g3r-repaired-immutable-recovery-freeze-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-g3r-repaired-u1-public-acceptance-l1-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-repaired-immutable-recovery-freeze-contract-20260728-v1.md"
      - "firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare/greenhouse_profile_isolated_device_g3r_repaired_immutable_20260728_v1.yml"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_repaired_tlsvalid03/**"
      - "tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_g3r_repaired_immutable_build_binding_20260728_v1.json"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_immutable_recovery_20260728_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_repaired_immutable_recovery_pipeline_20260728_v1.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_BASE_BRANCH: fix/h3-n2-stage2d9r-g3r-repaired-u1-host-preflight-20260728-v1
  EXPECTED_BASE_SHA: 922374a46b5ad6198623ab177efc5c313d4edff4
  EXPECTED_MAIN_SHA: c16da1a2d4d8300198b0603359eea349a034e2ea
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  SOURCE_DATE_EPOCH: "1785196800"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONHASHSEED: "0"
  PUBLIC_DIR: tests/h3_n2_stage2d9r_tls_candidate/public_repaired_tlsvalid03
  BINDING_FILE: tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_g3r_repaired_immutable_build_binding_20260728_v1.json
  PIPELINE: tools/h3_n2_stage2d9r_g3r_repaired_immutable_recovery_pipeline_20260728_v1.py
  HOST_CONTROLLER: tools/h3_n2_stage2d9r_serial_handshake_repair_20260727_v1.py
  TARGET_DIR: firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare
  TARGET_CONFIG: greenhouse_profile_isolated_device_g3r_repaired_immutable_20260728_v1.yml
  PARTITION_CSV: firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3_prepare/stage2d9_g3_partitions_20260722_v65.csv

jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed on layered PR and repository drift
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$EVENT_BASE_REF" = "$EXPECTED_BASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"

          for number in 187 186 185 184 183 180 176; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" > "/tmp/pr-$number.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              187: ("922374a46b5ad6198623ab177efc5c313d4edff4", "2ed70e3292e5b6522ac3a5bc279c94535cd7b784"),
              186: ("2ed70e3292e5b6522ac3a5bc279c94535cd7b784", "662bd9027595a7dcfaaaedb977691b13b3fec74b"),
              185: ("662bd9027595a7dcfaaaedb977691b13b3fec74b", "abd28fc25c2d814b7becd9488915735bc26ac297"),
              184: ("abd28fc25c2d814b7becd9488915735bc26ac297", "4a5b7a5290f04500050783124f9711268dba0afd"),
              183: ("4a5b7a5290f04500050783124f9711268dba0afd", "b2c481d5c824bd6606d914f5828ba6a1662000b1"),
              180: ("b2c481d5c824bd6606d914f5828ba6a1662000b1", "cf841f3e5a8cf04c5df9875c499b91ad4e4289cb"),
              176: ("cf841f3e5a8cf04c5df9875c499b91ad4e4289cb", None),
          }
          for number, (head, base) in expected.items():
              value = json.loads(Path(f"/tmp/pr-{number}.json").read_text())
              assert value["state"] == "open", number
              assert value["draft"] is True, number
              assert value["merged"] is False, number
              assert value["head"]["sha"] == head, number
              if base is not None:
                  assert value["base"]["sha"] == base, number
          PY

      - name: Verify upstream source and private boundaries are unchanged
        run: |
          set -euo pipefail
          git diff --exit-code "$EXPECTED_BASE_SHA"...HEAD -- \
            tools/h3_n2_stage2d9r_g3r_repaired_private_material_generator_20260728_v1.py \
            tools/h3_n2_stage2d9r_g3r_repaired_private_material_contract_20260728_v1.py \
            tools/h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py \
            tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py \
            tools/h3_n2_stage2d9r_serial_handshake_repair_20260727_v1.py \
            firmware/esphome_rc/components/greenhouse_profile_isolated_device_g3r_executor \
            firmware/esphome_rc/components/greenhouse_profile_isolated_device_g3r_ready_repeater
          test -z "$(git status --porcelain)"

      - name: Validate public U1 evidence, contract and source tests
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/stage2d9r-repaired-freeze-pycache
          python -m py_compile "$PIPELINE" \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_immutable_recovery_20260728_v1.py
          python "$PIPELINE" validate-public \
            --public-dir "$PUBLIC_DIR" \
            --binding "$BINDING_FILE" \
            | tee /tmp/stage2d9r-repaired-public-validation.log
          grep -Fx 'STAGE2D9R_REPAIRED_PUBLIC_INPUT_VALIDATION=PASS' \
            /tmp/stage2d9r-repaired-public-validation.log
          python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_immutable_recovery_20260728_v1.py -v \
            2>&1 | tee /tmp/stage2d9r-repaired-freeze-tests.log
          grep -F 'Ran 6 tests' /tmp/stage2d9r-repaired-freeze-tests.log
          grep -F 'OK' /tmp/stage2d9r-repaired-freeze-tests.log
          grep -F '4051f5d541898cef742f35aeec757e7fc479f383' "$TARGET_DIR/$TARGET_CONFIG"
          grep -F 'f1fe3ccbda78f069e6cf1e47ee4c3340878372f42fc24a21126884eb0c22df98' "$TARGET_DIR/$TARGET_CONFIG"
          grep -F 'e9abe88df80f21311ea9ea4977b78f531380a37564490c1108fabeae8cc5bc5a' "$TARGET_DIR/$TARGET_CONFIG"
          ! grep -R -I -n -E \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|GH2D9R_PREPARE_V1 tlsvalid03|GH2D9R_VERIFY_V1 tlsvalid03|/Users/|/private/tmp/' \
            "$PUBLIC_DIR" "$BINDING_FILE" \
            docs/acceptance/h3-n2-stage2d9r-g3r-repaired-u1-public-acceptance-l1-v1.json
          rm -rf "$PYTHONPYCACHEPREFIX"

  immutable-build:
    needs: source-review
    strategy:
      fail-fast: true
      matrix:
        lane: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ESPHome
        run: python -m pip install -q "esphome==2026.4.3"

      - name: Bind ESPHome build clock
        id: clock
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/esphome-writer-binding.txt
          import hashlib
          import os
          from pathlib import Path
          import esphome.writer

          path = Path(esphome.writer.__file__).resolve(strict=True)
          text = path.read_text(encoding="utf-8")
          old = (
              '    build_time = int(time.time())\n'
              '    build_time_str = time.strftime("%Y-%m-%d %H:%M:%S %z", time.localtime(build_time))\n'
          )
          new = (
              '    source_date_epoch = os.environ.get("SOURCE_DATE_EPOCH")\n'
              '    build_time = int(source_date_epoch) if source_date_epoch is not None else int(time.time())\n'
              '    build_time_str = time.strftime("%Y-%m-%d %H:%M:%S %z", time.localtime(build_time))\n'
          )
          if text.count(old) != 1:
              raise RuntimeError("unexpected ESPHome 2026.4.3 writer source")
          path.write_text(text.replace(old, new), encoding="utf-8")
          print(hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          writer_sha="$(tail -n1 /tmp/esphome-writer-binding.txt)"
          test "${#writer_sha}" = 64
          echo "writer_sha=$writer_sha" >> "$GITHUB_OUTPUT"

      - name: Capture deterministic build environments
        id: env
        env:
          WRITER_SHA: ${{ steps.clock.outputs.writer_sha }}
        run: |
          set -euo pipefail
          {
            python --version
            python -m pip freeze --all
          } | LC_ALL=C sort > /tmp/python-environment.txt
          openssl version -a | LC_ALL=C > /tmp/openssl-environment.txt
          printf '%s\n' \
            'esphome==2026.4.3' \
            "esphome-writer-sha256=$WRITER_SHA" \
            "source-date-epoch=$SOURCE_DATE_EPOCH" \
            > /tmp/esphome-environment.txt
          echo "python_sha=$(sha256sum /tmp/python-environment.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "openssl_sha=$(sha256sum /tmp/openssl-environment.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "esphome_sha=$(sha256sum /tmp/esphome-environment.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$(sha256sum .github/workflows/h3-n2-stage2d9r-g3r-repaired-immutable-recovery-freeze-ci-v1.yml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate and clean compile repaired immutable target
        run: |
          set -euo pipefail
          rm -rf "$TARGET_DIR/.esphome"
          (
            cd "$TARGET_DIR"
            esphome config "$TARGET_CONFIG" 2>&1 | tee "/tmp/config-${{ matrix.lane }}.log"
            esphome compile "$TARGET_CONFIG" 2>&1 | tee "/tmp/compile-${{ matrix.lane }}.log"
          )
          grep -F 'INFO Successfully compiled program.' "/tmp/compile-${{ matrix.lane }}.log"
          app="$TARGET_DIR/.esphome/build/gh-2d9r-g3r-r3/.pioenvs/gh-2d9r-g3r-r3/firmware.bin"
          test -f "$app"
          strings "$app" | grep -Fx '2026-07-28 00:00:00 +0000'

      - name: Package immutable lane
        env:
          LANE: ${{ matrix.lane }}
          PYTHON_ENV_SHA: ${{ steps.env.outputs.python_sha }}
          OPENSSL_ENV_SHA: ${{ steps.env.outputs.openssl_sha }}
          ESPHOME_ENV_SHA: ${{ steps.env.outputs.esphome_sha }}
          WORKFLOW_SHA: ${{ steps.env.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          out="/tmp/stage2d9r-repaired-immutable-$LANE"
          python "$PIPELINE" build-immutable \
            --build-root "$TARGET_DIR/.esphome/build/gh-2d9r-g3r-r3" \
            --output-dir "$out" \
            --lane "$LANE" \
            --source-sha "$SOURCE_SHA" \
            --python-environment-sha256 "$PYTHON_ENV_SHA" \
            --openssl-environment-sha256 "$OPENSSL_ENV_SHA" \
            --esphome-environment-sha256 "$ESPHOME_ENV_SHA" \
            --workflow-sha256 "$WORKFLOW_SHA" \
            --public-dir "$PUBLIC_DIR" \
            --binding "$BINDING_FILE" \
            --partition-csv "$PARTITION_CSV" \
            --host-controller "$HOST_CONTROLLER" \
            | tee "/tmp/package-$LANE.log"
          grep -Fx 'STAGE2D9R_REPAIRED_IMMUTABLE_BUILD=PASS' "/tmp/package-$LANE.log"
          grep -Fx 'PRIVATE_VALUES_INCLUDED=false' "/tmp/package-$LANE.log"
          grep -Fx 'BOARD_OPERATION=false' "/tmp/package-$LANE.log"

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-build-${{ matrix.lane }}-v1
          path: /tmp/stage2d9r-repaired-immutable-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  immutable-freeze:
    needs: immutable-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-build-a-v1
          path: /tmp/immutable-a
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-build-b-v1
          path: /tmp/immutable-b
      - name: Freeze byte-identical immutable builds
        run: |
          set -euo pipefail
          out=/tmp/stage2d9r-repaired-immutable-freeze
          python "$PIPELINE" freeze-immutable \
            --build-a /tmp/immutable-a \
            --build-b /tmp/immutable-b \
            --output-dir "$out" \
            --source-sha "$SOURCE_SHA" \
            | tee /tmp/immutable-freeze.log
          (cd "$out" && sha256sum -c SHA256SUMS)
          grep -Fx 'STAGE2D9R_REPAIRED_IMMUTABLE_FREEZE=PASS' /tmp/immutable-freeze.log
          grep -Fx 'REPRODUCIBLE=true' /tmp/immutable-freeze.log
          grep -Fx 'EXECUTION_AUTHORIZED=false' /tmp/immutable-freeze.log
      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-freeze-v1
          path: /tmp/stage2d9r-repaired-immutable-freeze
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  recovery-build:
    needs: immutable-freeze
    strategy:
      fail-fast: true
      matrix:
        lane: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-freeze-v1
          path: /tmp/immutable-freeze
      - name: Build independent locked-recovery package
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          out="/tmp/stage2d9r-repaired-recovery-$LANE"
          python "$PIPELINE" build-recovery \
            --immutable-freeze /tmp/immutable-freeze \
            --output-dir "$out" \
            --lane "$LANE" \
            --source-sha "$SOURCE_SHA" \
            --public-dir "$PUBLIC_DIR" \
            --binding "$BINDING_FILE" \
            | tee "/tmp/recovery-$LANE.log"
          grep -Fx 'STAGE2D9R_REPAIRED_LOCKED_RECOVERY_BUILD=PASS' "/tmp/recovery-$LANE.log"
          grep -Fx 'RECOVERY_AUTHORIZED=false' "/tmp/recovery-$LANE.log"
          grep -Fx 'BOARD_OPERATION=false' "/tmp/recovery-$LANE.log"
      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-locked-recovery-build-${{ matrix.lane }}-v1
          path: /tmp/stage2d9r-repaired-recovery-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  final-freeze:
    needs: recovery-build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-freeze-v1
          path: /tmp/immutable-freeze
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-locked-recovery-build-a-v1
          path: /tmp/recovery-a
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-locked-recovery-build-b-v1
          path: /tmp/recovery-b
      - name: Freeze recovery and derive final execution binding
        run: |
          set -euo pipefail
          out=/tmp/stage2d9r-repaired-immutable-recovery-freeze
          python "$PIPELINE" freeze-recovery \
            --build-a /tmp/recovery-a \
            --build-b /tmp/recovery-b \
            --immutable-freeze /tmp/immutable-freeze \
            --output-dir "$out" \
            --source-sha "$SOURCE_SHA" \
            --public-dir "$PUBLIC_DIR" \
            --binding "$BINDING_FILE" \
            --host-controller "$HOST_CONTROLLER" \
            | tee /tmp/final-freeze.log
          (cd "$out" && sha256sum -c SHA256SUMS)
          grep -Fx 'STAGE2D9R_REPAIRED_IMMUTABLE_RECOVERY_FREEZE=PASS' /tmp/final-freeze.log
          grep -Fx 'NEXT_GATE=BASELINE_READONLY_GATE' /tmp/final-freeze.log
          grep -Fx 'EXECUTION_AUTHORIZED=false' /tmp/final-freeze.log
          grep -Fx 'BOARD_OPERATION=false' /tmp/final-freeze.log
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/stage2d9r-repaired-immutable-recovery-freeze")
          manifest = json.loads((root / "immutable-recovery-freeze-manifest.json").read_text())
          binding = json.loads((root / "final-execution-binding.json").read_text())
          assert manifest["state"] == "REPAIRED_IMMUTABLE_RECOVERY_FROZEN_FINAL_BINDING_READY"
          assert manifest["immutable_clean_build_count"] == 2
          assert manifest["immutable_builds_byte_identical"] is True
          assert manifest["recovery_clean_build_count"] == 2
          assert manifest["recovery_payloads_byte_identical"] is True
          assert len(manifest["final_execution_binding"]) == 40
          assert len(manifest["final_execution_binding_sha256"]) == 64
          assert manifest["final_execution_binding_sha256"] == binding["final_execution_binding_sha256"]
          for value in (manifest, binding):
              for key, observed in value.items():
                  if key.endswith("_authorized"):
                      assert observed is False, key
          PY
          ! grep -R -I -n -E \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|GH2D9R_PREPARE_V1 tlsvalid03|GH2D9R_VERIFY_V1 tlsvalid03|/Users/|/private/tmp/' \
            "$out"

      - name: Upload final public freeze Artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-g3r-repaired-immutable-recovery-freeze-v1
          path: /tmp/stage2d9r-repaired-immutable-recovery-freeze
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Report locked boundary
        run: |
          printf '%s\n' \
            'STAGE2D9R_REPAIRED_IMMUTABLE_RECOVERY_WORKFLOW=PASS' \
            "SOURCE_SHA=$SOURCE_SHA" \
            "ARTIFACT_ID=${{ steps.artifact.outputs.artifact-id }}" \
            "ARTIFACT_DIGEST=${{ steps.artifact.outputs.artifact-digest }}" \
            'NEXT_GATE=BASELINE_READONLY_GATE' \
            'D2_AUTHORIZED=false' \
            'RECOVERY_AUTHORIZED=false' \
            'BOARD_OPERATION=false' \
            'USB_ENUMERATION=false' \
            'SERIAL_OPERATION=false' \
            'ESPTOOL_OPERATION=false' \
            'FLASH_OPERATION=false' \
            'PHYSICAL_NVS_OPERATION=false' \
            'NETWORK_OPERATION=false' \
            'BROKER_STARTED=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false' \
            'ACTIVATE_EXECUTED=false' \
            'CLEANUP_EXECUTED=false' \
            'READY=false' \
            'MERGE=false' \
            'RELEASE=false' \
            'TAG=false' \
            'DEPLOYMENT=false'
