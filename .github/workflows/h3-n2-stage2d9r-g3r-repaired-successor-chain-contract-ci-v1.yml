name: H3 N2 Stage2D9R G3R Repaired Successor Contract CI

on:
  pull_request:
    paths:
      - "docs/decisions/h3-n2-stage2d9r-g3r-repaired-successor-chain-d1-20260728-v1.json"
      - "docs/development/h3-n2-stage2d9r-g3r-repaired-successor-chain-contract-20260728-v1.md"
      - "tools/h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_repaired_private_material_contract_20260728_v1.py"
      - "tools/h3_n2_stage2d9r_g3r_repaired_private_material_generator_20260728_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_private_material_20260728_v1.py"
      - ".github/workflows/h3-n2-stage2d9r-g3r-repaired-successor-chain-contract-ci-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py \
            tools/h3_n2_stage2d9r_g3r_repaired_private_material_contract_20260728_v1.py \
            tools/h3_n2_stage2d9r_g3r_repaired_private_material_generator_20260728_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_private_material_20260728_v1.py

      - name: Run contract tests
        run: |
          set -euo pipefail
          python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py
          python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_g3r_repaired_private_material_20260728_v1.py

      - name: Validate inert source outputs
        run: |
          set -euo pipefail
          python tools/h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py --source-sha "${GITHUB_SHA}" > /tmp/source.json
          python tools/h3_n2_stage2d9r_g3r_repaired_private_material_contract_20260728_v1.py > /tmp/private-contract.json
          python tools/h3_n2_stage2d9r_g3r_repaired_private_material_generator_20260728_v1.py > /tmp/private-generator.json
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/source.json').read_text())
          private_contract = json.loads(Path('/tmp/private-contract.json').read_text())
          generator = json.loads(Path('/tmp/private-generator.json').read_text())
          assert source['state'] == 'SOURCE_CONTRACT_ACCEPTED_NO_EXECUTION_AUTHORITY'
          assert source['decision_id'] == 'D1-H3N2-STAGE2D9R-G3R-REPAIRED-SUCCESSOR-CHAIN-20260728-01'
          assert source['base_head_sha'] == '662bd9027595a7dcfaaaedb977691b13b3fec74b'
          assert source['current_main_sha'] == 'c16da1a2d4d8300198b0603359eea349a034e2ea'
          assert source['run_suffix'] == 'tlsvalid03'
          assert private_contract['state'] == 'SOURCE_ONLY_REQUIRES_NEW_EXACT_U1'
          assert generator['status'] == 'SOURCE_ONLY_REQUIRES_NEW_EXACT_U1'
          common = (
              'authorization_created', 'authorization_claimed',
              'authorization_consumed', 'secret_generation',
              'private_material_created', 'board_operation',
              'flash_operation', 'physical_nvs_operation',
              'network_operation', 'broker_started', 'prepare_executed',
              'verify_executed', 'private_paths_included',
              'secret_values_included',
          )
          for value in (source, private_contract, generator):
              for key in common:
                  assert value[key] is False, (value.get('schema'), key)
          assert source['serial_enumeration'] is False
          assert source['serial_open'] is False
          assert private_contract['serial_operation'] is False
          assert generator['serial_operation'] is False
          PY

      - name: Validate import and decision boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          source_path = Path('tools/h3_n2_stage2d9r_g3r_repaired_successor_chain_contract_20260728_v1.py')
          tree = ast.parse(source_path.read_text(encoding='utf-8'))
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          assert imported <= {'__future__', 'argparse', 'hashlib', 'json', 're', 'typing'}, imported

          forbidden = {'socket', 'serial', 'esptool', 'paho', 'requests', 'urllib', 'http'}
          for name in (
              'tools/h3_n2_stage2d9r_g3r_repaired_private_material_contract_20260728_v1.py',
              'tools/h3_n2_stage2d9r_g3r_repaired_private_material_generator_20260728_v1.py',
          ):
              tree = ast.parse(Path(name).read_text(encoding='utf-8'))
              imported = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name.split('.')[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module.split('.')[0])
              assert not (imported & forbidden), (name, imported & forbidden)

          decision = json.loads(Path('docs/decisions/h3-n2-stage2d9r-g3r-repaired-successor-chain-d1-20260728-v1.json').read_text())
          assert decision['status'] == 'ACCEPTED'
          assert decision['layering']['base_head_sha'] == '662bd9027595a7dcfaaaedb977691b13b3fec74b'
          assert decision['accepted_repository_drift']['current_main_sha'] == 'c16da1a2d4d8300198b0603359eea349a034e2ea'
          assert decision['retired_execution']['terminal_status'] == 'CONSUMED_FAILED'
          assert decision['retired_execution']['terminal_state'] == 'LOCKED_RECOVERY_COMPLETED'
          assert decision['decision']['new_run_suffix'] == 'tlsvalid03'
          assert decision['secret_values_included'] is False
          assert decision['private_paths_included'] is False
          PY
