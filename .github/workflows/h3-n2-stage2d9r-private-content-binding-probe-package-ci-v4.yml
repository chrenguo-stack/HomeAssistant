name: H3 N2 Stage2D9R Private Content Binding Probe Package CI V4

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-private-content-binding-probe-package-ci-v4.yml"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v1.py"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py"
      - "docs/acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json"
      - "docs/development/h3-n2-stage2d9r-private-content-binding-u1-review-20260724-v2.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/**"
      - "tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_tls_candidate_descriptor_20260723_v1.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: a3a72d75480362999e70e180f33459198b3951b5
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REQUEST_ID: U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04
  U1_03_MARKER_SHA256: 8aa4a1bcc20f55cf027d1e047286e8289682af7c261d9afb540641427bce15c7

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed on repository drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          observed_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$observed_main" = "$EXPECTED_MAIN_SHA"

      - name: Verify corrected verifier and frozen public bindings
        shell: bash
        run: |
          set -euo pipefail
          python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py
          python - <<'PY'
          import json
          from pathlib import Path

          failure = json.loads(Path("docs/acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json").read_text())
          public = json.loads(Path("tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_tls_candidate_descriptor_20260723_v1.json").read_text())
          assert failure["authorization_id"] == "U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-03"
          assert failure["status"] == "CONSUMED_FAILED"
          assert failure["failure_code"] == "BROKER_CERTIFICATE_DIGEST_MISMATCH"
          assert failure["consumed_marker_sha256"] == "8aa4a1bcc20f55cf027d1e047286e8289682af7c261d9afb540641427bce15c7"
          assert failure["replay_permitted"] is False
          assert failure["automatic_retry_permitted"] is False
          assert public["public_material"]["broker_certificate_sha256"] == "988b6f82b04b0b3cf13f58a07ecd85e420e5576c167fe01ea0940d4530e20ac7"
          assert public["public_material"]["broker_spki_sha256"] == "f034dc2a036f709287f0558773418ee1799e75bee50dcf55e09143a3a9052a03"
          assert public["public_material"]["ca_pem_sha256"] == "cfcb6638ed61731270f3bf8e9e262c1512fbca8ff34d4b08b62186453233e963"
          PY

      - name: Assemble V4 review-only artifact
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v4"
          rm -rf "$root"
          mkdir -p "$root/tools" "$root/tests" "$root/review" "$root/acceptance" "$root/public"
          cp tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v1.py "$root/tools/"
          cp tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py "$root/tools/"
          cp tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py "$root/tests/"
          cp docs/development/h3-n2-stage2d9r-private-content-binding-u1-review-20260724-v2.md "$root/review/"
          cp docs/acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json "$root/acceptance/"
          cp tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_tls_candidate_descriptor_20260723_v1.json "$root/public/"
          cp tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/public-descriptor.redacted.json "$root/public/"
          cp tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/isolated-broker-public-config.redacted.json "$root/public/"
          cp tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/root-ca.cert.txt "$root/public/"
          cp tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/broker.cert.txt "$root/public/"

          ROOT="$root" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          source = os.environ["SOURCE_SHA"]
          request = os.environ["REQUEST_ID"]
          marker_sha = os.environ["U1_03_MARKER_SHA256"]
          command = (
              "One future exact U1 may authorize one offline, one-shot, read-only private-content "
              "binding verification using the corrected DER certificate digest contract. It may "
              "read existing private material only inside the reviewed verifier process and output "
              "only booleans and already-public SHA-256 bindings. No secret output, network, Broker, "
              "board, serial, Flash/NVS, PREPARE, VERIFY, ACTIVATE, CLEANUP, production, Ready, merge, "
              "release, tag or deployment action is permitted.\n"
          )
          stop = (
              "# Fail-closed stop conditions\n\n"
              "Stop before claim if any PR, main, HEAD, CI, package, toolchain, custody, descriptor, "
              "historical marker, candidate, immutable Artifact or recovery Artifact binding differs. "
              "U1-03 is permanently CONSUMED_FAILED and cannot be replayed. A future U1-04 must be "
              "one-shot, no longer than two hours, non-replayable and non-retryable; success and failure "
              "both permanently consume it.\n"
          )
          readme = (
              "# Stage 2D-9R private-content binding preauthorization review V4\n\n"
              "Review-only package for request U1-04. It uses the corrected DER certificate digest "
              "verifier and binds the retired U1-03 CONSUMED_FAILED marker. It contains no authorization "
              "record and no authorized execution launcher. The included launcher performs checksum and "
              "toolchain/preauthorization probing only and does not read private content.\n"
          )
          (root / "COMMAND_GROUP_REVIEW_ONLY.txt").write_text(command)
          (root / "STOP_CONDITIONS.md").write_text(stop)
          (root / "README.md").write_text(readme)

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          binding = {
              "schema": "gh.h3.n2.stage2d9r-private-content-binding-review-package/1",
              "stage": "H3/N2 Stage 2D-9R G3R",
              "state": "PENDING_EXACT_U1_TOOLCHAIN_PROBE_V4",
              "authorization_request_id": request,
              "repository": "chrenguo-stack/HomeAssistant",
              "pull_request": 176,
              "main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "source_sha": source,
              "head_branch": "feature/h3-n2-stage2d9r-g3-tls-valid-candidate-20260723-v1",
              "probe_sha256": sha(root / "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py"),
              "base_probe_sha256": sha(root / "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v1.py"),
              "contract_test_sha256": sha(root / "tests/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py"),
              "command_group_sha256": sha(root / "COMMAND_GROUP_REVIEW_ONLY.txt"),
              "stop_conditions_sha256": sha(root / "STOP_CONDITIONS.md"),
              "u1_03_failed_marker_sha256": marker_sha,
              "u1_03_failure_acceptance_sha256": sha(root / "acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json"),
              "u1_03_authorization_record_sha256": "38edfa6ba1d42aea5d0d6d57f0a3157209be3afc6873f957d92d0156fceae0a2",
              "u1_03_failure_code": "BROKER_CERTIFICATE_DIGEST_MISMATCH",
              "u1_03_status": "CONSUMED_FAILED",
              "python_executable_sha256_required": "4e28e811a89aeac6eed668ae641c7f85f5831e42e8dc6cd9a85a3bcc032ec46a",
              "python_version_required": "3.11.9",
              "openssl_executable_sha256_required": "04ad05ce2e7eaf92116dac99a984cc0e589040a103589f93a9fe452832766973",
              "openssl_version_required": "OpenSSL 3.5.0 8 Apr 2025",
              "command_custody": {
                  "root_digest_sha256": "ef5f79be168fff686cabcc91fdc4109918d75d3311da1209dd8d0e381804006e",
                  "private_descriptor_sha256": "cda5b1604200045fec0db45e46f9c441e1bde10f2e5a57f8c98ee2d14b5f9a75",
                  "public_descriptor_sha256": "91c10168174438fc30b3dce087a6b75e24375b87b4262bafddb5b2822ee16d23",
                  "package_sha256": "cc9086c20781007655c498b78ff1ce7af3316db0c02edbae2440d177d7fdfbb5",
                  "unlock_digest_sha256": "3650d44f8761f21dc1931fbd9b6ba6a1d9da92ffa469b3d4f98ee5411a6809e3",
                  "u1_01_marker_sha256": "7461c0396a7be9fc99d1e880fdfc386054f003b4a64f9e758e6b826f93769314",
                  "u1_02_marker_sha256": "1fc51b7338adc56b00b38795173b805b7408e7aafa4e0315e7553dc5898779a9"
              },
              "pki_custody": {
                  "root_digest_sha256": "4cd43ee4b2df177bd99c32d3904dbe1e1df890aa14c6b6714a6b4f7ae4024868",
                  "private_descriptor_sha256": "59814b825cd2df4ac7f0e3eb137798af4efdbbed4da9d627fe8ad98144be8687",
                  "public_descriptor_sha256": "93bb071a5bf6f58472ac9e3891c2330dd9de6f05410824ad2fb51829267b4540",
                  "package_sha256": "0632b37a70aa2eae416c48ffa9420a8f1e13788c22a7d12e211f77cf6e78a267",
                  "ca_pem_sha256": "cfcb6638ed61731270f3bf8e9e262c1512fbca8ff34d4b08b62186453233e963",
                  "broker_certificate_sha256": "988b6f82b04b0b3cf13f58a07ecd85e420e5576c167fe01ea0940d4530e20ac7",
                  "broker_spki_sha256": "f034dc2a036f709287f0558773418ee1799e75bee50dcf55e09143a3a9052a03",
                  "candidate_digest_sha256": "f22144e37372b883b7a38d07eff2980a865108cf7c8fed9bfdb9f198a030b5c5",
                  "marker_sha256": "fbe03088de17b8db4d8b048e1985d571ca9f54d3add9b9fc3fce1735c9bec261"
              },
              "immutable_artifact": {
                  "artifact_id": 8585140964,
                  "run_id": 30062650179,
                  "github_digest_sha256": "ecc28451499e0d2d934c7e298037ed5ee156c887bf72a9b258101c4aef7e2808",
                  "payload_sha256": "5dbe763fe411728533018dd324075f5287ee3542f8351113d54ec80a7042f1d3",
                  "application_sha256": "7651a6476cd48dda6aa5e400695e126b91141c95fca5b74d879f65f2058d1630",
                  "merged_sha256": "ea6af469ad7ae103d40a551f482fc18d1f2afc9ed75933481f1802f0a7b2916f",
                  "source_sha": "c9e8447c24b0f09f3eac3f56791f2346e8aa5d61",
                  "expired": False
              },
              "recovery_artifact": {
                  "artifact_id": 8589561310,
                  "run_id": 30075191850,
                  "github_digest_sha256": "f1654002f894ec136f4b52248a6b0e26ed9dedc7460e8205ec9f852b161d4a6a",
                  "payload_sha256": "c1ed8e5f00b17cbe5bab30aec75d2e8637986b9c19b2389b761bebf3fc0b8d8b",
                  "manifest_sha256": "fe82c458533953df4c86966d047d1f66b59da15e5299b3953135702236d68690",
                  "erased_sha256": "71189f7fb6aed638640078fba3a35fda6c39c8962e74dcc75935aac948da9063",
                  "source_sha": "f312f8580d9f4312f4dd1429b2d7755e1c550636",
                  "expired": False
              },
              "authorization_record_included": False,
              "authorized_execution_launcher_included": False,
              "private_content_read": False,
              "private_paths_included": False,
              "secret_values_included": False,
              "network_operation": False,
              "broker_started": False,
              "board_operation": False,
              "serial_operation": False,
              "flash_operation": False,
              "physical_nvs_operation": False,
              "prepare_executed": False,
              "verify_executed": False,
              "activate_executed": False,
              "cleanup_executed": False,
              "production_operation": False
          }
          canonical = json.dumps(binding, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          binding["review_binding_sha256"] = hashlib.sha256(canonical).hexdigest()
          (root / "PROBE_PACKAGE_BINDING.json").write_text(json.dumps(binding, indent=2, sort_keys=True) + "\n")
          PY

          cat > "$root/run_stage2d9r_private_content_binding_toolchain_probe_20260724_v4_2f6c8a91.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          ROOT="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)"
          cd "$ROOT"
          shasum -a 256 -c SHA256SUMS
          echo PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V4_BEGIN
          set +e
          "$(command -v python3)" \
            "$ROOT/tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py" \
            --package-root "$ROOT" \
            --probe-toolchain
          rc=$?
          set -e
          echo PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V4_END
          exit "$rc"
          SH

          chmod 700 "$root/run_stage2d9r_private_content_binding_toolchain_probe_20260724_v4_2f6c8a91.sh"
          find "$root" -type f ! -name 'run_*.sh' -exec chmod 600 {} +
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 \
              | sed 's#  \./#  #' > SHA256SUMS
            chmod 600 SHA256SUMS
          )

      - name: Smoke-test V4 packaged launcher boundary
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v4"
          home="$(mktemp -d)"
          out="$(mktemp)"
          set +e
          HOME="$home" "$root/run_stage2d9r_private_content_binding_toolchain_probe_20260724_v4_2f6c8a91.sh" >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V4_BEGIN$' "$out"
          grep -q '^FAILURE_STAGE=READ_ONLY_TOOLCHAIN_PREAUTH_PROBE$' "$out"
          grep -q '^FAILURE_CODE=PYTHON_DIGEST_CHANGED$' "$out"
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V4_END$' "$out"
          ! grep -q 'PRIVATE_CONTENT_READ=true' "$out"
          test ! -e "$home/.local/state/greenhouse-stage2d9r/authorizations/U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04.consumed.json"
          rm -rf "$home" "$out"

      - name: Verify V4 artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v4"
          (
            cd "$root"
            shasum -a 256 -c SHA256SUMS
          )
          test ! -e "$root/authorization"
          test -z "$(find "$root" -type f -name '*.authorization.json' -print -quit)"
          test -z "$(find "$root" -type f -iname '*authorized*launcher*' -print -quit)"
          ! grep -R -I -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|/Users/|/private/tmp/' "$root"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v4")
          binding = json.loads((root / "PROBE_PACKAGE_BINDING.json").read_text())
          assert binding["authorization_request_id"].endswith("-04")
          assert binding["u1_03_failed_marker_sha256"] == "8aa4a1bcc20f55cf027d1e047286e8289682af7c261d9afb540641427bce15c7"
          assert binding["u1_03_status"] == "CONSUMED_FAILED"
          assert binding["authorization_record_included"] is False
          assert binding["authorized_execution_launcher_included"] is False
          for key, value in binding.items():
              if key.endswith("_operation") or key.endswith("_executed") or key in {"private_content_read", "broker_started"}:
                  assert value is False, key
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-private-content-binding-preauth-review-v4
          path: .artifacts/stage2d9r-private-content-binding-preauth-review-v4
          if-no-files-found: error
          retention-days: 5
          include-hidden-files: true

      - name: Report refreshed U1-04 review binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          binding = json.loads(Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v4/PROBE_PACKAGE_BINDING.json").read_text())
          for key in (
              "authorization_request_id",
              "source_sha",
              "probe_sha256",
              "review_binding_sha256",
              "command_group_sha256",
              "stop_conditions_sha256",
              "u1_03_failed_marker_sha256",
          ):
              print(f"{key}={binding[key]}")
          print("authorization_record_included=false")
          print("authorized_execution_launcher_included=false")
          print("private_content_read=false")
          print("network_operation=false")
          print("board_operation=false")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .artifacts
