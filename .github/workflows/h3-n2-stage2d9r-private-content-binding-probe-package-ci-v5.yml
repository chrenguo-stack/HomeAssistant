name: H3 N2 Stage2D9R Private Content Binding Probe Package CI V5

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-private-content-binding-probe-package-ci-v5.yml"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v1.py"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py"
      - "tools/h3_n2_stage2d9r_private_content_review_packager_20260724_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py"
      - "docs/acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json"
      - "docs/development/h3-n2-stage2d9r-private-content-binding-u1-review-20260724-v2.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: a3a72d75480362999e70e180f33459198b3951b5
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed on repository drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          observed_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$observed_main" = "$EXPECTED_MAIN_SHA"

      - name: Validate corrected verifier contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py

      - name: Assemble deterministic V5 review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python tools/h3_n2_stage2d9r_private_content_review_packager_20260724_v1.py \
            --repository-root . \
            --output .artifacts/stage2d9r-private-content-binding-preauth-review-v5 \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$EXPECTED_MAIN_SHA" \
            | tee .artifacts/stage2d9r-private-content-binding-preauth-review-v5-summary.json

      - name: Smoke-test packaged launcher argument boundary
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v5"
          home="$(mktemp -d)"
          out="$(mktemp)"
          set +e
          HOME="$home" "$root/run_stage2d9r_private_content_binding_toolchain_probe_20260724_v5_7d31c4a8.sh" >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V5_BEGIN$' "$out"
          grep -q '^FAILURE_STAGE=READ_ONLY_TOOLCHAIN_PREAUTH_PROBE$' "$out"
          grep -q '^FAILURE_CODE=PYTHON_DIGEST_CHANGED$' "$out"
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V5_END$' "$out"
          ! grep -q 'PRIVATE_CONTENT_READ=true' "$out"
          test ! -e "$home/.local/state/greenhouse-stage2d9r/authorizations/U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04.consumed.json"
          rm -rf "$home" "$out"

      - name: Verify package boundary
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v5"
          (cd "$root" && shasum -a 256 -c SHA256SUMS)
          test ! -e "$root/authorization"
          test -z "$(find "$root" -type f -name '*.authorization.json' -print -quit)"
          ! grep -R -I -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|/Users/|/private/tmp/' "$root"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v5")
          binding = json.loads((root / "PROBE_PACKAGE_BINDING.json").read_text())
          assert binding["authorization_request_id"] == "U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04"
          assert binding["u1_03_failed_marker_sha256"] == "8aa4a1bcc20f55cf027d1e047286e8289682af7c261d9afb540641427bce15c7"
          assert binding["u1_03_status"] == "CONSUMED_FAILED"
          assert binding["authorization_record_included"] is False
          assert binding["authorized_execution_launcher_included"] is False
          for key in (
              "private_content_read",
              "network_operation",
              "broker_started",
              "board_operation",
              "serial_operation",
              "flash_operation",
              "physical_nvs_operation",
              "prepare_executed",
              "verify_executed",
              "activate_executed",
              "cleanup_executed",
              "production_operation",
          ):
              assert binding[key] is False, key
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-private-content-binding-preauth-review-v5
          path: .artifacts/stage2d9r-private-content-binding-preauth-review-v5
          if-no-files-found: error
          retention-days: 5
          include-hidden-files: true

      - name: Report U1-04 review binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          binding = json.loads(Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v5/PROBE_PACKAGE_BINDING.json").read_text())
          for key in (
              "authorization_request_id",
              "source_sha",
              "probe_sha256",
              "review_binding_sha256",
              "command_group_sha256",
              "stop_conditions_sha256",
              "u1_03_failed_marker_sha256",
          ):
              print(f"{key}={binding[key]}")
          print("authorization_record_included=false")
          print("authorized_execution_launcher_included=false")
          print("private_content_read=false")
          print("network_operation=false")
          print("board_operation=false")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .artifacts
