name: H3 N2 Stage2D9R Private Content Binding Probe Package CI V6

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-private-content-binding-probe-package-ci-v6.yml"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v1.py"
      - "tools/h3_n2_stage2d9r_private_content_binding_probe_20260724_v3.py"
      - "tools/h3_n2_stage2d9r_private_content_review_packager_20260724_v1.py"
      - "tools/h3_n2_stage2d9r_private_content_review_packager_20260724_v2.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py"
      - "docs/acceptance/h3-n2-stage2d9r-private-content-u1-03-failure-l1-v1.json"
      - "docs/development/h3-n2-stage2d9r-private-content-binding-u1-review-20260724-v2.md"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid01/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: a3a72d75480362999e70e180f33459198b3951b5
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed on repository drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          observed_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$observed_main" = "$EXPECTED_MAIN_SHA"

      - name: Validate corrected verifier contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_content_binding_probe_20260724_v4.py

      - name: Assemble deterministic V6 review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          PYTHONDONTWRITEBYTECODE=1 \
            python tools/h3_n2_stage2d9r_private_content_review_packager_20260724_v2.py \
              --repository-root . \
              --output .artifacts/stage2d9r-private-content-binding-preauth-review-v6 \
              --source-sha "$SOURCE_SHA" \
              --main-sha "$EXPECTED_MAIN_SHA" \
              | tee .artifacts/stage2d9r-private-content-binding-preauth-review-v6-summary.json

      - name: Smoke-test packaged launcher without mutation
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v6"
          before="$(mktemp)"
          after="$(mktemp)"
          home="$(mktemp -d)"
          out="$(mktemp)"
          (cd "$root" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > "$before"
          set +e
          HOME="$home" "$root/run_stage2d9r_private_content_binding_toolchain_probe_20260724_v6_91e4b7c2.sh" >"$out" 2>&1
          rc=$?
          set -e
          (cd "$root" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > "$after"
          test "$rc" -eq 2
          cmp "$before" "$after"
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V6_BEGIN$' "$out"
          grep -q '^FAILURE_STAGE=READ_ONLY_TOOLCHAIN_PREAUTH_PROBE$' "$out"
          grep -q '^FAILURE_CODE=PYTHON_DIGEST_CHANGED$' "$out"
          grep -q '^PRIVATE_CONTENT_BINDING_TOOLCHAIN_PROBE_V6_END$' "$out"
          test -z "$(find "$root" -type d -name __pycache__ -print -quit)"
          test -z "$(find "$root" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          test ! -e "$home/.local/state/greenhouse-stage2d9r/authorizations/U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04.consumed.json"
          rm -rf "$home" "$out" "$before" "$after"

      - name: Verify exact package inventory and boundary
        shell: bash
        run: |
          set -euo pipefail
          root=".artifacts/stage2d9r-private-content-binding-preauth-review-v6"
          (cd "$root" && shasum -a 256 -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v6")
          sums = root / "SHA256SUMS"
          covered = {line.split("  ", 1)[1] for line in sums.read_text().splitlines()}
          observed = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path != sums
          }
          assert covered == observed, (sorted(covered - observed), sorted(observed - covered))
          binding = json.loads((root / "PROBE_PACKAGE_BINDING.json").read_text())
          assert binding["state"] == "PENDING_EXACT_U1_TOOLCHAIN_PROBE_V6"
          assert binding["authorization_request_id"] == "U1-H3N2-STAGE2D9R-PRIVATE-CONTENT-BINDING-20260724-04"
          assert binding["u1_03_failed_marker_sha256"] == "8aa4a1bcc20f55cf027d1e047286e8289682af7c261d9afb540641427bce15c7"
          assert binding["u1_03_status"] == "CONSUMED_FAILED"
          for key in (
              "authorization_record_included",
              "authorized_execution_launcher_included",
              "private_content_read",
              "network_operation",
              "broker_started",
              "board_operation",
              "serial_operation",
              "flash_operation",
              "physical_nvs_operation",
              "prepare_executed",
              "verify_executed",
              "activate_executed",
              "cleanup_executed",
              "production_operation",
          ):
              assert binding[key] is False, key
          PY
          test ! -e "$root/authorization"
          test -z "$(find "$root" -type f -name '*.authorization.json' -print -quit)"
          test -z "$(find "$root" -type d -name __pycache__ -print -quit)"
          test -z "$(find "$root" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          ! grep -R -I -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|/Users/|/private/tmp/' "$root"

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-private-content-binding-preauth-review-v6
          path: .artifacts/stage2d9r-private-content-binding-preauth-review-v6
          if-no-files-found: error
          retention-days: 5
          include-hidden-files: true

      - name: Report U1-04 V6 binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          binding = json.loads(Path(".artifacts/stage2d9r-private-content-binding-preauth-review-v6/PROBE_PACKAGE_BINDING.json").read_text())
          for key in (
              "authorization_request_id",
              "source_sha",
              "probe_sha256",
              "review_binding_sha256",
              "command_group_sha256",
              "stop_conditions_sha256",
              "u1_03_failed_marker_sha256",
          ):
              print(f"{key}={binding[key]}")
          print("complete_inventory_bound=true")
          print("bytecode_cache_included=false")
          print("authorization_record_included=false")
          print("authorized_execution_launcher_included=false")
          print("private_content_read=false")
          print("network_operation=false")
          print("board_operation=false")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .artifacts
