name: H3 N2 Stage2D9R Serial Repair Compile Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-serial-handshake-repair-config-diagnostic.yml"
      - "firmware/esphome_rc/components/greenhouse_profile_isolated_device_g3r_executor_v2/**"
      - "firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare/greenhouse_profile_isolated_device_g3r_serial_handshake_repair_20260727_v2.yml"

permissions:
  contents: read

jobs:
  compile-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q "esphome==2026.4.3"
      - name: Capture ESPHome config result
        id: config
        continue-on-error: true
        run: |
          set +e
          cd firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare
          esphome config greenhouse_profile_isolated_device_g3r_serial_handshake_repair_20260727_v2.yml \
            > /tmp/stage2d9r-serial-repair-config-diagnostic.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /tmp/stage2d9r-serial-repair-config-diagnostic.rc
          exit "$rc"
      - name: Capture ESPHome compile result
        id: compile
        if: steps.config.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare
          esphome compile greenhouse_profile_isolated_device_g3r_serial_handshake_repair_20260727_v2.yml \
            > /tmp/stage2d9r-serial-repair-compile-diagnostic.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /tmp/stage2d9r-serial-repair-compile-diagnostic.rc
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2d9r-serial-repair-compile-diagnostic
          path: |
            /tmp/stage2d9r-serial-repair-config-diagnostic.log
            /tmp/stage2d9r-serial-repair-config-diagnostic.rc
            /tmp/stage2d9r-serial-repair-compile-diagnostic.log
            /tmp/stage2d9r-serial-repair-compile-diagnostic.rc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve diagnostic failure
        if: steps.config.outcome != 'success' || steps.compile.outcome != 'success'
        run: exit 1
