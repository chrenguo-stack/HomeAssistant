name: H3 N2 Stage2D9R Successor D2 Execution Package Freeze CI V1

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-execution-package-freeze-ci-v1.yml"
      - "tools/h3_n2_stage2d9r_successor_d2_execute_20260727_v1.py"
      - "tools/h3_n2_stage2d9r_successor_d2_execution_packager_20260727_v*.py"
      - "tools/h3_n2_stage2d9r_successor_d2_execution_freeze_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_execution_package_20260727_v1.py"
      - "docs/development/h3-n2-stage2d9r-successor-d2-execution-package-contract-20260727-v1.md"
      - "docs/acceptance/h3-n2-stage2d9r-successor-locked-recovery-artifact-l1-v1.json"
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-execution-package-freeze-ci-v1.yml"
      - "tools/h3_n2_stage2d9r_successor_d2_execute_20260727_v1.py"
      - "tools/h3_n2_stage2d9r_successor_d2_execution_packager_20260727_v*.py"
      - "tools/h3_n2_stage2d9r_successor_d2_execution_freeze_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_execution_package_20260727_v1.py"
      - "docs/development/h3-n2-stage2d9r-successor-d2-execution-package-contract-20260727-v1.md"
      - "docs/acceptance/h3-n2-stage2d9r-successor-locked-recovery-artifact-l1-v1.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source-only one-shot execution package
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/stage2d9r-successor-d2-execution-pycache
          python -m py_compile \
            tools/h3_n2_stage2d9r_successor_d2_execute_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_d2_execution_packager_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_d2_execution_packager_20260727_v2.py \
            tools/h3_n2_stage2d9r_successor_d2_execution_freeze_20260727_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_execution_package_20260727_v1.py
          python \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_execution_package_20260727_v1.py \
            -v 2>&1 | tee /tmp/stage2d9r-successor-d2-execution-tests.log
          grep -F 'Ran 6 tests' /tmp/stage2d9r-successor-d2-execution-tests.log
          grep -F 'OK' /tmp/stage2d9r-successor-d2-execution-tests.log
          rm -rf "$PYTHONPYCACHEPREFIX"

  build:
    needs: source-tests
    strategy:
      fail-fast: true
      matrix:
        lane: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build independent deterministic execution package
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            a) lane_number=1 ;;
            b) lane_number=2 ;;
            *) exit 2 ;;
          esac
          build_instance_id=$((GITHUB_RUN_ID * 10 + lane_number))
          out="/tmp/stage2d9r-successor-d2-execution-build-${LANE}-v1"
          python tools/h3_n2_stage2d9r_successor_d2_execution_packager_20260727_v2.py \
            --executor tools/h3_n2_stage2d9r_successor_d2_execute_20260727_v1.py \
            --contract docs/development/h3-n2-stage2d9r-successor-d2-execution-package-contract-20260727-v1.md \
            --output-dir "$out" \
            --source-sha "$SOURCE_SHA" \
            --lane "$LANE" \
            --artifact-name "stage2d9r-successor-d2-execution-build-${LANE}-v1" \
            --run-id "$build_instance_id"
          test -f "$out/stage2d9r-successor-d2-execution-package-v1.tar"
          grep -F "$SOURCE_SHA" "$out/build-record.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-successor-d2-execution-build-${{ matrix.lane }}-v1
          path: /tmp/stage2d9r-successor-d2-execution-build-${{ matrix.lane }}-v1
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  freeze:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-successor-d2-execution-build-a-v1
          path: /tmp/build-a
      - uses: actions/download-artifact@v4
        with:
          name: stage2d9r-successor-d2-execution-build-b-v1
          path: /tmp/build-b
      - name: Compare independent builds and freeze canonical package
        run: |
          set -euo pipefail
          out=/tmp/stage2d9r-successor-d2-execution-freeze-v1
          python tools/h3_n2_stage2d9r_successor_d2_execution_freeze_20260727_v1.py \
            --build-a /tmp/build-a \
            --build-b /tmp/build-b \
            --output-dir "$out" \
            --source-sha "$SOURCE_SHA"
          (cd "$out" && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/stage2d9r-successor-d2-execution-freeze-v1')
          value = json.loads((root / 'freeze-manifest.json').read_text())
          assert value['state'] == 'D2_EXECUTION_PACKAGE_REPRODUCIBLE_AND_FROZEN'
          assert value['clean_build_count'] == 2
          assert value['payloads_byte_identical'] is True
          for key in (
              'authorization_record_included', 'private_content_included',
              'private_paths_included', 'secret_values_included',
              'authorization_created', 'authorization_claimed',
              'authorization_consumed', 'execution_authorized',
              'recovery_authorized', 'board_operation', 'serial_operation',
              'flash_operation', 'physical_nvs_operation', 'network_operation',
              'broker_started', 'prepare_executed', 'verify_executed',
              'activate_executed', 'cleanup_executed', 'production_operation',
          ):
              assert value[key] is False, key
          PY
      - name: Upload frozen successor D2 execution Artifact
        id: execution
        uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-successor-d2-execution-freeze-v1
          path: /tmp/stage2d9r-successor-d2-execution-freeze-v1
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Report non-authorizing source freeze
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_D2_EXECUTION_PACKAGE_FREEZE=PASS' \
            "SOURCE_SHA=$SOURCE_SHA" \
            "EXECUTION_ARTIFACT_ID=${{ steps.execution.outputs.artifact-id }}" \
            "EXECUTION_ARTIFACT_DIGEST=${{ steps.execution.outputs.artifact-digest }}" \
            'D2_AUTHORIZED=false' \
            'AUTHORIZATION_CREATED=false' \
            'AUTHORIZATION_CLAIMED=false' \
            'BOARD_OPERATION=false' \
            'SERIAL_OPERATION=false' \
            'FLASH_OPERATION=false' \
            'BROKER_STARTED=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false'
