name: H3 N2 Stage2D9R Successor D2 Review CI V1

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-review-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-*.json"
      - "docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md"
      - "tools/h3_n2_stage2d9r_successor_*_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py"
  push:
    branches: [fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1]
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-review-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-*.json"
      - "docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md"
      - "tools/h3_n2_stage2d9r_successor_*_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {contents: read, pull-requests: read, actions: read}
env:
  EXPECTED_MAIN_SHA: 43aa37b0cc343efdd2024f369517e55c5b6461f1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  successor-d2-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 1, show-progress: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Verify frozen repository and Draft PR boundary
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          gh api repos/chrenguo-stack/HomeAssistant/pulls/180 > /tmp/p180
          gh api repos/chrenguo-stack/HomeAssistant/pulls/176 > /tmp/p176
          jq -e '.state=="open" and .draft==true and .merged==false and .mergeable==true and .base.sha=="cf841f3e5a8cf04c5df9875c499b91ad4e4289cb"' /tmp/p180
          jq -e '.state=="open" and .draft==true and .merged==false and .mergeable==true and .head.sha=="cf841f3e5a8cf04c5df9875c499b91ad4e4289cb"' /tmp/p176
          test "$(git status --porcelain)" = ""

      - name: Verify immutable Artifact and public source digests
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          gh api repos/chrenguo-stack/HomeAssistant/actions/artifacts/8638796771 > /tmp/immutable-meta
          jq -e '.id==8638796771 and .expired==false and .workflow_run.head_sha=="ac1d2a7a92323988c9cd946a3e018e4f1ba9463b"' /tmp/immutable-meta
          gh api repos/chrenguo-stack/HomeAssistant/actions/artifacts/8638796771/zip > /tmp/immutable.zip
          echo 'b8c7e937ff325d121aeff8414618e88b8a229cca00bc27e439c587f830851dc8  /tmp/immutable.zip' | sha256sum -c -
          sha256sum -c <<'SUMS'
          9429e3ccf25f52f0cc5e97d4f316aa561f064285e1564ada82b6134641cc8fa6  docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-01-invalidation-l1-v1.json
          7d7938447769cc4fb3a8d8a4272501a9744f2e2a03ddaddb1b2b0882d1ab03fb  docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-02-success-l1-v1.json
          3c3401056f6683b9a38a1dfb8d0c630778a89d3806f2fd5fc1856f149abceb0e  docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md
          85ed0a1b7d86e8ccc0569262ef68f089515eb7283132ca58d8aca55725138c4e  tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_contract_20260727_v1.py
          4337f34649211cb04c9ea45e793bd637ab6277f7d1b21b727d3b72d9d12233fa  tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_readonly_preflight_20260727_v1.py
          4a1acb37cdaef216dc7ac45ad3009f13a01dc8de6f8b754585a5d4023a67e6bf  tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_d2_review_packager_20260727_v1.py
          87f8a4f5b373b1e95798c42da33a03c5885ce2360ce312185978927a3c49a2a3  tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_u1_public_closure_20260727_v1.py
          cf6808cb9747e020bf26633c9b57743f1095494d22596cd462c0f3d5d33e3736  tools/h3_n2_stage2d9r_successor_d2_contract_20260727_v1.py
          c2b7dc679bd59fdc72bcb98049b2a43f91cbe9fda7ba3797ef0eb6cebd642b43  tools/h3_n2_stage2d9r_successor_d2_readonly_preflight_20260727_v1.py
          5c0af9f6f69928374b62c3491c6dec4089c0f9c28bba4a87ec3e40b117afb41e  tools/h3_n2_stage2d9r_successor_d2_review_packager_20260727_v1.py
          d4c58d7b4ad1bee360c455ea47c8feb515777457377c5ee09970fab7afd24b01  tools/h3_n2_stage2d9r_successor_u1_public_closure_20260727_v1.py
          504836a63fa176d73d2f79499219c6534b3175a75b9a6659337d452c5b308b34  tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_successor_final_build_binding_20260727_v1.json
          7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6  tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/public-descriptor.redacted.json
          0a38ef9648008cbd7a3966e5e558bb8a9b672f255fa6e390800508cd93555734  tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02/public-pki-export-binding.json
          SUMS

      - name: Run source contracts and assemble review package
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/d2-pycache
          for f in tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py; do python "$f" -v; done
          root=/tmp/stage2d9r-successor-d2-review-v1
          PYTHONDONTWRITEBYTECODE=1 python tools/h3_n2_stage2d9r_successor_d2_review_packager_20260727_v1.py --output "$root" --source-sha "$SOURCE_SHA" --main-sha "$EXPECTED_MAIN_SHA"
          launcher="$(find "$root" -maxdepth 1 -type f -name 'run_stage2d9r_successor_d2_review_integrity_probe_*.sh' -print -quit)"
          test -n "$launcher"
          "$launcher" | tee /tmp/integrity
          grep -F 'state=D2_REVIEWED' /tmp/integrity
          grep -F 'exact_authorization_request_included=false' /tmp/integrity
          (cd "$root" && sha256sum -c SHA256SUMS)
          test -z "$(find "$root" -type f -name '*.authorization.json' -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/stage2d9r-successor-d2-review-v1')
          tokens=(b'BEGIN '+b'PRIVATE KEY',b'BEGIN '+b'RSA '+b'PRIVATE KEY',b'BEGIN '+b'EC '+b'PRIVATE KEY',b'/'+b'Users'+b'/',b'/'+b'private'+b'/tmp/',b'mqtt'+b'-password'+b'.hex',b'persistence'+b'-key'+b'.hex',b'unlock'+b'-token'+b'.hex',b'root-ca'+b'.key'+b'.pem',b'broker'+b'.key'+b'.pem')
          for p in root.rglob('*'):
              if p.is_file(): assert not any(x in p.read_bytes() for x in tokens), p.name
          b=json.loads((root/'D2_REVIEW_BINDING.json').read_text())
          c=json.loads((root/'D2_CONTRACT.json').read_text())
          assert b['source_sha']==__import__('os').environ['SOURCE_SHA'] and b['main_sha']==__import__('os').environ['EXPECTED_MAIN_SHA']
          for k in ('exact_authorization_request_included','authorization_record_included','execution_launcher_included','private_content_included','private_paths_included','secret_values_included','board_operation','serial_operation','flash_operation','physical_nvs_operation','network_operation','broker_started','prepare_executed','verify_executed','activate_executed','cleanup_executed','production_operation'): assert b[k] is False,k
          assert b['execution_package_contract_included'] is True
          assert c['state_machine']['prepare_max_count']==c['state_machine']['verify_max_count']==c['state_machine']['locked_recovery_max_count']==c['state_machine']['isolated_broker_start_max_count']==1
          PY
          rm -rf "$PYTHONPYCACHEPREFIX"

      - name: Upload D2 review Artifact
        id: review
        uses: actions/upload-artifact@v4
        with: {name: stage2d9r-successor-d2-review-v1, path: /tmp/stage2d9r-successor-d2-review-v1, if-no-files-found: error, retention-days: 5, compression-level: 0}

      - name: Assemble public read-only preflight seed
        env:
