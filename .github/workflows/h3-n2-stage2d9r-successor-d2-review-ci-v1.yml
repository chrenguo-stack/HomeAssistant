name: H3 N2 Stage2D9R Successor D2 Review CI V1

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-review-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-*.json"
      - "docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md"
      - "tools/h3_n2_stage2d9r_successor_*_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py"
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-d2-review-ci-v1.yml"
      - "docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-*.json"
      - "docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md"
      - "tools/h3_n2_stage2d9r_successor_*_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN_SHA: 43aa37b0cc343efdd2024f369517e55c5b6461f1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  successor-d2-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen repository and Draft PR boundary
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          gh api repos/chrenguo-stack/HomeAssistant/pulls/180 > /tmp/p180
          gh api repos/chrenguo-stack/HomeAssistant/pulls/176 > /tmp/p176
          jq -e '.state=="open" and .draft==true and .merged==false and .mergeable==true and .base.sha=="cf841f3e5a8cf04c5df9875c499b91ad4e4289cb"' /tmp/p180
          jq -e '.state=="open" and .draft==true and .merged==false and .mergeable==true and .head.sha=="cf841f3e5a8cf04c5df9875c499b91ad4e4289cb"' /tmp/p176
          test "$(git status --porcelain)" = ""

      - name: Verify immutable Artifact and reviewed source ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/chrenguo-stack/HomeAssistant/actions/artifacts/8638796771 > /tmp/immutable-meta
          jq -e '.id==8638796771 and .expired==false and .workflow_run.head_sha=="ac1d2a7a92323988c9cd946a3e018e4f1ba9463b"' /tmp/immutable-meta
          gh api repos/chrenguo-stack/HomeAssistant/actions/artifacts/8638796771/zip > /tmp/immutable.zip
          echo 'b8c7e937ff325d121aeff8414618e88b8a229cca00bc27e439c587f830851dc8  /tmp/immutable.zip' | sha256sum -c -
          git fetch --no-tags --depth=16 origin fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          git merge-base --is-ancestor 9da017e057d52aa302e68e20c2e63c1fa1df12b9 HEAD
          printf '%s\n' \
            '.github/workflows/h3-n2-stage2d9r-successor-d2-review-ci-v1.yml' \
            'tools/h3_n2_stage2d9r_successor_u1_public_closure_20260727_v1.py' \
            | LC_ALL=C sort > /tmp/expected-changed
          git diff --name-only 9da017e057d52aa302e68e20c2e63c1fa1df12b9..HEAD \
            | LC_ALL=C sort > /tmp/actual-changed
          diff -u /tmp/expected-changed /tmp/actual-changed
          for path in \
            docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-01-invalidation-l1-v1.json \
            docs/acceptance/h3-n2-stage2d9r-successor-private-content-binding-u1-02-success-l1-v1.json \
            docs/development/h3-n2-stage2d9r-successor-d2-contract-20260727-v1.md \
            tools/h3_n2_stage2d9r_successor_d2_contract_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_d2_readonly_preflight_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_d2_review_packager_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_u1_public_closure_20260727_v1.py; do
            test -f "$path"
            test ! -L "$path"
          done
          echo '504836a63fa176d73d2f79499219c6534b3175a75b9a6659337d452c5b308b34  tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_successor_final_build_binding_20260727_v1.json' | sha256sum -c -
          echo '7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6  tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/public-descriptor.redacted.json' | sha256sum -c -
          echo '0a38ef9648008cbd7a3966e5e558bb8a9b672f255fa6e390800508cd93555734  tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02/public-pki-export-binding.json' | sha256sum -c -

      - name: Run source contracts and assemble review package
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/d2-pycache
          for f in tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_*_20260727_v1.py; do
            python "$f" -v
          done
          root=/tmp/stage2d9r-successor-d2-review-v1
          PYTHONDONTWRITEBYTECODE=1 python tools/h3_n2_stage2d9r_successor_d2_review_packager_20260727_v1.py \
            --output "$root" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$EXPECTED_MAIN_SHA"
          launcher="$(find "$root" -maxdepth 1 -type f -name 'run_stage2d9r_successor_d2_review_integrity_probe_*.sh' -print -quit)"
          test -n "$launcher"
          "$launcher" | tee /tmp/integrity
          grep -F 'state=D2_REVIEWED' /tmp/integrity
          grep -F 'exact_authorization_request_included=false' /tmp/integrity
          (cd "$root" && sha256sum -c SHA256SUMS)
          test -z "$(find "$root" -type f -name '*.authorization.json' -print -quit)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("/tmp/stage2d9r-successor-d2-review-v1")
          tokens = (
              b"BEGIN " + b"PRIVATE KEY",
              b"BEGIN " + b"RSA " + b"PRIVATE KEY",
              b"BEGIN " + b"EC " + b"PRIVATE KEY",
              b"/" + b"Users" + b"/",
              b"/" + b"private" + b"/tmp/",
              b"mqtt" + b"-password" + b".hex",
              b"persistence" + b"-key" + b".hex",
              b"unlock" + b"-token" + b".hex",
              b"root-ca" + b".key" + b".pem",
              b"broker" + b".key" + b".pem",
          )
          for path in root.rglob("*"):
              if path.is_file():
                  data = path.read_bytes()
                  assert not any(token in data for token in tokens), path.name
          binding = json.loads((root / "D2_REVIEW_BINDING.json").read_text())
          contract = json.loads((root / "D2_CONTRACT.json").read_text())
          assert binding["source_sha"] == os.environ["SOURCE_SHA"]
          assert binding["main_sha"] == os.environ["EXPECTED_MAIN_SHA"]
          for key in (
              "exact_authorization_request_included",
              "authorization_record_included",
              "execution_launcher_included",
              "private_content_included",
              "private_paths_included",
              "secret_values_included",
              "board_operation",
              "serial_operation",
              "flash_operation",
              "physical_nvs_operation",
              "network_operation",
              "broker_started",
              "prepare_executed",
              "verify_executed",
              "activate_executed",
              "cleanup_executed",
              "production_operation",
          ):
              assert binding[key] is False, key
          assert binding["execution_package_contract_included"] is True
          state = contract["state_machine"]
          assert state["prepare_max_count"] == 1
          assert state["verify_max_count"] == 1
          assert state["locked_recovery_max_count"] == 1
          assert state["isolated_broker_start_max_count"] == 1
          PY
          rm -rf "$PYTHONPYCACHEPREFIX"

      - name: Upload D2 review Artifact
        id: review
        uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-successor-d2-review-v1
          path: /tmp/stage2d9r-successor-d2-review-v1
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Assemble public read-only preflight seed
        env:
          REVIEW_ID: ${{ steps.review.outputs.artifact-id }}
          REVIEW_DIGEST: ${{ steps.review.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          out=/tmp/stage2d9r-successor-d2-public-preflight-v1
          mkdir -m 700 "$out"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          review_root = Path("/tmp/stage2d9r-successor-d2-review-v1")
          out = Path("/tmp/stage2d9r-successor-d2-public-preflight-v1")
          review = json.loads((review_root / "D2_REVIEW_BINDING.json").read_text())
          seed = {
              "schema": "gh.h3.n2.stage2d9r-successor-d2-public-preflight-seed/1",
              "stage": "H3/N2 Stage 2D-9R G3R successor",
              "state": "PUBLIC_PREFLIGHT_SEED_READY",
              "repository": "chrenguo-stack/HomeAssistant",
              "pull_request": 180,
              "base_pull_request": 176,
              "main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "source_sha": os.environ["SOURCE_SHA"],
              "review_artifact_id": int(os.environ["REVIEW_ID"]),
              "review_artifact_digest_sha256": os.environ["REVIEW_DIGEST"].removeprefix("sha256:"),
              "review_binding_sha256": review["review_binding_sha256"],
              "immutable_artifact_id": 8638796771,
              "immutable_artifact_archive_sha256": "b8c7e937ff325d121aeff8414618e88b8a229cca00bc27e439c587f830851dc8",
              "u1_02_authorization_record_sha256": "88314a56bc5d7dd3e175278e2b01409cde611562f1bea11690adb9ff3f71f348",
              "u1_02_result_sha256": "9ad24d630640ab485e055e7cb8f08c1320f19b6ca37d43e36303ce44d62d0b08",
              "live_u1_02_consumed_marker_sha256_required": True,
              "private_host_preflight_required": True,
              "previously_frozen_board_identity_sha256_required": True,
              "previously_frozen_serial_identity_sha256_required": True,
              "previously_frozen_baseline_state_sha256_required": True,
              "execution_package_script_launcher_marker_sha256_required": True,
              "locked_recovery_package_sha256_required": True,
              "current_head_all_ci_success_recheck_required": True,
              "exact_d2_authorization_request_generated": False,
              "authorization_created": False,
              "authorization_claimed": False,
              "authorization_consumed": False,
              "board_operation": False,
              "serial_operation": False,
              "flash_operation": False,
              "physical_nvs_operation": False,
              "network_operation": False,
              "broker_started": False,
              "prepare_executed": False,
              "verify_executed": False,
              "activate_executed": False,
              "cleanup_executed": False,
              "production_operation": False,
              "private_paths_included": False,
              "secret_values_included": False,
          }
          (out / "PUBLIC_PREFLIGHT_SEED.json").write_text(
              json.dumps(seed, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "README.md").write_text(
              "# Public read-only D2 preflight seed\n\n"
              "This Artifact is not an authorization. It binds the reviewed public source "
              "and lists the remaining private-host read-only checks required before an "
              "exact D2 request may be generated.\n",
              encoding="utf-8",
          )
          PY
          (cd "$out" && sha256sum PUBLIC_PREFLIGHT_SEED.json README.md > SHA256SUMS)

      - name: Upload public preflight Artifact
        id: preflight
        uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-successor-d2-public-preflight-v1
          path: /tmp/stage2d9r-successor-d2-public-preflight-v1
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Report safe review boundary
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_D2_REVIEW=PASS' \
            "SOURCE_SHA=$SOURCE_SHA" \
            "REVIEW_ARTIFACT_ID=${{ steps.review.outputs.artifact-id }}" \
            "REVIEW_ARTIFACT_DIGEST=${{ steps.review.outputs.artifact-digest }}" \
            "PUBLIC_PREFLIGHT_ARTIFACT_ID=${{ steps.preflight.outputs.artifact-id }}" \
            "PUBLIC_PREFLIGHT_ARTIFACT_DIGEST=${{ steps.preflight.outputs.artifact-digest }}" \
            'EXACT_D2_AUTHORIZATION_REQUEST_GENERATED=false' \
            'D2_AUTHORIZED=false' \
            'PHYSICAL_EXECUTION_AUTHORIZED=false' \
            'BOARD_OPERATION=false' \
            'SERIAL_OPERATION=false' \
            'FLASH_OPERATION=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false' \
            'ACTIVATE_EXECUTED=false' \
            'CLEANUP_EXECUTED=false'

      - name: Cleanup
        if: always()
        run: |
          rm -rf \
            /tmp/stage2d9r-successor-d2-review-v1 \
            /tmp/stage2d9r-successor-d2-public-preflight-v1 \
            /tmp/d2-pycache \
            /tmp/p180 \
            /tmp/p176 \
            /tmp/immutable-meta \
            /tmp/immutable.zip \
            /tmp/expected-changed \
            /tmp/actual-changed \
            /tmp/integrity
