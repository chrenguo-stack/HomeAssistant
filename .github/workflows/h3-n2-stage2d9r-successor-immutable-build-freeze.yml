name: H3 N2 Stage2D9R Successor Immutable Build Freeze

on:
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-immutable-build-a.yml"
      - ".github/workflows/h3-n2-stage2d9r-successor-immutable-build-b.yml"
      - ".github/workflows/h3-n2-stage2d9r-successor-immutable-build-reusable.yml"
      - ".github/workflows/h3-n2-stage2d9r-successor-immutable-build-freeze.yml"
      - "tools/h3_n2_stage2d9r_successor_immutable_build_packager_20260727_v1.py"
      - "tools/h3_n2_stage2d9r_successor_immutable_build_freeze_20260727_v1.py"
      - "tools/h3_n2_stage2d9r_successor_immutable_build_manifest_gate_20260727_v1.py"
      - "firmware/esphome_rc/components/greenhouse_profile_isolated_device_g3r_executor/**"
      - "firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare/greenhouse_profile_isolated_device_g3r_successor_immutable_20260727_v1.yml"
      - "firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3_prepare/stage2d9_g3_partitions_20260722_v65.csv"
      - "tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_successor_final_build_binding_20260727_v1.json"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/public-descriptor.redacted.json"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02/**"
      - "docs/acceptance/h3-n2-stage2d9r-successor-final-source-lock-l1-v1.json"

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify successor freeze tools and source inputs
        run: |
          set -euo pipefail
          echo 'f18e1c51939316410963694246e73aec21da5886e73ad18f2449a5e922346d30  tools/h3_n2_stage2d9r_successor_immutable_build_packager_20260727_v1.py' | sha256sum -c -
          echo '8d53e5d10c5a560398569d1b389f73ad60eb937757eca5b728ef9640f571e210  tools/h3_n2_stage2d9r_successor_immutable_build_freeze_20260727_v1.py' | sha256sum -c -
          echo '4fddcb8367d1a9ad90ac352fb37cf99380fe4389d233df28894bd96962f1263d  tools/h3_n2_stage2d9r_successor_immutable_build_manifest_gate_20260727_v1.py' | sha256sum -c -
          echo '52f403404ae1069f3245c6c20a71118c58ce7dc3446a24ea17e296c2c0f86647  .github/workflows/h3-n2-stage2d9r-successor-immutable-build-reusable.yml' | sha256sum -c -
          echo '504836a63fa176d73d2f79499219c6534b3175a75b9a6659337d452c5b308b34  tests/h3_n2_stage2d9r_tls_candidate/stage2d9r_successor_final_build_binding_20260727_v1.json' | sha256sum -c -
          echo 'a7917c92f09a74a45c827cb7a47edec27cfb050dec074680c36bae39efaad85f  firmware/esphome_rc/board_lab/h3_profile_isolated_device_g3r_tls_prepare/greenhouse_profile_isolated_device_g3r_successor_immutable_20260727_v1.yml' | sha256sum -c -
          echo '0105210833023e1a181079d5c2feab1239f1433e09a4e512768872b21f55b6b4  docs/acceptance/h3-n2-stage2d9r-successor-final-source-lock-l1-v1.json' | sha256sum -c -
          python -m py_compile \
            tools/h3_n2_stage2d9r_successor_immutable_build_freeze_20260727_v1.py \
            tools/h3_n2_stage2d9r_successor_immutable_build_manifest_gate_20260727_v1.py

      - name: Wait for two independent successful successor clean builds
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=push \
              -f per_page=20 \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'")] | sort_by(.id) | last | [.id, .status, (.conclusion // "")] | @tsv'
          }

          a=""
          b=""
          for attempt in $(seq 1 150); do
            a="$(latest_run h3-n2-stage2d9r-successor-immutable-build-a.yml || true)"
            b="$(latest_run h3-n2-stage2d9r-successor-immutable-build-b.yml || true)"

            a_id="$(printf '%s' "$a" | cut -f1)"
            a_status="$(printf '%s' "$a" | cut -f2)"
            a_conclusion="$(printf '%s' "$a" | cut -f3)"
            b_id="$(printf '%s' "$b" | cut -f1)"
            b_status="$(printf '%s' "$b" | cut -f2)"
            b_conclusion="$(printf '%s' "$b" | cut -f3)"

            if [ "$a_status" = completed ] && [ "$a_conclusion" != success ]; then
              echo "successor clean build A failed: $a" >&2
              exit 1
            fi
            if [ "$b_status" = completed ] && [ "$b_conclusion" != success ]; then
              echo "successor clean build B failed: $b" >&2
              exit 1
            fi
            if [ "$a_status" = completed ] && [ "$a_conclusion" = success ] &&
               [ "$b_status" = completed ] && [ "$b_conclusion" = success ]; then
              test -n "$a_id"
              test -n "$b_id"
              test "$a_id" != "$b_id"
              echo "run_a=$a_id" >> "$GITHUB_OUTPUT"
              echo "run_b=$b_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo 'timed out waiting for two successor clean build runs' >&2
          exit 1

      - name: Download both successor immutable build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_A: ${{ steps.runs.outputs.run_a }}
          RUN_B: ${{ steps.runs.outputs.run_b }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage2d9r-successor-build-a /tmp/stage2d9r-successor-build-b
          gh run download "$RUN_A" \
            --repo "$GITHUB_REPOSITORY" \
            --name stage2d9r-g3r-successor-immutable-locked-v1 \
            --dir /tmp/stage2d9r-successor-build-a
          gh run download "$RUN_B" \
            --repo "$GITHUB_REPOSITORY" \
            --name stage2d9r-g3r-successor-immutable-repro-v1 \
            --dir /tmp/stage2d9r-successor-build-b

      - name: Resolve successor canonical artifact id
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_A: ${{ steps.runs.outputs.run_a }}
        run: |
          set -euo pipefail
          ids="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_A/artifacts" \
            --jq '[.artifacts[] | select(.name == "stage2d9r-g3r-successor-immutable-locked-v1") | .id] | @tsv')"
          test -n "$ids"
          test "$(printf '%s' "$ids" | wc -w | tr -d ' ')" = "1"
          echo "artifact_a_id=$ids" >> "$GITHUB_OUTPUT"

      - name: Compare successor builds and freeze immutable manifest
        env:
          RUN_A: ${{ steps.runs.outputs.run_a }}
          RUN_B: ${{ steps.runs.outputs.run_b }}
          ARTIFACT_A_ID: ${{ steps.artifact.outputs.artifact_a_id }}
        run: |
          set -euo pipefail
          python tools/h3_n2_stage2d9r_successor_immutable_build_freeze_20260727_v1.py \
            --build-a /tmp/stage2d9r-successor-build-a \
            --build-b /tmp/stage2d9r-successor-build-b \
            --run-a "$RUN_A" \
            --run-b "$RUN_B" \
            --artifact-a-id "$ARTIFACT_A_ID" \
            --source-sha "$GITHUB_SHA" \
            --output-dir /tmp/stage2d9r-successor-immutable-freeze-evidence \
            | tee /tmp/stage2d9r-successor-immutable-freeze.log

      - name: Validate frozen successor manifest contract
        run: |
          set -euo pipefail
          root=/tmp/stage2d9r-successor-immutable-freeze-evidence
          manifest="$root/stage2d9r_successor_immutable_build_manifest_20260727_v1.json"
          (cd "$root" && sha256sum -c SHA256SUMS)
          python tools/h3_n2_stage2d9r_successor_immutable_build_manifest_gate_20260727_v1.py \
            --manifest "$manifest" \
            | tee /tmp/stage2d9r-successor-immutable-manifest-gate.log
          grep -Fx 'STAGE2D9R_SUCCESSOR_IMMUTABLE_BUILD_GATE=PASS' /tmp/stage2d9r-successor-immutable-manifest-gate.log
          grep -Fx 'STATE=BUILD_FROZEN' /tmp/stage2d9r-successor-immutable-manifest-gate.log
          grep -Fx 'STAGE2D9R_SUCCESSOR_IMMUTABLE_BUILD_FREEZE=PASS' /tmp/stage2d9r-successor-immutable-freeze.log
          grep -Fx 'REPRODUCIBLE=true' /tmp/stage2d9r-successor-immutable-freeze.log
          grep -Fx 'PRIVATE_VALUES_INCLUDED=false' /tmp/stage2d9r-successor-immutable-freeze.log
          grep -Fx 'EXECUTION_AUTHORIZED=false' /tmp/stage2d9r-successor-immutable-freeze.log
          grep -Fx 'BOARD_OPERATION_AUTHORIZED=false' /tmp/stage2d9r-successor-immutable-freeze.log
          grep -Fx 'NETWORK_OPERATION_AUTHORIZED=false' /tmp/stage2d9r-successor-immutable-freeze.log
          test "$(stat -c '%a' "$root/stage2d9r-g3r-successor-immutable-payload-v1.tar")" = 600
          test "$(stat -c '%a' "$manifest")" = 600
          if grep -R -I -n -E \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|/Users/|/private/tmp/' \
            "$root"; then
            echo 'private material detected in successor freeze evidence' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-g3r-successor-immutable-freeze-evidence-v1
          path: /tmp/stage2d9r-successor-immutable-freeze-evidence
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Report successor immutable freeze boundary
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_IMMUTABLE_FREEZE_WORKFLOW=PASS' \
            'REPRODUCIBLE=true' \
            'PRIVATE_VALUES_INCLUDED=false' \
            'EXECUTION_AUTHORIZED=false' \
            'BOARD_OPERATION_AUTHORIZED=false' \
            'NETWORK_OPERATION_AUTHORIZED=false' \
            'PREPARE_AUTHORIZED=false' \
            'VERIFY_AUTHORIZED=false' \
            'READY_AUTHORIZED=false' \
            'MERGE_AUTHORIZED=false' \
            'RELEASE_AUTHORIZED=false'

      - name: Cleanup
        if: always()
        run: |
          rm -rf \
            /tmp/stage2d9r-successor-build-a \
            /tmp/stage2d9r-successor-build-b \
            /tmp/stage2d9r-successor-immutable-freeze-evidence
          rm -f /tmp/stage2d9r-successor-immutable-*.log
