        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=160 origin "$HEAD_BRANCH" main
          git merge-base --is-ancestor cf841f3e5a8cf04c5df9875c499b91ad4e4289cb HEAD
          test "$(git rev-parse origin/main)" = 43aa37b0cc343efdd2024f369517e55c5b6461f1
          sha256sum -c <<'SUMS'
          3f341a0edfc7368dccc0d44e645edc4a51f16aaa40a054b5721311df30befb75  tools/h3_n2_stage2d9r_successor_private_content_binding_common_20260727_v1.py
          ccaf2a68311e5272b04bb6d57acdcdc94bfa2592f82d0968b3bd8a0fdeb99918  tools/h3_n2_stage2d9r_successor_private_content_binding_deep_20260727_v1.py
          f1b890ad8a356df69dc83e894e7b72d97d7e607e846f8660722449e4b8854eb4  tools/h3_n2_stage2d9r_successor_private_content_binding_verifier_20260727_v1.py
          04385a505fa8d8dd4d58107e9d83294779d9d94c7b610a89870ee9b0921d6167  tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_private_content_binding_verifier_20260727_v1.py
          95c33d9d1cbb051e23621264a51c1b77bf674c0d403e2e813d1936ab9f9dbfb0  tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py
          2520c292151b240827083272673df82441fd68b4e022ab0320311866d2bd4f18  tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py
          5d99b3172c6350c9fef8b9f9238a888a5c41fff3fb60430aafc286e20464ad4e  docs/acceptance/h3-n2-stage2d9r-successor-host-artifact-custody-preauth-probe-l1-v1.json
          SUMS
          export PYTHONPYCACHEPREFIX=/tmp/s2d9r-private-binding-pycache
