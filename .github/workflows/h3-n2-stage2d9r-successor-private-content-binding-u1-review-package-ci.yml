      - tools/h3_n2_stage2d9r_successor_private_content_binding_common_20260727_v1.py
      - tools/h3_n2_stage2d9r_successor_private_content_binding_deep_20260727_v1.py
      - tools/h3_n2_stage2d9r_successor_private_content_binding_verifier_20260727_v1.py
      - tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_private_content_binding_verifier_20260727_v1.py
      - docs/acceptance/h3-n2-stage2d9r-successor-host-artifact-custody-preauth-probe-l1-v1.json
