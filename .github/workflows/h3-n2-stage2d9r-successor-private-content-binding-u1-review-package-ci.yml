          b['review_binding_sha256']=hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':')).encode()).hexdigest();(r/'review-binding.json').write_text(json.dumps(b,indent=2,sort_keys=True)+'\n')
          PY
          cat > "$R/run_stage2d9r_successor_private_content_binding_u1_review_probe_20260727_v1.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail;umask 077;R="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)";cd "$R";shasum -a 256 -c SHA256SUMS
          O="$(python3 "$R/tools/h3_n2_stage2d9r_successor_private_content_binding_verifier_20260727_v1.py" --review-binding "$R/review-binding.json" --probe-state)"
          printf '%s\n' STAGE2D9R_SUCCESSOR_PRIVATE_CONTENT_BINDING_U1_REVIEW_PROBE_V1_BEGIN "$O"
          O="$O" B="$R/review-binding.json" python3 - <<'PY'
          import json,os
