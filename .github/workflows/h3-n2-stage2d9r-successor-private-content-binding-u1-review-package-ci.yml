          from pathlib import Path
          r=Path(os.environ['R']);d=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          b={'schema':'gh.h3.n2.stage2d9r-successor-private-content-binding-u1-review/1','stage':'H3/N2 Stage 2D-9R G3R successor','state':'PENDING_EXACT_SUCCESSOR_PRIVATE_CONTENT_BINDING_U1_REVIEW','u1_request_id':'U1-H3N2-STAGE2D9R-SUCCESSOR-PRIVATE-CONTENT-BINDING-20260727-01','repository':'chrenguo-stack/HomeAssistant','pull_request':180,'pull_request_required_state':'open,draft,unmerged,mergeable','base_pull_request':176,'base_source_sha':'cf841f3e5a8cf04c5df9875c499b91ad4e4289cb','main_sha':'43aa37b0cc343efdd2024f369517e55c5b6461f1','source_sha':os.environ['SOURCE_SHA'],'preauth_result':'PASS_READ_ONLY_PREAUTH','preauth_probe_source_sha':'307895e4d6cd71205ab9d800e02df2f898a4e087','preauth_artifact_id':8638999760,'preauth_artifact_digest_sha256':'f4d2679e82bf29ecf3a4762075c3e0e5f410c87fc7377d5ee60b9e171bceedb5','immutable_artifact_id':8638796771,'immutable_artifact_source_sha':'ac1d2a7a92323988c9cd946a3e018e4f1ba9463b','immutable_payload_tar_sha256':'14e882f550ca92d14cf6776e518eb083b7344683b5534487bd28e95d93b29747','immutable_application_sha256':'a75e440c90aa5f050ac55086d1f1c614f113a7b66bd31ffc748fee95b9d26e1b','immutable_merged_image_sha256':'925ae87831a259d5a477fba9dde009b4d6a218e43735638521d4a10a38fe95bf','immutable_build_binding':'742f663333837366a42da92b984a3b05c643f571','generation_authorization_id':'U1-H3N2-STAGE2D9R-PRIVATE-EXECUTION-MATERIAL-20260725-01','generation_record_sha256':'99d5f8cf5a0a12d921497ce04b7dc95161fc77ee79e79ddf50d6cb2535473817','generation_marker_sha256':'428231f9e0e6a26c39701427b3e32531e18d08b54e341736b1189a78a06848a5','private_descriptor_sha256':'49236148741cccac301bbe45c900912e472e72ab8da8cb894645fb3916852fc8','public_descriptor_sha256':'7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6','private_package_sha256':'7b585fc53b9201fd2c6161e544ac062d4223f509bfc86a10052d97907e4f55bb','candidate_digest_sha256':'a0ff758217a1769c1876336c131cb85e64dcb2369758c649f36798cd8083aaf2','verifier_sha256':d(r/'tools/h3_n2_stage2d9r_su