name: H3 N2 Stage2D9R Successor Private Execution Material Generator CI

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-private-execution-material-generator-ci.yml"
      - "tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py"
      - "tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py"
      - "tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py"
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-private-execution-material-generator-ci.yml"
      - "tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py"
      - "tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py"
      - "tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generator-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify successor ancestry and source inventory
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=320 origin "$HEAD_BRANCH"
          git merge-base --is-ancestor cf841f3e5a8cf04c5df9875c499b91ad4e4289cb HEAD
          test -f tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py
          test -f tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          test -f tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py
          test -f tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py
          test -f tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          sha256sum \
            tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py \
            tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py \
            tools/h3_n2_stage2d9r_prepare_command_protocol_20260723_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          test "$(git status --porcelain)" = ""

      - name: Run offline contracts
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/stage2d9r-successor-generator-pycache
          python -m py_compile \
            tools/h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py \
            tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          python \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_contract_20260725_v1.py \
            -v 2>&1 | tee /tmp/stage2d9r-successor-contract.log
          python \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py \
            -v 2>&1 | tee /tmp/stage2d9r-successor-generator.log
          grep -F 'Ran 8 tests' /tmp/stage2d9r-successor-contract.log
          grep -F 'Ran 9 tests' /tmp/stage2d9r-successor-generator.log
          grep -F 'OK' /tmp/stage2d9r-successor-contract.log
          grep -F 'OK' /tmp/stage2d9r-successor-generator.log
          rm -rf "$PYTHONPYCACHEPREFIX"

      - name: Verify one-shot and redaction boundaries
        run: |
          set -euo pipefail
          generator=tools/h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          grep -F 'GENERATION_REQUIRES_EXPLICIT_EXECUTE' "$generator"
          grep -F 'AUTH_NOT_CURRENT' "$generator"
          grep -F 'AUTH_ALREADY_CLAIMED_OR_CONSUMED' "$generator"
          grep -F 'CONSUMED_FAILED' "$generator"
          grep -F 'PASSWORD_DATABASE_CROSS_BINDING_FAILED' "$generator"
          grep -F 'PREPARE_PARSE_CROSS_BINDING_FAILED' "$generator"
          grep -F 'VERIFY_PARSE_CROSS_BINDING_FAILED' "$generator"
          ! grep -R -I -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|/Users/|/private/tmp/|[0-9a-f]{64}:[0-9a-f]{64}' \
            "$generator" \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_private_execution_material_successor_generator_20260725_v1.py
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"

      - name: Report source-only boundary
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_PRIVATE_EXECUTION_MATERIAL_GENERATOR_CI=PASS' \
            "SOURCE_SHA=$SOURCE_SHA" \
            'RUN_SUFFIX=tlsvalid02' \
            'PASSWORD_PREIMAGE_RETAINED_BY_CONTRACT=true' \
            'PERSISTENCE_KEY_RETAINED_BY_CONTRACT=true' \
            'NEW_PKI_REQUIRED=true' \
            'NEW_UNLOCK_TOKEN_REQUIRED=true' \
            'AUTHORIZATION_CREATED=false' \
            'AUTHORIZATION_CLAIMED=false' \
            'AUTHORIZATION_CONSUMED=false' \
            'PRIVATE_CONTENT_GENERATED=false' \
            'BOARD_OPERATION=false' \
            'SERIAL_OPERATION=false' \
            'FLASH_OPERATION=false' \
            'PHYSICAL_NVS_OPERATION=false' \
            'NETWORK_OPERATION=false' \
            'BROKER_STARTED=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false'

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/stage2d9r-successor-generator-pycache /tmp/stage2d9r-successor-contract.log /tmp/stage2d9r-successor-generator.log
