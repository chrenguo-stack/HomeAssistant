name: H3 N2 Stage2D9R Successor Public PKI Export Success Probe Package CI

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-public-pki-export-success-probe-package-ci.yml"
      - "tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py"
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-public-pki-export-success-probe-package-ci.yml"
      - "tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py"
      - "tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  success-probe-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify branch and frozen executed U1 source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=64 origin "$HEAD_BRANCH"
          git merge-base --is-ancestor d6a2304ef1b9b229ed515f2fdc00e0146888b7d7 HEAD
          test "$(git status --porcelain)" = ""

      - name: Run read-only public PKI export success probe tests
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/stage2d9r-successor-public-pki-success-pycache
          python -m py_compile \
            tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py
          python \
            tests/h3_n2_stage2d9r_tls_candidate/test_h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py \
            -v 2>&1 | tee /tmp/stage2d9r-successor-public-pki-success-tests.log
          grep -F 'Ran 6 tests' /tmp/stage2d9r-successor-public-pki-success-tests.log
          grep -F 'OK' /tmp/stage2d9r-successor-public-pki-success-tests.log
          rm -rf "$PYTHONPYCACHEPREFIX"

      - name: Assemble read-only closure package
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root=/tmp/stage2d9r-successor-public-pki-export-success-probe-v1
          mkdir -p "$root/tools"
          cp tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py "$root/tools/"

          SOURCE_SHA="$SOURCE_SHA" ROOT="$root" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          probe = root / 'tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py'
          binding = {
              'schema': 'gh.h3.n2.stage2d9r-successor-public-pki-export-success-probe-package/1',
              'stage': 'H3/N2 Stage 2D-9R G3R successor',
              'state': 'READ_ONLY_CONSUMED_EXPORT_CLOSURE_PROBE',
              'authorization_id': 'U1-H3N2-STAGE2D9R-PUBLIC-PKI-EXPORT-20260725-01',
              'authorized_source_sha': 'd6a2304ef1b9b229ed515f2fdc00e0146888b7d7',
              'package_source_sha': os.environ['SOURCE_SHA'],
              'authorization_record_sha256': '8b2fb72bc61a14d8618a03fd5c3c029253d3b05232de2fae06517fdf38c7c839',
              'export_zip_sha256': 'c54f134bc9f135881a74462aecfc561ce89739724cdfeca41ae54dbc735dec6b',
              'export_binding_sha256': '0a38ef9648008cbd7a3966e5e558bb8a9b672f255fa6e390800508cd93555734',
              'public_descriptor_sha256': '7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6',
              'probe_sha256': hashlib.sha256(probe.read_bytes()).hexdigest(),
              'authorization_record_included': False,
              'public_certificate_content_included': False,
              'private_content_included': False,
              'private_paths_included': False,
              'secret_values_included': False,
              'authorization_claimed': False,
              'authorization_consumed_by_probe': False,
              'marker_modified': False,
              'output_modified': False,
              'board_operation': False,
              'serial_operation': False,
              'flash_operation': False,
              'physical_nvs_operation': False,
              'network_operation': False,
              'broker_started': False,
              'prepare_executed': False,
              'verify_executed': False,
              'activate_executed': False,
              'cleanup_executed': False,
              'production_operation': False,
          }
          canonical = json.dumps(binding, sort_keys=True, separators=(',', ':')).encode()
          binding['package_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          (root / 'package-binding.json').write_text(
              json.dumps(binding, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          cat > "$root/README.md" <<'EOF'
          # Stage 2D-9R successor public PKI export closure probe

          This package performs a read-only validation of the consumed one-shot
          public PKI export marker and the fixed public output ZIP. It verifies
          digests, deterministic archive inventory, file modes, internal sums,
          public binding fields, and protected false boundaries. It does not
          modify the marker or output, read successor private execution material,
          access a board or serial port, use a network, start a Broker, or execute
          PREPARE, VERIFY, ACTIVATE, or CLEANUP.
          EOF

          cat > "$root/run_stage2d9r_successor_public_pki_export_success_probe_20260727_v1_c54f134b.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          ROOT="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)"
          cd "$ROOT"
          shasum -a 256 -c SHA256SUMS
          printf '%s\n' 'STAGE2D9R_SUCCESSOR_PUBLIC_PKI_EXPORT_SUCCESS_PROBE_V1_BEGIN'
          python3 "$ROOT/tools/h3_n2_stage2d9r_successor_public_pki_export_success_probe_20260727_v1.py"
          printf '%s\n' 'STAGE2D9R_SUCCESSOR_PUBLIC_PKI_EXPORT_SUCCESS_PROBE_V1_END'
          SH
          chmod 0700 "$root"/run_*.sh
          find "$root" -type f ! -name 'run_*.sh' -exec chmod 0600 {} +
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | sed 's#  \./#  #' > SHA256SUMS)
          chmod 0600 "$root/SHA256SUMS"

      - name: Verify read-only package boundary
        run: |
          set -euo pipefail
          root=/tmp/stage2d9r-successor-public-pki-export-success-probe-v1
          (cd "$root" && sha256sum -c SHA256SUMS)
          test ! -e "$root/authorization-record.json"
          test ! -e "$root/root-ca.cert.pem"
          test ! -e "$root/broker.cert.pem"
          test ! -e "$root/broker.fullchain.pem"
          test -z "$(find "$root" -type d -name __pycache__ -print -quit)"
          test -z "$(find "$root" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          ! grep -R -I -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|mqtt-password\.hex|persistence-key\.hex|unlock-token\.hex|root-ca\.key\.pem|broker\.key\.pem|mosquitto\.password|prepare-command\.txt|verify-command\.txt' "$root"

      - uses: actions/upload-artifact@v4
        with:
          name: stage2d9r-successor-public-pki-export-success-probe-v1
          path: /tmp/stage2d9r-successor-public-pki-export-success-probe-v1
          if-no-files-found: error
          retention-days: 5
          compression-level: 9

      - name: Report safe closure-probe boundary
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_PUBLIC_PKI_EXPORT_SUCCESS_PROBE_PACKAGE=PASS' \
            "SOURCE_SHA=$SOURCE_SHA" \
            'AUTHORIZED_SOURCE_SHA=d6a2304ef1b9b229ed515f2fdc00e0146888b7d7' \
            'AUTHORIZATION_ID=U1-H3N2-STAGE2D9R-PUBLIC-PKI-EXPORT-20260725-01' \
            'AUTHORIZATION_RECORD_SHA256=8b2fb72bc61a14d8618a03fd5c3c029253d3b05232de2fae06517fdf38c7c839' \
            'EXPORT_ZIP_SHA256=c54f134bc9f135881a74462aecfc561ce89739724cdfeca41ae54dbc735dec6b' \
            'EXPORT_BINDING_SHA256=0a38ef9648008cbd7a3966e5e558bb8a9b672f255fa6e390800508cd93555734' \
            'AUTHORIZATION_RECORD_INCLUDED=false' \
            'PUBLIC_CERTIFICATE_CONTENT_INCLUDED=false' \
            'MARKER_MODIFIED=false' \
            'OUTPUT_MODIFIED=false' \
            'PRIVATE_CONTENT_READ=false' \
            'BOARD_OPERATION=false' \
            'NETWORK_OPERATION=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false'

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/stage2d9r-successor-public-pki-export-success-probe-v1 /tmp/stage2d9r-successor-public-pki-success-pycache /tmp/stage2d9r-successor-public-pki-success-tests.log
