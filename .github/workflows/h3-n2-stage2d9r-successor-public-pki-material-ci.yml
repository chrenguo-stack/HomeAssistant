name: H3 N2 Stage2D9R Successor Public PKI Material CI

on:
  pull_request:
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-public-pki-material-ci.yml"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02/**"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/public-descriptor.redacted.json"
      - "docs/acceptance/h3-n2-stage2d9r-successor-public-pki-upload-validation-l1-v1.json"
      - "docs/acceptance/h3-n2-stage2d9r-successor-public-pki-export-u1-01-success-l1-v1.json"
  push:
    branches:
      - fix/h3-n2-stage2d9r-g3r-private-execution-material-20260725-v1
    paths:
      - ".github/workflows/h3-n2-stage2d9r-successor-public-pki-material-ci.yml"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02/**"
      - "tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/public-descriptor.redacted.json"
      - "docs/acceptance/h3-n2-stage2d9r-successor-public-pki-upload-validation-l1-v1.json"
      - "docs/acceptance/h3-n2-stage2d9r-successor-public-pki-export-u1-01-success-l1-v1.json"

permissions:
  contents: read

jobs:
  successor-public-pki-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Verify exact public repository payload
        working-directory: tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02
        run: |
          set -euo pipefail
          cat > /tmp/stage2d9r-successor-public-pki-sha256-v1.txt <<'EOF'
          884a56b031846900ee914241c10a4af34b27129ce895f6606a2cae5e5ff23443  SHA256SUMS
          d862dfe123f8d9ce755bb65e556cc064404b4d37f6b760295c94129ae1815384  broker.cert.txt
          0ad309c0048530287330b7edd8dd99da3f6816015355169b878116314863ff9a  broker.fullchain.txt
          7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6  public-descriptor.redacted.json
          0a38ef9648008cbd7a3966e5e558bb8a9b672f255fa6e390800508cd93555734  public-pki-export-binding.json
          9d98b4aa1d87604e8c37aaa50892bf4cd47b8b8a0479acdabe78d41d39b36096  root-ca.cert.txt
          EOF
          sha256sum -c /tmp/stage2d9r-successor-public-pki-sha256-v1.txt
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          test -z "$(find . -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Verify certificate chain roles hostname and fingerprints
        working-directory: tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02
        run: |
          set -euo pipefail
          openssl verify -CAfile root-ca.cert.txt -purpose sslserver \
            -verify_hostname stage2d9r.local broker.cert.txt \
            | tee /tmp/stage2d9r-successor-public-pki-openssl-v1.log
          grep -F 'broker.cert.txt: OK' /tmp/stage2d9r-successor-public-pki-openssl-v1.log
          openssl x509 -in root-ca.cert.txt -noout -text > /tmp/stage2d9r-successor-root-ca-v1.txt
          openssl x509 -in broker.cert.txt -noout -text > /tmp/stage2d9r-successor-broker-cert-v1.txt
          grep -F 'CA:TRUE' /tmp/stage2d9r-successor-root-ca-v1.txt
          grep -F 'Certificate Sign' /tmp/stage2d9r-successor-root-ca-v1.txt
          grep -F 'CA:FALSE' /tmp/stage2d9r-successor-broker-cert-v1.txt
          grep -F 'TLS Web Server Authentication' /tmp/stage2d9r-successor-broker-cert-v1.txt
          grep -F 'DNS:stage2d9r.local' /tmp/stage2d9r-successor-broker-cert-v1.txt
          test "$(openssl x509 -in root-ca.cert.txt -outform DER | sha256sum | awk '{print $1}')" = \
            '0b1592a0ee6d46206b3fcb81de4661d0d32bb1acac2da78c43d8a2e7a54c2f05'
          test "$(openssl x509 -in broker.cert.txt -outform DER | sha256sum | awk '{print $1}')" = \
            '4ca8731424c87ba61336f4bc4fb743137ed83c127ed1a214198b65e5b33b40f9'
          test "$(openssl x509 -in broker.cert.txt -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')" = \
            '0ae2d32c2ddfb7b4b63c9ee4049291d9725a42a55721b0e78d53fcf5c9e1f72e'
          cmp broker.fullchain.txt <(cat broker.cert.txt root-ca.cert.txt)

      - name: Validate uploaded-export binding and frozen boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("tests/h3_n2_stage2d9r_tls_candidate/public_pki_tlsvalid02")
          descriptor_source = Path(
              "tests/h3_n2_stage2d9r_tls_candidate/public_successor_tlsvalid02/"
              "public-descriptor.redacted.json"
          )
          acceptance = json.loads(Path(
              "docs/acceptance/"
              "h3-n2-stage2d9r-successor-public-pki-upload-validation-l1-v1.json"
          ).read_text())
          success = json.loads(Path(
              "docs/acceptance/"
              "h3-n2-stage2d9r-successor-public-pki-export-u1-01-success-l1-v1.json"
          ).read_text())
          descriptor = json.loads((root / "public-descriptor.redacted.json").read_text())
          binding = json.loads((root / "public-pki-export-binding.json").read_text())

          repo_inventory = {
              "SHA256SUMS",
              "broker.cert.txt",
              "broker.fullchain.txt",
              "public-descriptor.redacted.json",
              "public-pki-export-binding.json",
              "root-ca.cert.txt",
          }
          archive_inventory = {
              "SHA256SUMS",
              "broker.cert.pem",
              "broker.fullchain.pem",
              "public-descriptor.redacted.json",
              "public-pki-export-binding.json",
              "root-ca.cert.pem",
          }
          assert {p.name for p in root.iterdir() if p.is_file()} == repo_inventory
          assert not any(p.is_dir() for p in root.iterdir())
          assert (root / "public-descriptor.redacted.json").read_bytes() == descriptor_source.read_bytes()

          assert descriptor["schema"] == "gh.h3.n2.stage2d9r-private-execution-material-successor-public/1"
          assert descriptor["state"] == "SUCCESSOR_EXECUTION_MATERIAL_FROZEN"
          assert descriptor["run_suffix"] == "tlsvalid02"
          assert descriptor["broker_host"] == descriptor["broker_tls_server_name"] == "stage2d9r.local"
          assert descriptor["broker_port"] == 8883
          assert descriptor["candidate_digest_sha256"] == "a0ff758217a1769c1876336c131cb85e64dcb2369758c649f36798cd8083aaf2"
          for key in (
              "execution_authorized", "board_operation_authorized",
              "serial_operation_authorized", "flash_operation_authorized",
              "physical_nvs_operation_authorized", "network_operation_authorized",
              "broker_start_authorized", "prepare_authorized", "verify_authorized",
              "activate_authorized", "cleanup_authorized",
              "production_operation_authorized", "private_values_included",
              "private_paths_included", "secret_values_included",
          ):
              assert descriptor[key] is False, key

          assert binding["schema"] == "gh.h3.n2.stage2d9r-successor-public-pki-export/1"
          assert binding["state"] == "PUBLIC_PKI_EXPORTED"
          assert binding["authorization_id"] == "U1-H3N2-STAGE2D9R-PUBLIC-PKI-EXPORT-20260725-01"
          assert binding["authorization_record_sha256"] == "8b2fb72bc61a14d8618a03fd5c3c029253d3b05232de2fae06517fdf38c7c839"
          assert binding["public_descriptor_sha256"] == "7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6"
          assert binding["certificate_chain_valid"] is True
          assert binding["broker_hostname_match"] is True
          for key in (
              "authorization_record_included", "private_content_included",
              "private_paths_included", "secret_values_included",
              "board_operation", "serial_operation", "flash_operation",
              "physical_nvs_operation", "network_operation", "broker_started",
              "prepare_executed", "verify_executed", "activate_executed",
              "cleanup_executed", "production_operation",
          ):
              assert binding[key] is False, key

          assert success["result"] == "consumed_passed_retired"
          assert success["status"] == "CONSUMED"
          assert success["replay_permitted"] is False
          assert success["automatic_retry_permitted"] is False
          assert success["export_result"]["export_zip_sha256"] == \
              "c54f134bc9f135881a74462aecfc561ce89739724cdfeca41ae54dbc735dec6b"

          assert acceptance["state"] == "PUBLIC_PKI_UPLOAD_VALIDATED_AND_REPOSITORY_FROZEN"
          assert acceptance["uploaded_archive"]["sha256"] == \
              "c54f134bc9f135881a74462aecfc561ce89739724cdfeca41ae54dbc735dec6b"
          assert acceptance["uploaded_archive"]["size_bytes"] == 6390
          assert acceptance["uploaded_archive"]["modified_or_repacked"] is False
          assert set(acceptance["archive_validation"]["exact_file_inventory"]) == archive_inventory
          assert acceptance["archive_validation"]["entry_count"] == 6
          assert acceptance["archive_validation"]["all_file_modes"] == "0600"
          assert acceptance["archive_validation"]["all_timestamps"] == "1980-01-01T00:00:00"
          assert acceptance["archive_validation"]["internal_sha256sums_valid"] is True

          freeze = acceptance["repository_freeze"]
          assert set(freeze["repository_file_inventory"]) == repo_inventory
          assert freeze["exact_archive_payload_files_committed"] is False
          assert freeze["exact_public_file_bytes_committed"] is True
          assert freeze["public_material_only"] is True
          assert freeze["private_material_committed"] is False
          assert freeze["archive_filename_mapping"] == {
              "broker.cert.pem": "broker.cert.txt",
              "broker.fullchain.pem": "broker.fullchain.txt",
              "root-ca.cert.pem": "root-ca.cert.txt",
          }
          assert acceptance["public_material_digests"]["archive_sha256sums_sha256"] == \
              "6fa6745918d399ced2d31a2c363bdc7ee40c5273fec28ca72d75a11137714719"
          assert acceptance["public_material_digests"]["repository_sha256sums_sha256"] == \
              "884a56b031846900ee914241c10a4af34b27129ce895f6606a2cae5e5ff23443"
          assert acceptance["disposition"]["upload_validation_completed"] is True
          assert acceptance["disposition"]["public_certificate_repository_freeze_completed"] is True
          assert acceptance["disposition"]["final_source_lock_ready"] is True
          assert acceptance["disposition"]["immutable_firmware_build_ready"] is False
          assert acceptance["disposition"]["next_gate"] == "FINAL_SOURCE_LOCK"
          assert all(value is False for value in acceptance["redaction_boundary"].values())
          assert all(value is False for value in acceptance["protected_boundaries"].values())

          forbidden = (
              "BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY",
              "BEGIN EC PRIVATE KEY", "/Users/", "/private/tmp/",
          )
          for path in root.iterdir():
              if path.is_file():
                  text = path.read_text(encoding="utf-8")
                  assert all(marker not in text for marker in forbidden), path
          PY

      - name: Report frozen public boundary
        run: |
          printf '%s\n' \
            'STAGE2D9R_SUCCESSOR_PUBLIC_PKI_MATERIAL_CI=PASS' \
            'UPLOAD_ARCHIVE_SHA256=c54f134bc9f135881a74462aecfc561ce89739724cdfeca41ae54dbc735dec6b' \
            'PUBLIC_DESCRIPTOR_SHA256=7021279f141f00cbf7e64fe8a20e89dd8b8ef3b9c4c7625ec28b79f6d65db2b6' \
            'CANDIDATE_DIGEST_SHA256=a0ff758217a1769c1876336c131cb85e64dcb2369758c649f36798cd8083aaf2' \
            'PUBLIC_CERTIFICATE_REPOSITORY_FREEZE_COMPLETED=true' \
            'FINAL_SOURCE_LOCK_READY=true' \
            'PRIVATE_CONTENT_INCLUDED=false' \
            'BOARD_OPERATION=false' \
            'SERIAL_OPERATION=false' \
            'FLASH_OPERATION=false' \
            'PHYSICAL_NVS_OPERATION=false' \
            'NETWORK_OPERATION=false' \
            'BROKER_STARTED=false' \
            'PREPARE_EXECUTED=false' \
            'VERIFY_EXECUTED=false'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/stage2d9r-successor-public-pki-* /tmp/stage2d9r-successor-root-ca-v1.txt /tmp/stage2d9r-successor-broker-cert-v1.txt
