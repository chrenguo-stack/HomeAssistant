name: M2 Dynamic Security CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "host/greenhouse-manager/**"
      - "infra/compose/m2-dynsec/**"
      - "protocols/pairing/**"
      - ".github/workflows/m2-dynsec-ci.yml"

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(host/greenhouse-manager/|infra/compose/m2-dynsec/|protocols/pairing/|\.github/workflows/m2-dynsec-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  dynsec-integration:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated Compose
        working-directory: infra/compose/m2-dynsec
        env:
          GH_DYNSEC_ADMIN_PASSWORD: compose-validation-only
        run: docker compose config

      - name: Verify node and service identity matrix
        run: bash infra/compose/m2-dynsec/verify.sh 2>&1 | tee /tmp/m2-dynsec-verification.log

      - name: Upload redacted failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m2-dynsec-failure-log
          path: /tmp/m2-dynsec-verification.log
          retention-days: 1