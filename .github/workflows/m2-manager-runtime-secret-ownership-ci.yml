name: M2 manager runtime secret ownership CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(host/greenhouse-manager/|\.github/workflows/m2-manager-runtime-secret-ownership-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ownership-gate:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Runtime ownership and preclaim tests
        run: |
          pytest -q \
            tests/runtime/test_app_check_config.py \
            tests/ops/test_t1_manager_runtime_secret_ownership.py \
            tests/ops/test_t1_manager_identity_migration_preclaim_candidate.py \
            tests/ops/test_t1_manager_identity_migration_preparation.py \
            tests/ops/test_t1_manager_identity_migration_live_runtime_gate.py \
            tests/ops/test_t1_manager_identity_migration_execution_preparation.py \
            tests/ops/test_t1_manager_identity_migration_execution_authorization.py \
            tests/ops/test_t1_manager_identity_migration_execution_transaction_gate.py \
            tests/ops/test_t1_manager_identity_migration_production_host_adapters.py \
            tests/ops/test_t1_manager_identity_migration_production_runtime_probe.py \
            tests/ops/test_t1_manager_identity_migration_production_execution_packet.py