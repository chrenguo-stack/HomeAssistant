name: N3W auto safe fallback Gate C source repair

on:
  push:
    branches:
      - fix/n3w-auto-safe-fallback-v1-20260929
    paths:
      - ".github/workflows/n3w-auto-safe-fallback-gate-c-source-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n3w-auto-safe-fallback-v1-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact Gate C source repair
        run: python tools/execution_packages/n3w/auto_safe_fallback/gate_c_source_repair/bootstrap_executor.py
      - name: Run Gate C source checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest>=8,<9"
          pytest -q tests/n3w_phase4/test_broker_relocation_source_contract.py tests/n3w_phase4/test_manager_discovery_policy_behavior.py
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$core" "$core/n3w_broker_relocation_policy.cpp" tests/n3w_phase4/n3w_broker_relocation_policy_host_test.cpp -o /tmp/n3w-broker-relocation-policy-host-test
          /tmp/n3w-broker-relocation-policy-host-test
          git diff --check
      - name: Commit Gate C source repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/execution_packages/n3w/auto_safe_fallback/gate_c_source_repair/bootstrap_executor.py
          git config user.name "Renguo_CHEN"
          git config user.email "ch.renguo@gmail.com"
          git add -A
          git commit -m "feat(n3w): integrate bounded broker relocation into Direct recovery"
          git push origin HEAD:fix/n3w-auto-safe-fallback-v1-20260929
