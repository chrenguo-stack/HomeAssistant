name: N3W auto safe fallback Gate C source repair

on:
  push:
    branches:
      - fix/n3w-auto-safe-fallback-v1-20260929
    paths:
      - ".github/workflows/n3w-auto-safe-fallback-gate-c-source-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n3w-auto-safe-fallback-v1-20260929
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover and harden exact executor
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/n3w-auto-safe-fallback-gate-c-source-repair.yml > /tmp/gate-c-old.yml
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('/tmp/gate-c-old.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          prefix = '          '
          body = []
          for line in source[start:end]:
              if line.startswith(prefix):
                  body.append(line[len(prefix):])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'unexpected executor indentation: {line!r}')
          code = '\n'.join(body) + '\n'

          code = code.replace(
              '#include <algorithm>\n#include <array>\n\n#ifdef USE_MQTT',
              '#include <algorithm>\n#include <array>\n#include <utility>\n\n#ifdef USE_MQTT',
          )
          code = code.replace(
              '#endif\n#include "esphome/core/log.h"',
              '#endif\n#ifdef USE_WIFI\n#include "esphome/components/wifi/wifi_component.h"\n#endif\n#include "esphome/core/log.h"',
          )
          code = code.replace(
              'static const char *const TAG = "n3w_broker_relocation";\n\n}',
              '''static const char *const TAG = "n3w_broker_relocation";

bool broker_mqtt_connected() {
#ifdef USE_MQTT
  return mqtt::global_mqtt_client != nullptr &&
         mqtt::global_mqtt_client->is_connected();
#else
  return false;
#endif
}

bool broker_wifi_connected() {
#ifdef USE_WIFI
  return wifi::global_wifi_component != nullptr &&
         wifi::global_wifi_component->is_connected();
#else
  return false;
#endif
}

}''',
          )
          code = code.replace('wifi_connected()', 'broker_wifi_connected()')
          code = code.replace('mqtt_connected()', 'broker_mqtt_connected()')
          code = code.replace(
              '''    if (broker_candidate_deadline_ms_ != 0U &&
        now >= broker_candidate_deadline_ms_) {
      broker_candidate_active_ = false;
      pending_broker_candidate_host_.clear();
      if (!start_next_broker_candidate_()) rollback_broker_candidate_();
    }''',
              '''    if (broker_candidate_deadline_ms_ != 0U &&
        now >= broker_candidate_deadline_ms_) {
      rollback_broker_candidate_();
      (void) start_next_broker_candidate_();
    }''',
          )
          code = code.replace(
              'assert(deadline == std::numeric_limits<uint64_t>::max() - 2000U);',
              'assert(deadline == 0U);',
          )
          Path('/tmp/gate-c-executor.py').write_text(code, encoding='utf-8')
          EXTRACT
          python /tmp/gate-c-executor.py
      - name: Run Gate C source checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest>=8,<9"
          pytest -q tests/n3w_phase4/test_broker_relocation_source_contract.py tests/n3w_phase4/test_manager_discovery_policy_behavior.py
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$core" "$core/n3w_broker_relocation_policy.cpp" tests/n3w_phase4/n3w_broker_relocation_policy_host_test.cpp -o /tmp/n3w-broker-relocation-policy-host-test
          /tmp/n3w-broker-relocation-policy-host-test
          git diff --check
      - name: Commit Gate C source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Renguo_CHEN"
          git config user.email "ch.renguo@gmail.com"
          git add -A
          git commit -m "feat(n3w): integrate bounded broker relocation into Direct recovery"
          git push origin HEAD:fix/n3w-auto-safe-fallback-v1-20260929
