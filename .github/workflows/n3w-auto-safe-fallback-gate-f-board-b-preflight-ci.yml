name: N3W auto safe fallback Gate F Board B preflight CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/**"
      - "tests/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/**"
      - ".github/workflows/n3w-auto-safe-fallback-gate-f-board-b-preflight-ci.yml"
  push:
    branches:
      - fix/n3w-auto-safe-fallback-production-core-convergence-20261003
    paths:
      - "tools/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/**"
      - "tests/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/**"
      - ".github/workflows/n3w-auto-safe-fallback-gate-f-board-b-preflight-ci.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile executors
        run: |
          python -m py_compile tools/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/executor.py
          python -m py_compile tools/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/write_executor.py
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Run focused tests
        run: |
          python -m pytest -q tests/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/test_executor.py
          python -m pytest -q tests/execution_packages/n3w/auto_safe_fallback/gate_f_board_b_preflight/test_write_executor.py
