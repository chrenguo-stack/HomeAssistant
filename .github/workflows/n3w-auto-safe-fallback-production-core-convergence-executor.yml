name: N3W auto safe fallback production core convergence executor

on:
  push:
    branches:
      - fix/n3w-auto-safe-fallback-production-core-convergence-20261003
    paths:
      - tools/n3w_auto_safe_fallback_production_core_convergence_apply.py
      - .github/workflows/n3w-auto-safe-fallback-production-core-convergence-executor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n3w-auto-safe-fallback-production-core-convergence-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact production convergence delta
        run: python tools/n3w_auto_safe_fallback_production_core_convergence_apply.py
      - name: Check source diff
        run: git diff --check
      - name: Commit production convergence delta
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_product_runtime.h
          git add firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_product_runtime.cpp
          git add firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_product_component.h
          git commit -m "feat(n3w): integrate auto fallback into production runtime"
          git push origin HEAD:fix/n3w-auto-safe-fallback-production-core-convergence-20261003
