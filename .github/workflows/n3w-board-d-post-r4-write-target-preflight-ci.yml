name: N3W Board_D post-R4 write target preflight CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/board_d/post_r4_write_target_preflight/**"
      - "tests/execution_packages/n3w/board_d/post_r4_write_target_preflight/**"
      - ".github/workflows/n3w-board-d-post-r4-write-target-preflight-ci.yml"
      - "docs/development/N3W_BOARD_D_POST_R4_WRITE_TARGET_PREFLIGHT_PREPARATION_20261023.md"

permissions:
  contents: read

jobs:
  preflight-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python -m py_compile tools/execution_packages/n3w/board_d/post_r4_write_target_preflight/executor.py
      - run: pytest -q tests/execution_packages/n3w/board_d/post_r4_write_target_preflight/test_executor.py
      - shell: bash
        run: |
          set -euo pipefail
          FILE=tools/execution_packages/n3w/board_d/post_r4_write_target_preflight/executor.py
          if grep -Fq 'add_parser("write")' "$FILE"; then exit 1; fi
          if grep -Fq 'write-flash' "$FILE"; then exit 1; fi
          if grep -Fq 'erase-flash' "$FILE"; then exit 1; fi
          grep -Fq 'write_authorization_granted": False' "$FILE"
          grep -Fq 'raw_flash_args_direct_execution_allowed": False' "$FILE"
          grep -Fq 'persistent_mutation": False' "$FILE"
          grep -Fq 'flash_write": False' "$FILE"
          grep -Fq 'nvs_write": False' "$FILE"
