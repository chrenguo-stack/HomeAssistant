name: N3W Board D R4 dual-slot normalization write executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/**"
      - "tests/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/**"
      - ".github/workflows/n3w-board-d-r4-dual-slot-normalization-write-executor-ci.yml"
      - "docs/development/N3W_BOARD_D_R4_DUAL_SLOT_NORMALIZATION_WRITE_EXECUTOR_SOURCE_REPAIR_20261023.md"
      - "docs/development/N3W_BOARD_D_R4_DUAL_SLOT_NORMALIZATION_POSTWRITE_VERIFIER_SOURCE_REPAIR_20261023.md"
  push:
    paths:
      - "tools/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/**"
      - "tests/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/**"
      - ".github/workflows/n3w-board-d-r4-dual-slot-normalization-write-executor-ci.yml"
      - "docs/development/N3W_BOARD_D_R4_DUAL_SLOT_NORMALIZATION_WRITE_EXECUTOR_SOURCE_REPAIR_20261023.md"
      - "docs/development/N3W_BOARD_D_R4_DUAL_SLOT_NORMALIZATION_POSTWRITE_VERIFIER_SOURCE_REPAIR_20261023.md"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python -m py_compile tools/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/executor.py
      - run: pytest -q tests/execution_packages/n3w/board_d/r4_dual_slot_normalization_write/test_executor.py
