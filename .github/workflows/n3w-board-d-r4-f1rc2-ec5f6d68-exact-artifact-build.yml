name: N3W Board_D R4 F1RC2 ec5f6d68 exact-source artifact build

on:
  push:
    branches:
      - "build/n3w-board-d-r4-f1rc2-ec5f6d68-artifact-20261023"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact R4 product source
        uses: actions/checkout@v4
        with:
          ref: ec5f6d68e33db7757d91c807fff708ca81b075dc
          fetch-depth: 1

      - name: Bind exact source and production contracts
        shell: bash
        run: |
          set -euo pipefail
          TARGET="firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
          BRIDGE="firmware/esphome_rc/f1_0_rc2/packages/n3w_product_telemetry.yml"
          TRANSPORT="firmware/esphome_rc/f1_0_rc2/packages/n3w_product_transport.yml"
          CORE_INIT="firmware/esphome_rc/components/greenhouse_n3w_core/__init__.py"
          CORE_HEADER="firmware/esphome_rc/components/greenhouse_n3w_core/greenhouse_n3w_core.h"
          PRODUCT_COMPONENT_HEADER="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_simple_product_component.h"
          DIAG_STUB="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_product_diagnostics_stub.h"
          DIAG_SUPPORT="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_diag_support.cpp"
          PHASE4_SUPPORT="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_phase4_support.cpp"
          RTC_SUPPORT="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_rtc_support.cpp"
          BROKER_RELOCATION="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_simple_product_component_broker_relocation.cpp"
          PRODUCT_RUNTIME="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_simple_product_runtime.cpp"
          RADIO="firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp"

          test "$(git rev-parse HEAD)" = "ec5f6d68e33db7757d91c807fff708ca81b075dc"
          test "$(git rev-parse HEAD^{tree})" = "16740efa8ad24d423adc0b2de32b99d56e2d23d1"
          test "$(git hash-object "$TARGET")" = "176ef5a2839ba8d58b4675c5f5097eba5c662236"
          test "$(git hash-object "$BRIDGE")" = "ce16f2389d146f9b25e95cbb628547e11ce36bd6"
          test "$(git hash-object "$TRANSPORT")" = "6458c2bb5d52a9050859c75feefcd8f03b49b73c"
          test "$(git hash-object "$CORE_INIT")" = "5e91cb475eb6a194a1980b0b30ea24180104ab82"
          test "$(git hash-object "$CORE_HEADER")" = "c231e66a68a3a2f185c58bceddc5add1f4364b43"
          test "$(git hash-object "$PRODUCT_COMPONENT_HEADER")" = "19c7f1557ad14e021c0f208de5963d13e25c2f85"
          test "$(git hash-object "$DIAG_STUB")" = "409696edcd27a4ae23e07e8057c3eabe8bb0fcb5"
          test "$(git hash-object "$DIAG_SUPPORT")" = "05276bea109779adbbe3dab2372e852c0625c617"
          test "$(git hash-object "$PHASE4_SUPPORT")" = "b485e576693ee7d105c44ad31b36dedf91ff41aa"
          test "$(git hash-object "$RTC_SUPPORT")" = "241a7fa7b02d7b78e7f6f78312818c5cc4fdc6cb"
          test "$(git hash-object "$BROKER_RELOCATION")" = "1c3afa2497a624b4026409b3e6bc2085681ae45b"
          test "$(git hash-object "$PRODUCT_RUNTIME")" = "8abf899fc7a1e1e69007fa66be85247c22775187"
          test "$(git hash-object "$RADIO")" = "e6ae3c4512a4d7f171fdcc5e0f2a0a9eb36770f4"

          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact ESPHome and source-test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "esphome==2026.4.3"

      - name: Recheck integrated R2 R3 R4 source contracts
        run: |
          pytest -q \
            tests/n3w_production/test_current_main_product_source_convergence_r3_contract.py \
            tests/n3w_production/test_multi_relay_gateway_selection_v1_contract.py \
            tests/n3w_production/test_relay_discovery_full_channel_fallback_v1_contract.py \
            tests/n3w_production/test_current_main_product_deharness_r4_contract.py

      - name: Compile exact production target
        shell: bash
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: |
          set -euo pipefail
          bash tools/rc2.sh compile

      - name: Verify ESP-IDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FILE="$HOME/.platformio/packages/framework-espidf/tools/cmake/version.cmake"
          test -f "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_MAJOR[[:space:]]+5\)' "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_MINOR[[:space:]]+5\)' "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_PATCH[[:space:]]+4\)' "$VERSION_FILE"

      - name: Prove exact binary is de-harnessed
        shell: bash
        run: |
          set -euo pipefail
          ENV="$GITHUB_WORKSPACE/firmware/esphome_rc/f1_0_rc2/.esphome/build/gh/.pioenvs/gh"
          APP="$ENV/firmware.bin"
          FACTORY="$ENV/firmware.factory.bin"
          ELF="$ENV/firmware.elf"
          MAP="$ENV/firmware.map"

          test -f "$APP"
          test -f "$FACTORY"
          test -f "$ELF"
          test -f "$MAP"

          NM="$(find "$HOME/.platformio/packages" -type f -name riscv32-esp-elf-nm -print -quit)"
          test -n "$NM"
          test -x "$NM"

          "$NM" -C "$ELF" > /tmp/n3w-symbols.txt
          strings -a "$APP" > /tmp/n3w-app-strings.txt
          strings -a "$FACTORY" > /tmp/n3w-factory-strings.txt

          forbidden=(
            Phase4PhysicalHarness
            N3wLabDiagnostics
            N3wRtcBreadcrumb
            n3w_phase4_physical_harness
            n3w_lab_diagnostics
            n3w_rtc_breadcrumb
            n3w_rtc_breadcrumb_
            gh_n3w_diag
            N3W_DIAG_DISCOVERY
            PHASE4_LAB_TELEMETRY
            phase4_source_harness
            phase4_lab_diagnostics
          )

          for marker in "${forbidden[@]}"; do
            for file in /tmp/n3w-symbols.txt "$MAP" /tmp/n3w-app-strings.txt /tmp/n3w-factory-strings.txt; do
              if grep -Fq "$marker" "$file"; then
                echo "FORBIDDEN_MARKER_PRESENT=$marker"
                echo "FORBIDDEN_MARKER_FILE=$file"
                exit 1
              fi
            done
          done

          grep -Fq "GreenhouseN3wCore" /tmp/n3w-symbols.txt
          grep -Fq "SimpleProductComponent" /tmp/n3w-symbols.txt
          grep -Fq "gh.telemetry/1" /tmp/n3w-app-strings.txt
          grep -Fq "air_temperature_c" /tmp/n3w-app-strings.txt

          echo "N3W_PRODUCTION_BINARY_DEHARNESS_PROOF=PASS"
          echo "FORBIDDEN_MARKER_COUNT=${#forbidden[@]}"
          echo "PHASE4_HARNESS_PRESENT=false"
          echo "LAB_DIAGNOSTICS_PRESENT=false"
          echo "RTC_BREADCRUMB_PRESENT=false"

      - name: Freeze exact production release bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/firmware/esphome_rc/f1_0_rc2/.esphome/build/gh"
          ENV="$ROOT/.pioenvs/gh"
          MEMBERS="$GITHUB_WORKSPACE/release-members"
          OUT="$GITHUB_WORKSPACE/release-artifact"
          BUNDLE="n3w-board-d-r4-f1rc2-ec5f6d68-exact-source.zip"

          mkdir -p "$MEMBERS" "$OUT"

          files=(
            firmware.bin
            firmware.ota.bin
            firmware.factory.bin
            bootloader.bin
            partitions.bin
            ota_data_initial.bin
            flash_args
          )

          for name in "${files[@]}"; do
            test -f "$ENV/$name"
            cp "$ENV/$name" "$MEMBERS/$name"
          done

          {
            echo "BINDING_SCHEMA=N3W_BOARD_D_R4_PRODUCTION_EXACT_ARTIFACT_V2"
            echo "SOURCE_HEAD=ec5f6d68e33db7757d91c807fff708ca81b075dc"
            echo "SOURCE_TREE=16740efa8ad24d423adc0b2de32b99d56e2d23d1"
            echo "TARGET_CONFIG=firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
            echo "TARGET_BLOB_SHA=176ef5a2839ba8d58b4675c5f5097eba5c662236"
            echo "TELEMETRY_BRIDGE_BLOB_SHA=ce16f2389d146f9b25e95cbb628547e11ce36bd6"
            echo "TRANSPORT_BLOB_SHA=6458c2bb5d52a9050859c75feefcd8f03b49b73c"
            echo "ACTIVE_CORE_INIT_BLOB_SHA=5e91cb475eb6a194a1980b0b30ea24180104ab82"
            echo "ACTIVE_CORE_HEADER_BLOB_SHA=c231e66a68a3a2f185c58bceddc5add1f4364b43"
            echo "PRODUCT_COMPONENT_HEADER_BLOB_SHA=19c7f1557ad14e021c0f208de5963d13e25c2f85"
            echo "DIAGNOSTICS_STUB_BLOB_SHA=409696edcd27a4ae23e07e8057c3eabe8bb0fcb5"
            echo "DIAGNOSTICS_SUPPORT_BLOB_SHA=05276bea109779adbbe3dab2372e852c0625c617"
            echo "PHASE4_SUPPORT_BLOB_SHA=b485e576693ee7d105c44ad31b36dedf91ff41aa"
            echo "RTC_SUPPORT_BLOB_SHA=241a7fa7b02d7b78e7f6f78312818c5cc4fdc6cb"
            echo "BROKER_RELOCATION_BLOB_SHA=1c3afa2497a624b4026409b3e6bc2085681ae45b"
            echo "PRODUCT_RUNTIME_BLOB_SHA=8abf899fc7a1e1e69007fa66be85247c22775187"
            echo "RADIO_BLOB_SHA=e6ae3c4512a4d7f171fdcc5e0f2a0a9eb36770f4"
            echo "PYTHON_VERSION=3.11"
            echo "ESPHOME_VERSION=2026.4.3"
            echo "ESP_IDF_VERSION=5.5.4"
            echo "WORKFLOW_TRIGGER_SHA=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "BINARY_DEHARNESS_PROOF=PASS"
            echo "PHASE4_HARNESS_PRESENT=false"
            echo "LAB_DIAGNOSTICS_PRESENT=false"
            echo "RTC_BREADCRUMB_PRESENT=false"
            for name in "${files[@]}"; do
              key="$(printf '%s' "$name" | tr '[:lower:].' '[:upper:]_')"
              size="$(stat -c '%s' "$MEMBERS/$name")"
              digest="$(sha256sum "$MEMBERS/$name" | awk '{print $1}')"
              echo "${key}_SIZE=${size}"
              echo "${key}_SHA256=${digest}"
            done
          } | tee "$MEMBERS/MANIFEST.txt"

          python - "$MEMBERS" "$OUT/$BUNDLE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          names = sorted(p.name for p in source.iterdir() if p.is_file())

          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_STORED) as archive:
              for name in names:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_STORED
                  archive.writestr(info, (source / name).read_bytes())
          PY

          BUNDLE_SIZE="$(stat -c '%s' "$OUT/$BUNDLE")"
          BUNDLE_SHA256="$(sha256sum "$OUT/$BUNDLE" | awk '{print $1}')"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$BUNDLE" > "$OUT/$BUNDLE.sha256"

          echo "RELEASE_BUNDLE=$BUNDLE"
          echo "RELEASE_BUNDLE_SIZE=$BUNDLE_SIZE"
          echo "RELEASE_BUNDLE_SHA256=$BUNDLE_SHA256"
          echo "RELEASE_MEMBER_COUNT=$(find "$MEMBERS" -maxdepth 1 -type f | wc -l)"
          sha256sum "$MEMBERS"/*

      - name: Upload exact production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: n3w-board-d-r4-f1rc2-ec5f6d68-exact-source
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
