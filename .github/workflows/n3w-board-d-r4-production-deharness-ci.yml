name: N3W Board_D R4 production de-harness CI

on:
  pull_request:
    paths:
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "firmware/esphome_rc/f1_0_rc2/**"
      - "tests/n3w_production/test_current_main_product_deharness_r4_contract.py"
      - ".github/workflows/n3w-board-d-r4-production-deharness-ci.yml"

permissions:
  contents: read

jobs:
  production-deharness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact ESPHome and host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmbedtls-dev
          python -m pip install -q "pytest>=8,<9" "esphome==2026.4.3"
      - name: R4 source contract
        run: pytest -q tests/n3w_production/test_current_main_product_deharness_r4_contract.py
      - name: Preserve lab diagnostics regression coverage
        run: pytest -q tests/n3w_kf089/test_relay_discovery_observability_contract.py
      - name: Compile formal production N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: bash tools/rc2.sh compile
      - name: Prove production binary excludes lab diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ENV="$GITHUB_WORKSPACE/firmware/esphome_rc/f1_0_rc2/.esphome/build/gh/.pioenvs/gh"
          APP="$ENV/firmware.bin"
          FACTORY="$ENV/firmware.factory.bin"
          ELF="$ENV/firmware.elf"
          MAP="$ENV/firmware.map"
          test -f "$APP"
          test -f "$FACTORY"
          test -f "$ELF"
          test -f "$MAP"
          NM="$(find "$HOME/.platformio/packages" -type f -name riscv32-esp-elf-nm -print -quit)"
          test -n "$NM"
          test -x "$NM"
          "$NM" -C "$ELF" > /tmp/n3w-symbols.txt
          strings -a "$APP" > /tmp/n3w-app-strings.txt
          strings -a "$FACTORY" > /tmp/n3w-factory-strings.txt
          forbidden=(
            Phase4PhysicalHarness
            N3wLabDiagnostics
            N3wRtcBreadcrumb
            n3w_phase4_physical_harness
            n3w_lab_diagnostics
            n3w_rtc_breadcrumb
            n3w_rtc_breadcrumb_
            gh_n3w_diag
            N3W_DIAG_DISCOVERY
            PHASE4_LAB_TELEMETRY
            phase4_source_harness
            phase4_lab_diagnostics
          )
          for marker in "${forbidden[@]}"; do
            for file in /tmp/n3w-symbols.txt "$MAP" /tmp/n3w-app-strings.txt /tmp/n3w-factory-strings.txt; do
              if grep -Fq "$marker" "$file"; then
                echo "FORBIDDEN_MARKER_PRESENT=$marker"
                echo "FORBIDDEN_MARKER_FILE=$file"
                exit 1
              fi
            done
          done
          grep -Fq "GreenhouseN3wCore" /tmp/n3w-symbols.txt
          grep -Fq "SimpleProductComponent" /tmp/n3w-symbols.txt
          grep -Fq "gh.telemetry/1" /tmp/n3w-app-strings.txt
          grep -Fq "air_temperature_c" /tmp/n3w-app-strings.txt
          echo "N3W_R4_PRODUCTION_BINARY_DEHARNESS=PASS"
