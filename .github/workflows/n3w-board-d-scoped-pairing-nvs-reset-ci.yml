name: N3W Board_D scoped pairing NVS reset CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/board_d/scoped_pairing_nvs_reset/**"
      - "tests/execution_packages/n3w/board_d/scoped_pairing_nvs_reset/**"
      - "docs/development/N3W_BOARD_D_SCOPED_PAIRING_NVS_RESET_SOURCE_DESIGN_20261025.md"
      - ".github/workflows/n3w-board-d-scoped-pairing-nvs-reset-ci.yml"

permissions:
  contents: read

jobs:
  scoped-nvs-reset-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python -m py_compile tools/execution_packages/n3w/board_d/scoped_pairing_nvs_reset/executor.py
      - run: pytest -q tests/execution_packages/n3w/board_d/scoped_pairing_nvs_reset/test_executor.py
      - shell: bash
        run: |
          set -euo pipefail
          FILE=tools/execution_packages/n3w/board_d/scoped_pairing_nvs_reset/executor.py
          if grep -Fq 'erase-flash' "$FILE"; then exit 1; fi
          if grep -Fq 'write-flash' "$FILE"; then exit 1; fi
          grep -Fq 'NVS_OFFSET = 0x790000' "$FILE"
          grep -Fq 'NVS_SIZE = 0x70000' "$FILE"
          grep -Fq '"--after",' "$FILE"
          grep -Fq '"no-reset",' "$FILE"
          grep -Fq '"status": "CLOSED_PASS_PREBOOT"' "$FILE"
          grep -Fq '"application_start_performed": False' "$FILE"
          grep -Fq '"full_flash_erase": False' "$FILE"
          grep -Fq '"application_flash_rewrite": False' "$FILE"
