name: N3W clean-product first-pair handoff F1RC2 629f096 exact-source artifact build

on:
  push:
    branches:
      - build/n3w-clean-product-first-pair-handoff-f1rc2-629f096-artifact-20261007

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: 629f096a32e087087ea32d30707dcc3cd6295e5d
          fetch-depth: 1

      - name: Bind exact source and production target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
          BRIDGE="firmware/esphome_rc/f1_0_rc2/packages/n3w_product_telemetry.yml"
          TRANSPORT="firmware/esphome_rc/f1_0_rc2/packages/n3w_product_transport.yml"
          DISPLAY="firmware/esphome_rc/f1_0_rc2/packages/display.yml"
          CORE_YAML="firmware/esphome_rc/f1_0_rc2/packages/core.yml"
          CORE_INIT="firmware/esphome_rc/components/greenhouse_n3w_product_core/__init__.py"
          CORE_HEADER="firmware/esphome_rc/components/greenhouse_n3w_product_core/greenhouse_n3w_product_core.h"
          FIRST_PAIR_POLICY="firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_first_pair_boot_policy.h"
          PAIRING_CPP="firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_pairing_client.cpp"
          PAIRING_H="firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_pairing_client.h"
          PRODUCT_CPP="firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_product_component.cpp"
          PRODUCT_H="firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_simple_product_component.h"

          test "$(git rev-parse HEAD)" = "629f096a32e087087ea32d30707dcc3cd6295e5d"
          test "$(git rev-parse HEAD^{tree})" = "0b97a97a63d7e251ed92cc96507386b454709161"
          test "$(git hash-object "$TARGET")" = "32a2b3cb29be4e1bce46807d8825b6a4c37999ec"
          test "$(git hash-object "$BRIDGE")" = "ce16f2389d146f9b25e95cbb628547e11ce36bd6"
          test "$(git hash-object "$TRANSPORT")" = "9cecdb091ca37fdcb1bbd675ecb4ef9566ae7751"
          test "$(git hash-object "$DISPLAY")" = "04f8a4ca46a7481650dc0a8f9500e1cb634b2b53"
          test "$(git hash-object "$CORE_YAML")" = "cc4b9dd495db1f5669508fa1728700f30b89c20f"
          test "$(git hash-object "$CORE_INIT")" = "75949b916144383ae57ebe90ece41e9f248b8cbe"
          test "$(git hash-object "$CORE_HEADER")" = "8132c86f4af91e3a2edc203cfd1ab183d0c06429"
          test "$(git hash-object "$FIRST_PAIR_POLICY")" = "c06dd29e1c43a00be6ab3399febe941176ce0177"
          test "$(git hash-object "$PAIRING_CPP")" = "4a779271046148763dd058bf8b77f921f843177a"
          test "$(git hash-object "$PAIRING_H")" = "5f19651245965635d50486a40b91192fcd3e96c4"
          test "$(git hash-object "$PRODUCT_CPP")" = "02f0a8eaf31bd9f8d9a8106b108b1eb2b5bb0c8e"
          test "$(git hash-object "$PRODUCT_H")" = "f92865d175c0fa926520634a0baa71b3d54ee05f"
          grep -Fq "classify_startup_product_identity_" "$CORE_HEADER"
          grep -Fq "prepare_initial_boot_floor" "$CORE_HEADER"
          grep -Fq "handoff_ready_ = true;" "$PAIRING_CPP"
          grep -Fq "pairing_handoff_ready()" "$PRODUCT_H"
          grep -Fq "id(pairing_qr).set_value(payload);" "$TRANSPORT"
          grep -Fq "payload != last_pairing_payload" "$TRANSPORT"
          grep -Fq 'value: "GHN3W2:pending"' "$DISPLAY"
          grep -Fq '"Unprovisioned N3-W node ready for local pairing"' "$PRODUCT_CPP"
          ! grep -Fq "hardware_id=%s pairing_id=%s" "$PRODUCT_CPP"
          ! grep -Fq "fresh_identity_candidate_" "$CORE_HEADER"
          ! grep -Fq "Provisioned identity has no durable boot-session counter" "$CORE_HEADER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact ESPHome
        run: python -m pip install --disable-pip-version-check "esphome==2026.4.3"

      - name: Compile exact production target
        shell: bash
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: |
          set -euo pipefail
          bash tools/rc2.sh compile

      - name: Verify ESP-IDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FILE="$HOME/.platformio/packages/framework-espidf/tools/cmake/version.cmake"
          test -f "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_MAJOR[[:space:]]+5\)' "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_MINOR[[:space:]]+5\)' "$VERSION_FILE"
          grep -Eq 'set\(IDF_VERSION_PATCH[[:space:]]+4\)' "$VERSION_FILE"

      - name: Prove exact binary is de-harnessed and includes clean-product first-pair repair
        shell: bash
        run: |
          set -euo pipefail
          ENV="$GITHUB_WORKSPACE/firmware/esphome_rc/f1_0_rc2/.esphome/build/gh/.pioenvs/gh"
          APP="$ENV/firmware.bin"
          FACTORY="$ENV/firmware.factory.bin"
          ELF="$ENV/firmware.elf"
          MAP="$ENV/firmware.map"

          test -f "$APP"
          test -f "$FACTORY"
          test -f "$ELF"
          test -f "$MAP"

          NM="$(find "$HOME/.platformio/packages" -type f -name riscv32-esp-elf-nm -print -quit)"
          test -n "$NM"
          test -x "$NM"

          "$NM" -C "$ELF" > /tmp/n3w-symbols.txt
          strings -a "$APP" > /tmp/n3w-app-strings.txt
          strings -a "$FACTORY" > /tmp/n3w-factory-strings.txt

          forbidden=(
            Phase4PhysicalHarness
            N3wLabDiagnostics
            N3wRtcBreadcrumb
            n3w_phase4_physical_harness
            n3w_lab_diagnostics
            n3w_rtc_breadcrumb
            n3w_rtc_breadcrumb_
            gh_n3w_diag
            N3W_DIAG_DISCOVERY
            PHASE4_LAB_TELEMETRY
            phase4_source_harness
            phase4_lab_diagnostics
            "Unprovisioned N3-W node ready for local pairing hardware_id=%s pairing_id=%s"
          )

          for marker in "${forbidden[@]}"; do
            ! grep -Fq "$marker" /tmp/n3w-symbols.txt
            ! grep -Fq "$marker" "$MAP"
            ! grep -Fq "$marker" /tmp/n3w-app-strings.txt
            ! grep -Fq "$marker" /tmp/n3w-factory-strings.txt
          done

          grep -Fq "GreenhouseN3wCore" /tmp/n3w-symbols.txt
          grep -Fq "SimpleProductComponent" /tmp/n3w-symbols.txt
          grep -Fq "gh.telemetry/1" /tmp/n3w-app-strings.txt
          grep -Fq "air_temperature_c" /tmp/n3w-app-strings.txt
          grep -Fq "N3-W standalone Direct Broker candidate attempt started" /tmp/n3w-app-strings.txt
          grep -Fq "stable Broker restored" /tmp/n3w-app-strings.txt
          grep -Fq "Startup product identity state is partial, corrupt, or contradictory" /tmp/n3w-app-strings.txt
          grep -Fq "Initial boot-session floor preparation failed code=%u" /tmp/n3w-app-strings.txt
          grep -Fq "Unprovisioned N3-W node ready for local pairing" /tmp/n3w-app-strings.txt
          grep -Fq "GHN3W2:pending" /tmp/n3w-app-strings.txt

          echo "N3W_PRODUCTION_BINARY_DEHARNESS_PROOF=PASS"
          echo "N3W_DIRECT_MQTT_RELOCATION_R2_MARKERS=PASS"
          echo "N3W_KF050_FIRST_PAIR_BOOT_REPAIR_MARKERS=PASS"
          echo "N3W_CLEAN_PRODUCT_FIRST_PAIR_HANDOFF_MARKERS=PASS"
          echo "N3W_PAIRING_ID_LOG_REDACTION_MARKERS=PASS"

      - name: Freeze exact production release bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/firmware/esphome_rc/f1_0_rc2/.esphome/build/gh"
          ENV="$ROOT/.pioenvs/gh"
          MEMBERS="$GITHUB_WORKSPACE/release-members"
          OUT="$GITHUB_WORKSPACE/release-artifact"
          BUNDLE="n3w-clean-product-first-pair-handoff-f1rc2-629f096-exact-source.zip"

          mkdir -p "$MEMBERS" "$OUT"

          files=(
            firmware.bin
            firmware.ota.bin
            firmware.factory.bin
            bootloader.bin
            partitions.bin
            ota_data_initial.bin
            flash_args
          )

          for name in "${files[@]}"; do
            test -f "$ENV/$name"
            cp "$ENV/$name" "$MEMBERS/$name"
          done

          {
            echo "BINDING_SCHEMA=N3W_PRODUCTION_EXACT_ARTIFACT_V1"
            echo "SOURCE_HEAD=629f096a32e087087ea32d30707dcc3cd6295e5d"
            echo "SOURCE_TREE=0b97a97a63d7e251ed92cc96507386b454709161"
            echo "SOURCE_REPAIR_R2=true"
            echo "KF050_FIRST_PAIR_BOOT_REPAIR=true"
            echo "CLEAN_PRODUCT_FIRST_PAIR_HANDOFF_REPAIR=true"
            echo "PAIRING_ID_LOG_REDACTION=true"
            echo "TARGET_CONFIG=firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
            echo "TARGET_BLOB_SHA=32a2b3cb29be4e1bce46807d8825b6a4c37999ec"
            echo "TELEMETRY_BRIDGE_BLOB_SHA=ce16f2389d146f9b25e95cbb628547e11ce36bd6"
            echo "TRANSPORT_BLOB_SHA=9cecdb091ca37fdcb1bbd675ecb4ef9566ae7751"
            echo "DISPLAY_BLOB_SHA=04f8a4ca46a7481650dc0a8f9500e1cb634b2b53"
            echo "CORE_YAML_BLOB_SHA=cc4b9dd495db1f5669508fa1728700f30b89c20f"
            echo "PRODUCT_CORE_INIT_BLOB_SHA=75949b916144383ae57ebe90ece41e9f248b8cbe"
            echo "PRODUCT_CORE_HEADER_BLOB_SHA=8132c86f4af91e3a2edc203cfd1ab183d0c06429"
            echo "FIRST_PAIR_POLICY_BLOB_SHA=c06dd29e1c43a00be6ab3399febe941176ce0177"
            echo "PAIRING_CLIENT_CPP_BLOB_SHA=4a779271046148763dd058bf8b77f921f843177a"
            echo "PAIRING_CLIENT_H_BLOB_SHA=5f19651245965635d50486a40b91192fcd3e96c4"
            echo "PRODUCT_COMPONENT_CPP_BLOB_SHA=02f0a8eaf31bd9f8d9a8106b108b1eb2b5bb0c8e"
            echo "PRODUCT_COMPONENT_H_BLOB_SHA=f92865d175c0fa926520634a0baa71b3d54ee05f"
            echo "PYTHON_VERSION=3.11"
            echo "ESPHOME_VERSION=2026.4.3"
            echo "ESP_IDF_VERSION=5.5.4"
            echo "WORKFLOW_TRIGGER_SHA=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "BINARY_DEHARNESS_PROOF=PASS"
            echo "DIRECT_MQTT_RELOCATION_R2_MARKERS=PASS"
            echo "KF050_FIRST_PAIR_BOOT_REPAIR_MARKERS=PASS"
            echo "CLEAN_PRODUCT_FIRST_PAIR_HANDOFF_MARKERS=PASS"
            echo "PAIRING_ID_LOG_REDACTION_MARKERS=PASS"
            echo "PHASE4_HARNESS_PRESENT=false"
            echo "LAB_DIAGNOSTICS_PRESENT=false"
            echo "RTC_BREADCRUMB_PRESENT=false"
            for name in "${files[@]}"; do
              key="$(printf '%s' "$name" | tr '[:lower:].' '[:upper:]_')"
              size="$(stat -c '%s' "$MEMBERS/$name")"
              digest="$(sha256sum "$MEMBERS/$name" | awk '{print $1}')"
              echo "${key}_SIZE=${size}"
              echo "${key}_SHA256=${digest}"
            done
          } | tee "$MEMBERS/MANIFEST.txt"

          python - "$MEMBERS" "$OUT/$BUNDLE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          names = sorted(p.name for p in source.iterdir() if p.is_file())

          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_STORED) as archive:
              for name in names:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_STORED
                  archive.writestr(info, (source / name).read_bytes())
          PY

          BUNDLE_SIZE="$(stat -c '%s' "$OUT/$BUNDLE")"
          BUNDLE_SHA256="$(sha256sum "$OUT/$BUNDLE" | awk '{print $1}')"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$BUNDLE" > "$OUT/$BUNDLE.sha256"

          echo "RELEASE_BUNDLE=$BUNDLE"
          echo "RELEASE_BUNDLE_SIZE=$BUNDLE_SIZE"
          echo "RELEASE_BUNDLE_SHA256=$BUNDLE_SHA256"
          echo "RELEASE_MEMBER_COUNT=$(find "$MEMBERS" -maxdepth 1 -type f | wc -l)"
          sha256sum "$MEMBERS"/*

      - name: Upload exact production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: n3w-clean-product-first-pair-handoff-f1rc2-629f096-exact-source
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
