name: N3W current-main product source convergence R3 CI

on:
  pull_request:
    paths:
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "tests/n3w_production/test_current_main_product_source_convergence_r3_contract.py"
      - "tests/n3w_production/n3w_current_main_broker_relocation_policy_host_test.cpp"
      - "tests/n3w_production/n3w_current_main_manager_discovery_policy_host_test.cpp"
      - ".github/workflows/n3w-current-main-product-source-convergence-r3-ci.yml"
  push:
    branches:
      - "fix/n3w-board-d-current-main-product-source-convergence-r1-20261023"
    paths:
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "tests/n3w_production/test_current_main_product_source_convergence_r3_contract.py"
      - "tests/n3w_production/n3w_current_main_broker_relocation_policy_host_test.cpp"
      - "tests/n3w_production/n3w_current_main_manager_discovery_policy_host_test.cpp"
      - ".github/workflows/n3w-current-main-product-source-convergence-r3-ci.yml"

permissions:
  contents: read

jobs:
  source-repair-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install host and ESP32-C6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmbedtls-dev
          python -m pip install -q "pytest>=8,<9" "esphome==2026.4.3"
      - name: R3 current-main source contract
        run: pytest -q tests/n3w_production/test_current_main_product_source_convergence_r3_contract.py
      - name: R2 radio regression source contracts
        run: pytest -q tests/n3w_production/test_multi_relay_gateway_selection_v1_contract.py tests/n3w_production/test_relay_discovery_full_channel_fallback_v1_contract.py
      - name: Build and run Broker relocation policy host test
        shell: bash
        run: |
          set -euo pipefail
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$core" "$core/n3w_broker_relocation_policy.cpp" tests/n3w_production/n3w_current_main_broker_relocation_policy_host_test.cpp -o /tmp/n3w-current-main-broker-relocation-policy
          /tmp/n3w-current-main-broker-relocation-policy
      - name: Build and run Manager discovery filter host test
        shell: bash
        run: |
          set -euo pipefail
          core=firmware/esphome_rc/components/greenhouse_n3w_core
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$core" "$core/n3w_manager_discovery_policy.cpp" tests/n3w_production/n3w_current_main_manager_discovery_policy_host_test.cpp -o /tmp/n3w-current-main-manager-discovery-policy
          /tmp/n3w-current-main-manager-discovery-policy
      - name: Validate F1.0-RC2 production N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        run: RC2_CONFIG=f1_0_rc2_n3w_target.yml bash tools/rc2.sh config
      - name: Compile F1.0-RC2 production N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        run: RC2_CONFIG=f1_0_rc2_n3w_target.yml bash tools/rc2.sh compile
