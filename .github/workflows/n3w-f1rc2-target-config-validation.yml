name: N3W F1RC2 target config validation

on:
  pull_request:
    paths:
      - "firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml"
      - "firmware/esphome_rc/f1_0_rc2/packages/n3w_product_transport.yml"
      - "firmware/esphome_rc/components/greenhouse_n3w_product_core/**"
      - ".github/workflows/n3w-f1rc2-target-config-validation.yml"

permissions:
  contents: read

jobs:
  config-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ESPHome
        run: python -m pip install --upgrade "esphome==2026.4.3"

      - name: Validate F1.0-RC2 N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: bash tools/rc2.sh config
