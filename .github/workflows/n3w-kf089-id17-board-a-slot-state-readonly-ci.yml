name: N3W KF089 ID17 Board A slot-state read-only CI

on:
  pull_request:
    paths:
      - 'tools/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/**'
      - 'tests/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/**'
      - '.github/workflows/n3w-kf089-id17-board-a-slot-state-readonly-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact host dependency
        run: python -m pip install --disable-pip-version-check pytest esptool==5.3.1
      - name: Validate JSON manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/manifest.json >/dev/null
      - name: Compile executor
        run: python -m py_compile tools/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/executor.py
      - name: Run executor self-check
        run: python tools/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/executor.py --self-check
      - name: Run focused package tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id17_board_a_slot_state_readonly/test_executor.py
