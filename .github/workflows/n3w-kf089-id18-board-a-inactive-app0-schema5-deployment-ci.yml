name: N3W KF089 ID18 Board A inactive-app0 Schema-v5 deployment CI

on:
  pull_request:
    paths:
      - 'tools/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/**'
      - 'tests/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/**'
      - '.github/workflows/n3w-kf089-id18-board-a-inactive-app0-schema5-deployment-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact host dependency
        run: python -m pip install --disable-pip-version-check pytest esptool==5.3.1
      - name: Validate JSON manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/manifest.json >/dev/null
      - name: Compile executor
        run: python -m py_compile tools/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/executor.py
      - name: Run executor self-check
        run: python tools/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/executor.py --self-check
      - name: Run focused package tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id18_board_a_inactive_app0_schema5_deployment/test_executor.py
