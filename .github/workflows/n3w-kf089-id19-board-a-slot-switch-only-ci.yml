name: N3W KF089 ID19 Board A slot-switch-only CI

on:
  pull_request:
    paths:
      - 'tools/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/**'
      - 'tests/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/**'
      - '.github/workflows/n3w-kf089-id19-board-a-slot-switch-only-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact host dependency
        run: python -m pip install --disable-pip-version-check pytest esptool==5.3.1
      - name: Validate manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/manifest.json >/dev/null
      - name: Compile executors
        run: |
          python -m py_compile tools/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/executor.py
          python -m py_compile tools/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/executor_impl.py
      - name: Run self-check
        run: python tools/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/executor.py --self-check
      - name: Run focused tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id19_board_a_slot_switch_only/test_executor.py
