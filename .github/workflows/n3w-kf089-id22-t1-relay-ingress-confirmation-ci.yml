name: N3W KF089 ID22 T1 Relay ingress confirmation CI

on:
  pull_request:
    paths:
      - 'tools/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/**'
      - 'tests/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/**'
      - '.github/workflows/n3w-kf089-id22-t1-relay-ingress-confirmation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact host dependency
        run: python -m pip install 'esptool==5.3.1'
      - name: Validate manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/manifest.json >/dev/null
      - name: Compile executors
        run: |
          python -m py_compile \
            tools/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/executor.py \
            tools/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/executor_impl.py
      - name: Run self-check
        run: python tools/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/executor.py --self-check
      - name: Run focused tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id22_t1_relay_ingress_confirmation/test_executor.py
