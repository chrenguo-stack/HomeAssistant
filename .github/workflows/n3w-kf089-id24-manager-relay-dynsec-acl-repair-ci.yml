name: N3W KF089 ID24 Manager Relay DynSec ACL repair CI

on:
  pull_request:
    paths:
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/service_identity_plan.py"
      - "host/greenhouse-manager/tests/runtime/test_service_identity_plan.py"
      - "tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/**"
      - "tests/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/**"
      - ".github/workflows/n3w-kf089-id24-manager-relay-dynsec-acl-repair-ci.yml"
  workflow_dispatch:

jobs:
  id24-host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/manifest.json >/dev/null
      - name: Compile executors
        run: |
          python -m py_compile tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/executor.py
          python -m py_compile tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/remote_dynsec_acl_mutator.py
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Verify repaired service identity contract
        env:
          PYTHONPATH: host/greenhouse-manager/src
        run: python -m pytest -q host/greenhouse-manager/tests/runtime/test_service_identity_plan.py
      - name: Self-check ID24 package
        run: python tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/executor.py --self-check
      - name: Focused ID24 tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair
