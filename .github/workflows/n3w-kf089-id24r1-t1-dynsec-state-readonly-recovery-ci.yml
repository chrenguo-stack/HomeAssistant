name: N3W KF089 ID24R1 T1 DynSec state read-only recovery CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/**"
      - "tests/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/**"
      - ".github/workflows/n3w-kf089-id24r1-t1-dynsec-state-readonly-recovery-ci.yml"
  workflow_dispatch:

jobs:
  id24r1-host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/manifest.json >/dev/null
      - name: Compile executor
        run: python -m py_compile tools/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/executor.py
      - name: Self-check read-only package
        run: python tools/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/executor.py --self-check
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Focused tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id24r1_t1_dynsec_state_readonly_recovery/test_executor.py
