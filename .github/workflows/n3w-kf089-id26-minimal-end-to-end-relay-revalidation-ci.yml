name: N3W KF089 ID26 minimal end-to-end Relay revalidation CI

on:
  pull_request:
    paths:
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_isolated_mqtt_service.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_manager_runtime_wiring.py"
      - "tools/execution_packages/n3w/kf089/id24_manager_relay_dynsec_acl_repair/**"
      - "tools/execution_packages/n3w/kf089/id25_manager_relay_subscription_reactivation/**"
      - "tools/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation/**"
      - "tests/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation/**"
      - ".github/workflows/n3w-kf089-id26-minimal-end-to-end-relay-revalidation-ci.yml"
  workflow_dispatch:

jobs:
  id26-host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest
        run: python -m json.tool tools/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation/manifest.json >/dev/null
      - name: Compile executor
        run: python -m py_compile tools/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation/executor.py
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Self-check ID26 package
        run: python tools/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation/executor.py --self-check
      - name: Focused ID26 tests
        run: python -m pytest -q tests/execution_packages/n3w/kf089/id26_minimal_end_to_end_relay_revalidation
