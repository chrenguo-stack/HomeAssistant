name: N3W PR437 Board A same-artifact write executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/**"
      - "tests/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/**"
      - ".github/workflows/n3w-kf096-pr437-board-a-same-artifact-write-ci.yml"
  push:
    branches:
      - "exec/n3w-pr437-board-a-same-artifact-role-swap-*"
    paths:
      - "tools/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/**"
      - "tests/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/**"
      - ".github/workflows/n3w-kf096-pr437-board-a-same-artifact-write-ci.yml"

permissions:
  contents: read

jobs:
  test-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests
        run: python -m pip install -q pytest
      - name: Python syntax
        run: |
          python -m py_compile tools/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/executor.py
          python -m py_compile tests/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/test_executor.py
      - name: Unit tests
        run: python -m pytest -q tests/execution_packages/n3w/kf096/pr437_board_a_same_artifact_write/test_executor.py
