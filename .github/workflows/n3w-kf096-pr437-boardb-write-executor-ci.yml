name: N3W KF096 PR437 Board B write executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/kf096/pr437_board_b_write/**"
      - "tests/execution_packages/n3w/kf096/pr437_board_b_write/**"
      - ".github/workflows/n3w-kf096-pr437-boardb-write-executor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile executor
        run: python -m py_compile tools/execution_packages/n3w/kf096/pr437_board_b_write/executor.py
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Focused tests
        run: python -m pytest -q tests/execution_packages/n3w/kf096/pr437_board_b_write/test_executor.py
