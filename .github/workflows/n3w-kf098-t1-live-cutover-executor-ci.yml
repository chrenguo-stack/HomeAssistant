name: N3W KF098 T1 live cutover executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/kf098/t1_live_cutover/**"
      - "tests/execution_packages/n3w/kf098/t1_live_cutover/**"
      - ".github/workflows/n3w-kf098-t1-live-cutover-executor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile executors
        run: |
          python -m py_compile tools/execution_packages/n3w/kf098/t1_live_cutover/executor.py
          python -m py_compile tools/execution_packages/n3w/kf098/t1_live_cutover/remote_cutover.py
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Focused tests
        run: python -m pytest -q tests/execution_packages/n3w/kf098/t1_live_cutover/test_executor.py
