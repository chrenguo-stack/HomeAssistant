name: N3-W Manager persistent path lease CI

on:
  pull_request:
    paths:
      - "docs/decisions/n3w-manager-path-lease-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/replay_registry.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_path_lease.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_ingress_router.py"
      - "host/greenhouse-manager/tests/runtime/test_replay_registry.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_path_lease.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py"
      - ".github/workflows/n3w-manager-path-lease-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/decisions/n3w-manager-path-lease-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/replay_registry.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_path_lease.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_ingress_router.py"
      - "host/greenhouse-manager/tests/runtime/test_replay_registry.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_path_lease.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py"
      - ".github/workflows/n3w-manager-path-lease-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  persistent-path-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml
      - name: Install Manager development dependencies
        run: python -m pip install -q -e ".[dev]"
      - name: Verify exact authorized base and changed-file boundary
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("../../docs/decisions/n3w-manager-path-lease-stage-entry.json").read_text()
          )
          assert decision["base"]["sha"] == "0db1c128c31c137e2bf6955365211280ce7036f8"
          assert decision["preserved_contract"]["head"] == (
              "239ea594c643d4990d449187f8b0cabae619e3d7"
          )
          assert decision["preserved_contract"]["mutation_allowed"] is False
          PY
          BASE_SHA="0db1c128c31c137e2bf6955365211280ce7036f8"
          TARGET_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          git diff --name-only "$BASE_SHA" "$TARGET_SHA" > /tmp/n3w-path-lease-files.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/n3w-manager-path-lease-ci.yml",
              "docs/decisions/n3w-manager-path-lease-stage-entry.json",
              "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_path_lease.py",
              "host/greenhouse-manager/src/greenhouse_manager/runtime/replay_registry.py",
              "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_ingress_router.py",
              "host/greenhouse-manager/tests/runtime/test_n3w_path_lease.py",
              "host/greenhouse-manager/tests/runtime/test_replay_registry.py",
              "host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py",
          }
          changed = {
              line.strip()
              for line in Path("/tmp/n3w-path-lease-files.txt").read_text().splitlines()
              if line.strip()
          }
          assert changed <= allowed, sorted(changed - allowed)
          assert changed == allowed, sorted(allowed - changed)
          PY
      - name: Validate stage entry and Python syntax
        run: |
          python -m json.tool ../../docs/decisions/n3w-manager-path-lease-stage-entry.json >/dev/null
          python -m compileall -q \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/runtime/n3w_path_lease.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_replay_registry.py \
            tests/runtime/test_n3w_path_lease.py \
            tests/runtime/test_n3w_ingress_router.py
      - name: Run focused Ruff checks
        run: |
          python -m ruff check \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/runtime/n3w_path_lease.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_replay_registry.py \
            tests/runtime/test_n3w_path_lease.py \
            tests/runtime/test_n3w_ingress_router.py
          python -m ruff format --check \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/runtime/n3w_path_lease.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_replay_registry.py \
            tests/runtime/test_n3w_path_lease.py \
            tests/runtime/test_n3w_ingress_router.py
      - name: Run persistent path lease and predecessor regression tests
        run: |
          python -m pytest -q \
            tests/runtime/test_replay_registry.py \
            tests/runtime/test_n3w_path_lease.py \
            tests/runtime/test_n3w_ingress_router.py \
            tests/runtime/test_n3w_relay_ingress.py \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/runtime/test_ingest.py
      - name: Assert non-live path lease boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("../../docs/decisions/n3w-manager-path-lease-stage-entry.json").read_text()
          )
          invariants = decision["invariants"]
          assert invariants["production_mqtt_subscription"] is False
          assert invariants["production_service_wiring"] is False
          assert invariants["canonical_publish_executed"] is False
          assert invariants["authorization_store_runtime_write"] is False
          assert invariants["key_provisioning_or_rotation"] is False
          assert invariants["board_or_live_execution"] is False
          assert invariants["pr276_mutation"] is False
          assert invariants["one_shared_replay_registry"] is True
          assert invariants["same_sqlite_transaction_for_path_cursor_and_replay"] is True
          assert invariants["candidate_consumes_replay"] is False
          assert invariants["path_policy_values_are_production_frozen"] is False

          path_core = Path("src/greenhouse_manager/runtime/n3w_path_lease.py").read_text()
          router = Path("src/greenhouse_manager/runtime/n3w_ingress_router.py").read_text()
          for source in (path_core, router):
              for forbidden in ("paho.mqtt", "mqtt.Client", ".subscribe(", ".publish("):
                  assert forbidden not in source
          PY
      - name: Write secret-free evidence summary
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "schema": "gh.n3w-manager-path-lease-ci-evidence/1",
              "status": "passed",
              "base_sha": "0db1c128c31c137e2bf6955365211280ce7036f8",
              "head_sha": os.environ.get("PR_HEAD_SHA") or os.environ["GITHUB_SHA"],
              "same_sqlite_transaction": True,
              "candidate_consumes_replay": False,
              "production_wiring": False,
              "board_or_live_executed": False,
              "secret_values_included": False,
          }
          Path("/tmp/n3w-manager-path-lease-evidence.json").write_text(
              json.dumps(report, sort_keys=True) + "\n"
          )
          PY
      - name: Upload path lease evidence
        uses: actions/upload-artifact@v4
        with:
          name: n3w-manager-path-lease-evidence
          path: /tmp/n3w-manager-path-lease-evidence.json
          retention-days: 14
