name: N3-W Manager relay authorization preflight CI

on:
  pull_request:
    paths:
      - "docs/decisions/n3w-manager-relay-authz-preflight-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_authorization.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/registration_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_relay_authorization.py"
      - "host/greenhouse-manager/tests/ops/test_registration_cli.py"
      - ".github/workflows/n3w-manager-relay-authz-preflight-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/decisions/n3w-manager-relay-authz-preflight-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_authorization.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/registration_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_relay_authorization.py"
      - "host/greenhouse-manager/tests/ops/test_registration_cli.py"
      - ".github/workflows/n3w-manager-relay-authz-preflight-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relay-authz-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml
      - name: Install Manager development dependencies
        run: python -m pip install -q -e ".[dev]"
      - name: Validate stage entry and Python syntax
        run: |
          python -m json.tool ../../docs/decisions/n3w-manager-relay-authz-preflight-stage-entry.json >/dev/null
          python -m compileall -q \
            src/greenhouse_manager/runtime/n3w_relay_authorization.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/ops/test_registration_cli.py
      - name: Run focused Ruff checks
        run: |
          python -m ruff check \
            src/greenhouse_manager/runtime/n3w_relay_authorization.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/ops/test_registration_cli.py
          python -m ruff format --check \
            src/greenhouse_manager/runtime/n3w_relay_authorization.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/ops/test_registration_cli.py
      - name: Run relay authorization and CLI regression tests
        run: |
          python -m pytest -q \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/ops/test_registration_cli.py \
            tests/runtime/test_n3w_relay_ingress.py \
            tests/runtime/test_replay_registry.py
      - name: Assert preflight-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("../../docs/decisions/n3w-manager-relay-authz-preflight-stage-entry.json").read_text()
          )
          invariants = decision["invariants"]
          assert invariants["production_mqtt_subscription"] is False
          assert invariants["authorization_store_runtime_write"] is False
          assert invariants["key_provisioning_or_rotation"] is False
          assert invariants["board_or_live_execution"] is False
          assert invariants["secret_values_in_evidence"] is False
          PY
