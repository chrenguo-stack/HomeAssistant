name: N3-W Manager relay ingress AEAD CI

on:
  pull_request:
    paths:
      - "docs/decisions/n3w-manager-relay-ingress-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_ingress.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_relay_ingress.py"
      - ".github/workflows/n3w-manager-relay-ingress-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/decisions/n3w-manager-relay-ingress-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_ingress.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_relay_ingress.py"
      - ".github/workflows/n3w-manager-relay-ingress-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relay-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install Manager development dependencies
        run: python -m pip install -q -e ".[dev]"

      - name: Validate stage entry and syntax
        run: |
          python -m json.tool ../../docs/decisions/n3w-manager-relay-ingress-stage-entry.json >/dev/null
          python -m compileall -q \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            tests/runtime/test_n3w_relay_ingress.py

      - name: Ruff
        run: |
          python -m ruff check \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            tests/runtime/test_n3w_relay_ingress.py
          python -m ruff format --check \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            tests/runtime/test_n3w_relay_ingress.py

      - name: Run focused N3-W relay ingress tests
        run: python -m pytest -q tests/runtime/test_n3w_relay_ingress.py

      - name: Run persistent replay-registry regression tests
        run: python -m pytest -q tests/runtime/test_replay_registry.py

      - name: Assert non-live boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("../../docs/decisions/n3w-manager-relay-ingress-stage-entry.json").read_text()
          )
          invariants = decision["invariants"]
          assert invariants["production_wiring"] is False
          assert invariants["board_or_live_execution"] is False
          assert invariants["test_keys_only"] is True
          forbidden = set(decision["work_package"]["forbidden"])
          assert "production MQTT relay subscription" in forbidden
          assert "real application keys" in forbidden
          assert "T1, node, board, Broker, Home Assistant, production Manager database, or credential access" in forbidden
          PY
