name: N3-W Manager replay registry CI

on:
  pull_request:
    paths:
      - "docs/decisions/n3w-manager-replay-registry-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/replay_registry.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/registration_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_replay_registry.py"
      - "host/greenhouse-manager/tests/ops/test_registration_cli.py"
      - ".github/workflows/n3w-manager-replay-registry-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/decisions/n3w-manager-replay-registry-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/replay_registry.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/registration_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_replay_registry.py"
      - "host/greenhouse-manager/tests/ops/test_registration_cli.py"
      - ".github/workflows/n3w-manager-replay-registry-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manager-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml
      - name: Install Manager development dependencies
        run: python -m pip install -q -e ".[dev]"
      - name: Validate stage entry and Python syntax
        run: |
          python -m json.tool ../../docs/decisions/n3w-manager-replay-registry-stage-entry.json >/dev/null
          python -m compileall -q \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_replay_registry.py \
            tests/ops/test_registration_cli.py
      - name: Run focused Ruff checks
        run: |
          python -m ruff check \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_replay_registry.py \
            tests/ops/test_registration_cli.py
          python -m ruff format --check \
            src/greenhouse_manager/runtime/replay_registry.py \
            src/greenhouse_manager/ops/registration_cli.py \
            tests/runtime/test_replay_registry.py \
            tests/ops/test_registration_cli.py
      - name: Run focused replay and CLI tests
        run: |
          python -m pytest -q \
            tests/runtime/test_replay_registry.py \
            tests/ops/test_registration_cli.py
      - name: Exercise installed CLI entry point without production state
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          REPLAY_DB="$tmpdir/n3w-replay.sqlite3" python - <<'PY'
          import os
          from greenhouse_manager.runtime.replay_registry import ReplayRegistry

          with ReplayRegistry(os.environ["REPLAY_DB"]):
              pass
          PY
          greenhouse-manager-registration \
            --db "$tmpdir/unused-registration.sqlite3" \
            n3w-replay-audit \
            --replay-db "$tmpdir/n3w-replay.sqlite3" \
            >"$tmpdir/audit.json"
          AUDIT_PATH="$tmpdir/audit.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["AUDIT_PATH"]).read_text())
          assert document["status"] == "passed"
          assert document["node_count"] == 0
          assert document["replay_tuple_count"] == 0
          PY
          test ! -e "$tmpdir/unused-registration.sqlite3"
