name: N3-W Manager unified ingress router CI

on:
  pull_request:
    paths:
      - "docs/decisions/n3w-manager-unified-ingress-router-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/ingest.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_ingress.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_ingress_router.py"
      - "host/greenhouse-manager/tests/runtime/test_ingest.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py"
      - ".github/workflows/n3w-manager-unified-ingress-router-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/decisions/n3w-manager-unified-ingress-router-stage-entry.json"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/ingest.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_relay_ingress.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_ingress_router.py"
      - "host/greenhouse-manager/tests/runtime/test_ingest.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py"
      - ".github/workflows/n3w-manager-unified-ingress-router-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unified-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host/greenhouse-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml
      - name: Install Manager development dependencies
        run: python -m pip install -q -e ".[dev]"
      - name: Validate stage entry and Python syntax
        run: |
          python -m json.tool ../../docs/decisions/n3w-manager-unified-ingress-router-stage-entry.json >/dev/null
          python -m compileall -q \
            src/greenhouse_manager/runtime/ingest.py \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_ingest.py \
            tests/runtime/test_n3w_ingress_router.py
      - name: Run focused Ruff checks
        run: |
          python -m ruff check \
            src/greenhouse_manager/runtime/ingest.py \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_ingest.py \
            tests/runtime/test_n3w_ingress_router.py
          python -m ruff format --check \
            src/greenhouse_manager/runtime/ingest.py \
            src/greenhouse_manager/runtime/n3w_relay_ingress.py \
            src/greenhouse_manager/runtime/n3w_ingress_router.py \
            tests/runtime/test_ingest.py \
            tests/runtime/test_n3w_ingress_router.py
      - name: Run unified ingress and regression tests
        run: |
          python -m pytest -q \
            tests/runtime/test_ingest.py \
            tests/runtime/test_n3w_ingress_router.py \
            tests/runtime/test_n3w_relay_ingress.py \
            tests/runtime/test_n3w_relay_authorization.py \
            tests/runtime/test_replay_registry.py
      - name: Assert non-live routing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("../../docs/decisions/n3w-manager-unified-ingress-router-stage-entry.json").read_text()
          )
          invariants = decision["invariants"]
          assert invariants["production_mqtt_subscription"] is False
          assert invariants["production_service_wiring"] is False
          assert invariants["canonical_publish_executed"] is False
          assert invariants["authorization_store_runtime_write"] is False
          assert invariants["key_provisioning_or_rotation"] is False
          assert invariants["board_or_live_execution"] is False
          assert invariants["one_shared_replay_registry"] is True

          router = Path("src/greenhouse_manager/runtime/n3w_ingress_router.py").read_text()
          for forbidden in ("paho.mqtt", "mqtt.Client", ".subscribe(", ".publish("):
              assert forbidden not in router
          PY
