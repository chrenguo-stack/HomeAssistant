name: N3W OTA Guard CI

on:
  pull_request:
    paths:
      - "tools/n3w_ota_guard.py"
      - "tests/tools/test_n3w_ota_guard.py"
      - ".github/workflows/n3w-ota-guard-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/n3w_ota_guard.py"
      - "tests/tools/test_n3w_ota_guard.py"
      - ".github/workflows/n3w-ota-guard-ci.yml"

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile with warnings as errors
        run: >-
          python -W error -m py_compile
          tools/n3w_ota_guard.py
          tests/tools/test_n3w_ota_guard.py
      - name: Run R2 host regression
        run: python -W error tests/tools/test_n3w_ota_guard.py
