name: N3W P4 Manager exact ARM64 offline image artifact

on:
  push:
    branches:
      - docs/n3w-p4-manager-exact-image-readonly-deploy-preexecution-20261009
    paths:
      - .github/workflows/n3w-p4-manager-arm64-offline-image-ci.yml

permissions:
  contents: read

jobs:
  exact-arm64-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact P4 candidate source
        uses: actions/checkout@v4
        with:
          ref: 3d86d6bfaf361dc3a3d7295d046f541a544d552d
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source and native target architecture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d86d6bfaf361dc3a3d7295d046f541a544d552d"
          test "$(uname -m)" = "aarch64"
          test -f host/greenhouse-manager/Dockerfile
          test -f host/greenhouse-manager/pyproject.toml
          echo "SOURCE_EXACT_HEAD=PASS"
          echo "NATIVE_ARM64_RUNNER=PASS"

      - name: Build ARM64 Manager as an isolated new image
        run: |
          set -euo pipefail
          docker buildx build             --platform linux/arm64             --load             --label org.opencontainers.image.revision=3d86d6bfaf361dc3a3d7295d046f541a544d552d             --tag n3w-p4-manager:3d86d6bfaf361dc3a3d7295d046f541a544d552d             --file host/greenhouse-manager/Dockerfile             host/greenhouse-manager
          echo "CANDIDATE_CI_IMAGE_BUILT=PASS"

      - name: Exact image provenance and synthetic offline interface gates
        run: |
          set -euo pipefail
          tag=n3w-p4-manager:3d86d6bfaf361dc3a3d7295d046f541a544d552d
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$tag")" = "linux/arm64"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$tag")" = "3d86d6bfaf361dc3a3d7295d046f541a544d552d"
          docker run --rm --network none --read-only --entrypoint greenhouse-manager-registration "$tag" p4-pending-readonly --help >/dev/null
          docker run --rm --network none --read-only --entrypoint greenhouse-manager-pairing "$tag" import-payload --help >/dev/null
          docker run --rm --network none --read-only --entrypoint python "$tag" -c 'import inspect; from greenhouse_manager.runtime.registration import RegistrationRegistry; from greenhouse_manager.runtime.n3w_simplified_pairing import SimplifiedPairingCoordinator; assert callable(getattr(RegistrationRegistry, "pending_import_guard", None)); assert "pending_import_guard" in inspect.getsource(SimplifiedPairingCoordinator.import_setup_secret); print("PENDING_EXPIRY_GUARD_IN_IMAGE=PASS")'
          docker image inspect --format 'CANDIDATE_IMAGE_ID={{.Id}} CANDIDATE_IMAGE_BYTES={{.Size}} TARGET={{.Os}}/{{.Architecture}}' "$tag"
          echo "CANDIDATE_OFFLINE_SYNTHETIC_GATES=PASS"

      - name: Export portable Docker archive with independent SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n3w-p4-image-output"
          cd "$RUNNER_TEMP/n3w-p4-image-output"
          tag=n3w-p4-manager:3d86d6bfaf361dc3a3d7295d046f541a544d552d
          file=n3w-p4-manager-linux-arm64-3d86d6bf.tar.gz
          docker save "$tag" | gzip -1 > "$file"
          sha256sum "$file" > "$file.sha256"
          cat "$file.sha256"
          echo "DOCKER_SAVE_ARCHIVE_READY=PASS"

      - name: Upload image archive (not runtime secrets or databases)
        uses: actions/upload-artifact@v4
        with:
          name: n3w-p4-manager-linux-arm64-3d86d6bf
          path: |
            ${{ runner.temp }}/n3w-p4-image-output/n3w-p4-manager-linux-arm64-3d86d6bf.tar.gz
            ${{ runner.temp }}/n3w-p4-image-output/n3w-p4-manager-linux-arm64-3d86d6bf.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
