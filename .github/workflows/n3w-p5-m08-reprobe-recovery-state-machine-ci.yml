name: N3-W P5 M08 reprobe recovery state machine CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-p5-m08-reprobe-recovery-state-machine-ci.yml'
      - 'firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.cpp'
      - 'firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.h'
      - 'tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  m08-reprobe-recovery-contract:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha == '9ff26629146fe2c1056f52e269c044a135306772' && github.event.pull_request.head.ref == 'agent/n3w-p5-m08-reprobe-recovery-state-machine-20260811-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exact main and four-file repair scope
        shell: bash
        run: |
          set -euo pipefail
          base='9ff26629146fe2c1056f52e269c044a135306772'
          branch='agent/n3w-p5-m08-reprobe-recovery-state-machine-20260811-v1'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$base"
            test '${{ github.event.pull_request.head.ref }}' = "$branch"
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"

          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-p5-m08-reprobe-recovery-state-machine-ci.yml
          firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.cpp
          firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.h
          tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$base"...HEAD | sort >"$actual"
          test "$(wc -l <"$actual")" -eq 4
          diff -u "$allowed" "$actual"

      - name: Install host-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libmbedtls-dev
          python -m pip install --upgrade pytest ruff jsonschema

      - name: Python contract quality
        run: |
          python -m compileall -q \
            tests/n3w_p5/test_n3w_p5_liveness_contract.py \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py
          ruff check \
            tests/n3w_p5/test_n3w_p5_liveness_contract.py \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py
          ruff format --check \
            tests/n3w_p5/test_n3w_p5_liveness_contract.py \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py

      - name: Build and execute existing P5 host liveness tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            tests/n3w_p5/n3w_p5_liveness_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_p5_liveness_host_test
          /tmp/n3w_p5_liveness_host_test

      - name: P5 regression and M08 source contracts
        run: |
          pytest -q \
            tests/n3w_p5/test_n3w_p5_preparation.py \
            tests/n3w_p5/test_n3w_p5_liveness_contract.py \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py

      - name: Explicit host-only and no-live safety gate
        shell: bash
        run: |
          set -euo pipefail
          base='9ff26629146fe2c1056f52e269c044a135306772'
          changed="$(git diff --name-only "$base"...HEAD)"
          if printf '%s\n' "$changed" | grep -E \
            '^(firmware/esphome_rc/f1_0_rc2/|infra/compose/|host/greenhouse-manager/)'; then
            echo 'Product runtime or live-service mutation is outside this repair'
            exit 1
          fi
          ! grep -R -n -E \
            '(esphome run|esp[t]ool|pio run .*upload|espota|/dev/cu\.|/dev/tty|192\.168\.68\.)' \
            firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_p5_lab/n3w_p5_lab.h \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py
          test "$(git diff --name-only "$base"...HEAD | grep -E '^firmware/esphome_rc/board_lab/' || true)" = ''

  esp32-c6-m08-reprobe-recovery-compile:
    needs: m08-reprobe-recovery-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [child, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen ESPHome
        run: python -m pip install --upgrade 'esphome==2026.4.3'
      - name: Validate compile-only P5 target
        run: esphome config firmware/esphome_rc/board_lab/n3w_p5_two_board/${{ matrix.target }}.yml
      - name: Compile P5 target without upload
        run: esphome compile firmware/esphome_rc/board_lab/n3w_p5_two_board/${{ matrix.target }}.yml
