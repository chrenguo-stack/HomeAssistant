name: N3-W P5 M12 key rotation host-only contract CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-p5-m12-key-rotation-host-only-ci.yml'
      - 'docs/decisions/n3w-p5-m12-key-rotation-host-only-plan.json'
      - 'tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m12-key-rotation-host-only-contract:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha == 'b4f07a5fd836124ae2fbdb2f01e28402481b15e7' && github.event.pull_request.head.ref == 'agent/n3w-p5-m12-host-only-contract-20260813-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Verify exact base and three-file host-only scope
        shell: bash
        run: |
          set -euo pipefail
          base='b4f07a5fd836124ae2fbdb2f01e28402481b15e7'
          branch='agent/n3w-p5-m12-host-only-contract-20260813-v1'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$base"
            test '${{ github.event.pull_request.head.ref }}' = "$branch"
          fi
          git cat-file -e "${base}^{commit}"
          test "$(git merge-base "$base" HEAD)" = "$base"

          allowed="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f "$allowed" "$actual"' EXIT
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-p5-m12-key-rotation-host-only-ci.yml
          docs/decisions/n3w-p5-m12-key-rotation-host-only-plan.json
          tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$base"...HEAD | sort >"$actual"
          test "$(wc -l <"$actual")" -eq 3
          diff -u "$allowed" "$actual"

      - name: Install Manager development dependencies
        run: python -m pip install -q -e 'host/greenhouse-manager[dev]'

      - name: Validate plan and Python quality
        run: |
          python -m json.tool \
            docs/decisions/n3w-p5-m12-key-rotation-host-only-plan.json \
            >/dev/null
          python -m compileall -q \
            tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py
          python -m ruff check \
            tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py
          python -m ruff format --check \
            tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py

      - name: Run M12 rotation and predecessor regressions
        run: |
          python -m pytest -q \
            tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py \
            tests/n3w_p5/test_n3w_p5_m11_authorization_regrant_contract.py \
            tests/n3w_p5/test_n3w_p5_m10_authorization_revoke_contract.py \
            host/greenhouse-manager/tests/ops/test_n3w_relay_authorization_admin.py \
            host/greenhouse-manager/tests/ops/test_registration_cli.py \
            host/greenhouse-manager/tests/runtime/test_n3w_relay_authorization.py \
            host/greenhouse-manager/tests/runtime/test_n3w_relay_ingress.py \
            host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py \
            host/greenhouse-manager/tests/runtime/test_replay_registry.py \
            host/greenhouse-manager/tests/runtime/test_n3w_path_lease.py

      - name: Enforce no-live execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 'b4f07a5fd836124ae2fbdb2f01e28402481b15e7'...HEAD | grep -E '^(firmware/|infra/compose/|host/greenhouse-manager/src/)' || true)" = ''

      - name: Write secret-free host-only evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "gh.n3w-p5-m12-key-rotation-host-only-ci-evidence/1",
              "status": "passed",
              "base_sha": "b4f07a5fd836124ae2fbdb2f01e28402481b15e7",
              "head_sha": os.environ.get("PR_HEAD_SHA") or os.environ["GITHUB_SHA"],
              "manager_product_runtime_changed": False,
              "live_epoch2_activation_executed": False,
              "live_child_key_2_publish_executed": False,
              "mqtt_docker_or_board_execution": False,
              "secret_values_included": False,
          }
          Path("/tmp/n3w-p5-m12-host-only-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: n3w-p5-m12-key-rotation-host-only-evidence
          path: /tmp/n3w-p5-m12-host-only-evidence.json
          retention-days: 14
