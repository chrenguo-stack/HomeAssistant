name: N3-W P5 M13 broker outage host-only contract CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-p5-m13-broker-outage-host-only-ci.yml'
      - 'docs/decisions/n3w-p5-m13-broker-outage-host-only-plan.json'
      - 'tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m13-broker-outage-host-only-contract:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha == '6bc4bd403d3913daf28017eea82dfab391265908' && github.event.pull_request.head.ref == 'agent/n3w-p5-m13-host-only-contract-20260813-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Verify exact base and three-file host-only scope
        shell: bash
        run: |
          set -euo pipefail
          base='6bc4bd403d3913daf28017eea82dfab391265908'
          branch='agent/n3w-p5-m13-host-only-contract-20260813-v1'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$base"
            test '${{ github.event.pull_request.head.ref }}' = "$branch"
          fi
          git cat-file -e "${base}^{commit}"
          test "$(git merge-base "$base" HEAD)" = "$base"

          allowed="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f "$allowed" "$actual"' EXIT
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-p5-m13-broker-outage-host-only-ci.yml
          docs/decisions/n3w-p5-m13-broker-outage-host-only-plan.json
          tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$base"...HEAD | sort >"$actual"
          test "$(wc -l <"$actual")" -eq 3
          diff -u "$allowed" "$actual"

      - name: Install host-only development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ libmbedtls-dev
          python -m pip install -q -e 'host/greenhouse-manager[dev]'

      - name: Validate plan and Python quality
        run: |
          python -m json.tool \
            docs/decisions/n3w-p5-m13-broker-outage-host-only-plan.json \
            >/dev/null
          python -m compileall -q \
            tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py
          python -m ruff check \
            tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py
          python -m ruff format --check \
            tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py

      - name: Compile and run production P5 cache and receipt implementation
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            tests/n3w_p5/n3w_p5_liveness_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_p5_m13_liveness_host_test
          /tmp/n3w_p5_m13_liveness_host_test

      - name: Run M13 outage contract and predecessor regressions
        run: |
          python -m pytest -q \
            tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py \
            tests/n3w_p5/test_n3w_p5_m12_key_rotation_contract.py \
            tests/n3w_p5/test_n3w_p5_m11_authorization_regrant_contract.py \
            tests/n3w_p5/test_n3w_p5_m10_authorization_revoke_contract.py \
            tests/n3w_p5/test_n3w_p5_m09_manager_restart_contract.py \
            tests/n3w_p5/test_n3w_p5_liveness_contract.py \
            tests/n3w_p5/test_n3w_p5_m08_reprobe_recovery_contract.py \
            host/greenhouse-manager/tests/runtime/test_replay_registry.py \
            host/greenhouse-manager/tests/runtime/test_n3w_path_lease.py \
            host/greenhouse-manager/tests/runtime/test_n3w_relay_ingress.py \
            host/greenhouse-manager/tests/runtime/test_n3w_ingress_router.py

      - name: Enforce no-live execution boundary
        shell: bash
        run: |
          set -euo pipefail
          base='6bc4bd403d3913daf28017eea82dfab391265908'
          test "$(git diff --name-only "$base"...HEAD | grep -E '^(firmware/|infra/compose/|host/greenhouse-manager/src/)' || true)" = ''
          python -m pytest -q \
            tests/n3w_p5/test_n3w_p5_m13_broker_outage_contract.py \
            -k host_only_scope_contains_no_live_execution_tokens

      - name: Write secret-free host-only evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "gh.n3w-p5-m13-broker-outage-host-only-ci-evidence/1",
              "status": "passed",
              "base_sha": "6bc4bd403d3913daf28017eea82dfab391265908",
              "head_sha": os.environ.get("PR_HEAD_SHA") or os.environ["GITHUB_SHA"],
              "manager_product_runtime_changed": False,
              "firmware_or_compose_changed": False,
              "live_broker_stop_or_start_executed": False,
              "mqtt_docker_board_or_network_execution": False,
              "secret_values_included": False,
          }
          Path("/tmp/n3w-p5-m13-host-only-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: n3w-p5-m13-broker-outage-host-only-evidence
          path: /tmp/n3w-p5-m13-host-only-evidence.json
          retention-days: 14
