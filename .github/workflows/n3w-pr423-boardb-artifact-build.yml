name: N3W PR423 Board B exact-main artifact build

on:
  push:
    branches:
      - build/n3w-pr423-boardb-artifact-20260917

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main repair commit
        uses: actions/checkout@v4
        with:
          ref: 35944fa928bb1fcf5527e476fb5dbfcfcdc11ead
          fetch-depth: 1

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "35944fa928bb1fcf5527e476fb5dbfcfcdc11ead"
          test "$(git rev-parse HEAD^{tree})" = "e20f6c7c539ae07fc6a0fef017f2e94ccaf6f49c"
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact ESPHome
        run: python -m pip install --disable-pip-version-check 'esphome==2026.4.3'

      - name: Compile exact-main physical harness
        shell: bash
        run: |
          set -euo pipefail
          cd firmware/esphome_rc/board_lab/n3w_phase4_physical
          python -m esphome compile generic.yml

      - name: Freeze Board B write artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/firmware/esphome_rc/board_lab/n3w_phase4_physical/.esphome/build/gh-n3w-phase4-generic"
          ENV="$ROOT/.pioenvs/gh-n3w-phase4-generic"
          APP="$ENV/firmware.bin"
          OTA="$ROOT/ota_data_initial.bin"
          test -f "$APP"
          test -f "$OTA"
          mkdir -p "$GITHUB_WORKSPACE/boardb-artifact"
          cp "$APP" "$GITHUB_WORKSPACE/boardb-artifact/firmware.bin"
          cp "$OTA" "$GITHUB_WORKSPACE/boardb-artifact/ota_data_initial.bin"
          {
            echo 'SOURCE_HEAD=35944fa928bb1fcf5527e476fb5dbfcfcdc11ead'
            echo 'SOURCE_TREE=e20f6c7c539ae07fc6a0fef017f2e94ccaf6f49c'
            echo 'ESPHOME_VERSION=2026.4.3'
            stat -c 'APPLICATION_SIZE=%s' "$APP"
            stat -c 'OTADATA_SIZE=%s' "$OTA"
            sha256sum "$APP" | awk '{print "APPLICATION_SHA256=" $1}'
            sha256sum "$OTA" | awk '{print "OTADATA_SHA256=" $1}'
          } | tee "$GITHUB_WORKSPACE/boardb-artifact/MANIFEST.txt"

      - name: Upload exact-main Board B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n3w-pr423-boardb-exact-main
          path: boardb-artifact/
          if-no-files-found: error
          retention-days: 7
