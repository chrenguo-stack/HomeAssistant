name: N3-W Product Completion S2 host-only core CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s2-hostonly-core-ci.yml'
      - 'docs/decisions/n3w-product-completion-s1-contract-freeze-20260814.json'
      - 'docs/decisions/n3w-product-completion-s2-hostonly-core-stage-entry-20260814.json'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_core/**'
      - 'tests/n3w_product_completion_s2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-only-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exact base and S2 scope gate
        shell: bash
        run: |
          set -euo pipefail
          base='c671c994064658e93321917c1efc75663ad65781'
          test "$(git merge-base "$base" HEAD)" = "$base"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$base"
          fi

          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s2-hostonly-core-ci.yml
          docs/decisions/n3w-product-completion-s1-contract-freeze-20260814.json
          docs/decisions/n3w-product-completion-s2-hostonly-core-stage-entry-20260814.json
          firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.h
          tests/n3w_product_completion_s2/n3w_product_core_host_test.cpp
          tests/n3w_product_completion_s2/test_n3w_product_s2_contract.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$base"...HEAD | sort >"$actual"
          test "$(wc -l <"$actual")" -eq 7
          diff -u "$allowed" "$actual"

      - name: Install host test dependency
        run: python -m pip install pytest

      - name: Validate decision records
        run: |
          python -m json.tool docs/decisions/n3w-product-completion-s1-contract-freeze-20260814.json >/dev/null
          python -m json.tool docs/decisions/n3w-product-completion-s2-hostonly-core-stage-entry-20260814.json >/dev/null

      - name: Run host C++ product core tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            tests/n3w_product_completion_s2/n3w_product_core_host_test.cpp \
            -o /tmp/n3w_product_completion_s2_host_test
          /tmp/n3w_product_completion_s2_host_test

      - name: Run product contract tests
        run: pytest -q tests/n3w_product_completion_s2/test_n3w_product_s2_contract.py

      - name: Host-only safety boundary gate
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            firmware/esphome_rc/components/greenhouse_n3w_product_core
            docs/decisions/n3w-product-completion-s1-contract-freeze-20260814.json
            docs/decisions/n3w-product-completion-s2-hostonly-core-stage-entry-20260814.json
          )
          if grep -R -n -E \
            '(esphome run|esptool|espota|pio run .*upload|PATH DIRECT|PATH RELAY|GH_N3W_RUNTIME_ENABLED=true)' \
            "${paths[@]}"; then
            echo 'Physical execution, manual path control, or runtime activation token detected'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          s1 = json.loads(Path(
              'docs/decisions/n3w-product-completion-s1-contract-freeze-20260814.json'
          ).read_text())
          s2 = json.loads(Path(
              'docs/decisions/n3w-product-completion-s2-hostonly-core-stage-entry-20260814.json'
          ).read_text())
          assert s1['status'] == 'FROZEN'
          assert len(s1['contracts']) == 8
          assert s1['acceptance']['physical_t1_required'] is True
          assert s2['mode'] == 'HOST_ONLY_CORE_DEVELOPMENT'
          assert s2['dependency']['existing_n3w_protocol_reliability_baseline_preserved'] is True
          assert all(value is False for value in s2['safety_boundary'].values())
          PY
