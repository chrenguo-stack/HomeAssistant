name: N3-W Product Completion S3 disconnected ESP-NOW runtime CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s3-disconnected-espnow-runtime-ci.yml'
      - 'docs/decisions/n3w-product-completion-s3-disconnected-espnow-runtime-stage-entry-20260814.json'
      - 'firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.h'
      - 'firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_runtime/**'
      - 'tests/n3w_product_completion_s3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disconnected-espnow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: S3 lineage gate
        shell: bash
        run: |
          set -euo pipefail
          s3_candidate='8340abe2aa1b73b9069ad4008d1cdae314c19745'
          git merge-base --is-ancestor "$s3_candidate" HEAD
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
          fi

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          python -m pip install pytest

      - name: Validate S3 decision record
        run: python -m json.tool docs/decisions/n3w-product-completion-s3-disconnected-espnow-runtime-stage-entry-20260814.json >/dev/null

      - name: Run S3 product contract tests
        run: pytest -q tests/n3w_product_completion_s3/test_n3w_product_s3_contract.py

      - name: Run C++ disconnected discovery runtime tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/n3w_include/esphome
          ln -s "$GITHUB_WORKSPACE/firmware/esphome_rc/components" /tmp/n3w_include/esphome/components
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp \
            tests/n3w_product_completion_s3/n3w_product_runtime_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_product_completion_s3_host_test
          /tmp/n3w_product_completion_s3_host_test

      - name: S3 safety and layering gate
        shell: bash
        run: |
          set -euo pipefail
          scope=(
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime
            docs/decisions/n3w-product-completion-s3-disconnected-espnow-runtime-stage-entry-20260814.json
          )
          if grep -R -n -E \
            '(esphome run|esptool|espota|pio run .*upload|PATH DIRECT|PATH RELAY|GH_N3W_RUNTIME_ENABLED=true)' \
            "${scope[@]}"; then
            echo 'Physical execution, manual path control, or product activation token detected'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('docs/decisions/n3w-product-completion-s3-disconnected-espnow-runtime-stage-entry-20260814.json')
          d = json.loads(p.read_text())
          assert d['baseline']['main_sha'] == 'e8c9d3aeb4be8918b17226e52e2e098e5daf45f9'
          assert d['scope']['disconnected_scan'] is True
          assert d['scope']['dynamic_advertisement'] is True
          assert d['security_boundary']['advertisement_is_trusted_identity'] is False
          assert d['security_boundary']['manager_authorization_required_before_peer_activation'] is True
          assert d['security_boundary']['runtime_generates_pairwise_lmk'] is False
          assert all(value is False for value in d['execution_boundary'].values())
          PY

  esp32-c6-driver-compile:
    needs: disconnected-espnow-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen ESPHome
        run: python -m pip install --upgrade 'esphome==2026.4.3'

      - name: Validate compile-only ESP32-C6 radio target
        run: |
          esphome config \
            firmware/esphome_rc/board_lab/n3w_p4b_espnow_runtime/n3w_p4b_espnow_runtime.yml

      - name: Compile modified ESP-NOW driver for ESP32-C6
        run: |
          esphome compile \
            firmware/esphome_rc/board_lab/n3w_p4b_espnow_runtime/n3w_p4b_espnow_runtime.yml
