name: N3-W Product Completion S4 Manager Registration CI

on:
  pull_request:
    paths:
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_peer_authorization.py'
      - 'host/greenhouse-manager/tests/runtime/test_n3w_product_peer_authorization.py'
      - 'docs/decisions/n3w-product-completion-s4-manager-registration-integration-20260814.json'
      - '.github/workflows/n3w-product-completion-s4-manager-registration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-registration-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact base and S4 scope gate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='8020194edfeea03a52466e83cb3071de54afbd48'
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          test "$BASE" = "$EXPECTED_BASE"
          mapfile -t CHANGED < <(git diff --name-only "$EXPECTED_BASE"...HEAD | sort)
          printf '%s\n' "${CHANGED[@]}"
          EXPECTED=(
            '.github/workflows/n3w-product-completion-s4-manager-registration-ci.yml'
            'docs/decisions/n3w-product-completion-s4-manager-registration-integration-20260814.json'
            'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_peer_authorization.py'
            'host/greenhouse-manager/tests/runtime/test_n3w_product_peer_authorization.py'
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#CHANGED[@]}" -eq "${#EXPECTED_SORTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${CHANGED[@]}")

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Manager dev dependencies
        run: python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Validate S4 decision record
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/decisions/n3w-product-completion-s4-manager-registration-integration-20260814.json')
          doc = json.loads(path.read_text())
          assert doc['authorization'] == 'D1-N3W-PRODUCT-COMPLETION-SUCCESSOR-S4-MANAGER-REGISTRATION-INTEGRATION-20260814-01'
          assert doc['base_sha'] == '8020194edfeea03a52466e83cb3071de54afbd48'
          assert doc['authorized'] is True
          assert doc['frozen_invariants']['factory_fixed_peer_information'] is False
          assert doc['frozen_invariants']['system_wide_shared_lmk'] is False
          assert doc['frozen_invariants']['static_gateway_node_pair_grant_required'] is False
          assert doc['frozen_invariants']['manager_is_membership_authority'] is True
          assert doc['final_product_acceptance']['physical_t1_required'] is True
          PY

      - name: Run S4 focused runtime tests
        working-directory: host/greenhouse-manager
        run: python -m pytest -q tests/runtime/test_n3w_product_peer_authorization.py

      - name: Ruff S4 implementation and tests
        working-directory: host/greenhouse-manager
        run: >-
          python -m ruff check --output-format=github
          src/greenhouse_manager/runtime/n3w_product_peer_authorization.py
          tests/runtime/test_n3w_product_peer_authorization.py

      - name: S4 no-static-peer and no-live boundary gate
        shell: bash
        run: |
          set -euo pipefail
          FILE='host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_peer_authorization.py'
          ! grep -E 'n3w_relay_gateway_nodes|peer_mac|PATH[[:space:]]+(DIRECT|RELAY)' "$FILE"
          ! grep -E 'subprocess|esptool|serial|/dev/tty|mosquitto_pub|docker[[:space:]]+(restart|stop|rm)' "$FILE"
          grep -q 'RegistrationRegistry' "$FILE"
          grep -q 'CredentialLifecycleStore' "$FILE"
          grep -q 'X25519' "$FILE"
          grep -q 'HKDF' "$FILE"
