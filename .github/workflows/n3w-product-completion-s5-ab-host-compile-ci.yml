name: N3-W Product Completion S5 A/B host compile CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s5-ab-host-compile-ci.yml'
      - 'docs/decisions/n3w-product-completion-s5-ab-host-compile-implementation-20260814.json'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_runtime/**'
      - 'tests/n3w_product_completion_s5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-s5-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen S5-A/B checkpoint and successor lineage
        shell: bash
        run: |
          set -euo pipefail
          checkpoint='41154e532c4ba00e3c0e4ef86d79b6c8824247fe'
          ab_head='37b1bc49998c6e1235788f078cb7936d6d9da35c'
          main='38c3b692d4ebe90d0040c732b6c0313fdfdc1ef6'
          git merge-base --is-ancestor "$checkpoint" "$ab_head"
          git merge-base --is-ancestor "$ab_head" HEAD
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$main"
          fi

          # Freeze the A/B implementation itself exactly once. Authorized
          # successors are governed by their own stage-specific scope gate;
          # this workflow remains a regression gate against the current HEAD.
          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-ab-host-compile-ci.yml
          docs/decisions/n3w-product-completion-s5-ab-host-compile-implementation-20260814.json
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.h
          tests/n3w_product_completion_s5/n3w_product_peer_handshake_wire_host_test.cpp
          tests/n3w_product_completion_s5/n3w_product_peer_security_host_test.cpp
          tests/n3w_product_completion_s5/n3w_product_s5_peer_coordinator_host_test.cpp
          tests/n3w_product_completion_s5/n3w_product_s5_radio_mux_host_test.cpp
          tests/n3w_product_completion_s5/test_s5_cross_language_vector.py
          tests/n3w_product_completion_s5/test_s5_manager_authorization_loop.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$checkpoint"..."$ab_head" | sort >"$actual"
          diff -u "$allowed" "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev libssl-dev
          python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Validate authorization record and frozen product invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/decisions/n3w-product-completion-s5-ab-host-compile-implementation-20260814.json')
          data = json.loads(path.read_text())
          assert data['authorization'] == 'D1-N3W-PRODUCT-COMPLETION-SUCCESSOR-S5-AB-HOST-COMPILE-IMPLEMENTATION-20260814-01'
          assert data['authorized'] is True
          assert data['status'] == 'AUTHORIZED_IN_PROGRESS'
          assert data['checkpoint_head_sha'] == '41154e532c4ba00e3c0e4ef86d79b6c8824247fe'
          invariants = data['required_invariants']
          assert invariants['s4_manager_is_only_authorization_authority'] is True
          assert invariants['advertisement_is_untrusted_hint_only'] is True
          assert invariants['manager_generates_or_distributes_lmk'] is False
          assert invariants['each_endpoint_verifies_its_own_manager_grant'] is True
          assert invariants['each_endpoint_derives_lmk_independently'] is True
          assert invariants['factory_peer_mac_node_id_gateway_id_or_lmk'] is False
          assert 'flash' in data['explicitly_not_authorized']
          assert 'espnow_rf_execution' in data['explicitly_not_authorized']
          assert 'wifi_connection' in data['explicitly_not_authorized']
          assert 'n3l' in data['explicitly_not_authorized']
          PY
          pytest -q tests/n3w_product_completion_s5/test_n3w_product_s5_contract.py

      - name: Run actual Manager authorization and cross-language vectors
        run: |
          pytest -q \
            tests/n3w_product_completion_s5/test_s5_cross_language_vector.py \
            tests/n3w_product_completion_s5/test_s5_manager_authorization_loop.py

      - name: Prepare host include tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/n3w_include/esphome
          ln -s "$GITHUB_WORKSPACE/firmware/esphome_rc/components" /tmp/n3w_include/esphome/components

      - name: Compile and run endpoint crypto contract
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp \
            tests/n3w_product_completion_s5/n3w_product_peer_security_host_test.cpp \
            -lmbedcrypto -lcrypto \
            -o /tmp/n3w_s5_peer_security
          /tmp/n3w_s5_peer_security

      - name: Compile and run provisional handshake wire contract
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.cpp \
            tests/n3w_product_completion_s5/n3w_product_peer_handshake_wire_host_test.cpp \
            -lmbedcrypto -lcrypto \
            -o /tmp/n3w_s5_peer_handshake
          /tmp/n3w_s5_peer_handshake

      - name: Compile and run S5 callback mux contract
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp \
            tests/n3w_product_completion_s5/n3w_product_s5_radio_mux_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_s5_radio_mux
          /tmp/n3w_s5_radio_mux

      - name: Compile and run advertisement to Manager-grant peer establishment contract
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp \
            tests/n3w_product_completion_s5/n3w_product_s5_peer_coordinator_host_test.cpp \
            -lmbedcrypto -lcrypto \
            -o /tmp/n3w_s5_peer_coordinator
          /tmp/n3w_s5_peer_coordinator

      - name: No-live and no-static-peer safety gate
        shell: bash
        run: |
          set -euo pipefail
          scope=(
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.h
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.h
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.h
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.h
          )
          if grep -R -n -E \
            '(esphome[[:space:]]+run|esptool|espota|pio[[:space:]]+run.*upload|esp_wifi_connect\(|GH_MQTT_PASSWORD|wifi_ssid|wifi_password)' \
            "${scope[@]}"; then
            echo 'Live execution, Wi-Fi connection, or site secret material detected in S5-A/B implementation'
            exit 1
          fi
