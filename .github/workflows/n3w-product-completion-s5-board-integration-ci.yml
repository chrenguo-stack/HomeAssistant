name: N3-W Product Completion S5 board integration CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s3-disconnected-espnow-runtime-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-board-integration-ci.yml'
      - 'docs/decisions/n3w-product-completion-s5-two-board-isolated-physical-20260814.json'
      - 'firmware/esphome_rc/board_lab/n3w_product_completion_s5/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_core/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_runtime/**'
      - 'tests/n3w_product_completion_s3/n3w_product_runtime_host_test.cpp'
      - 'tests/n3w_product_completion_s5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-s5-board-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: S5 lineage and scope boundary
        shell: bash
        run: |
          set -euo pipefail
          # S5 is an inherited lineage/scope contract. Later successor work may
          # intentionally remain stacked on the frozen S5 R7 branch, so ancestry
          # is the durable gate rather than requiring every PR to target main.
          base='38c3b692d4ebe90d0040c732b6c0313fdfdc1ef6'
          git merge-base --is-ancestor "$base" HEAD

          if git diff --name-only "$base"...HEAD | grep -E \
            '(^|/)(secrets\.ya?ml|.*\.bin|.*\.elf|.*\.map)$'; then
            echo 'Secret or rendered firmware artifact detected in S5 scope'
            exit 1
          fi

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          python -m pip install pytest

      - name: Validate decision record and S5 contracts
        run: |
          python -m json.tool \
            docs/decisions/n3w-product-completion-s5-two-board-isolated-physical-20260814.json \
            >/dev/null
          pytest -q tests/n3w_product_completion_s5/test_n3w_product_s5_contract.py

      - name: Run S3/S4 Manager integration host tests
        shell: bash
        run: |
          set -euo pipefail
          # Host-only shim: production ESPHome provides this header.
          # The shim exists only under /tmp and never enters firmware.
          mkdir -p /tmp/n3w_include/esphome/core
          ln -s "$GITHUB_WORKSPACE/firmware/esphome_rc/components" /tmp/n3w_include/esphome/components
          cat >/tmp/n3w_include/esphome/core/log.h <<'N3W_HOST_LOG_H'
          #pragma once
          namespace esphome {
          namespace n3w_host_log_stub {
          template<typename... Args>
          inline void consume(Args&&...) {}
          }  // namespace n3w_host_log_stub
          }  // namespace esphome
          #define ESP_LOGE(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGW(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGI(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGD(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGV(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGVV(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGCONFIG(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          N3W_HOST_LOG_H
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Wno-error=unused-const-variable \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp \
            tests/n3w_product_completion_s3/n3w_product_runtime_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_product_completion_s5_host_test
          /tmp/n3w_product_completion_s5_host_test

  esp32-c6-board-compile:
    needs: integration-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        role: [child, relay]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen ESPHome
        run: python -m pip install --upgrade 'esphome==2026.4.3'

      - name: Validate and compile ESP32-C6 ${{ matrix.role }} target
        env:
          S5_BUILD_PATH: /tmp/n3w-s5-${{ matrix.role }}-build
        run: |
          esphome config \
            firmware/esphome_rc/board_lab/n3w_product_completion_s5/${{ matrix.role }}.yml
          esphome compile \
            firmware/esphome_rc/board_lab/n3w_product_completion_s5/${{ matrix.role }}.yml
