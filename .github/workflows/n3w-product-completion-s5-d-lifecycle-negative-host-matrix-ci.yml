name: N3-W Product Completion S5 D lifecycle negative host matrix CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s5-c-isolated-manager-telemetry-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml'
      - 'docs/decisions/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-20260814.json'
      - 'docs/decisions/n3w-product-completion-s5-full-two-board-isolated-physical-e2e-preparation-20260814.json'
      - 'docs/decisions/n3w-product-completion-s5-isolated-manager-transport-host-compile-20260814.json'
      - 'docs/decisions/n3w-product-completion-s5-private-runtime-composition-20260815.json'
      - 'docs/decisions/n3w-product-completion-s5-private-package-render-build-binding-host-compile-20260815.json'
      - 'docs/handoffs/温室环境监测系统_N3W_ProductCompletion_S5完整双板隔离物理E2E准备合同_V1.0_20260814.md'
      - 'tools/n3w_product_s5_prepare_physical_package.py'
      - 'tools/n3w_product_s5_build_private_package.py'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_core/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_product_runtime/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/**'
      - 'firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/**'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_authority_time.py'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_mqtt_service.py'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_app.py'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_launcher.py'
      - 'tests/n3w_product_completion_s5/**'
      - 'tests/n3w_product_completion_s5_transport/**'
      - 'tests/n3w_product_completion_s5_private_runtime/**'
      - 'tests/n3w_product_completion_s5_package/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-s5-d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-negative-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorized S5-D checkpoint and exact successor scope
        shell: bash
        run: |
          set -euo pipefail
          start='259670af65f3a5fdd9209e78bf06ce3d57972a71'
          checkpoint='660acf72b701d9ff8e3a881e97e5d15357286786'
          archive='f530ee94e5d5339e0f30b902f6f41c83b8408f13'
          base='38c3b692d4ebe90d0040c732b6c0313fdfdc1ef6'
          git merge-base --is-ancestor "$start" "$checkpoint"
          git merge-base --is-ancestor "$checkpoint" "$archive"
          git merge-base --is-ancestor "$archive" HEAD
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = "$base"
          fi
          git config core.quotePath false

          frozen_allowed="$(mktemp)"
          frozen_actual="$(mktemp)"
          cat >"$frozen_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-c-isolated-manager-telemetry-ci.yml
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          docs/decisions/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-20260814.json
          firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_telemetry.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_telemetry.h
          tests/n3w_product_completion_s5/n3w_product_s5_peer_coordinator_host_test.cpp
          tests/n3w_product_completion_s5/n3w_product_s5_telemetry_host_test.cpp
          tests/n3w_product_completion_s5/test_s5_manager_authorization_loop.py
          FILES
          sed -i 's/^          //' "$frozen_allowed"
          sort -o "$frozen_allowed" "$frozen_allowed"
          git diff --name-only "$start"..."$checkpoint" | sort >"$frozen_actual"
          diff -u "$frozen_allowed" "$frozen_actual"

          successor_allowed="$(mktemp)"
          successor_actual="$(mktemp)"
          cat >"$successor_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          docs/decisions/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-20260814.json
          docs/decisions/n3w-product-completion-s5-full-two-board-isolated-physical-e2e-preparation-20260814.json
          docs/decisions/n3w-product-completion-s5-isolated-manager-transport-host-compile-20260814.json
          docs/decisions/n3w-product-completion-s5-private-package-render-build-binding-host-compile-20260815.json
          docs/decisions/n3w-product-completion-s5-private-runtime-composition-20260815.json
          docs/handoffs/温室环境监测系统_N3W_ProductCompletion_S5完整双板隔离物理E2E准备合同_V1.0_20260814.md
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/child_private_runtime_compile.yml
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/relay_private_runtime_compile.yml
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/transport_compile/relay_manager_transport_compile.yml
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/greenhouse_n3w_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/greenhouse_n3w_s5_private_runtime.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_runtime.cpp
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_authority_time.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_app.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_launcher.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_mqtt_service.py
          tests/n3w_product_completion_s5/test_s5_physical_e2e_preparation.py
          tests/n3w_product_completion_s5_package/test_s5_private_package_builder.py
          tests/n3w_product_completion_s5_private_runtime/test_s5_private_runtime_composition.py
          tests/n3w_product_completion_s5_transport/n3w_product_s5_manager_transport_host_test.cpp
          tests/n3w_product_completion_s5_transport/test_s5_isolated_manager_transport.py
          tools/n3w_product_s5_build_private_package.py
          tools/n3w_product_s5_prepare_physical_package.py
          FILES
          sed -i 's/^          //' "$successor_allowed"
          sort -o "$successor_allowed" "$successor_allowed"
          git diff --name-only "$checkpoint"..."$archive" | sort >"$successor_actual"
          diff -u "$successor_allowed" "$successor_actual"

      - name: R6 immutable successor exact scope
        shell: bash
        run: |
          set -euo pipefail
          archive='f530ee94e5d5339e0f30b902f6f41c83b8408f13'
          r6='39816fcbf2d8fa7942a68d22fc738e2defef89cc'
          git merge-base --is-ancestor "$archive" "$r6"
          git merge-base --is-ancestor "$r6" HEAD
          git config core.quotePath false
          r6_successor_allowed="$(mktemp)"
          r6_successor_actual="$(mktemp)"
          cat >"$r6_successor_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s3-disconnected-espnow-runtime-ci.yml
          .github/workflows/n3w-product-completion-s5-ab-host-compile-ci.yml
          .github/workflows/n3w-product-completion-s5-board-integration-ci.yml
          .github/workflows/n3w-product-completion-s5-c-isolated-manager-telemetry-ci.yml
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          docs/decisions/n3w-product-completion-s5-dedicated-two-node-state-initializer-hostonly-20260815.json
          firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp
          firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.h
          infra/compose/n3w-p5-two-board-isolated/acl
          tests/n3w_product_completion_s5/test_n3w_product_s5_contract.py
          tests/n3w_product_completion_s5_initializer/test_s5_dedicated_two_node_state_initializer.py
          tests/n3w_product_completion_s5_transport/n3w_product_s5_manager_transport_host_test.cpp
          tools/n3w_product_s5_initialize_dedicated_two_node_state.py
          tools/n3w_product_s5_render_private_acl.py
          FILES
          sed -i 's/^          //' "$r6_successor_allowed"
          sort -o "$r6_successor_allowed" "$r6_successor_allowed"
          git diff --name-only "$archive"..."$r6" | sort >"$r6_successor_actual"
          diff -u "$r6_successor_allowed" "$r6_successor_actual"

      - name: R7 telemetry stimulus and CI repair exact scope
        shell: bash
        run: |
          set -euo pipefail
          r6='39816fcbf2d8fa7942a68d22fc738e2defef89cc'
          implementation='6dcb0cc9e336db777e704065834d162b7a20b424'
          git merge-base --is-ancestor "$r6" "$implementation"
          git merge-base --is-ancestor "$implementation" HEAD
          git config core.quotePath false
          implementation_allowed="$(mktemp)"
          implementation_actual="$(mktemp)"
          cat >"$implementation_allowed" <<'FILES'
          docs/decisions/n3w-product-completion-s5-r7-private-physical-telemetry-stimulus-host-compile-20260815.json
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/child_private_runtime_compile.yml
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/greenhouse_n3w_s5_private_runtime.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_runtime.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus.h
          tests/n3w_product_completion_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus_host_test.cpp
          FILES
          sed -i 's/^          //' "$implementation_allowed"
          sort -o "$implementation_allowed" "$implementation_allowed"
          git diff --name-only "$r6"..."$implementation" | sort >"$implementation_actual"
          diff -u "$implementation_allowed" "$implementation_actual"

          ci_allowed="$(mktemp)"
          ci_actual="$(mktemp)"
          cat >"$ci_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          FILES
          sed -i 's/^          //' "$ci_allowed"
          sort -o "$ci_allowed" "$ci_allowed"
          git diff --name-only "$implementation"...HEAD | sort >"$ci_actual"
          diff -u "$ci_allowed" "$ci_actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev libssl-dev
          python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: Validate authorization and frozen product boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/decisions/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-20260814.json')
          d = json.loads(p.read_text())
          assert d['authorization'] == 'D1-N3W-PRODUCT-COMPLETION-SUCCESSOR-S5-D-LIFECYCLE-NEGATIVE-HOST-MATRIX-20260814-01'
          assert d['authorized'] is True
          assert d['starting_head'] == '259670af65f3a5fdd9209e78bf06ce3d57972a71'
          assert d['scope']['authorization_id_bound_explicit_revoke'] is True
          assert d['scope']['gateway_bound_relayframe_not_rehomed'] is True
          assert d['scope']['manager_epoch_request_freshness'] is True
          assert d['scope']['endpoint_monotonic_grant_lifetime'] is True
          assert d['scope']['manager_authority_clock_unavailable_fail_closed'] is True
          assert d['required_invariants']['old_gateway_bound_relayframe_may_move_to_new_relay'] is False
          assert d['required_invariants']['endpoint_monotonic_clock_treated_as_manager_epoch'] is False
          assert d['required_invariants']['grant_absolute_manager_epoch_reused_as_local_runtime_deadline'] is False
          assert d['required_invariants']['wifi_recovery_switchback_in_scope'] is False
          assert d['classification']['s5_full_two_board_e2e'] == 'PENDING'
          PY
          grep -q 'execution_enabled: false' firmware/esphome_rc/board_lab/n3w_product_completion_s5/child.yml
          grep -q 'execution_enabled: false' firmware/esphome_rc/board_lab/n3w_product_completion_s5/relay.yml

      - name: Run Manager replay stale credential and grant negative matrix
        run: |
          python -m pytest -q tests/n3w_product_completion_s5/test_s5_manager_authorization_loop.py

      - name: Prepare host include tree
        shell: bash
        run: |
          set -euo pipefail
          # Host-only shim: production ESPHome provides this header.
          # The shim exists only under /tmp and never enters firmware.
          mkdir -p /tmp/n3w_include/esphome/core
          ln -s "$GITHUB_WORKSPACE/firmware/esphome_rc/components" /tmp/n3w_include/esphome/components
          cat >/tmp/n3w_include/esphome/core/log.h <<'N3W_HOST_LOG_H'
          #pragma once
          namespace esphome {
          namespace n3w_host_log_stub {
          template<typename... Args>
          inline void consume(Args&&...) {}
          }  // namespace n3w_host_log_stub
          }  // namespace esphome
          #define ESP_LOGE(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGW(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGI(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGD(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGV(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGVV(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          #define ESP_LOGCONFIG(...) do { ::esphome::n3w_host_log_stub::consume(__VA_ARGS__); } while (0)
          N3W_HOST_LOG_H
      - name: Compile and run peer lifecycle matrix
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Wno-error=unused-const-variable \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_security.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_peer_handshake_wire.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp \
            tests/n3w_product_completion_s5/n3w_product_s5_peer_coordinator_host_test.cpp \
            -lmbedcrypto -lcrypto \
            -o /tmp/n3w_s5_d_peer_lifecycle
          /tmp/n3w_s5_d_peer_lifecycle

      - name: Compile and run reliable-link cache and gateway-binding matrix
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I/tmp/n3w_include \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_core \
            -Ifirmware/esphome_rc/components/greenhouse_n3w_product_runtime \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_core.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_core/n3w_radio.cpp \
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_telemetry.cpp \
            tests/n3w_product_completion_s5/n3w_product_s5_telemetry_host_test.cpp \
            -lmbedcrypto \
            -o /tmp/n3w_s5_d_telemetry_lifecycle
          /tmp/n3w_s5_d_telemetry_lifecycle

      - name: S5-C and isolated Manager regression
        run: |
          python -m pytest -q \
            tests/n3w_product_completion_s5/test_s5_isolated_manager_telemetry.py \
            tests/n3w_product_completion_s5/test_s5_cross_language_vector.py

      - name: No-live no-static-peer no-switchback safety gate
        shell: bash
        run: |
          set -euo pipefail
          scope=(
            firmware/esphome_rc/components/greenhouse_n3w_product_core/n3w_product_core.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_runtime.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_peer_coordinator.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
            firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_telemetry.cpp
