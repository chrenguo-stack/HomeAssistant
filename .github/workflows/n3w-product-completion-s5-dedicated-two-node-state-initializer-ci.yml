name: N3-W Product Completion S5 dedicated two-node state initializer CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml'
      - 'tests/n3w_product_completion_s5_initializer/**'
      - 'tools/n3w_product_s5_initialize_dedicated_two_node_state.py'
      - 'docs/decisions/n3w-product-completion-s5-dedicated-two-node-state-initializer-hostonly-20260815.json'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  hostonly-synthetic-initializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authorized exact successor scope
        shell: bash
        run: |
          set -euo pipefail
          START=f530ee94e5d5339e0f30b902f6f41c83b8408f13
          ARCHIVE=d30f4999235619bd545f166ff27d11941aacdd7c
          AUTH='D1-N3W-PRODUCT-COMPLETION-SUCCESSOR-S5-DEDICATED-TWO-NODE-STATE-INITIALIZER-HOSTONLY-CONTRACT-AND-SYNTHETIC-VALIDATION-20260815-01'
          git merge-base --is-ancestor "$START" "$ARCHIVE"
          git merge-base --is-ancestor "$ARCHIVE" HEAD
          git diff --name-only "$START"..."$ARCHIVE" | while read -r f; do
            case "$f" in
              .github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml|\
              tests/n3w_product_completion_s5_initializer/test_s5_dedicated_two_node_state_initializer.py|\
              tools/n3w_product_s5_initialize_dedicated_two_node_state.py|\
              docs/decisions/n3w-product-completion-s5-dedicated-two-node-state-initializer-hostonly-20260815.json) ;;
              *) echo "unauthorized successor file: $f"; exit 1 ;;
            esac
          done
          AUTH="$AUTH" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          path = Path('tools/n3w_product_s5_initialize_dedicated_two_node_state.py')
          spec = importlib.util.spec_from_file_location('s5_initializer_auth', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.AUTHORIZATION == os.environ['AUTH']
          print('S5_INITIALIZER_AUTHORIZATION_BINDING=PASS')
          PY

      - name: R6 immutable successor exact scope
        shell: bash
        run: |
          set -euo pipefail
          archive='d30f4999235619bd545f166ff27d11941aacdd7c'
          r6='39816fcbf2d8fa7942a68d22fc738e2defef89cc'
          git merge-base --is-ancestor "$archive" "$r6"
          git merge-base --is-ancestor "$r6" HEAD
          git config core.quotePath false
          r6_successor_allowed="$(mktemp)"
          r6_successor_actual="$(mktemp)"
          cat >"$r6_successor_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s3-disconnected-espnow-runtime-ci.yml
          .github/workflows/n3w-product-completion-s5-ab-host-compile-ci.yml
          .github/workflows/n3w-product-completion-s5-board-integration-ci.yml
          .github/workflows/n3w-product-completion-s5-c-isolated-manager-telemetry-ci.yml
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.cpp
          firmware/esphome_rc/components/greenhouse_n3w_core/n3w_espnow_driver.h
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.cpp
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_s5_radio_mux.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.h
          infra/compose/n3w-p5-two-board-isolated/acl
          tests/n3w_product_completion_s5/test_n3w_product_s5_contract.py
          tests/n3w_product_completion_s5_transport/n3w_product_s5_manager_transport_host_test.cpp
          tools/n3w_product_s5_render_private_acl.py
          FILES
          sed -i 's/^          //' "$r6_successor_allowed"
          sort -o "$r6_successor_allowed" "$r6_successor_allowed"
          git diff --name-only "$archive"..."$r6" | sort >"$r6_successor_actual"
          diff -u "$r6_successor_allowed" "$r6_successor_actual"

      - name: R7 telemetry stimulus and CI repair exact scope
        shell: bash
        run: |
          set -euo pipefail
          r6='39816fcbf2d8fa7942a68d22fc738e2defef89cc'
          implementation='6dcb0cc9e336db777e704065834d162b7a20b424'
          git merge-base --is-ancestor "$r6" "$implementation"
          git merge-base --is-ancestor "$implementation" HEAD
          git config core.quotePath false
          implementation_allowed="$(mktemp)"
          implementation_actual="$(mktemp)"
          cat >"$implementation_allowed" <<'FILES'
          docs/decisions/n3w-product-completion-s5-r7-private-physical-telemetry-stimulus-host-compile-20260815.json
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/child_private_runtime_compile.yml
          firmware/esphome_rc/components/greenhouse_n3w_product_runtime/n3w_product_integration.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/greenhouse_n3w_s5_private_runtime.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_runtime.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus.h
          tests/n3w_product_completion_s5_private_runtime/n3w_product_s5_private_telemetry_stimulus_host_test.cpp
          FILES
          sed -i 's/^          //' "$implementation_allowed"
          sort -o "$implementation_allowed" "$implementation_allowed"
          git diff --name-only "$r6"..."$implementation" | sort >"$implementation_actual"
          diff -u "$implementation_allowed" "$implementation_actual"

          ci_allowed="$(mktemp)"
          ci_actual="$(mktemp)"
          cat >"$ci_allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-dedicated-two-node-state-initializer-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          FILES
          sed -i 's/^          //' "$ci_allowed"
          sort -o "$ci_allowed" "$ci_allowed"
          git diff --name-only "$implementation"...HEAD | sort >"$ci_actual"
          diff -u "$ci_allowed" "$ci_actual"

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Host-only unit contract
        run: python tests/n3w_product_completion_s5_initializer/test_s5_dedicated_two_node_state_initializer.py -v
      - name: Materialize disposable synthetic closure
        env:
          FIXTURE: ${{ runner.temp }}/s5-fixture.json
          OUTPUT: ${{ runner.temp }}/s5-state
        run: |
          set -euo pipefail; umask 077; rm -rf "$OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          def mac(*octets):
              return ':'.join(octets)
          v={"schema":"gh.n3w-product-s5-dedicated-two-node-state-synthetic/1","synthetic_only":True,
             "synthetic_marker":"S5-SYNTHETIC-ONLY-NOT-REAL-CREDENTIALS","system_id":"system001",
             "child":{"role":"child","hardware_id":"ghw-s5child-021122334455","pairing_id":"pair_child_0001","pairing_epoch":7,"node_id":"node_child01","credential_generation":7,"key_epoch":9,"application_key_hex":"81"*32,"local_mac":mac("02","11","22","33","44","55"),"capabilities":["telemetry","n3w-product-relay"]},
             "relay":{"role":"relay","hardware_id":"ghw-s5relay-02aabbccddee","pairing_id":"pair_relay_0001","pairing_epoch":11,"node_id":"node_relay01","credential_generation":11,"key_epoch":13,"application_key_hex":"a1"*32,"local_mac":mac("02","aa","bb","cc","dd","ee"),"capabilities":["telemetry","n3w-product-relay"]}}
          p=Path(os.environ['FIXTURE']); p.write_text(json.dumps(v)); p.chmod(0o600)
          PY
          python tools/n3w_product_s5_initialize_dedicated_two_node_state.py --fixture "$FIXTURE" --output "$OUTPUT"
      - name: Exact package-builder compatibility
        env: {OUTPUT: '${{ runner.temp }}/s5-state'}
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT']); p=Path('tools/n3w_product_s5_build_private_package.py')
          spec=importlib.util.spec_from_file_location('builder',p); b=importlib.util.module_from_spec(spec); spec.loader.exec_module(b)
          c=b._load_credentials(root/'credentials/child.json','child_credentials')
          r=b._load_credentials(root/'credentials/relay.json','relay_credentials')
          x=b._validate_minimal_manager_snapshot_source(root/'manager_state',c,r)
          assert x['minimal_snapshot_verified'] is True
          assert x['target_node_ids']==['node_child01','node_relay01']
          assert x['required_key_files']==['child.key','relay.key']
          print('S5_INITIALIZER_BUILDER_COMPATIBILITY=PASS')
          PY
      - name: Install exact-head Manager runtime
        run: python -m pip install --disable-pip-version-check -e host/greenhouse-manager
      - name: Exact-head membership compatibility
        env: {OUTPUT: '${{ runner.temp }}/s5-state'}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from greenhouse_manager.runtime.credential_lifecycle import CredentialLifecycleStore
          from greenhouse_manager.runtime.n3w_product_peer_authorization import ProductNodeApplicationKeyProvider, RegistrationMembershipResolver
          from greenhouse_manager.runtime.registration import RegistrationRegistry
          from greenhouse_manager.runtime.replay_registry import ReplayRegistry
          root=Path(os.environ['OUTPUT']); state=root/'manager_state'
          reg=RegistrationRegistry(state/'registration.sqlite3'); cred=CredentialLifecycleStore(state/'registration.sqlite3')
          keys=ProductNodeApplicationKeyProvider(state/'relay-authorization.sqlite3',state/'relay-keys')
          replay=ReplayRegistry(state/'replay.sqlite3',read_only=True)
          try:
            resolver=RegistrationMembershipResolver(reg,cred,keys,system_id='system001')
            ids=[]
            for role in ('child','relay'):
              v=json.loads((root/f'credentials/{role}.json').read_text())
              m=resolver.resolve(system_id=v['system_id'],node_id=v['node_id'],credential_generation=v['credential_generation'],key_epoch=v['key_epoch'])
              assert m.application_key==bytes.fromhex(v['application_key_hex']); ids.append(m.node_id)
            assert len(set(ids))==2
            print('S5_INITIALIZER_EXACT_HEAD_RUNTIME_MEMBERSHIP=PASS')
          finally:
            replay.close(); keys.close(); cred.close(); reg.close()
          PY
      - name: Product-neutral/no-static-gateway/no-live gate
        env: {OUTPUT: '${{ runner.temp }}/s5-state'}
        run: |
          python - <<'PY'
          import ast,json,os,sqlite3
          from pathlib import Path
          root=Path(os.environ['OUTPUT']); state=root/'manager_state'; tool=Path('tools/n3w_product_s5_initialize_dedicated_two_node_state.py')
          manifest=json.loads((root/'synthetic_manifest.json').read_text())
          assert manifest['synthetic_only'] and not manifest['real_private_state_materialized']
          assert not manifest['static_gateway_relation_present'] and not manifest['pair_lmk_present'] and not manifest['pmk_present']
          db=sqlite3.connect(state/'relay-authorization.sqlite3')
          assert db.execute('select count(*) from n3w_relay_nodes').fetchone()[0]==2
          assert db.execute('select count(*) from n3w_relay_gateway_nodes').fetchone()[0]==0
          assert db.execute('select count(*) from n3w_relay_operations').fetchone()[0]==0; db.close()
          tree=ast.parse(tool.read_text()); imported=set()
          for n in ast.walk(tree):
            if isinstance(n,ast.Import): imported.update(a.name.split('.')[0] for a in n.names)
            elif isinstance(n,ast.ImportFrom) and n.module: imported.add(n.module.split('.')[0])
          assert {'socket','serial','paho','esptool','requests','urllib','subprocess','secrets'}.isdisjoint(imported)
          print('S5_INITIALIZER_PRODUCT_NEUTRAL_NO_LIVE=PASS')
          PY
      - name: Cleanup
        if: always()
        run: rm -rf '${{ runner.temp }}/s5-fixture.json' '${{ runner.temp }}/s5-state'