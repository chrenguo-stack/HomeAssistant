name: N3-W Product Completion S5 physical E2E preparation CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml'
      - '.github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml'
      - 'docs/decisions/n3w-product-completion-s5-full-two-board-isolated-physical-e2e-preparation-20260814.json'
      - 'docs/decisions/n3w-product-completion-s5-isolated-manager-transport-host-compile-20260814.json'
      - 'docs/decisions/n3w-product-completion-s5-private-runtime-composition-20260815.json'
      - 'docs/handoffs/温室环境监测系统_N3W_ProductCompletion_S5完整双板隔离物理E2E准备合同_V1.0_20260814.md'
      - 'tools/n3w_product_s5_prepare_physical_package.py'
      - 'tests/n3w_product_completion_s5/test_s5_physical_e2e_preparation.py'
      - 'tests/n3w_product_completion_s5_transport/**'
      - 'tests/n3w_product_completion_s5_private_runtime/**'
      - 'firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/**'
      - 'firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/**'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_app.py'
      - 'host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_launcher.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorized successor lineage and exact preparation scope
        shell: bash
        run: |
          set -euo pipefail
          START=eb2fdc795850fedd4f49ce3fbba8cd03a4548de9
          git merge-base --is-ancestor "$START" HEAD
          git config core.quotePath false
          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-d-lifecycle-negative-host-matrix-ci.yml
          .github/workflows/n3w-product-completion-s5-isolated-manager-transport-ci.yml
          .github/workflows/n3w-product-completion-s5-physical-e2e-preparation-ci.yml
          .github/workflows/n3w-product-completion-s5-private-runtime-composition-ci.yml
          docs/decisions/n3w-product-completion-s5-full-two-board-isolated-physical-e2e-preparation-20260814.json
          docs/decisions/n3w-product-completion-s5-isolated-manager-transport-host-compile-20260814.json
          docs/decisions/n3w-product-completion-s5-private-runtime-composition-20260815.json
          docs/handoffs/温室环境监测系统_N3W_ProductCompletion_S5完整双板隔离物理E2E准备合同_V1.0_20260814.md
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/child_private_runtime_compile.yml
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/private_runtime_compile/relay_private_runtime_compile.yml
          firmware/esphome_rc/board_lab/n3w_product_completion_s5/transport_compile/relay_manager_transport_compile.yml
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/greenhouse_n3w_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_component.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_transport.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.cpp
          firmware/esphome_rc/components/greenhouse_n3w_s5_manager_transport/n3w_product_s5_manager_wire.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/__init__.py
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/greenhouse_n3w_s5_private_runtime.h
          firmware/esphome_rc/components/greenhouse_n3w_s5_private_runtime/n3w_product_s5_private_runtime.cpp
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_authority_time.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_app.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_launcher.py
          host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_product_isolated_mqtt_service.py
          tests/n3w_product_completion_s5/test_s5_physical_e2e_preparation.py
          tests/n3w_product_completion_s5_private_runtime/test_s5_private_runtime_composition.py
          tests/n3w_product_completion_s5_transport/n3w_product_s5_manager_transport_host_test.cpp
          tests/n3w_product_completion_s5_transport/test_s5_isolated_manager_transport.py
          tools/n3w_product_s5_prepare_physical_package.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only "$START"...HEAD | sort >"$actual"
          diff -u "$allowed" "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run host-only preparation contract
        run: python -m unittest tests.n3w_product_completion_s5.test_s5_physical_e2e_preparation -v

      - name: Static no-live execution gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/n3w_product_s5_prepare_physical_package.py')
          tree = ast.parse(path.read_text())
          forbidden_imports = {'subprocess', 'socket', 'serial', 'paho'}
          imported = set()
          forbidden_calls = {'system', 'popen', 'execv', 'execve', 'spawnv'}
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
          assert forbidden_imports.isdisjoint(imported), imported & forbidden_imports
          assert forbidden_calls.isdisjoint(calls), calls & forbidden_calls
          PY

      - name: Verify physical execution remains unauthorized
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/decisions/n3w-product-completion-s5-full-two-board-isolated-physical-e2e-preparation-20260814.json')
          d = json.loads(p.read_text())
          assert d['authorization'] == 'D1-N3W-PRODUCT-COMPLETION-SUCCESSOR-S5-FULL-TWO-BOARD-ISOLATED-PHYSICAL-E2E-PREPARATION-20260814-01'
          assert d['preparation_scope']['physical_execution_authorized'] is False
          assert d['preparation_scope']['s5_d_successor_ci_lineage_compatibility_only'] is True
          assert d['classification']['s5_full_two_board_e2e'] == 'PENDING'
          for key in ('erase','flash','ota','serial','usb_jtag_board_access','espnow_rf','wifi_connection','real_mqtt_network_e2e','production_t1','pr_merge','release','deployment','n3l'):
              assert d['not_authorized'][key] is True, key
          PY
