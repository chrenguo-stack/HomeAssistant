name: N3-W Product Completion S5 private package render build binding CI

on:
  pull_request:
    paths:
      - '.github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml'
      - 'docs/decisions/n3w-product-completion-s5-private-package-render-build-binding-host-compile-20260815.json'
      - 'tests/n3w_product_completion_s5_package/**'
      - 'tools/n3w_product_s5_build_private_package.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-package-host-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authorized lineage and exact successor scope
        shell: bash
        run: |
          set -euo pipefail
          START=15510ac3dbf3f8639f63e9dfa5146a27b52eb0d0
          git merge-base --is-ancestor "$START" HEAD
          git config core.quotePath false
          actual="$(mktemp)"
          allowed="$(mktemp)"
          git diff --name-only "$START"...HEAD | sort >"$actual"
          cat >"$allowed" <<'FILES'
          .github/workflows/n3w-product-completion-s5-private-package-builder-ci.yml
          docs/decisions/n3w-product-completion-s5-private-package-render-build-binding-host-compile-20260815.json
          tests/n3w_product_completion_s5_package/test_s5_private_package_builder.py
          tools/n3w_product_s5_build_private_package.py
          FILES
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          diff -u "$allowed" "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen ESPHome
        run: python -m pip install --disable-pip-version-check 'esphome==2026.4.3'

      - name: Host contract tests
        run: python tests/n3w_product_completion_s5_package/test_s5_private_package_builder.py -v

      - name: Create synthetic private fixture outside repository
        shell: bash
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/n3w-s5-private-builder-fixture
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$FIXTURE_ROOT"
          mkdir -m 700 "$FIXTURE_ROOT"
          python - <<'PY'
          import hashlib
          import json
          import os
          import sqlite3
          from pathlib import Path

          root = Path(os.environ['FIXTURE_ROOT'])
          manager = root / 'manager-state'
          keys = manager / 'relay-keys'
          manager.mkdir(mode=0o700)
          keys.mkdir(mode=0o700)

          child = {
              'system_id': 'system001',
              'node_id': 'node_child01',
              'credential_generation': 7,
              'key_epoch': 9,
              'application_key_hex': '81' * 32,
              'local_mac': '02:11:22:33:44:55',
          }
          relay = {
              'system_id': 'system001',
              'node_id': 'node_relay01',
              'credential_generation': 11,
              'key_epoch': 13,
              'application_key_hex': 'a1' * 32,
              'local_mac': '02:aa:bb:cc:dd:ee',
          }
          network = {
              'wifi_ssid': 's5-isolated-fixture',
              'wifi_password': 'fixture-pass-123',
              'wifi_channel': 6,
              'mqtt_broker': '192.0.2.10',
              'mqtt_port': 1883,
              'mqtt_client_id': 'gh-s5-relay-fixture',
              'mqtt_username': 'fixture-user',
              'mqtt_password': 'fixture-mqtt-pass',
              'mqtt_tls': False,
          }
          for name, value in (
              ('child.json', child),
              ('relay.json', relay),
              ('network.json', network),
          ):
              path = root / name
              path.write_text(json.dumps(value), encoding='utf-8')
              os.chmod(path, 0o600)

          for filename, credential in (('child.key', child), ('relay.key', relay)):
              path = keys / filename
              path.write_bytes(bytes.fromhex(credential['application_key_hex']))
              os.chmod(path, 0o600)

          pairing = manager / 'registration.sqlite3'
          db = sqlite3.connect(pairing)
          db.executescript('''
          CREATE TABLE pairing_sessions (
              pairing_id TEXT PRIMARY KEY,
              hardware_id TEXT NOT NULL,
              state TEXT NOT NULL
          );
          CREATE TABLE registrations (
              hardware_id TEXT PRIMARY KEY,
              current_pairing_id TEXT NOT NULL,
              node_id TEXT UNIQUE,
              retired_at TEXT
          );
          CREATE TABLE credential_assignments (
              hardware_id TEXT NOT NULL,
              node_id TEXT,
              active_generation INTEGER NOT NULL,
              state TEXT NOT NULL
          );
          ''')
          for role, credential in (('child', child), ('relay', relay)):
              hardware = f'ghw-s5-{role}-001122334455'
              pairing_id = f'pair-{role}-0001'
              db.execute(
                  "INSERT INTO pairing_sessions(pairing_id,hardware_id,state) VALUES (?,?,'approved')",
                  (pairing_id, hardware),
              )
              db.execute(
                  'INSERT INTO registrations(hardware_id,current_pairing_id,node_id,retired_at) VALUES (?,?,?,NULL)',
                  (hardware, pairing_id, credential['node_id']),
              )
              db.execute(
                  "INSERT INTO credential_assignments(hardware_id,node_id,active_generation,state) VALUES (?,?,?,'active')",
                  (hardware, credential['node_id'], credential['credential_generation']),
              )
          db.commit(); db.close(); os.chmod(pairing, 0o600)

          replay = manager / 'replay.sqlite3'
          db = sqlite3.connect(replay)
          db.executescript('''
          CREATE TABLE n3w_replay_meta (schema_version INTEGER NOT NULL);
          INSERT INTO n3w_replay_meta(schema_version) VALUES (1);
          CREATE TABLE n3w_replay_state (node_id TEXT PRIMARY KEY, highest_session_hex TEXT NOT NULL);
          CREATE TABLE n3w_replay_seen (
              node_id TEXT NOT NULL,
              boot_id TEXT NOT NULL,
              seq INTEGER NOT NULL,
              committed_at TEXT NOT NULL,
              PRIMARY KEY(node_id,boot_id,seq)
          );
          ''')
          db.commit(); db.close(); os.chmod(replay, 0o600)

          relay_auth = manager / 'relay-authorization.sqlite3'
          db = sqlite3.connect(relay_auth)
          db.executescript('''
          CREATE TABLE n3w_relay_meta (schema_version INTEGER NOT NULL);
          INSERT INTO n3w_relay_meta(schema_version) VALUES (2);
          CREATE TABLE n3w_relay_nodes (node_id TEXT PRIMARY KEY, active INTEGER NOT NULL);
          CREATE TABLE n3w_relay_gateway_nodes (gateway_id TEXT NOT NULL, node_id TEXT NOT NULL, enabled INTEGER NOT NULL);
          CREATE TABLE n3w_relay_key_epochs (
              node_id TEXT NOT NULL,
              key_epoch INTEGER NOT NULL,
              key_file TEXT NOT NULL,
              enabled INTEGER NOT NULL,
              state TEXT NOT NULL,
              key_sha256 TEXT
          );
          CREATE TABLE n3w_relay_operations (status TEXT NOT NULL);
          ''')
          for filename, credential in (('child.key', child), ('relay.key', relay)):
              key = bytes.fromhex(credential['application_key_hex'])
              db.execute('INSERT INTO n3w_relay_nodes(node_id,active) VALUES (?,1)', (credential['node_id'],))
              db.execute(
                  "INSERT INTO n3w_relay_key_epochs(node_id,key_epoch,key_file,enabled,state,key_sha256) VALUES (?,?,?,1,'ACTIVE',?)",
                  (credential['node_id'], credential['key_epoch'], filename, hashlib.sha256(key).hexdigest()),
              )
          db.commit(); db.close(); os.chmod(relay_auth, 0o600)
          PY

      - name: Render build and bind synthetic private package
        shell: bash
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/n3w-s5-private-builder-fixture
          PACKAGE_ROOT: ${{ runner.temp }}/n3w-s5-private-builder-package
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$PACKAGE_ROOT"
          python tools/n3w_product_s5_build_private_package.py \
            --source-root "$GITHUB_WORKSPACE" \
            --source-head "$EXACT_HEAD" \
            --child-credentials "$FIXTURE_ROOT/child.json" \
            --relay-credentials "$FIXTURE_ROOT/relay.json" \
            --isolated-network "$FIXTURE_ROOT/network.json" \
            --manager-state-root "$FIXTURE_ROOT/manager-state" \
            --output "$PACKAGE_ROOT"

      - name: Verify exact build provenance and no-live package boundary
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/n3w-s5-private-builder-package
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          root = Path(os.environ['PACKAGE_ROOT'])
          manifest = json.loads((root / 'manifest.json').read_text())
          secret = json.loads((root / 'private_secrets.json').read_text())
          child_yaml = (root / 'rendered' / 'child.yml').read_text()
          relay_yaml = (root / 'rendered' / 'relay.yml').read_text()
          pmk = secret['espnow_pmk_hex']
          assert manifest['schema'] == 'gh.n3w-product-s5-private-physical-e2e-package/3'
          assert manifest['source_head'] == os.environ['EXACT_HEAD']
          assert manifest['execution_authorized'] is False
          assert manifest['physical_execution_authorization'] is None
          assert manifest['ready_for_readonly_binding_review'] is True
          assert manifest['radio_binding']['channels_match'] is True
          assert manifest['radio_binding']['same_fresh_pmk_rendered_into_both_firmware_configs'] is True
          assert len(bytes.fromhex(pmk)) == 16 and bytes.fromhex(pmk) != bytes(16)
          assert child_yaml.count(pmk) == 1
          assert relay_yaml.count(pmk) == 1
          assert 's5-isolated-fixture' not in child_yaml
          assert 's5-isolated-fixture' in relay_yaml
          assert '192.0.2.10' in relay_yaml
          assert manifest['manager_state_binding']['relay_authorization']['enabled_gateway_grant_count'] == 0
          assert manifest['composition_contract']['static_gateway_child_preseed_present'] is False
          assert manifest['composition_contract']['pair_lmk_supplied_by_package'] is False
          assert manifest['build_provenance']['allowed_esphome_actions'] == ['config', 'compile']
          for role in ('child', 'relay'):
              firmware = root / 'artifacts' / f'{role}_firmware.bin'
              assert firmware.is_file() and firmware.stat().st_size > 0
              digest = hashlib.sha256(firmware.read_bytes()).hexdigest()
              assert digest == manifest['build_provenance'][f'{role}_firmware_sha256']
          assert not (root / '.work').exists()
          assert stat.S_IMODE(root.stat().st_mode) == 0o700
          for path in root.rglob('*'):
              if path.is_file():
                  assert stat.S_IMODE(path.stat().st_mode) & 0o077 == 0, path
          print('S5_PRIVATE_PACKAGE_RENDER_BUILD_BINDING=PASS')
          print('S5_PRIVATE_PACKAGE_SYNTHETIC_ONLY=true')
          print('PHYSICAL_EXECUTION_AUTHORIZED=false')
          PY

      - name: No-live and no-board command static gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('tools/n3w_product_s5_build_private_package.py')
          tree = ast.parse(path.read_text())
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          assert {'socket','serial','paho','esptool'}.isdisjoint(imported)
          namespace = {}
          exec(compile(tree, str(path), 'exec'), namespace)
          assert namespace['ALLOWED_ESPHOME_ACTIONS'] == ('config', 'compile')
          PY

      - name: Cleanup synthetic private material
        if: always()
        shell: bash
        run: |
          rm -rf \
            "${{ runner.temp }}/n3w-s5-private-builder-fixture" \
            "${{ runner.temp }}/n3w-s5-private-builder-package"
