name: N3-W production firmware CI

on:
  pull_request:
    paths:
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "firmware/esphome_rc/components/greenhouse_n3w_production_telemetry/**"
      - "firmware/esphome_rc/f1_0_rc2/**"
      - "firmware/esphome_rc/15_1_2_rs485_modbus_echo_filter/**"
      - "tests/n3w_production/**"
      - ".github/workflows/n3w-production-firmware-ci.yml"

permissions:
  contents: read

jobs:
  production-deharness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ESPHome and source-test dependencies
        run: python -m pip install --upgrade "esphome==2026.4.3" "pytest>=8,<9"

      - name: Production deharness source contracts
        run: pytest -q tests/n3w_production/test_production_deharness_contract.py

      - name: Validate production configuration
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_production.yml
        run: bash tools/rc2.sh config

      - name: Compile production firmware
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_production.yml
        run: bash tools/rc2.sh compile

      - name: Prove lab fixture strings are absent from production binary
        working-directory: firmware/esphome_rc/f1_0_rc2
        shell: bash
        run: |
          set -euo pipefail
          firmware="$(find .esphome -type f -name firmware.bin -print | head -n 1)"
          test -n "$firmware"
          strings "$firmware" > "$RUNNER_TEMP/n3w-production-strings.txt"

          forbidden=(
            PHASE4_PAIRING_QR_PAYLOAD
            PHASE4_LAB_TELEMETRY
            gh_n3w_diag
            N3W_DIAG_DISCOVERY
            N3W_DIAG_RECOVERY
            wdt_breadcrumb
            "ESP-NOW diagnostic receive count="
            "ESP-NOW diagnostic broadcast completion count="
          )
          for marker in "${forbidden[@]}"; do
            if grep -Fq "$marker" "$RUNNER_TEMP/n3w-production-strings.txt"; then
              echo "Production binary unexpectedly contains lab marker: $marker"
              exit 1
            fi
          done

          required=(
            "gh.telemetry/1"
            "n3w_product_telemetry"
            "Production telemetry rejected"
          )
          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$RUNNER_TEMP/n3w-production-strings.txt"
          done

      - name: Recompile the preserved Phase-4 lab target
        working-directory: firmware/esphome_rc/board_lab/n3w_phase4_physical
        run: |
          esphome config generic.yml
          esphome compile generic.yml
