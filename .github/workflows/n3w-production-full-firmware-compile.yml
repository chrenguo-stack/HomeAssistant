name: N3W production full firmware compile

on:
  pull_request:
    paths:
      - "firmware/esphome_rc/f1_0_rc2/**"
      - "firmware/esphome_rc/components/greenhouse_n3w_product_core/**"
      - ".github/workflows/n3w-production-full-firmware-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ESPHome
        run: python -m pip install --upgrade "esphome==2026.4.3"

      - name: Compile F1.0-RC2 N3-W production firmware
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: bash tools/rc2.sh compile

      - name: Prove linked firmware binary exists
        working-directory: firmware/esphome_rc/f1_0_rc2
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bins < <(find .esphome/build -type f -name firmware.bin -print)
          if (( ${#bins[@]} != 1 )); then
            printf 'Expected exactly one firmware.bin, found %d\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          stat --printf='FIRMWARE_BIN=%n\nFIRMWARE_BYTES=%s\n' "${bins[0]}"
          sha256sum "${bins[0]}"
