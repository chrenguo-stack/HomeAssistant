name: N3W R10 Board D physical acceptance write executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/**"
      - "tests/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/**"
      - ".github/workflows/n3w-r10-board-d-physical-acceptance-write-ci.yml"
      - "docs/development/N3W_SCAN_TRIGGERED_FIRST_PAIRING_R10_BOARD_D_PHYSICAL_ACCEPTANCE_WRITE_EXECUTOR_SOURCE_REPAIR_20261029.md"
  push:
    paths:
      - "tools/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/**"
      - "tests/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/**"
      - ".github/workflows/n3w-r10-board-d-physical-acceptance-write-ci.yml"
      - "docs/development/N3W_SCAN_TRIGGERED_FIRST_PAIRING_R10_BOARD_D_PHYSICAL_ACCEPTANCE_WRITE_EXECUTOR_SOURCE_REPAIR_20261029.md"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python -m py_compile tools/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/executor.py
      - run: pytest -q tests/execution_packages/n3w/scan_first_pairing/r10_board_d_physical_acceptance_write/test_executor.py
