name: N3W R10 Board D TLS-pin successor write executor CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/**"
      - "tests/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/**"
      - ".github/workflows/n3w-r10-board-d-tls-pin-successor-write-executor-ci.yml"
      - "docs/development/N3W_SCAN_TRIGGERED_FIRST_PAIRING_R10_BOARD_D_TLS_PIN_REPAIR_SUCCESSOR_WRITE_EXECUTOR_SOURCE_20261029.md"
  push:
    paths:
      - "tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/**"
      - "tests/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/**"
      - ".github/workflows/n3w-r10-board-d-tls-pin-successor-write-executor-ci.yml"
      - "docs/development/N3W_SCAN_TRIGGERED_FIRST_PAIRING_R10_BOARD_D_TLS_PIN_REPAIR_SUCCESSOR_WRITE_EXECUTOR_SOURCE_20261029.md"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile successor executor
        run: python -m py_compile tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
      - name: Run focused successor executor tests
        run: pytest -q tests/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/test_executor.py
      - name: Enforce source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ARTIFACT_ID = 12879548794' tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
          grep -Fq 'CURRENT_PREDECESSOR_SLOT_SHA256 = "9d3b7b9d6b277e06cb6eb7f3155e9c777025b0d5cdb6e40feec47d46435eafbd"' tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
          grep -Fq 'NORMALIZED_SLOT_SHA256 = "5901a6ff149ac9da8041057617df989526b41018a44a1647f8175254fda044fc"' tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
          ! grep -Fq 'ARTIFACT_ID = 12864962159' tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
          ! grep -Fq 'CURRENT_PREDECESSOR_SLOT_SHA256 = "6e777334cd8dec12523ec5e2daa6ce2909a4d581531218b0d9cec26803f68079"' tools/execution_packages/n3w/scan_first_pairing/r10_board_d_tls_pin_acceptance_write/executor.py
          echo "BOARD_ACCESS=false"
          echo "BOARD_WRITE=false"
          echo "T1_ACCESS=false"
          echo "T1_MUTATION=false"
