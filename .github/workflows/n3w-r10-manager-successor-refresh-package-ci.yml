name: N3W R10 Manager successor refresh package CI

on:
  push:
    branches:
      - build/n3w-r10-manager-successor-refresh-package-20261029
  pull_request:
    paths:
      - ".github/workflows/n3w-r10-manager-successor-refresh-package-ci.yml"
      - "tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/**"
      - "tests/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/**"
      - "docs/development/N3W_SCAN_TRIGGERED_FIRST_PAIRING_R10_MANAGER_SUCCESSOR_EXACT_ARTIFACT_SOURCE_20261029.md"
  workflow_dispatch:
    inputs:
      produce_exact_artifact:
        description: "Produce the exact ARM64 Manager successor package"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PREDECESSOR_SOURCE: e299c937a7b89bb8a7b9a7432186ba46a416cd44
  TARGET_SOURCE: ff750b3801a282af1667b5fa63481e2333e301b3
  TARGET_TREE: ee6ee5e362628fa725d57fbdf50c6608e9032b17
  PREDECESSOR_MANAGER_IMAGE: local/greenhouse-manager:fresh-e299c937a7b8
  TARGET_MANAGER_IMAGE: local/greenhouse-manager:fresh-ff750b3801a2
  BASE_IMAGE_REF: python:3.11-slim
  TARGET_DOCKERFILE_BLOB: 6486ff5fbcc23536676a48f36d67e4e0d364900a
  TARGET_COMPOSE_BLOB: c9038251d9ba1b05a472edda14b287470690815a
  TARGET_DISCOVERY_BLOB: ac6e3f70879f980ee9a2d37938879dc6345a511e
  PACKAGE_HEAD: ${{ github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bounded package sources
        run: |
          set -euo pipefail
          python -m py_compile tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/package_builder.py
          python -m py_compile tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/live_refresh.py
          python -m py_compile tests/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/test_manager_successor_refresh.py

      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Run focused successor package tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/test_manager_successor_refresh.py

      - name: Bind integrated product authority
        run: |
          set -euo pipefail
          git cat-file -e "$PREDECESSOR_SOURCE^{commit}"
          git cat-file -e "$TARGET_SOURCE^{commit}"
          test "$(git rev-parse "$TARGET_SOURCE^{tree}")" = "$TARGET_TREE"
          test "$(git rev-parse "$PREDECESSOR_SOURCE^{tree}")" != "$TARGET_TREE"

          test "$(git rev-parse "$TARGET_SOURCE:host/greenhouse-manager/Dockerfile")" = "$TARGET_DOCKERFILE_BLOB"
          test "$(git rev-parse "$TARGET_SOURCE:infra/n3w-t1/production/docker-compose.fresh.yml")" = "$TARGET_COMPOSE_BLOB"
          test "$(git rev-parse "$TARGET_SOURCE:host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py")" = "$TARGET_DISCOVERY_BLOB"

          test "$(git diff --name-only "$PREDECESSOR_SOURCE" "$TARGET_SOURCE" -- host/greenhouse-manager/src | wc -l)" -eq 1
          test "$(git diff --name-only "$PREDECESSOR_SOURCE" "$TARGET_SOURCE" -- host/greenhouse-manager/src)" = "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py"
          test -z "$(git diff --name-only "$PREDECESSOR_SOURCE" "$TARGET_SOURCE" -- infra/n3w-t1)"
          test "$(git rev-parse "$PREDECESSOR_SOURCE:host/greenhouse-manager/Dockerfile")" = "$TARGET_DOCKERFILE_BLOB"
          test "$(git rev-parse "$PREDECESSOR_SOURCE:infra/n3w-t1/production/docker-compose.fresh.yml")" = "$TARGET_COMPOSE_BLOB"

          git show "$PREDECESSOR_SOURCE:host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py" | grep -Fq "ttl_s: int = 30"
          git show "$TARGET_SOURCE:host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py" | grep -Fq "ttl_s: int = 60"
          git show "$TARGET_SOURCE:host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py" | grep -Fq "self.ttl_s != 60"

          echo "INTEGRATED_PRODUCT_AUTHORITY=PASS"
          echo "MANAGER_PRODUCTION_DELTA=ONE_FILE"
          echo "MANAGER_TTL_TRANSITION=30_TO_60"

      - name: Enforce source-stage no-artifact boundary
        if: github.event_name != 'workflow_dispatch' || inputs.produce_exact_artifact != true
        run: |
          set -euo pipefail
          echo "EXACT_ARTIFACT_PRODUCTION=false"
          echo "T1_ACCESS=false"
          echo "T1_MUTATION=false"
          echo "BOARD_ACCESS=false"

  build-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.produce_exact_artifact == true
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      manifest_sha256: ${{ steps.meta.outputs.manifest_sha256 }}
      manager_tar_sha256: ${{ steps.meta.outputs.manager_tar_sha256 }}
      manager_image_id: ${{ steps.image.outputs.manager_image_id }}
      base_arm64_digest: ${{ steps.base.outputs.base_arm64_digest }}
      upload_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      upload_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Materialize exact integrated product source
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r10-manager-refresh"
          mkdir -p "$WORK"
          git worktree add --detach "$WORK/target" "$TARGET_SOURCE"
          test "$(git -C "$WORK/target" rev-parse HEAD)" = "$TARGET_SOURCE"
          test "$(git -C "$WORK/target" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C "$WORK/target" hash-object host/greenhouse-manager/Dockerfile)" = "$TARGET_DOCKERFILE_BLOB"
          test "$(git -C "$WORK/target" hash-object infra/n3w-t1/production/docker-compose.fresh.yml)" = "$TARGET_COMPOSE_BLOB"
          test "$(git -C "$WORK/target" hash-object host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_registration_discovery.py)" = "$TARGET_DISCOVERY_BLOB"

      - name: Resolve exact linux arm64 base manifest
        id: base
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/r10-manager-refresh/base-index.json"
          docker buildx imagetools inspect --raw "$BASE_IMAGE_REF" > "$RAW"
          BASE_ARM64_DIGEST="$(
            python - "$RAW" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          manifests=data.get("manifests")
          if not isinstance(manifests,list):
              raise SystemExit("base_not_multiarch_index")
          matches=[]
          for item in manifests:
              platform=item.get("platform") or {}
              if platform.get("os")=="linux" and platform.get("architecture")=="arm64":
                  matches.append(item.get("digest"))
          matches=[x for x in matches if isinstance(x,str) and x.startswith("sha256:")]
          if len(matches)!=1:
              raise SystemExit(f"arm64_manifest_count_invalid:{len(matches)}")
          print(matches[0])
          PY
          )"
          docker pull --platform linux/arm64 "$BASE_IMAGE_REF@$BASE_ARM64_DIGEST"
          BASE_IMAGE_ID="$(docker image inspect "$BASE_IMAGE_REF@$BASE_ARM64_DIGEST" --format '{{.Id}}')"
          echo "base_arm64_digest=$BASE_ARM64_DIGEST" >> "$GITHUB_OUTPUT"
          echo "base_image_id=$BASE_IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Create digest-pinned Manager Dockerfile
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r10-manager-refresh"
          python - "$WORK/target/host/greenhouse-manager/Dockerfile" "$WORK/Dockerfile.pinned" "${{ steps.base.outputs.base_arm64_digest }}" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text(encoding="utf-8")
          lines=source.splitlines()
          if not lines or lines[0] != "FROM python:3.11-slim AS runtime":
              raise SystemExit("target_dockerfile_from_contract_drift")
          lines[0]=f"FROM python:3.11-slim@{sys.argv[3]} AS runtime"
          Path(sys.argv[2]).write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Build exact-source Manager candidate
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r10-manager-refresh"
          docker buildx build             --platform linux/arm64             --file "$WORK/Dockerfile.pinned"             --tag "$TARGET_MANAGER_IMAGE"             --output "type=docker,dest=$WORK/greenhouse-manager-arm64.tar"             "$WORK/target/host/greenhouse-manager"
          test -s "$WORK/greenhouse-manager-arm64.tar"
          docker load -i "$WORK/greenhouse-manager-arm64.tar"

      - name: Validate exact candidate image and TTL 60
        id: image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{.Id}}')"
          IMAGE_SIZE="$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{.Size}}')"
          test "$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{.Os}}')" = linux
          test "$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{.Config.User}}')" = greenhouse
          test "$(docker image inspect "$TARGET_MANAGER_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["greenhouse-manager"]'
          docker run -i --rm --platform linux/arm64 --network none --entrypoint python "$TARGET_MANAGER_IMAGE" - <<'PY'
          from greenhouse_manager.runtime.n3w_registration_discovery import RegistrationCandidate
          c=RegistrationCandidate(
              manager_id="m",
              system_id="s",
              system_id_hint="S",
              host="127.0.0.1",
              bootstrap_tls_sha256="0"*64,
          )
          assert c.ttl_s == 60
          print("R10_MANAGER_CANDIDATE_TTL=60")
          PY
          echo "manager_image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "manager_image_size=$IMAGE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Capture installed Python distribution inventory
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r10-manager-refresh/manager-python-distributions.json"
          docker run --rm --platform linux/arm64 --network none --entrypoint python "$TARGET_MANAGER_IMAGE" -c 'import importlib.metadata as m,json; print(json.dumps([{"name":d.metadata["Name"],"version":d.version} for d in sorted(m.distributions(),key=lambda d:(d.metadata["Name"] or "").lower()) if d.metadata["Name"]],sort_keys=True,separators=(",",":"))) ' > "$OUT"
          python - "$OUT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert isinstance(data,list) and data
          names=[item["name"].lower() for item in data]
          assert "greenhouse-manager" in names
          PY

      - name: Assemble bounded successor package
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r10-manager-refresh"
          python tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/package_builder.py build             --output "$WORK/package"             --package-head "$PACKAGE_HEAD"             --predecessor-source "$PREDECESSOR_SOURCE"             --target-source "$TARGET_SOURCE"             --target-tree "$TARGET_TREE"             --manager-tar "$WORK/greenhouse-manager-arm64.tar"             --manager-image "$TARGET_MANAGER_IMAGE"             --manager-image-id "${{ steps.image.outputs.manager_image_id }}"             --manager-image-size-bytes "${{ steps.image.outputs.manager_image_size }}"             --base-image-ref "$BASE_IMAGE_REF"             --base-arm64-digest "${{ steps.base.outputs.base_arm64_digest }}"             --base-image-id "${{ steps.base.outputs.base_image_id }}"             --python-distributions "$WORK/manager-python-distributions.json"             --executor tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/live_refresh.py             --candidate-ttl-seconds 60
          python tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/package_builder.py verify "$WORK/package"

      - name: Emit exact package binding
        id: meta
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r10-manager-refresh/package"
          ARTIFACT_NAME="n3w-r10-manager-successor-${PACKAGE_HEAD:0:12}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum "$ROOT/manifest.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manager_tar_sha256=$(sha256sum "$ROOT/greenhouse-manager-arm64.tar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf '%s\n'             "TARGET_SOURCE=$TARGET_SOURCE"             "TARGET_TREE=$TARGET_TREE"             "TARGET_MANAGER_IMAGE=$TARGET_MANAGER_IMAGE"             "MANIFEST_SHA256=$(sha256sum "$ROOT/manifest.json" | awk '{print $1}')"             "MANAGER_TAR_SHA256=$(sha256sum "$ROOT/greenhouse-manager-arm64.tar" | awk '{print $1}')"             "BASE_ARM64_DIGEST=${{ steps.base.outputs.base_arm64_digest }}"             "CANDIDATE_TTL_SECONDS=60"             "LIVE_AUTHORIZATION_GRANTED=false"

      - name: Upload exact Manager successor package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/r10-manager-refresh/package/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  redownload-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.produce_exact_artifact == true
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/redownload

      - name: Independently verify redownloaded package
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/redownload"
          python tools/execution_packages/n3w/scan_first_pairing/r10_manager_successor_refresh/package_builder.py verify "$ROOT"
          test "$(sha256sum "$ROOT/manifest.json" | awk '{print $1}')" = "${{ needs.build-candidate.outputs.manifest_sha256 }}"
          test "$(sha256sum "$ROOT/greenhouse-manager-arm64.tar" | awk '{print $1}')" = "${{ needs.build-candidate.outputs.manager_tar_sha256 }}"
          echo "REDOWNLOAD_VERIFY=PASS"
          echo "ARTIFACT_ID=${{ needs.build-candidate.outputs.upload_artifact_id }}"
          echo "ARTIFACT_DIGEST=${{ needs.build-candidate.outputs.upload_artifact_digest }}"
