name: N3W R3 sensorless first-registration firmware artifact CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/n3w-r3-sensorless-first-registration-firmware-artifact-ci.yml"
      - "firmware/esphome_rc/f1_0_rc2/**"
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "firmware/esphome_rc/15_1_2_rs485_modbus_echo_filter/**"
      - "docs/development/N3W_T1_CORE_STACK_CLEAN_REFERENCE_R3_SENSORLESS_REAL_FIRST_REGISTRATION_EXECUTION_PLAN_20261102.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-r3-sensorless-first-registration-firmware-artifact-ci.yml"
      - "firmware/esphome_rc/f1_0_rc2/**"
      - "firmware/esphome_rc/components/greenhouse_n3w_core/**"
      - "firmware/esphome_rc/15_1_2_rs485_modbus_echo_filter/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-exact-firmware:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact ESPHome
        run: python -m pip install --upgrade "esphome==2026.4.3"

      - name: Validate exact N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: bash tools/rc2.sh config

      - name: Compile exact N3-W target
        working-directory: firmware/esphome_rc/f1_0_rc2
        env:
          RC2_CONFIG: f1_0_rc2_n3w_target.yml
        run: bash tools/rc2.sh compile

      - name: Package and independently verify factory image
        shell: bash
        run: |
          set -euo pipefail
          build="firmware/esphome_rc/f1_0_rc2/.esphome/build/gh/.pioenvs/gh"
          out="r3-sensorless-first-registration-firmware"
          test -s "$build/firmware.factory.bin"
          test -s "$build/firmware.ota.bin"
          mkdir -p "$out"
          cp "$build/firmware.factory.bin" "$out/firmware.factory.bin"
          cp "$build/firmware.ota.bin" "$out/firmware.ota.bin"
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          out = pathlib.Path("r3-sensorless-first-registration-firmware")
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          def sha(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema": "gh.n3w-r3-sensorless-first-registration-firmware/1",
              "source_head": head,
              "target": "firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml",
              "target_blob": subprocess.check_output(
                  [
                      "git",
                      "rev-parse",
                      "HEAD:firmware/esphome_rc/f1_0_rc2/f1_0_rc2_n3w_target.yml",
                  ],
                  text=True,
              ).strip(),
              "esphome_version": "2026.4.3",
              "fresh_flash_file": "firmware.factory.bin",
              "fresh_flash_offset": "0x0",
              "telemetry_interval_seconds": 60,
              "files": {
                  name: {
                      "sha256": sha(out / name),
                      "size": (out / name).stat().st_size,
                  }
                  for name in ("firmware.factory.bin", "firmware.ota.bin")
              },
          }
          (out / "artifact-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          out = pathlib.Path("r3-sensorless-first-registration-firmware")
          manifest = json.loads((out / "artifact-manifest.json").read_text())
          for name, expected in manifest["files"].items():
              path = out / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected["sha256"]
              assert path.stat().st_size == expected["size"]
          print("R3_SENSORLESS_FIRMWARE_PACKAGE_VERIFY=PASS")
          PY

      - name: Upload exact firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: n3w-r3-sensorless-first-registration-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: r3-sensorless-first-registration-firmware
          if-no-files-found: error
          retention-days: 14
