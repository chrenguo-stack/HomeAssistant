name: N3W T1 Clean Reference R2A activation CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    paths:
      - ".github/workflows/n3w-t1-clean-reference-r2a-ci.yml"
      - "tools/n3w_t1_clean_reference_r2a.py"
      - "tools/n3w_t1_clean_reference_r2a_package_builder.py"
      - "tests/tools/test_n3w_t1_clean_reference_r2a.py"
      - "infra/n3w-t1/clean-reference/**"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-clean-reference-r2a-ci.yml"
      - "tools/n3w_t1_clean_reference_r2a.py"
      - "tools/n3w_t1_clean_reference_r2a_package_builder.py"
      - "tests/tools/test_n3w_t1_clean_reference_r2a.py"
      - "infra/n3w-t1/clean-reference/**"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE_HEAD: 24382caae4a1f5d459297f86e8d18f10a848ca64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove reused product control files remain S0-exact
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE_HEAD^{commit}"
          git diff --exit-code "$PRODUCT_SOURCE_HEAD" --             tools/n3w_t1_broker_authenticated_readiness.py             tools/n3w_broker_certificate_lifecycle.py             infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer             infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard

      - name: Run R2A source tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m py_compile             tools/n3w_t1_clean_reference_r2a.py             tools/n3w_t1_clean_reference_r2a_package_builder.py
          python -m pytest -q tests/tools/test_n3w_t1_clean_reference_r2a.py

  build-control-package:
    needs: source-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTROL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build exact R2A control package
        run: |
          set -euo pipefail
          python tools/n3w_t1_clean_reference_r2a_package_builder.py             --repo-root .             --destination "$RUNNER_TEMP/r2a-package"             --control-plane-head "$CONTROL_HEAD"             | tee "$RUNNER_TEMP/build-report.json"
          grep -q '"status":"PASS"' "$RUNNER_TEMP/build-report.json"

      - name: Independently validate package manifest
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/r2a-package" "$CONTROL_HEAD" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          head = sys.argv[2]
          manifest = json.loads(
              (root / "package-manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["schema"] == "gh.n3w-t1-clean-reference-r2a-package/1"
          assert manifest["product_source_head"] == "24382caae4a1f5d459297f86e8d18f10a848ca64"
          assert manifest["control_plane_head"] == head
          assert manifest["production_service_start"] is False
          assert manifest["t1_access"] is False
          assert manifest["board_access"] is False
          expected = {item["path"] for item in manifest["files"]}
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path.name != "package-manifest.json"
          }
          assert actual == expected
          for item in manifest["files"]:
              path = root / item["path"]
              assert path.stat().st_size == item["size"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          print("R2A_CONTROL_PACKAGE_VERIFY=PASS")
          PY

      - name: Upload exact R2A control artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-clean-reference-r2a-${{ env.CONTROL_HEAD }}
          path: ${{ runner.temp }}/r2a-package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report exact artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'R2A_CONTROL_HEAD=%s\n' "$CONTROL_HEAD"
          printf 'R2A_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'R2A_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'PRODUCT_SOURCE_HEAD=24382caae4a1f5d459297f86e8d18f10a848ca64\n'
          printf 'T1_ACCESS=false\n'
          printf 'PRODUCTION_SERVICE_START=false\n'
          printf 'BOARD_ACCESS=false\n'
