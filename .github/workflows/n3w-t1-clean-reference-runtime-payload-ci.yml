name: N3W T1 Clean Reference runtime payload CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
    paths:
      - ".github/workflows/n3w-t1-clean-reference-runtime-payload-ci.yml"
      - "tools/n3w_t1_clean_reference_runtime_payload_builder.py"
      - "tools/n3w_t1_clean_reference_executor.py"
      - "tools/n3w_t1_clean_reference_staging_host.py"
      - "tests/tools/test_n3w_t1_clean_reference_r1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-clean-reference-runtime-payload-ci.yml"
      - "tools/n3w_t1_clean_reference_runtime_payload_builder.py"
      - "tools/n3w_t1_clean_reference_executor.py"
      - "tools/n3w_t1_clean_reference_staging_host.py"
      - "tests/tools/test_n3w_t1_clean_reference_r1.py"
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact S0 source head
        required: true
        type: string
      image_run_id:
        description: Exact-three-image workflow run ID
        required: true
        type: string
      image_artifact_id:
        description: Exact-three-image artifact ID
        required: true
        type: string
      base_run_id:
        description: Fresh deployable workflow run ID providing exact runtime source
        required: true
        type: string
      base_artifact_id:
        description: Fresh deployable artifact ID providing exact runtime source
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  source-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Clean Reference R1 source tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m py_compile             tools/n3w_t1_clean_reference_runtime_payload_builder.py             tools/n3w_t1_clean_reference_executor.py             tools/n3w_t1_clean_reference_staging_host.py
          python -m pytest -q tests/tools/test_n3w_t1_clean_reference_r1.py

  build-runtime:
    if: github.event_name == 'workflow_dispatch'
    needs: source-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: ${{ inputs.source_head }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
      BASE_RUN_ID: ${{ inputs.base_run_id }}
      BASE_ARTIFACT_ID: ${{ inputs.base_artifact_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify artifact provenance
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$IMAGE_RUN_ID" > "$RUNNER_TEMP/image-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$IMAGE_ARTIFACT_ID" > "$RUNNER_TEMP/image-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BASE_RUN_ID" > "$RUNNER_TEMP/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BASE_ARTIFACT_ID" > "$RUNNER_TEMP/base-artifact.json"
          python - "$RUNNER_TEMP" "$SOURCE_HEAD" "$IMAGE_RUN_ID" "$IMAGE_ARTIFACT_ID" "$BASE_RUN_ID" "$BASE_ARTIFACT_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          source, image_run_id, image_artifact_id, base_run_id, base_artifact_id = sys.argv[2:]

          def read(name):
              return json.loads((root / name).read_text(encoding="utf-8"))

          image_run = read("image-run.json")
          image_artifact = read("image-artifact.json")
          base_run = read("base-run.json")
          base_artifact = read("base-artifact.json")

          for run, expected in (
              (image_run, int(image_run_id)),
              (base_run, int(base_run_id)),
          ):
              assert run["id"] == expected
              assert run["head_sha"] == source
              assert run["status"] == "completed"
              assert run["conclusion"] == "success"

          assert image_artifact["id"] == int(image_artifact_id)
          assert image_artifact["expired"] is False
          assert image_artifact["workflow_run"]["id"] == int(image_run_id)
          assert image_artifact["workflow_run"]["head_sha"] == source
          assert image_artifact["name"] == f"n3w-t1-fresh-exact-arm64-{source}"

          assert base_artifact["id"] == int(base_artifact_id)
          assert base_artifact["expired"] is False
          assert base_artifact["workflow_run"]["id"] == int(base_run_id)
          assert base_artifact["workflow_run"]["head_sha"] == source
          assert base_artifact["name"] == f"n3w-t1-fresh-bootstrap-deployable-{source}"

          print("CLEAN_REFERENCE_INPUT_PROVENANCE=PASS")
          PY

      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.image_run_id }}
          artifact-ids: ${{ inputs.image_artifact_id }}
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run_id }}
          artifact-ids: ${{ inputs.base_artifact_id }}
          path: ${{ runner.temp }}/base
          merge-multiple: true

      - name: Build runtime-only payload around exact S1 images
        run: |
          set -euo pipefail
          python tools/n3w_t1_clean_reference_runtime_payload_builder.py             --base-root "$RUNNER_TEMP/base"             --image-root "$RUNNER_TEMP/images"             --destination "$RUNNER_TEMP/runtime"             --source-head "$SOURCE_HEAD" | tee "$RUNNER_TEMP/build-report.json"
          test "$(find "$RUNNER_TEMP/runtime" -maxdepth 1 -type f -name '*-arm64.tar' | wc -l)" = "0"
          grep -q '"image_rebuild_performed":false' "$RUNNER_TEMP/build-report.json"
          grep -q '"registry_pull_performed":false' "$RUNNER_TEMP/build-report.json"
          grep -q '"status":"PASS"' "$RUNNER_TEMP/build-report.json"
          cp "$RUNNER_TEMP/build-report.json" "$RUNNER_TEMP/runtime/build-report.json"

      - name: Verify runtime output
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/images/binding.json" "$SOURCE_HEAD" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          s1 = Path(sys.argv[2])
          source = sys.argv[3]
          expected = {
              "runtime-payload.tar.gz",
              "runtime-payload.sha256",
              "payload-manifest.sha256",
              "capacity-contract.json",
              "capacity-contract.sha256",
              "executor.sha256",
              "host-wrapper.py",
              "host-wrapper.sha256",
              "host-baseline.py",
              "host-baseline.sha256",
              "runtime-binding.json",
              "build-report.json",
          }
          assert {path.name for path in root.iterdir()} == expected

          binding = json.loads((root / "runtime-binding.json").read_text(encoding="utf-8"))
          assert binding["source_head"] == source
          assert binding["image_rebuild_performed"] is False
          assert binding["registry_pull_performed"] is False
          assert binding["production_service_start"] is False

          h = hashlib.sha256(s1.read_bytes()).hexdigest()
          assert binding["s1_binding_sha256"] == h

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          assert sha(root / "runtime-payload.tar.gz") == (root / "runtime-payload.sha256").read_text().strip()
          assert sha(root / "capacity-contract.json") == (root / "capacity-contract.sha256").read_text().strip()
          print("CLEAN_REFERENCE_RUNTIME_POSTBUILD_VERIFY=PASS")
          PY

      - name: Upload runtime-only artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-clean-reference-runtime-${{ inputs.source_head }}
          path: ${{ runner.temp }}/runtime/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report exact runtime artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'CLEAN_REFERENCE_RUNTIME_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'CLEAN_REFERENCE_RUNTIME_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
          printf 'IMAGE_REBUILD_PERFORMED=false\n'
          printf 'REGISTRY_PULL_PERFORMED=false\n'
          printf 'T1_ACCESS=false\n'
          printf 'PRODUCTION_SERVICE_START=false\n'
          printf 'BOARD_ACCESS=false\n'
