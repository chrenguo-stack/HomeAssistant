name: N3W T1 Core Stack current authority CI

on:
  pull_request:
    paths:
      - "infra/n3w-t1/production/t1-core-stack-current.json"
      - "infra/n3w-t1/upgrades/manager-3539c8f871e2.json"
      - "infra/n3w-t1/production/docker-compose.fresh.yml"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "tools/n3w_t1_core_stack_current_authority_check.py"
      - "tests/tools/test_n3w_t1_core_stack_current_authority.py"
      - "docs/development/N3W_CURRENT_STATE.md"
      - "docs/development/N3W_CURRENT_STATE_INDEX.md"
      - ".github/workflows/n3w-t1-core-stack-current-authority-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-t1-core-stack-current-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Validate current T1 Core Stack authority
        run: |
          set -euo pipefail
          python -m py_compile tools/n3w_t1_core_stack_current_authority_check.py
          python tools/n3w_t1_core_stack_current_authority_check.py --repo-root .

      - name: Run successor authority regression tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m pytest -q tests/tools/test_n3w_t1_core_stack_current_authority.py

      - name: Prove no live mutation in repository gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          authority = json.loads(
              Path("infra/n3w-t1/production/t1-core-stack-current.json")
              .read_text(encoding="utf-8")
          )
          assert authority["authority_state"] == "SUCCESSOR_READY_NOT_LIVE_APPLIED"
          assert authority["live_deployment"]["state"] == "NOT_YET_APPLIED"
          assert authority["mutation_scope"] == {
              "manager": True,
              "homeassistant_image": False,
              "broker_image": False,
              "host_platform": False,
              "board": False,
          }
          print("REPOSITORY_SUCCESSOR_AUTHORITY=PASS")
          print("LIVE_T1_MUTATION=false")
          PY
