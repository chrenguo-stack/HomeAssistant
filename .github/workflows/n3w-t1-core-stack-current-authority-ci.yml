name: N3W T1 Core Stack current authority CI

on:
  pull_request:
    paths:
      - "infra/n3w-t1/production/t1-core-stack-current.json"
      - "infra/n3w-t1/updater-releases/delivery-contract.json"
      - "infra/n3w-t1/upgrades/manager-3539c8f871e2.json"
      - "infra/n3w-t1/upgrades/manager-b863ddd95909.json"
      - "infra/n3w-t1/upgrades/manager-5b32e1ae8210.json"
      - "infra/n3w-t1/production/docker-compose.fresh.yml"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
      - ".github/workflows/n3w-t1-core-updater-manager-a-to-b-ci.yml"
      - "tools/execution_packages/n3w/u1/manager_a_to_b_v2_live_apply/executor.py"
      - "tools/n3w_t1_core_stack_current_authority_check.py"
      - "tests/tools/test_n3w_t1_core_stack_current_authority.py"
      - "docs/development/N3W_CURRENT_STATE.md"
      - "docs/development/N3W_CURRENT_STATE_INDEX.md"
      - ".github/workflows/n3w-t1-core-stack-current-authority-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-t1-core-stack-current-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Validate current T1 Core Stack authority
        run: |
          set -euo pipefail
          python -m py_compile tools/n3w_t1_core_stack_current_authority_check.py
          python tools/n3w_t1_core_stack_current_authority_check.py --repo-root .

      - name: Run successor authority regression tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m pytest -q tests/tools/test_n3w_t1_core_stack_current_authority.py

      - name: Prove accepted live authority contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          authority = json.loads(
              Path("infra/n3w-t1/production/t1-core-stack-current.json")
              .read_text(encoding="utf-8")
          )
          delivery = json.loads(
              Path("infra/n3w-t1/updater-releases/delivery-contract.json")
              .read_text(encoding="utf-8")
          )
          assert authority["schema"] == "gh.n3w-t1-core-stack-current-authority/2"
          assert authority["authority_state"] == "CURRENT_STACK_LIVE_ACCEPTED"
          assert authority["live_deployment"]["state"] == "APPLIED_ACCEPTED"
          assert authority["live_deployment"]["transaction_status"] == "COMMITTED"
          assert authority["live_deployment"]["post_upgrade_acceptance"] == "PASS"
          assert authority["live_deployment"]["runtime_class"] == "TARGET_BOUND_RUNNING"
          assert authority["live_deployment"]["health_state"] == "HEALTHY"
          assert authority["live_deployment"]["kf139_closure"] == "CLOSED_PASS"
          assert authority["live_deployment"]["kf141_closure"] == "CLOSED_PASS"
          assert authority["current_repository_stack"]["product_source_head"] == "5b32e1ae82104a42f9e4e6907fe44d9172e87615"
          assert authority["current_repository_stack"]["manager"]["image"] == "local/greenhouse-manager:fresh-5b32e1ae8210"
          assert authority["live_deployment"]["current_manager_image"] == "local/greenhouse-manager:fresh-5b32e1ae8210"
          assert authority["live_deployment"]["first_registration_acceptance"] == "PASS"
          assert authority["live_deployment"]["credential_lifecycle_private_database_gate"] == "PASS"
          assert authority["live_deployment"]["pairing_window_state"] == "CLOSED"
          assert authority["live_deployment"]["pairing_window_close_reason"] == "committed"
          assert delivery == {
              "schema": "gh.n3w-t1-core-updater-delivery/1",
              "mode": "EXACT_PACKAGE_BOUND_EPHEMERAL_PYZ",
              "canonical_package_filename": "t1-core-updater.pyz",
              "permanent_install_required": False,
              "permanent_cli_path": None,
              "allowed_staging_roots": ["/tmp", "/var/tmp"],
              "execution_prefix": ["python3", "-B"],
              "integrity_authority": "package-binding.json:updater_pyz_sha256",
              "accepted_binding_source": "infra/n3w-t1/production/t1-core-stack-current.json:manager_successor_upgrade",
              "source_checkout_required_on_t1": False,
              "runtime_health_authority": False,
          }
          assert "updater_delivery" not in authority
          assert authority["mutation_scope"] == {
              "manager": True,
              "homeassistant_image": False,
              "broker_image": False,
              "host_platform": False,
              "board": False,
          }
          print("REPOSITORY_LIVE_AUTHORITY=PASS")
          print("REPOSITORY_GATE_T1_MUTATION=false")
          PY
