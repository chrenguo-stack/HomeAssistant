name: N3W T1 Core Stack semantic release CI

on:
  pull_request:
    paths:
      - "tools/n3w_t1_core_stack_release.py"
      - "tests/tools/test_n3w_t1_core_stack_release.py"
      - "infra/n3w-t1/releases/**"
      - "docs/development/N3W_T1_CORE_STACK_SEMANTIC_VERSION_AND_RELEASE_UPGRADE_MODEL_20261105.md"
      - "docs/development/N3W_T1_CORE_UPDATER_HOMEASSISTANT_PRODUCT_GRADE_UPGRADE_VALIDATION_PREPARATION_20261105.md"
      - ".github/workflows/n3w-t1-core-stack-semantic-release-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-t1-core-stack-semantic-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate semantic Stack release contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python -m pip install "pytest>=8,<9"
          python -m py_compile tools/n3w_t1_core_stack_release.py
          PYTHONPATH=tools python -m pytest -q tests/tools/test_n3w_t1_core_stack_release.py
