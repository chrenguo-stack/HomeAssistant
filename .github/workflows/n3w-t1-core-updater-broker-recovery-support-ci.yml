name: N3W T1 Core Updater Broker Recovery Support Exact CI

on:
  pull_request:
    paths:
      - "tools/n3w_t1_core_updater*.py"
      - "infra/n3w-t1/systemd/n3wfc4-core-updater-broker-recovery.service"
      - "tests/tools/test_n3w_t1_core_updater_a2.py"
      - "tests/tools/test_n3w_t1_core_updater_broker_support.py"
      - "tests/tools/test_n3w_t1_core_updater_broker_recovery_support_ci_contract.py"
      - "docs/development/N3W_T1_BROKER_OTA_V1_0_B4_HOST_RECOVERY_AND_RECOVERY_POINT_LIFECYCLE_20261121.md"
      - "docs/development/N3W_T1_BROKER_OTA_V1_0_B5_RECOVERY_SUPPORT_EXACT_PACKAGE_20261121.md"
      - ".github/workflows/n3w-t1-core-updater-broker-recovery-support-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      T1_ACCESS: "false"
      T1_MUTATION: "false"
      BOARD_ACCESS: "false"
      PRODUCTION_SERVICE_START: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact source and focused Broker recovery simulation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python -m pip install "pytest>=8,<9"
          python -m py_compile             tools/n3w_t1_core_updater.py             tools/n3w_t1_core_updater_common.py             tools/n3w_t1_core_updater_core.py             tools/n3w_t1_core_updater_host.py             tools/n3w_t1_core_updater_state.py             tools/n3w_t1_core_updater_v2.py             tools/n3w_t1_core_updater_v2_common.py             tools/n3w_t1_core_updater_v2_state.py             tools/n3w_t1_core_updater_components.py             tools/n3w_t1_core_updater_a1_policy.py             tools/n3w_t1_core_updater_broker_recovery.py             tools/n3w_t1_core_updater_broker_support.py             tools/n3w_t1_portable_image_identity.py
          PYTHONPATH=tools python -m pytest -q             tests/tools/test_n3w_t1_core_updater_a2.py             tests/tools/test_n3w_t1_core_updater_broker_support.py

  exact-package:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PACKAGE_NAME: n3w-t1-core-updater-broker-recovery-support
      T1_ACCESS: "false"
      T1_MUTATION: "false"
      BOARD_ACCESS: "false"
      PRODUCTION_SERVICE_START: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic Broker recovery support package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python tools/n3w_t1_core_updater_broker_support.py build             --repo .             --source-head "$SOURCE_HEAD"             --destination "$RUNNER_TEMP/package"
          python tools/n3w_t1_core_updater_broker_support.py verify             --package "$RUNNER_TEMP/package"             --source-head "$SOURCE_HEAD"
          python -I "$RUNNER_TEMP/package/t1-core-updater.pyz" --help             | grep -F "recover-broker-pending"
          python - "$RUNNER_TEMP/package/t1-core-updater.pyz" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          path = Path(sys.argv[1])
          with zipfile.ZipFile(path, "r") as archive:
              names = set(archive.namelist())
          assert "n3w_t1_core_updater_broker_recovery.py" in names
          assert "n3w_t1_core_updater_v2.py" in names
          print("BROKER_RECOVERY_SUPPORT_MODULE_SET=PASS")
          PY
          echo "T1_ACCESS=false"
          echo "T1_MUTATION=false"
          echo "BOARD_ACCESS=false"
          echo "PRODUCTION_SERVICE_START=false"

      - name: Upload exact Broker recovery support artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          compression-level: 0

  artifact-recheck:
    needs: exact-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PACKAGE_NAME: n3w-t1-core-updater-broker-recovery-support
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ runner.temp }}/download

      - name: Re-download and verify exact Broker recovery support artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python tools/n3w_t1_core_updater_broker_support.py verify             --package "$RUNNER_TEMP/download"             --source-head "$SOURCE_HEAD"
          python -I "$RUNNER_TEMP/download/t1-core-updater.pyz" --help             | grep -F "recover-broker-pending"
          test "$(find "$RUNNER_TEMP/download" -maxdepth 1 -type f | wc -l)" -eq 3
