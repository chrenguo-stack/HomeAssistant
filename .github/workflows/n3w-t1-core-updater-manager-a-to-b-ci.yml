name: N3W T1 Core Updater Manager A-to-B CI

on:
  pull_request:
    paths:
      - "tools/n3w_t1_core_updater*.py"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "infra/n3w-t1/production/docker-compose.fresh.yml"
      - "tests/tools/test_n3w_t1_core_updater.py"
      - "tests/tools/test_n3w_t1_core_updater_a2.py"
      - "tests/tools/test_n3w_t1_core_updater_ha_usb_r1.py"
      - "tests/tools/test_n3w_t1_core_updater_ha_usb_r2.py"
      - "tests/tools/test_n3w_t1_core_updater_u1_pre_u1_simulation.py"
      - "infra/n3w-t1/upgrades/manager-bf38e388497b.json"
      - "infra/n3w-t1/upgrades/manager-bf38e388497b-compatibility.json"
      - "infra/n3w-t1/clean-reference/r7a-manager-predecessor-baseline-20261107.json"
      - "tests/tools/test_n3w_t1_core_updater_manager_r7a_successor.py"
      - "tests/tools/test_n3w_t1_core_updater_manager_r7a_repair_successor.py"
      - "tests/tools/test_n3w_t1_core_updater_r7a_repair_pre_u1_simulation.py"
      - "infra/n3w-t1/upgrades/manager-7807271e4c48.json"
      - "infra/n3w-t1/upgrades/manager-7807271e4c48-compatibility.json"
      - "infra/n3w-t1/clean-reference/r7a-repaired-manager-predecessor-bf38-baseline-20261108.json"
      - "tools/execution_packages/n3w/r7a/manager_a0_live_apply/**"
      - "tools/execution_packages/n3w/r7a/host_a1_live_activation/**"
      - "tests/tools/test_n3w_t1_r7a_manager_a0_executor.py"
      - "tests/tools/test_n3w_t1_r7a_host_a1_executor.py"
      - "infra/n3w-t1/production/docker-compose.ha-ota.yml"
      - "infra/n3w-t1/systemd/n3w-t1-ha-ota.service"
      - "infra/n3w-t1/systemd/n3wfc4-services-activation.ha-ota.conf"
      - "infra/n3w-t1/upgrades/homeassistant-2026.10.4-approved.json"
      - "docs/development/N3W_T1_CORE_UPDATER_MANAGER_A_TO_B_SOURCE_DESIGN_20261102.md"
      - ".github/workflows/n3w-t1-core-updater-manager-a-to-b-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n3w-t1-core-updater-manager-a-to-b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate updater source and simulation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python -m pip install "pytest>=8,<9"
          python -m py_compile \
            tools/n3w_t1_core_updater.py \
            tools/n3w_t1_core_updater_common.py \
            tools/n3w_t1_core_updater_core.py \
            tools/n3w_t1_core_updater_host.py \
            tools/n3w_t1_core_updater_state.py \
            tools/n3w_t1_core_updater_v2.py \
            tools/n3w_t1_core_updater_v2_common.py \
            tools/n3w_t1_core_updater_v2_state.py \
            tools/n3w_t1_core_updater_components.py \
            tools/n3w_t1_core_updater_a1_policy.py \
            tools/n3w_t1_core_updater_ha_usb.py \
            tools/n3w_t1_core_updater_ha_usb_state.py \
            tools/n3w_t1_core_updater_ha_usb_media.py \
            tools/n3w_t1_core_updater_ha_backup.py \
            tools/n3w_t1_core_updater_ha_recovery.py \
            tools/n3w_t1_core_updater_ha_daemon.py \
            tools/n3w_t1_core_updater_ha_ipc.py \
            tools/n3w_t1_core_updater_ha_prepare.py \
            tools/n3w_t1_core_updater_ha_prepare_host.py \
            tools/n3w_t1_portable_image_identity.py \
            tools/execution_packages/n3w/r7a/host_a1_live_activation/executor.py
          PYTHONPATH=tools python -m pytest -q \
            tests/tools/test_n3w_t1_core_updater.py \
            tests/tools/test_n3w_t1_core_updater_a2.py \
            tests/tools/test_n3w_t1_core_updater_ha_usb_r1.py \
            tests/tools/test_n3w_t1_core_updater_ha_usb_r2.py \
            tests/tools/test_n3w_t1_core_updater_manager_r7a_successor.py \
            tests/tools/test_n3w_t1_core_updater_manager_r7a_repair_successor.py \
            tests/tools/test_n3w_t1_r7a_manager_a0_executor.py \
            tests/tools/test_n3w_t1_r7a_host_a1_executor.py \
            tests/tools/test_n3w_t1_core_updater_ha_prepare_host_r7a.py \
            tests/tools/test_n3w_t1_core_updater_ha_prepare_r7a.py \
            tests/tools/test_n3w_t1_core_stack_current_authority.py \
            tests/tools/test_n3w_t1_fresh_product_bootstrap.py
          ! grep -R -E 'PAIRING_SHA256|HARDWARE_SHA256|R10_E03_MANAGER_SUCCESSOR_REFRESH|KF-131'             tools/n3w_t1_core_updater*.py

  exact-manager-slice:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      package_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      package_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CONTROL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      UPSTREAM_RUN_ID: "42452239964"
      UPSTREAM_ARTIFACT_ID: "13615963302"
      UPSTREAM_ARTIFACT_NAME: "n3w-t1-fresh-exact-arm64-7807271e4c48161f2fad96a7886fa4c24b038321"
      TARGET_MANIFEST: "infra/n3w-t1/upgrades/manager-7807271e4c48.json"
      BASELINE_MANIFEST: "infra/n3w-t1/clean-reference/r7a-repaired-manager-predecessor-bf38-baseline-20261108.json"
      PACKAGE_NAME: "n3w-t1-core-updater-manager-v2-7807271e4c48"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_HEAD }}
          fetch-depth: 0

      - name: Verify upstream GitHub artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/upstream-artifacts.json"
          python - "$RUNNER_TEMP/upstream-artifacts.json" "$TARGET_MANIFEST" "$UPSTREAM_ARTIFACT_NAME" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          name = sys.argv[3]

          identity = target["artifact_identity"]
          matches = [
              item
              for item in metadata.get("artifacts", [])
              if item.get("id") == identity["artifact_id"]
          ]
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact["name"] == identity["artifact_name"] == name
          assert artifact.get("expired") is False
          assert artifact.get("digest") == (
              "sha256:" + identity["artifact_digest_sha256"]
          )
          workflow_run = artifact.get("workflow_run") or {}
          assert workflow_run.get("id") == int(os.environ["UPSTREAM_RUN_ID"])
          assert workflow_run.get("head_sha") == (
              target["compatibility_evidence"]["target_source_head"]
          )
          assert identity["artifact_id"] == int(
              os.environ["UPSTREAM_ARTIFACT_ID"]
          )
          print("UPSTREAM_GITHUB_ARTIFACT_IDENTITY=PASS")
          PY

      - name: Download exact upstream three-image artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}
          artifact-ids: ${{ env.UPSTREAM_ARTIFACT_ID }}
          path: ${{ runner.temp }}/upstream
          merge-multiple: true

      - name: Verify V2 target binding and produce Manager-only package
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/upstream" "$TARGET_MANIFEST" "$BASELINE_MANIFEST" "$RUNNER_TEMP/package" "$CONTROL_HEAD" <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import sys
          import zipapp
          from pathlib import Path

          upstream = Path(sys.argv[1])
          target_path = Path(sys.argv[2])
          baseline_path = Path(sys.argv[3])
          package = Path(sys.argv[4])
          control_head = sys.argv[5]

          target = json.loads(target_path.read_text(encoding="utf-8"))
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          binding = json.loads((upstream / "binding.json").read_text(encoding="utf-8"))
          manager_tar = upstream / "greenhouse-manager-arm64.tar"

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          assert target["schema"] == "gh.n3w-t1-core-updater-target/2"
          assert target["component"] == "manager"
          assert target["mutation_profile"] == "IMAGE_ONLY_V1"
          assert target["target_platform"] == "linux/arm64"
          assert target["rollback_compatible"] is True
          assert baseline["schema"] == "gh.n3w-t1-core-updater-baseline/1"
          assert baseline["stack_images"]["manager"] == target["expected_predecessor_image_ref"]
          assert binding["schema"] == "gh.n3w.t1-fresh-exact-arm64-binding/1"
          assert binding["source_head"] == target["compatibility_evidence"]["target_source_head"]
          assert binding["manager"]["image"] == target["target_image_ref"]
          assert binding["manager"]["tar_sha256"] == target["target_archive_sha256"]
          assert binding["manager"]["tar_size_bytes"] == manager_tar.stat().st_size
          assert binding["manager"]["platform"] == target["target_platform"]
          assert binding["secret_values_included"] is False
          assert binding["production_service_start"] is False
          assert binding["t1_access"] is False
          assert binding["board_access"] is False
          assert sha(manager_tar) == target["target_archive_sha256"]

          package.mkdir(parents=True, exist_ok=False)
          shutil.copy2(manager_tar, package / "greenhouse-manager-arm64.tar")
          shutil.copy2(target_path, package / "manager-target-v2.json")
          shutil.copy2(baseline_path, package / "upgrade-baseline-a.json")

          updater_source = package.parent / "updater-source"
          updater_source.mkdir(parents=True, exist_ok=False)
          updater_modules = (
              "n3w_t1_core_updater.py",
              "n3w_t1_core_updater_common.py",
              "n3w_t1_core_updater_core.py",
              "n3w_t1_core_updater_host.py",
              "n3w_t1_core_updater_state.py",
              "n3w_t1_core_updater_v2.py",
              "n3w_t1_core_updater_v2_common.py",
              "n3w_t1_core_updater_v2_state.py",
              "n3w_t1_core_updater_components.py",
              "n3w_t1_core_updater_a1_policy.py",
              "n3w_t1_portable_image_identity.py",
          )
          for name in updater_modules:
              shutil.copy2(Path("tools") / name, updater_source / name)
          (updater_source / "__main__.py").write_text(
              "from n3w_t1_core_updater import main\n"
              "raise SystemExit(main())\n",
              encoding="utf-8",
          )
          updater_pyz = package / "t1-core-updater.pyz"
          zipapp.create_archive(
              updater_source,
              updater_pyz,
              interpreter="/usr/bin/env python3",
          )

          package_binding = {
              "schema": "gh.n3w-t1-core-updater-manager-package/2",
              "control_plane_head": control_head,
              "target_schema": target["schema"],
              "target_source_head": target["compatibility_evidence"]["target_source_head"],
              "upstream_run_id": int(os.environ["UPSTREAM_RUN_ID"]),
              "upstream_artifact_id": target["artifact_identity"]["artifact_id"],
              "upstream_artifact_digest_sha256": target["artifact_identity"]["artifact_digest_sha256"],
              "manager_image": target["target_image_ref"],
              "manager_build_image_id": binding["manager"]["image_id"],
              "manager_tar_sha256": target["target_archive_sha256"],
              "manager_tar_size_bytes": manager_tar.stat().st_size,
              "manager_platform": target["target_platform"],
              "baseline_file_sha256": sha(baseline_path),
              "updater_pyz_sha256": sha(updater_pyz),
              "updater_pyz_size_bytes": updater_pyz.stat().st_size,
              "transaction_schema": "gh.n3w-t1-core-updater-transaction/2",
              "manager_rebuilt": False,
              "homeassistant_included": False,
              "broker_included": False,
              "secret_values_included": False,
              "t1_access": False,
              "t1_mutation": False,
              "board_access": False
          }
          (package / "package-binding.json").write_text(
              json.dumps(package_binding, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(package_binding, sort_keys=True))
          PY

      - name: Upload exact Manager-only V2 package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Re-download and verify Manager-only V2 package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/redownload
          merge-multiple: true

      - name: Close exact V2 package binding
        env:
          PACKAGE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/redownload" "$PACKAGE_ARTIFACT_ID" "$PACKAGE_ARTIFACT_DIGEST" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          artifact_id = sys.argv[2]
          artifact_digest = sys.argv[3]
          assert {p.name for p in root.iterdir()} == {
              "greenhouse-manager-arm64.tar",
              "manager-target-v2.json",
              "upgrade-baseline-a.json",
              "package-binding.json",
              "t1-core-updater.pyz",
          }
          target = json.loads((root / "manager-target-v2.json").read_text(encoding="utf-8"))
          package = json.loads((root / "package-binding.json").read_text(encoding="utf-8"))
          assert package["control_plane_head"] == os.environ["CONTROL_HEAD"]
          assert package["target_schema"] == "gh.n3w-t1-core-updater-target/2"
          assert package["transaction_schema"] == "gh.n3w-t1-core-updater-transaction/2"

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          assert sha(root / "greenhouse-manager-arm64.tar") == target["target_archive_sha256"]
          assert sha(root / "upgrade-baseline-a.json") == package["baseline_file_sha256"]
          assert sha(root / "t1-core-updater.pyz") == package["updater_pyz_sha256"]
          assert (root / "t1-core-updater.pyz").stat().st_size == package["updater_pyz_size_bytes"]
          assert package["manager_tar_sha256"] == target["target_archive_sha256"]
          assert package["manager_rebuilt"] is False
          assert package["homeassistant_included"] is False
          assert package["broker_included"] is False
          assert package["secret_values_included"] is False
          assert package["t1_mutation"] is False

          print(f"MANAGER_V2_PACKAGE_ARTIFACT_ID={artifact_id}")
          print(f"UPDATER_PYZ_SHA256={package['updater_pyz_sha256']}")
          print(f"MANAGER_V2_PACKAGE_ARTIFACT_DIGEST={artifact_digest}")
          print(f"MANAGER_TAR_SHA256={target['target_archive_sha256']}")
          print(f"MANAGER_BUILD_IMAGE_ID={package['manager_build_image_id']}")
          print("T1_CORE_UPDATER_MANAGER_V2_PACKAGE_BINDING=PASS")
          print("MANAGER_REBUILT=false")
          print("T1_MUTATION=false")
          PY
          python "$RUNNER_TEMP/redownload/t1-core-updater.pyz" --help >/dev/null
          echo "T1_CORE_UPDATER_PYZ_EXECUTION=PASS"

  pre-u1-v2-simulation:
    needs: exact-manager-slice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      U1_MANAGER_PACKAGE_ARTIFACT_ID: ${{ needs.exact-manager-slice.outputs.package_artifact_id }}
      U1_MANAGER_PACKAGE_ARTIFACT_DIGEST: ${{ needs.exact-manager-slice.outputs.package_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download exact V2 Manager-only package from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.U1_MANAGER_PACKAGE_ARTIFACT_ID }}
          path: ${{ runner.temp }}/u1-package
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frozen Pre-U1 V2 transaction simulation
        env:
          U1_MANAGER_PACKAGE_DIR: ${{ runner.temp }}/u1-package
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          PYTHONPATH=tools python -m pytest -q tests/tools/test_n3w_t1_core_updater_r7a_repair_pre_u1_simulation.py
          echo "U1_B8_V2_PRE_U1_INSPECT_PLAN_SIMULATION=PASS"
          echo "U1_B8_V2_TERMINAL_TRANSACTION_ARCHIVE=PASS"
          echo "T1_ACCESS=false"
          echo "T1_MUTATION=false"
          echo "BOARD_ACCESS=false"
