name: N3W T1 F2 read-only preflight source CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-f2-readonly-preflight-source-ci.yml"
      - "tools/execution_packages/n3w/f2/t1_fresh_readonly_preflight/**"
      - "tests/execution_packages/n3w/f2/t1_fresh_readonly_preflight/**"
      - "tools/n3w_t1_os_identity_readonly_probe.py"
      - "tools/n3w_t1_minimal_baseline_readonly_inventory.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tools/n3w_t1_fresh_host_baseline.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/n3w-t1-f2-readonly-preflight-source-ci.yml"
      - "tools/execution_packages/n3w/f2/t1_fresh_readonly_preflight/**"
      - "tests/execution_packages/n3w/f2/t1_fresh_readonly_preflight/**"
      - "tools/n3w_t1_os_identity_readonly_probe.py"
      - "tools/n3w_t1_minimal_baseline_readonly_inventory.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tools/n3w_t1_fresh_host_baseline.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run F2 source contracts
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m py_compile \
            tools/execution_packages/n3w/f2/t1_fresh_readonly_preflight/executor.py \
            tools/n3w_t1_os_identity_readonly_probe.py \
            tools/n3w_t1_minimal_baseline_readonly_inventory.py \
            tools/n3w_t1_fresh_product_staging_host.py \
            tools/n3w_t1_fresh_host_baseline.py
          python -m pytest -q \
            tests/execution_packages/n3w/f2/t1_fresh_readonly_preflight/test_executor.py \
            tests/tools/test_n3w_t1_minimal_baseline_readonly_inventory.py \
            tests/tools/test_n3w_t1_fresh_product_staging_host.py \
            tests/tools/test_n3w_t1_fresh_host_baseline.py
