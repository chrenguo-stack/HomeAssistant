name: N3W T1 F4 activation source CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-f4-activation-source-ci.yml"
      - "tools/n3w_t1_f4_activation_host.py"
      - "tools/n3w_t1_f4_package_builder.py"
      - "tools/n3w_t1_f4_certificate_runtime_guard.py"
      - "tools/n3w_t1_f4_reboot_successor_package_builder.py"
      - "tools/n3w_t1_f4_reboot_authority.py"
      - "tools/n3w_t1_f4_reboot_verify.py"
      - "tools/n3w_t1_f4_reboot_successor_postclaim_recovery.py"
      - "tests/tools/test_n3w_t1_f4_reboot_successor_postclaim_recovery.py"
      - "tests/tools/test_n3w_t1_f4_reboot_authority.py"
      - "tests/tools/test_n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_f4_reboot_successor_package_builder.py"
      - "tests/tools/test_n3w_t1_f4_certificate_runtime_guard.py"
      - "infra/n3w-t1/f4/reboot-successor/**"
      - "tests/tools/test_n3w_t1_f4_activation_host.py"
      - "tests/tools/test_n3w_t1_f4_package_builder.py"
      - "infra/n3w-t1/f4/n3wfc4-broker-activation.service"
      - "infra/n3w-t1/f4/n3wfc4-services-activation.service"
      - "infra/n3w-t1/f4/n3wfc4-broker-certificate-lifecycle.service"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/f4/broker-certificate-lifecycle.env.example"
      - "infra/n3w-t1/activate-systemd-production.sh"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
      - "tests/tools/test_n3w_broker_certificate_lifecycle.py"
      - "tests/tools/test_n3w_broker_ingress_guard_lifecycle.py"
      - "host/greenhouse-manager/src/greenhouse_manager/bootstrap/device_provisioning_runtime.py"
      - "host/greenhouse-manager/tests/bootstrap/test_device_provisioning_runtime.py"
      - "docs/development/N3W_T1_F4_*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-f4-activation-source-ci.yml"
      - "tools/n3w_t1_f4_activation_host.py"
      - "tools/n3w_t1_f4_package_builder.py"
      - "tools/n3w_t1_f4_certificate_runtime_guard.py"
      - "tools/n3w_t1_f4_reboot_successor_package_builder.py"
      - "tools/n3w_t1_f4_reboot_authority.py"
      - "tools/n3w_t1_f4_reboot_verify.py"
      - "tools/n3w_t1_f4_reboot_successor_postclaim_recovery.py"
      - "tests/tools/test_n3w_t1_f4_reboot_successor_postclaim_recovery.py"
      - "tests/tools/test_n3w_t1_f4_reboot_authority.py"
      - "tests/tools/test_n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_f4_reboot_successor_package_builder.py"
      - "tests/tools/test_n3w_t1_f4_certificate_runtime_guard.py"
      - "infra/n3w-t1/f4/reboot-successor/**"
      - "tests/tools/test_n3w_t1_f4_activation_host.py"
      - "tests/tools/test_n3w_t1_f4_package_builder.py"
      - "infra/n3w-t1/f4/n3wfc4-broker-activation.service"
      - "infra/n3w-t1/f4/n3wfc4-services-activation.service"
      - "infra/n3w-t1/f4/n3wfc4-broker-certificate-lifecycle.service"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/f4/broker-certificate-lifecycle.env.example"
      - "infra/n3w-t1/activate-systemd-production.sh"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
      - "tests/tools/test_n3w_broker_certificate_lifecycle.py"
      - "tests/tools/test_n3w_broker_ingress_guard_lifecycle.py"
      - "host/greenhouse-manager/src/greenhouse_manager/bootstrap/device_provisioning_runtime.py"
      - "host/greenhouse-manager/tests/bootstrap/test_device_provisioning_runtime.py"
      - "docs/development/N3W_T1_F4_*.md"

permissions:
  contents: read

jobs:
  f4-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/greenhouse-manager/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e 'host/greenhouse-manager[dev]'

      - name: F4 launcher executable contract
        run: |
          test -x tools/n3w_t1_f4_activation_host.py
          test "$(head -n 1 tools/n3w_t1_f4_activation_host.py)" = "#!/usr/bin/python3"
          ./tools/n3w_t1_f4_activation_host.py --help >/dev/null

      - name: Compile F4 host and package builder
        run: |
          python -m py_compile tools/n3w_t1_f4_activation_host.py
          python -m py_compile tools/n3w_t1_f4_package_builder.py
          python -m py_compile tools/n3w_t1_f4_certificate_runtime_guard.py
          python -m py_compile tools/n3w_t1_f4_reboot_successor_package_builder.py
          python -m py_compile tools/n3w_t1_f4_reboot_authority.py
          python -m py_compile tools/n3w_t1_f4_reboot_verify.py
          python -m py_compile tools/n3w_t1_f4_reboot_successor_postclaim_recovery.py

      - name: Ruff
        run: |
          ruff check \
            tools/n3w_t1_f4_activation_host.py \
            tools/n3w_t1_f4_package_builder.py \
            tests/tools/test_n3w_t1_f4_activation_host.py \
            tests/tools/test_n3w_t1_f4_certificate_runtime_guard.py \
            tests/tools/test_n3w_t1_f4_package_builder.py \
            tools/n3w_t1_f4_certificate_runtime_guard.py \
            tools/n3w_t1_f4_reboot_successor_package_builder.py \
            tools/n3w_t1_f4_reboot_authority.py \
            tools/n3w_t1_f4_reboot_verify.py \
            tools/n3w_t1_f4_reboot_successor_postclaim_recovery.py \
            tests/tools/test_n3w_t1_f4_reboot_authority.py \
            tests/tools/test_n3w_t1_f4_reboot_verify.py \
            tests/tools/test_n3w_t1_f4_reboot_successor_postclaim_recovery.py \
            tests/tools/test_n3w_t1_f4_reboot_successor_package_builder.py

      - name: Focused F4 tests
        run: |
          pytest -q \
            tests/tools/test_n3w_t1_f4_activation_host.py \
            tests/tools/test_n3w_t1_f4_certificate_runtime_guard.py \
            tests/tools/test_n3w_t1_f4_reboot_authority.py \
            tests/tools/test_n3w_t1_f4_reboot_verify.py \
            tests/tools/test_n3w_t1_f4_reboot_successor_package_builder.py \
            host/greenhouse-manager/tests/bootstrap/test_device_provisioning_runtime.py \
            tests/tools/test_n3w_broker_certificate_lifecycle.py \
            tests/tools/test_n3w_broker_ingress_guard_lifecycle.py

      - name: Static F3 to F4 boundary
        run: |
          grep -Fq 'eligibility --phase broker' infra/n3w-t1/f4/n3wfc4-broker-activation.service
          grep -Fq 'eligibility --phase services' infra/n3w-t1/f4/n3wfc4-services-activation.service
          grep -Fq 'eligibility --phase certificate' infra/n3w-t1/f4/n3wfc4-broker-certificate-lifecycle.service
          grep -Fq 'N3WFC4_CERT_ALLOWED_ROOT_BROKER_CA' infra/n3w-t1/f4/n3wfc4-broker-certificate-lifecycle.service
          grep -Fq 'ExecStartPre=' infra/n3w-t1/f4/reboot-successor/n3wfc4-broker-certificate-lifecycle.service.d/10-runtime-status-evolution.conf
          grep -Fq 'n3w-t1-f4-certificate-runtime-guard check' infra/n3w-t1/f4/reboot-successor/n3wfc4-broker-certificate-lifecycle.service.d/10-runtime-status-evolution.conf
          ! grep -Fq 'enable --now' infra/n3w-t1/activate-systemd-production.sh
          ! grep -Fq 'systemctl start' infra/n3w-t1/activate-systemd-production.sh
          ! grep -Fq 'systemctl restart' infra/n3w-t1/activate-systemd-production.sh

      - name: Provisioning replay remains absent
        run: |
          ! grep -Fq 'START DEVICE PROVISIONING: YES' tools/n3w_t1_f4_activation_host.py
          ! grep -Fq 'PROVISION_CLI), "start"' tools/n3w_t1_f4_activation_host.py
