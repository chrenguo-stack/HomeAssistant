name: N3W T1 F4 exact control package

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-f4-exact-control-package.yml"
      - "tools/n3w_t1_f4_activation_host.py"
      - "tools/n3w_t1_f4_package_builder.py"
      - "infra/n3w-t1/f4/**"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-f4-exact-control-package.yml"
      - "tools/n3w_t1_f4_activation_host.py"
      - "tools/n3w_t1_f4_package_builder.py"
      - "infra/n3w-t1/f4/**"
      - "infra/n3w-t1/systemd/n3wfc4-broker-certificate-lifecycle.timer"
      - "infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard"
      - "tools/n3w_t1_broker_authenticated_readiness.py"
      - "tools/n3w_broker_certificate_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-f4-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exact package
        run: |
          mkdir -p out
          python tools/n3w_t1_f4_package_builder.py \
            --repository . \
            --destination out/f4-package \
            --source-head "$SOURCE_HEAD" \
            > out/build-report.json

      - name: Verify package against F4 consumer
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("out/build-report.json").read_text())
          assert report["status"] == "PASS"
          assert report["source_head"] == os.environ["SOURCE_HEAD"]

          manifest = Path("out/f4-package/f4-package-manifest.json")
          manifest_sha = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert manifest_sha == report["manifest_sha256"]

          path = Path("tools/n3w_t1_f4_activation_host.py")
          spec = importlib.util.spec_from_file_location("f4_consumer", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          verified = module._validate_package(
              Path("out/f4-package"),
              expected_manifest_sha256=manifest_sha,
              expected_source_head=os.environ["SOURCE_HEAD"],
          )
          assert verified["source_head"] == os.environ["SOURCE_HEAD"]
          assert verified["manifest_sha256"] == manifest_sha
          PY

      - name: Seal transport tar
        run: |
          tar -C out -cf out/n3w-t1-f4-control-package.tar f4-package
          sha256sum out/n3w-t1-f4-control-package.tar \
            > out/n3w-t1-f4-control-package.tar.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f4-control-package-${{ env.SOURCE_HEAD }}
          path: |
            out/n3w-t1-f4-control-package.tar
            out/n3w-t1-f4-control-package.tar.sha256
            out/build-report.json
          if-no-files-found: error
          retention-days: 14
