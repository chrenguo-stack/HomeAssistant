name: N3W T1 F5 exact production release CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-f5-exact-production-release-ci.yml"
      - "tools/n3w_t1_f5_release_builder.py"
      - "tests/tools/test_n3w_t1_f5_release_builder.py"
      - "docs/development/N3W_T1_F5_EXACT_PRODUCTION_RELEASE_BUILD_AND_BINDING_PREPARATION_20261018.md"
      - "docs/development/N3W_T1_F5_7_EXACT_PRODUCTION_RELEASE_BUILD_AND_BINDING_PREPARATION_20261019.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-f5-exact-production-release-ci.yml"
      - "tools/n3w_t1_f5_release_builder.py"
      - "tests/tools/test_n3w_t1_f5_release_builder.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-production-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_HEAD: 4afd89b56e9925d7330b27f3f734ebcefc09182c
      SOURCE_TREE: da864ffb6c44de3efccb93516e5e786f16219cd9
      F3_RUN_ID: "39213902773"
      F3_ARTIFACT_ID: "12169550382"
      F3_ARTIFACT_SHA256: 6c227fc9b1d45a289791439a8374825a8bd6d62178ea2123d3b292cd5b36fe9c
      DOCKER_PACKAGE_VERSION: 29.1.3-0ubuntu4.1
      COMPOSE_PACKAGE_VERSION: 2.40.3+ds1-0ubuntu1
      ENVIRONMENT_AUTHORITY: docs/development/N3W_T1_PER_DEVICE_FRESH_ARMBIAN_AUTOMATED_DEPLOYMENT_F3_R2_LIVE_APPLY_PREEXECUTION_NEW_CHAT_HANDOFF_V1.0_20261014.md

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release builder unit tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m pytest -q tests/tools/test_n3w_t1_f5_release_builder.py
          python -m py_compile tools/n3w_t1_f5_release_builder.py

      - name: Checkout exact frozen product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          path: frozen-source

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git -C frozen-source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C frozen-source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          printf 'SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
          printf 'SOURCE_TREE=%s\n' "$SOURCE_TREE"

      - name: Build exact F4 and reboot packages from frozen product source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f4-input"
          python frozen-source/tools/n3w_t1_f4_package_builder.py             --repository frozen-source             --destination "$RUNNER_TEMP/f4-input/f4-package"             --source-head "$SOURCE_HEAD"             > "$RUNNER_TEMP/f4-input/build-report.json"
          python frozen-source/tools/n3w_t1_f4_reboot_successor_package_builder.py             --repository frozen-source             --destination "$RUNNER_TEMP/f4-input/reboot-successor-control"             --source-head "$SOURCE_HEAD"             > "$RUNNER_TEMP/f4-input/reboot-successor-build-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "f4-input"
          source = os.environ["SOURCE_HEAD"]
          f4 = json.loads((root / "build-report.json").read_text())
          reboot = json.loads((root / "reboot-successor-build-report.json").read_text())
          assert f4["status"] == "PASS"
          assert f4["source_head"] == source
          assert f4["secret_values_included"] is False
          assert f4["board_access"] is False
          assert reboot["status"] == "PASS"
          assert reboot["source_head"] == source
          assert reboot["board_access"] is False
          PY
          tar -C "$RUNNER_TEMP/f4-input" -cf "$RUNNER_TEMP/f4-input/n3w-t1-f4-control-package.tar" f4-package
          sha256sum "$RUNNER_TEMP/f4-input/n3w-t1-f4-control-package.tar"             > "$RUNNER_TEMP/f4-input/n3w-t1-f4-control-package.tar.sha256"
          tar -C "$RUNNER_TEMP/f4-input" -cf "$RUNNER_TEMP/f4-input/n3w-t1-f4-reboot-successor-control.tar" reboot-successor-control
          sha256sum "$RUNNER_TEMP/f4-input/n3w-t1-f4-reboot-successor-control.tar"             > "$RUNNER_TEMP/f4-input/n3w-t1-f4-reboot-successor-control.tar.sha256"
          printf 'EXACT_F4_REBOOT_LOCAL_BUILD=PASS\n'

      - name: Upload exact F4 source-bound input
        id: upload_f4
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f4-control-package-${{ env.SOURCE_HEAD }}
          path: |
            ${{ runner.temp }}/f4-input/n3w-t1-f4-control-package.tar
            ${{ runner.temp }}/f4-input/n3w-t1-f4-control-package.tar.sha256
            ${{ runner.temp }}/f4-input/build-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload exact reboot source-bound input
        id: upload_reboot
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f4-reboot-successor-control-${{ env.SOURCE_HEAD }}
          path: |
            ${{ runner.temp }}/f4-input/n3w-t1-f4-reboot-successor-control.tar
            ${{ runner.temp }}/f4-input/n3w-t1-f4-reboot-successor-control.tar.sha256
            ${{ runner.temp }}/f4-input/reboot-successor-build-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download exact source-bound input artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          F4_ARTIFACT_ID_INPUT: ${{ steps.upload_f4.outputs.artifact-id }}
          F4_ARTIFACT_DIGEST_INPUT: ${{ steps.upload_f4.outputs.artifact-digest }}
          REBOOT_ARTIFACT_ID_INPUT: ${{ steps.upload_reboot.outputs.artifact-id }}
          REBOOT_ARTIFACT_DIGEST_INPUT: ${{ steps.upload_reboot.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/$F3_ARTIFACT_ID/zip" -o "$RUNNER_TEMP/f3.zip"
          curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/$F4_ARTIFACT_ID_INPUT/zip" -o "$RUNNER_TEMP/f4.zip"
          curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/$REBOOT_ARTIFACT_ID_INPUT/zip" -o "$RUNNER_TEMP/reboot.zip"
          f4_sha="${F4_ARTIFACT_DIGEST_INPUT#sha256:}"
          reboot_sha="${REBOOT_ARTIFACT_DIGEST_INPUT#sha256:}"
          test "$(sha256sum "$RUNNER_TEMP/f3.zip" | awk '{print $1}')" = "$F3_ARTIFACT_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/f4.zip" | awk '{print $1}')" = "$f4_sha"
          test "$(sha256sum "$RUNNER_TEMP/reboot.zip" | awk '{print $1}')" = "$reboot_sha"
          printf 'F4_ARTIFACT_ID=%s\n' "$F4_ARTIFACT_ID_INPUT" >> "$GITHUB_ENV"
          printf 'F4_ARTIFACT_SHA256=%s\n' "$f4_sha" >> "$GITHUB_ENV"
          printf 'REBOOT_ARTIFACT_ID=%s\n' "$REBOOT_ARTIFACT_ID_INPUT" >> "$GITHUB_ENV"
          printf 'REBOOT_ARTIFACT_SHA256=%s\n' "$reboot_sha" >> "$GITHUB_ENV"
          printf 'EXACT_INPUT_ARTIFACT_BINDING=PASS\n'

      - name: Build exact approved production release candidate
        env:
          BUILDER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python tools/n3w_t1_f5_release_builder.py build             --source-root frozen-source             --output-root "$RUNNER_TEMP/release"             --source-head "$SOURCE_HEAD"             --source-tree "$SOURCE_TREE"             --builder-head "$BUILDER_HEAD"             --f3-artifact "$RUNNER_TEMP/f3.zip"             --f3-artifact-sha256 "$F3_ARTIFACT_SHA256"             --f3-run-id "$F3_RUN_ID"             --f3-artifact-id "$F3_ARTIFACT_ID"             --f4-artifact "$RUNNER_TEMP/f4.zip"             --f4-artifact-sha256 "$F4_ARTIFACT_SHA256"             --f4-run-id "$GITHUB_RUN_ID"             --f4-artifact-id "$F4_ARTIFACT_ID"             --reboot-artifact "$RUNNER_TEMP/reboot.zip"             --reboot-artifact-sha256 "$REBOOT_ARTIFACT_SHA256"             --reboot-artifact-id "$REBOOT_ARTIFACT_ID"             --docker-package-version "$DOCKER_PACKAGE_VERSION"             --compose-package-version "$COMPOSE_PACKAGE_VERSION"             --environment-authority "$ENVIRONMENT_AUTHORITY"             | tee "$RUNNER_TEMP/release-build-result.json"
          python tools/n3w_t1_f5_release_builder.py verify --release-root "$RUNNER_TEMP/release"
          RELEASE_ID="$(python -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/release/approved-release.json"))["release_id"])')"
          RELEASE_SHA256="$(cat "$RUNNER_TEMP/release/approved-release.sha256")"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA256=%s\n' "$RELEASE_SHA256" >> "$GITHUB_ENV"
          printf 'F5_EXACT_RELEASE_LOCAL_VERIFY=PASS\n'

      - name: Upload exact release candidate
        id: upload_release
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f5-approved-release-${{ env.SOURCE_HEAD }}
          path: ${{ runner.temp }}/release/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Re-download exact release candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload_release.outputs.artifact-id }}
          path: ${{ runner.temp }}/redownload
          merge-multiple: true

      - name: Verify post-upload release binding
        env:
          ARTIFACT_ID: ${{ steps.upload_release.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_release.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/redownload/approved-release.sha256")" = "$RELEASE_SHA256"
          python tools/n3w_t1_f5_release_builder.py verify --release-root "$RUNNER_TEMP/redownload"
          test "$(python -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/redownload/approved-release.json"))["release_id"])')" = "$RELEASE_ID"
          printf 'SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
          printf 'SOURCE_TREE=%s\n' "$SOURCE_TREE"
          printf 'F3_ARTIFACT_ID=%s\n' "$F3_ARTIFACT_ID"
          printf 'F4_ARTIFACT_ID=%s\n' "$F4_ARTIFACT_ID"
          printf 'REBOOT_ARTIFACT_ID=%s\n' "$REBOOT_ARTIFACT_ID"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID"
          printf 'RELEASE_SHA256=%s\n' "$RELEASE_SHA256"
          printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'F5_EXACT_RELEASE_POST_UPLOAD_BINDING=PASS\n'
          printf 'T1_ACCESS=false\n'
          printf 'T1_MUTATION=false\n'
          printf 'LIVE_REBOOT=false\n'
          printf 'BOARD_ACCESS=false\n'
