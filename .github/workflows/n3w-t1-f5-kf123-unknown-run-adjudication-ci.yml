name: N3W T1 F5 KF123 UNKNOWN run adjudication CI

on:
  pull_request:
    paths:
      - "tools/n3w_t1_f5_unknown_run_adjudicator.py"
      - "tools/n3w_t1_production_authority.py"
      - "tools/n3w_t1_production_contract.py"
      - "tests/tools/test_n3w_t1_f5_unknown_run_adjudicator.py"
      - ".github/workflows/n3w-t1-f5-kf123-unknown-run-adjudication-ci.yml"
      - "docs/development/N3W_T1_F5_KF123_UNKNOWN_RUN_CONTROLLED_RECOVERY_DESIGN_20261019.md"
  push:
    branches:
      - "fix/n3w-t1-f5-kf123-unknown-run-adjudication-20261019"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m py_compile tools/n3w_t1_f5_unknown_run_adjudicator.py tools/n3w_t1_production_authority.py tools/n3w_t1_production_contract.py
          python -m pytest -q tests/tools/test_n3w_t1_f5_unknown_run_adjudicator.py
      - name: Static mutation boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("tools/n3w_t1_f5_unknown_run_adjudicator.py").read_text()
          required = (
              'PHASE = "F3_DEPLOY"',
              'updated_phase["state"] = "FAILED"',
              'updated_run["failure_class"] = "FAILED"',
              '"f5_production_authority_and_adjudication_ledger_only"',
              '"product_service_start": False',
              '"reboot_executed": False',
              '"board_access": False',
          )
          for value in required:
              assert value in source
          forbidden = (
              "docker load",
              "docker pull",
              "docker compose up",
              "docker rm",
              "docker rmi",
              "docker volume rm",
              "docker network rm",
              "systemctl start",
              "systemctl enable",
              "systemctl reboot",
              "shutdown -r",
              "apt-get",
              "apt install",
              "execute_production_apply",
              "claim_phase(",
              "begin_phase(",
              "approve_run(",
          )
          for value in forbidden:
              assert value not in source
          PY
          printf 'T1_ACCESS=false\n'
          printf 'LIVE_RUNTIME_MUTATION=false\n'
          printf 'BOARD_ACCESS=false\n'
      - name: Build exact adjudication package
        env:
          PACKAGE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package"
          mkdir -p "$root"
          cp tools/n3w_t1_f5_unknown_run_adjudicator.py "$root/"
          cp tools/n3w_t1_production_authority.py "$root/"
          cp tools/n3w_t1_production_contract.py "$root/"
          python - "$root" "$PACKAGE_SOURCE_HEAD" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          source_head = sys.argv[2]
          files = []
          for path in sorted(root.iterdir()):
              raw = path.read_bytes()
              files.append(
                  {
                      "path": path.name,
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "size": len(raw),
                  }
              )
          manifest = {
              "schema": "gh.n3w-t1-f5-kf123-unknown-run-adjudication-package/1",
              "source_head": source_head,
              "historical_run_id": "3e37993537f9317dfb8070fd53fa20384de86cbd7c2a234857b55602c1280799",
              "phase": "F3_DEPLOY",
              "failing_source_head": "9048dd7c6b48c0620471919c0cf96c96bdab71f1",
              "failing_release_id": "31c8a8cd2d8424f93aaa7b4d0b78cfe2b73f1b035f4bdbce08a181ac56619420",
              "mutation_scope": "f5_production_authority_and_adjudication_ledger_only",
              "files": files,
              "t1_access": False,
              "live_runtime_mutation": False,
              "board_access": False,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python - "$root" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text())
          for record in manifest["files"]:
              path = root / record["path"]
              raw = path.read_bytes()
              assert len(raw) == record["size"]
              assert hashlib.sha256(raw).hexdigest() == record["sha256"]
          print("ADJUDICATION_PACKAGE_LOCAL_VERIFY=PASS")
          PY
      - name: Upload exact adjudication package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f5-kf123-unknown-run-adjudicator-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/package/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Report exact adjudication artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'ADJUDICATION_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'ADJUDICATION_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'T1_ACCESS=false\n'
          printf 'LIVE_RUNTIME_MUTATION=false\n'
          printf 'BOARD_ACCESS=false\n'
