name: N3W T1 F5 production process V1 source CI

on:
  pull_request:
    paths:
      - "tools/n3w_t1_production.py"
      - "tools/n3w_t1_production_authority.py"
      - "tools/n3w_t1_ssh_transport.py"
      - "tools/n3w_t1_production_contract.py"
      - "tests/tools/test_n3w_t1_production.py"
      - "tests/tools/test_n3w_t1_production_authority.py"
      - "tests/tools/test_n3w_t1_ssh_transport.py"
      - "tests/tools/test_n3w_t1_production_contract.py"
      - ".github/workflows/n3w-t1-f5-production-process-v1-source-ci.yml"
  push:
    branches:
      - "feat/n3w-t1-f5-production-process-v1-source-20261017"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile
        run: |
          python -m py_compile             tools/n3w_t1_production.py             tools/n3w_t1_production_authority.py             tools/n3w_t1_ssh_transport.py             tools/n3w_t1_production_contract.py
      - name: Focused tests
        run: |
          python -m pytest -q             tests/tools/test_n3w_t1_production.py             tests/tools/test_n3w_t1_production_authority.py             tests/tools/test_n3w_t1_ssh_transport.py             tests/tools/test_n3w_t1_production_contract.py
      - name: Real sshd transport integration
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server
          fi

          SSHD_DIR="$RUNNER_TEMP/n3w-f5-sshd"
          TEST_USER="n3wf5ci"
          TEST_PASSWORD="n3w-ci-password-2026"
          mkdir -p "$SSHD_DIR"
          ssh-keygen -q -t ed25519 -N "" -f "$SSHD_DIR/ssh_host_ed25519_key"
          sudo chown root:root "$SSHD_DIR/ssh_host_ed25519_key"
          sudo chmod 600 "$SSHD_DIR/ssh_host_ed25519_key"
          awk '{print "127.0.0.1 " $1 " " $2}'             "$SSHD_DIR/ssh_host_ed25519_key.pub" > "$SSHD_DIR/known_hosts"
          chmod 600 "$SSHD_DIR/known_hosts"

          if id "$TEST_USER" >/dev/null 2>&1; then
            sudo userdel -r "$TEST_USER" || true
          fi
          sudo useradd --create-home --shell /bin/bash "$TEST_USER"
          printf '%s:%s\n' "$TEST_USER" "$TEST_PASSWORD" | sudo chpasswd
          sudo mkdir -p /run/sshd

          cat > "$SSHD_DIR/sshd_config" <<EOF
          Port 22
          ListenAddress 127.0.0.1
          AddressFamily inet
          HostKey $SSHD_DIR/ssh_host_ed25519_key
          PidFile $SSHD_DIR/sshd.pid
          UsePAM no
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication no
          PermitRootLogin no
          PermitEmptyPasswords no
          AllowUsers $TEST_USER
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          cleanup() {
            if [[ -f "$SSHD_DIR/sshd.pid" ]]; then
              sudo kill "$(cat "$SSHD_DIR/sshd.pid")" || true
            fi
            sudo userdel -r "$TEST_USER" || true
          }
          trap cleanup EXIT

          sudo systemctl stop ssh.socket ssh.service 2>/dev/null || true
          sudo service ssh stop 2>/dev/null || true
          port_free=false
          for _ in $(seq 1 20); do
            if ! sudo ss -ltn | grep -Eq 'LISTEN.+:22[[:space:]]'; then
              port_free=true
              break
            fi
            sleep 0.25
          done
          if [[ "$port_free" != "true" ]]; then
            sudo ss -ltnp || true
            echo "port 22 still in use after stopping runner ssh service"
            exit 1
          fi
          sudo /usr/sbin/sshd -t -f "$SSHD_DIR/sshd_config"
          sudo /usr/sbin/sshd -f "$SSHD_DIR/sshd_config" -E "$SSHD_DIR/sshd.log"

          ready=false
          for _ in $(seq 1 20); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            cat "$SSHD_DIR/sshd.log" || true
            exit 1
          fi

          N3W_REAL_SSHD_INTEGRATION=1           N3W_REAL_SSHD_TARGET="$TEST_USER@127.0.0.1"           N3W_REAL_SSHD_KNOWN_HOSTS="$SSHD_DIR/known_hosts"           N3W_REAL_SSHD_PASSWORD="$TEST_PASSWORD"             python -m pytest -q               tests/tools/test_n3w_t1_ssh_transport.py               -k real_sshd

      - name: Static contract guards
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path("tools/n3w_t1_production.py").read_text()
          authority = Path("tools/n3w_t1_production_authority.py").read_text()
          transport = Path("tools/n3w_t1_ssh_transport.py").read_text()
          assert "repair-" not in production
          assert '"replay_allowed": False' in authority
          assert '"UNKNOWN"' in authority
          assert "PasswordAuthentication=no" in transport
          assert "KbdInteractiveAuthentication=no" in transport
          PY
