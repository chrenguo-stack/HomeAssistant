name: N3W T1 F5 V2 exact release inputs CI

on:
  workflow_dispatch:
    inputs:
      f3_run_id:
        description: "Successful exact-main F3 deployable payload run"
        required: true
        type: string
      f4_run_id:
        description: "Successful exact-main F4 control package run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  exact-release-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      F3_RUN_ID: ${{ inputs.f3_run_id }}
      F4_RUN_ID: ${{ inputs.f4_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce exact merged-main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact upstream artifact provenance
        run: |
          set -euo pipefail
          F3_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$F3_RUN_ID")"
          F4_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$F4_RUN_ID")"

          test "$(jq -r '.path' <<<"$F3_JSON")" = ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
          test "$(jq -r '.path' <<<"$F4_JSON")" = ".github/workflows/n3w-t1-f4-exact-control-package.yml"

          for RUN_JSON in "$F3_JSON" "$F4_JSON"; do
            test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$GITHUB_SHA"
            test "$(jq -r '.head_branch' <<<"$RUN_JSON")" = "main"
            test "$(jq -r '.status' <<<"$RUN_JSON")" = "completed"
            test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
            case "$(jq -r '.event' <<<"$RUN_JSON")" in
              push|workflow_dispatch) ;;
              *) exit 1 ;;
            esac
          done

          F3_NAME="n3w-t1-fresh-bootstrap-deployable-$GITHUB_SHA"
          F4_NAME="n3w-t1-f4-control-package-$GITHUB_SHA"
          REBOOT_NAME="n3w-t1-f4-reboot-successor-control-$GITHUB_SHA"

          F3_ARTIFACTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$F3_RUN_ID/artifacts?per_page=100")"
          F4_ARTIFACTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$F4_RUN_ID/artifacts?per_page=100")"

          test "$(jq --arg name "$F3_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$F3_ARTIFACTS")" = "1"
          test "$(jq --arg name "$F4_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$F4_ARTIFACTS")" = "1"
          test "$(jq --arg name "$REBOOT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$F4_ARTIFACTS")" = "1"

          printf 'F3_ARTIFACT_NAME=%s\n' "$F3_NAME" >> "$GITHUB_ENV"
          printf 'F4_ARTIFACT_NAME=%s\n' "$F4_NAME" >> "$GITHUB_ENV"
          printf 'REBOOT_ARTIFACT_NAME=%s\n' "$REBOOT_NAME" >> "$GITHUB_ENV"

      - name: Download exact upstream artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f3" "$RUNNER_TEMP/f4" "$RUNNER_TEMP/reboot"
          gh run download "$F3_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$F3_ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/f3"
          gh run download "$F4_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$F4_ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/f4"
          gh run download "$F4_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$REBOOT_ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/reboot"

      - name: Build exact V2 release inputs
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          python tools/n3w_t1_f5_v2_release_inputs_builder.py build \
            --repository . \
            --profile infra/n3w-t1/production/f5-v2-release-profile.json \
            --f3-dir "$RUNNER_TEMP/f3" \
            --f4-dir "$RUNNER_TEMP/f4" \
            --reboot-dir "$RUNNER_TEMP/reboot" \
            --destination "$RUNNER_TEMP/release-inputs" \
            --source-head "$GITHUB_SHA" \
            --source-tree "$SOURCE_TREE" \
            --production-authority
          python tools/n3w_t1_f5_v2_release_inputs_builder.py verify \
            --destination "$RUNNER_TEMP/release-inputs"

      - name: Upload exact V2 release inputs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-f5-v2-release-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/release-inputs/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Re-download and verify exact V2 release inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-inputs-redownload
          merge-multiple: true

      - name: Verify post-upload input binding
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python tools/n3w_t1_f5_v2_release_inputs_builder.py verify \
            --destination "$RUNNER_TEMP/release-inputs-redownload"
          test "$(python -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/release-inputs-redownload/release-inputs.json"))["source_head"])')" = "$GITHUB_SHA"
          printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'EXACT_RELEASE_INPUTS_POST_UPLOAD_BINDING=PASS\n'
          printf 'T1_ACCESS=false\n'
          printf 'T1_MUTATION=false\n'
          printf 'LIVE_RUNTIME_MUTATION=false\n'
          printf 'BOARD_ACCESS=false\n'
