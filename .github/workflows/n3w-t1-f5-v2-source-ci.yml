name: N3W T1 F5 V2 source CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-f5-v2-source-ci.yml"
      - ".github/workflows/n3w-t1-f5-v2-exact-production-release-ci.yml"
      - ".github/workflows/n3w-t1-f5-v2-release-inputs-ci.yml"
      - ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
      - "tools/n3w_t1_production_v2_contract.py"
      - "tools/n3w_t1_ssh_transport.py"
      - "tools/n3w_t1_fresh_armbian_qualification.py"
      - "tools/n3w_t1_production_marker.py"
      - "tools/n3w_t1_failure_forensics.py"
      - "tools/n3w_t1_production_v2.py"
      - "tools/n3w_t1_production_v2_executor.py"
      - "tools/n3w_t1_f5_v2_release_builder.py"
      - "tools/n3w_t1_f5_v2_release_inputs_builder.py"
      - "tools/n3w_t1_post_reboot_acceptance.py"
      - "tools/n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_mqtt_nondisruptive_integration.py"
      - "tools/n3w_t1_fresh_host_baseline.py"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tests/tools/test_n3w_t1_production_v2_contract.py"
      - "tests/tools/test_n3w_t1_ssh_transport.py"
      - "tests/tools/test_n3w_t1_fresh_armbian_qualification.py"
      - "tests/tools/test_n3w_t1_production_marker.py"
      - "tests/tools/test_n3w_t1_failure_forensics.py"
      - "tests/tools/test_n3w_t1_production_v2.py"
      - "tests/tools/test_n3w_t1_production_v2_executor.py"
      - "tests/tools/test_n3w_t1_f5_v2_release_builder.py"
      - "tests/tools/test_n3w_t1_f5_v2_release_inputs_builder.py"
      - "tests/tools/test_n3w_t1_post_reboot_acceptance.py"
      - "tests/tools/test_n3w_t1_fresh_host_baseline.py"
      - "tests/tools/test_n3w_t1_fresh_product_bootstrap.py"
      - "tests/tools/test_n3w_t1_fresh_product_staging_host.py"
      - "infra/n3w-t1/production/f5-v2-release-profile.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/n3w-t1-f5-v2-source-ci.yml"
      - ".github/workflows/n3w-t1-f5-v2-exact-production-release-ci.yml"
      - ".github/workflows/n3w-t1-f5-v2-release-inputs-ci.yml"
      - ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
      - "tools/n3w_t1_production_v2_contract.py"
      - "tools/n3w_t1_f5_v2_release_builder.py"
      - "tools/n3w_t1_f5_v2_release_inputs_builder.py"
      - "tools/n3w_t1_post_reboot_acceptance.py"
      - "tools/n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_f4_reboot_verify.py"
      - "tests/tools/test_n3w_t1_mqtt_nondisruptive_integration.py"
      - "tools/n3w_t1_ssh_transport.py"
      - "tools/n3w_t1_fresh_armbian_qualification.py"
      - "tools/n3w_t1_production_marker.py"
      - "tools/n3w_t1_failure_forensics.py"
      - "tools/n3w_t1_production_v2.py"
      - "tools/n3w_t1_production_v2_executor.py"
      - "tools/n3w_t1_fresh_host_baseline.py"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tests/tools/test_n3w_t1_production_v2_contract.py"
      - "tests/tools/test_n3w_t1_ssh_transport.py"
      - "tests/tools/test_n3w_t1_fresh_armbian_qualification.py"
      - "tests/tools/test_n3w_t1_production_marker.py"
      - "tests/tools/test_n3w_t1_failure_forensics.py"
      - "tests/tools/test_n3w_t1_production_v2.py"
      - "tests/tools/test_n3w_t1_production_v2_executor.py"
      - "tests/tools/test_n3w_t1_f5_v2_release_builder.py"
      - "tests/tools/test_n3w_t1_f5_v2_release_inputs_builder.py"
      - "tests/tools/test_n3w_t1_post_reboot_acceptance.py"
      - "tests/tools/test_n3w_t1_fresh_host_baseline.py"
      - "tests/tools/test_n3w_t1_fresh_product_bootstrap.py"
      - "tests/tools/test_n3w_t1_fresh_product_staging_host.py"
      - "infra/n3w-t1/production/f5-v2-release-profile.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  r1-foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Compile R1 foundations
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/n3w_t1_production_v2_contract.py \
            tools/n3w_t1_ssh_transport.py \
            tools/n3w_t1_fresh_armbian_qualification.py \
            tools/n3w_t1_production_marker.py \
            tools/n3w_t1_failure_forensics.py

      - name: Run R1 foundation tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/tools/test_n3w_t1_production_v2_contract.py \
            tests/tools/test_n3w_t1_ssh_transport.py \
            tests/tools/test_n3w_t1_fresh_armbian_qualification.py \
            tests/tools/test_n3w_t1_production_marker.py \
            tests/tools/test_n3w_t1_failure_forensics.py

      - name: Enforce R1 boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "n3w_t1_production_authority",
              "failed-run terminalizer",
              "unknown-run adjudication",
          )
          paths = [
              Path("tools/n3w_t1_production_v2_contract.py"),
              Path("tools/n3w_t1_fresh_armbian_qualification.py"),
              Path("tools/n3w_t1_production_marker.py"),
              Path("tools/n3w_t1_failure_forensics.py"),
          ]
          text = "\n".join(path.read_text(encoding="utf-8").casefold() for path in paths)
          for token in forbidden:
              assert token.casefold() not in text
          print("F5_V2_R1_BOUNDARY=PASS")
          print("T1_ACCESS=false")
          print("T1_MUTATION=false")
          print("BOARD_ACCESS=false")
          PY

  r2-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Compile R2 source
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/n3w_t1_production_v2.py \
            tools/n3w_t1_fresh_host_baseline.py \
            tools/n3w_t1_fresh_product_bootstrap.py \
            tools/n3w_t1_fresh_product_staging_host.py

      - name: Run R2 focused tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/tools/test_n3w_t1_production_v2.py \
            tests/tools/test_n3w_t1_fresh_host_baseline.py \
            tests/tools/test_n3w_t1_fresh_product_bootstrap.py \
            tests/tools/test_n3w_t1_fresh_product_staging_host.py

      - name: Enforce R2 boundary
        run: |
          set -euo pipefail
          python tools/n3w_t1_production_v2.py
          python - <<'PY'
          from pathlib import Path
          source = Path("tools/n3w_t1_production_v2.py").read_text(encoding="utf-8")
          assert "post_reboot_acceptance_complete" in source
          assert "R2_TERMINAL_STATE = \"REBOOT_PENDING\"" in source
          assert "repair-" not in source.split("def self_check(", 1)[0]
          print("F5_V2_R2_BOUNDARY=PASS")
          print("T1_ACCESS=false")
          print("T1_MUTATION=false")
          print("BOARD_ACCESS=false")
          PY


  r3-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Compile R3 source
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/n3w_t1_production_v2.py \
            tools/n3w_t1_production_v2_executor.py \
            tools/n3w_t1_post_reboot_acceptance.py \
            tools/n3w_t1_f5_v2_release_builder.py \
            tools/n3w_t1_f5_v2_release_inputs_builder.py

      - name: Run R3 focused tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/tools/test_n3w_t1_production_v2.py \
            tests/tools/test_n3w_t1_production_v2_executor.py \
            tests/tools/test_n3w_t1_post_reboot_acceptance.py \
            tests/tools/test_n3w_t1_f4_reboot_verify.py \
            tests/tools/test_n3w_t1_f5_v2_release_builder.py \
            tests/tools/test_n3w_t1_f5_v2_release_inputs_builder.py \
            tests/tools/test_n3w_t1_production_marker.py \
            tests/tools/test_n3w_t1_production_v2_contract.py

      - name: Enforce R3 boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          acceptance = Path("tools/n3w_t1_post_reboot_acceptance.py").read_text(
              encoding="utf-8"
          )
          production = Path("tools/n3w_t1_production_v2.py").read_text(
              encoding="utf-8"
          )
          executor = Path(
              "tools/n3w_t1_production_v2_executor.py"
          ).read_text(encoding="utf-8")
          exact_ci = Path(
              ".github/workflows/n3w-t1-f5-v2-exact-production-release-ci.yml"
          ).read_text(encoding="utf-8")
          producer_ci = Path(
              ".github/workflows/n3w-t1-f5-v2-release-inputs-ci.yml"
          ).read_text(encoding="utf-8")
          f3_ci = Path(
              ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
          ).read_text(encoding="utf-8")
          release_profile = Path(
              "infra/n3w-t1/production/f5-v2-release-profile.json"
          ).read_text(encoding="utf-8")

          required = (
              "TCP_8883",
              "TLS_CA",
              "TLS_HOSTNAME_SNI",
              "INVALID_CREDENTIAL_REJECTED",
              "HOMEASSISTANT_HTTP_READY",
          )
          for token in required:
              assert token in acceptance
          assert 'OBSERVATION_SECONDS = 90' in acceptance
          assert "R3Orchestrator" in production
          assert "POST_REBOOT_ACCEPTANCE_FAIL_REFLASH_REQUIRED" in production
          assert "PROCESS_CLEANUP_FAIL" in production
          assert "approval_callback" in production
          assert "REBOOT_CONTROL_INSTALL" in production
          assert "APPROVE N3W T1 F5 V2 PRODUCTION" in executor
          assert "--release-f3-payload" in executor
          assert "--release-f3-images" in executor
          assert "resume-if-needed" not in executor
          assert "repair-" not in executor
          r3_normal = production.split('R3_SCHEMA =', 1)[1]
          assert "repair-" not in r3_normal
          assert "resume-if-needed" not in r3_normal
          assert "workflow_dispatch:" in exact_ci
          assert "pull_request:" not in exact_ci
          assert 'refs/heads/main' in exact_ci
          assert "--production-authority" in exact_ci
          assert "EXPECTED_ARTIFACT_NAME=\"n3w-t1-f5-v2-release-inputs-$GITHUB_SHA\"" in exact_ci
          assert "'.head_sha'" in exact_ci
          assert "'.conclusion'" in exact_ci
          assert "MATCH_COUNT" in exact_ci
          release_builder = Path(
              "tools/n3w_t1_f5_v2_release_builder.py"
          ).read_text(encoding="utf-8")
          assert "release_inputs_source_head_mismatch" in release_builder
          assert "release_inputs_source_tree_mismatch" in release_builder
          assert "release_inputs_artifact_set_invalid" in release_builder
          assert ".github/workflows/n3w-t1-f5-v2-release-inputs-ci.yml" in exact_ci
          assert "workflow_dispatch" in producer_ci
          assert "pull_request:" not in producer_ci
          assert "\n  push:" not in producer_ci
          assert ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml" in producer_ci
          assert ".github/workflows/n3w-t1-f4-exact-control-package.yml" in producer_ci
          assert "n3w-t1-f5-v2-release-inputs-" in producer_ci
          assert "github.sha" in producer_ci
          assert "--production-authority" in producer_ci
          assert "workflow_dispatch:" in f3_ci
          assert '"schema": "gh.n3w-t1-production-v2-release-profile/1"' in release_profile
          release_inputs_builder = Path(
              "tools/n3w_t1_f5_v2_release_inputs_builder.py"
          ).read_text(encoding="utf-8")
          for token in (
              "production_source_not_exact_merged_main",
              "f3_image_sha256_mismatch",
              "f3_payload",
              "f3_image",
              "f4_control",
              "reboot_control",
              "v2_mac_tools",
              "transport_contract",
          ):
              assert token in release_inputs_builder

          print("F5_V2_R3_BOUNDARY=PASS")
          print("OBSERVATION_WINDOW_SECONDS=90")
          print("PR_RELEASE_PRODUCTION_AUTHORITY=false")
          print("T1_ACCESS=false")
          print("T1_MUTATION=false")
          print("BOARD_ACCESS=false")
          PY

  mqtt-nondisruptive-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated regression dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Pull exact disposable Mosquitto 2.1.2 image
        run: docker pull eclipse-mosquitto:2.1.2-alpine@sha256:3184566df484a083411a0e70e92c87a264b8f0648df632f10eb23d54d99f4549
      - name: Prove takeover regression and non-disruptive replacement on loopback
        env:
          N3W_ISOLATED_MQTT_TEST: "1"
        run: python -m pytest -q tests/tools/test_n3w_t1_mqtt_nondisruptive_integration.py
