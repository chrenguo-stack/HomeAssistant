name: N3W T1 first-pairing onboarding CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-first-pairing-onboarding-ci.yml"
      - "tools/n3w_t1_first_pairing_onboarding.py"
      - "tests/tools/test_n3w_t1_first_pairing_onboarding.py"
      - "infra/n3w-t1/production/docker-compose.yml"
      - "tools/n3w_t1_clean_product_deployment_gate.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_manager_runtime_wiring.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_discovery.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_product_runtime.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_dynamic_pairing_window.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_final_product_manager_wiring.py"
      - "docs/development/N3W_T1_FIRST_PAIRING_ONBOARDING_*.md"
      - "docs/development/N3W_MANAGER_DYNAMIC_FIRST_PAIRING_WINDOW_*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-first-pairing-onboarding-ci.yml"
      - "tools/n3w_t1_first_pairing_onboarding.py"
      - "tests/tools/test_n3w_t1_first_pairing_onboarding.py"
      - "infra/n3w-t1/production/docker-compose.yml"
      - "tools/n3w_t1_clean_product_deployment_gate.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_manager_runtime_wiring.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_discovery.py"
      - "host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_product_runtime.py"
      - "host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_dynamic_pairing_window.py"
      - "host/greenhouse-manager/tests/runtime/test_n3w_final_product_manager_wiring.py"
      - "docs/development/N3W_T1_FIRST_PAIRING_ONBOARDING_*.md"
      - "docs/development/N3W_MANAGER_DYNAMIC_FIRST_PAIRING_WINDOW_*.md"

permissions:
  contents: read

jobs:
  onboarding-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install -e 'host/greenhouse-manager[dev]'
          python -m pip install pytest ruff

      - name: Compile
        run: |
          python -m py_compile \
            tools/n3w_t1_first_pairing_onboarding.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_manager_runtime_wiring.py \
            host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py

      - name: Ruff
        run: |
          ruff check \
            tools/n3w_t1_first_pairing_onboarding.py \
            tests/tools/test_n3w_t1_first_pairing_onboarding.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py \
            host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_manager_runtime_wiring.py \
            host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py \
            host/greenhouse-manager/tests/runtime/test_n3w_dynamic_pairing_window.py \
            host/greenhouse-manager/tests/runtime/test_n3w_final_product_manager_wiring.py

      - name: Focused tests
        run: |
          pytest -q \
            tests/tools/test_n3w_t1_first_pairing_onboarding.py \
            host/greenhouse-manager/tests/runtime/test_n3w_dynamic_pairing_window.py \
            host/greenhouse-manager/tests/runtime/test_n3w_final_product_manager_wiring.py

      - name: Factory default remains pairing disabled
        run: |
          grep -Fq 'GH_N3W_PRODUCT_PAIRING_ENABLED: "false"' infra/n3w-t1/production/docker-compose.yml
          grep -Fq 'GH_N3W_NODE_BROKER_HOST: gate-f-unbound.invalid' infra/n3w-t1/production/docker-compose.yml
          grep -Fq 'GH_N3W_PAIRING_ADVERTISED_HOST: auto' infra/n3w-t1/production/docker-compose.yml
          grep -Fq 'GH_N3W_NODE_BROKER_TLS_SERVER_NAME: armbian' infra/n3w-t1/production/docker-compose.yml

      - name: Normal onboarding never recreates Manager
        run: |
          ! grep -Fq -- '--force-recreate' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq -- '--no-deps' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'manager-pairing.override' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq '_recreate_manager' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq '_restore_factory_manager' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq '"greenhouse-manager-pairing"' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq 'f"window-{command}"' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'docker system prune' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'docker compose down' tools/n3w_t1_first_pairing_onboarding.py

      - name: Manager owns the primary deadline
        run: |
          grep -Fq 'n3w-dynamic-pairing-deadline' host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py
          grep -Fq 'WATCHDOG_GRACE_SECONDS = 15' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq '"systemd-run"' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq '"--timer-property=AccuracySec=1s"' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq '"--property=Type=exec"' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'Restart=on-failure' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'RestartSec=' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq 'CLOSED_TIMEOUT' tools/n3w_t1_first_pairing_onboarding.py
          grep -Fq 'detail_sha256=' tools/n3w_t1_first_pairing_onboarding.py
          ! grep -Fq 'reason[:300]' tools/n3w_t1_first_pairing_onboarding.py

      - name: Pairing control and Setup Secret authorities stay separate
        run: |
          grep -Fq 'pairing-control.sock' host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_dynamic_pairing_window.py
          grep -Fq 'pairing.sock' host/greenhouse-manager/src/greenhouse_manager/runtime/config.py
          grep -Fq 'import_setup_secret_over_socket' host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py
          grep -Fq 'open_dynamic_pairing_window_over_socket' host/greenhouse-manager/src/greenhouse_manager/ops/n3w_pairing_cli.py
          grep -Fq 'resolve_route_selected_ipv4' host/greenhouse-manager/src/greenhouse_manager/runtime/n3w_simplified_discovery.py
