          PY

          test -z "$(docker ps -aq --filter 'name=n3w-fresh-')"

          python tools/n3w_t1_fresh_product_bootstrap.py             --payload-root "$PAYLOAD"             --phase self-check
          test -z "$(find "$PAYLOAD" -type f -path '*/__pycache__/*' -print -quit)"

          MANIFEST_SHA="$(sha256sum "$PAYLOAD/payload-manifest.json" | awk '{print $1}')"
          ARCHIVE="$RUNNER_TEMP/fresh-bootstrap-payload.tar.gz"
          tar -C "$PAYLOAD" -czf "$ARCHIVE" .
          ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          cp "$ARCHIVE" "$RUNNER_TEMP/payload-archive.tar.gz"
          printf '%s\n' "$ARCHIVE_SHA" > "$RUNNER_TEMP/payload-archive.sha256"
          printf '%s\n' "$MANIFEST_SHA" > "$RUNNER_TEMP/payload-manifest.sha256"
          sha256sum "$PAYLOAD/tools/n3w_t1_fresh_product_bootstrap.py" | awk '{print $1}' > "$RUNNER_TEMP/executor.sha256"
          cp tools/n3w_t1_fresh_product_staging_host.py "$RUNNER_TEMP/host-wrapper.py"
          sha256sum "$RUNNER_TEMP/host-wrapper.py" | awk '{print $1}' > "$RUNNER_TEMP/host-wrapper.sha256"
          printf 'PAYLOAD_ARCHIVE_SHA256=%s\n' "$ARCHIVE_SHA"
          printf 'PAYLOAD_MANIFEST_SHA256=%s\n' "$MANIFEST_SHA"

      - name: Upload fresh deployable payload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: n3w-t1-fresh-bootstrap-deployable-${{ env.SOURCE_HEAD }}
          path: |
            ${{ runner.temp }}/payload-archive.tar.gz
            ${{ runner.temp }}/payload-archive.sha256
            ${{ runner.temp }}/executor.sha256
            ${{ runner.temp }}/payload-manifest.sha256
            ${{ runner.temp }}/host-wrapper.py
            ${{ runner.temp }}/host-wrapper.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Download uploaded artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/redownload
          merge-multiple: true

      - name: Verify post-upload binding
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/redownload/payload-archive.tar.gz" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/redownload/payload-archive.sha256")"
          test "$(sha256sum "$RUNNER_TEMP/redownload/host-wrapper.py" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/redownload/host-wrapper.sha256")"
          python - "$RUNNER_TEMP/redownload" <<'PY'
          import hashlib
          import tarfile
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = {
              "payload-archive.tar.gz",
              "payload-archive.sha256",
              "payload-manifest.sha256",
              "executor.sha256",
              "host-wrapper.py",
              "host-wrapper.sha256",
          }
          assert {path.name for path in root.iterdir()} == expected

          archive = root / "payload-archive.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              manifest_members = [
                  member
                  for member in bundle.getmembers()
                  if member.name.lstrip("./") == "payload-manifest.json"
              ]
              executor_members = [
                  member
                  for member in bundle.getmembers()
                  if member.name.lstrip("./")
                  == "tools/n3w_t1_fresh_product_bootstrap.py"
              ]
              assert len(manifest_members) == 1
              assert len(executor_members) == 1
              manifest_stream = bundle.extractfile(manifest_members[0])
              executor_stream = bundle.extractfile(executor_members[0])
              assert manifest_stream is not None
              assert executor_stream is not None
              manifest_sha = hashlib.sha256(manifest_stream.read()).hexdigest()
              executor_sha = hashlib.sha256(executor_stream.read()).hexdigest()

          assert manifest_sha == (
              root / "payload-manifest.sha256"
          ).read_text(encoding="utf-8").strip()
          assert executor_sha == (
              root / "executor.sha256"
          ).read_text(encoding="utf-8").strip()
          print("FRESH_BOOTSTRAP_INNER_BINDING=PASS")
          PY
          printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'FRESH_BOOTSTRAP_DEPLOYABLE_POST_UPLOAD_BINDING=PASS\n'
          printf 'T1_ACCESS=false\n'
          printf 'LIVE_MUTATION=false\n'
          printf 'PRODUCTION_SERVICE_START=false\n'
          printf 'BOARD_ACCESS=false\n'
