name: N3W T1 fresh bootstrap deployable payload CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
      - "host/greenhouse-manager/**"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tools/n3w_t1_clean_product_deployment_gate.py"
      - "tools/n3w_broker_ingress_guard.py"
      - "tests/tools/test_n3w_t1_fresh_product_bootstrap.py"
      - "tests/tools/test_n3w_t1_fresh_product_staging_host.py"
      - "tests/tools/test_n3w_t1_clean_product_deployment_gate.py"
      - "infra/n3w-t1/production/docker-compose.fresh.yml"
      - "infra/n3w-t1/production/homeassistant-configuration.yaml"
      - "infra/n3w-t1/broker/mosquitto.conf"
      - "infra/n3w-t1/homeassistant/**"
      - "infra/n3w-t1/systemd/n3wfc4-broker-ingress-guard.service"
  push:
    branches: [main]
    paths:
      - ".github/workflows/n3w-t1-fresh-bootstrap-deployable-payload-ci.yml"
      - "host/greenhouse-manager/**"
      - "tools/n3w_t1_fresh_product_bootstrap.py"
      - "tools/n3w_t1_fresh_product_staging_host.py"
      - "tools/n3w_t1_clean_product_deployment_gate.py"
      - "tools/n3w_broker_ingress_guard.py"
      - "tests/tools/test_n3w_t1_fresh_product_bootstrap.py"
      - "tests/tools/test_n3w_t1_fresh_product_staging_host.py"
      - "tests/tools/test_n3w_t1_clean_product_deployment_gate.py"
      - "infra/n3w-t1/production/docker-compose.fresh.yml"
      - "infra/n3w-t1/production/homeassistant-configuration.yaml"
      - "infra/n3w-t1/broker/mosquitto.conf"
      - "infra/n3w-t1/homeassistant/**"
      - "infra/n3w-t1/systemd/n3wfc4-broker-ingress-guard.service"

permissions:
  contents: read

jobs:
  deployable-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTHORIZATION_ID: N3W_T1_MINIMAL_HOST_FRESH_PRODUCT_BOOTSTRAP_LIVE_APPLY_20261012_08
      HA_SOURCE_IMAGE: ghcr.io/home-assistant/home-assistant:2026.10.0
      HA_ARM64_DIGEST: sha256:0c73235a9140a9b02e4bf618d06d8c496b12ae70656ecddb0e02ad31ad122be4
      HA_EXPECTED_IMAGE_ID: sha256:b0e1ee82adfb19fa1ff3049034535633b1c4f0df6606721c0e77383854b99879
      BROKER_SOURCE_IMAGE: m.daocloud.io/docker.io/library/eclipse-mosquitto:2.1.2-alpine
      BROKER_ARM64_DIGEST: sha256:3184566df484a083411a0e70e92c87a264b8f0648df632f10eb23d54d99f4549
      BROKER_EXPECTED_IMAGE_ID: sha256:4c199d7c9d377d018313a2199f6839978f6fd2219c405ad664d0a830c14b9c7b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run source contract tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          python -m pytest -q             tests/tools/test_n3w_t1_fresh_product_bootstrap.py             tests/tools/test_n3w_t1_fresh_product_staging_host.py             tests/tools/test_n3w_t1_clean_product_deployment_gate.py
          python -m py_compile             tools/n3w_t1_fresh_product_bootstrap.py             tools/n3w_t1_fresh_product_staging_host.py             tools/n3w_t1_clean_product_deployment_gate.py

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build exact current ARM64 Manager
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fresh-deployable"
          mkdir -p "$WORK/payload/artifact"
          MANAGER_IMAGE="local/greenhouse-manager:fresh-${SOURCE_HEAD:0:12}"
          echo "MANAGER_IMAGE=$MANAGER_IMAGE" >> "$GITHUB_ENV"
          docker buildx build             --platform linux/arm64             --file host/greenhouse-manager/Dockerfile             --tag "$MANAGER_IMAGE"             --output "type=docker,dest=$WORK/payload/artifact/greenhouse-manager-arm64.tar"             host/greenhouse-manager
          docker load -i "$WORK/payload/artifact/greenhouse-manager-arm64.tar"
          MANAGER_IMAGE_ID="$(docker image inspect "$MANAGER_IMAGE" --format '{{.Id}}')"
          test "$(docker image inspect "$MANAGER_IMAGE" --format '{{.Architecture}}/{{.Os}}')" = "arm64/linux"
          echo "MANAGER_IMAGE_ID=$MANAGER_IMAGE_ID" >> "$GITHUB_ENV"

      - name: Materialize exact external ARM64 images
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fresh-deployable"
          docker pull --platform linux/arm64 "$HA_SOURCE_IMAGE@$HA_ARM64_DIGEST"
          docker pull --platform linux/arm64 "$BROKER_SOURCE_IMAGE@$BROKER_ARM64_DIGEST"
          docker tag "$HA_SOURCE_IMAGE@$HA_ARM64_DIGEST" local/n3w-homeassistant:2026.10.0-0c73235a
          docker tag "$BROKER_SOURCE_IMAGE@$BROKER_ARM64_DIGEST" local/n3w-mosquitto:2.1.2-3184566d
          test "$(docker image inspect local/n3w-homeassistant:2026.10.0-0c73235a --format '{{.Id}}')" = "$HA_EXPECTED_IMAGE_ID"
          test "$(docker image inspect local/n3w-mosquitto:2.1.2-3184566d --format '{{.Id}}')" = "$BROKER_EXPECTED_IMAGE_ID"
          docker save -o "$WORK/payload/artifact/homeassistant-arm64.tar" local/n3w-homeassistant:2026.10.0-0c73235a
          docker save -o "$WORK/payload/artifact/broker-arm64.tar" local/n3w-mosquitto:2.1.2-3184566d

      - name: Build exact fresh bootstrap payload
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fresh-deployable"
          PAYLOAD="$WORK/payload"
          mkdir -p             "$PAYLOAD/tools"             "$PAYLOAD/contract"             "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/production"             "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/broker"             "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/homeassistant/custom_components/n3w_mqtt_bootstrap"             "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/systemd"             "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/NetworkManager/dispatcher.d"             "$PAYLOAD/runtime-source/opt/HomeAssistant/tools"             "$PAYLOAD/runtime-source/usr/local/sbin"             "$PAYLOAD/runtime-source/etc/systemd/system"
          cp tools/n3w_t1_fresh_product_bootstrap.py "$PAYLOAD/tools/"
          cp host/greenhouse-manager/src/greenhouse_manager/bootstrap/fresh_installer.py "$PAYLOAD/contract/"
          cp tools/n3w_t1_fresh_product_bootstrap.py "$PAYLOAD/runtime-source/opt/HomeAssistant/tools/"
          cp tools/n3w_t1_device_provisioning_host.py "$PAYLOAD/runtime-source/opt/HomeAssistant/tools/"
          cp host/greenhouse-manager/src/greenhouse_manager/bootstrap/device_firstboot.py "$PAYLOAD/runtime-source/opt/HomeAssistant/tools/n3w_t1_device_firstboot.py"
          cp infra/n3w-t1/production/docker-compose.fresh.yml "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/production/"
          cp infra/n3w-t1/production/homeassistant-configuration.yaml "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/production/"
          cp infra/n3w-t1/broker/mosquitto.conf "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/broker/"
          cp infra/n3w-t1/homeassistant/custom_components/n3w_mqtt_bootstrap/__init__.py "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/homeassistant/custom_components/n3w_mqtt_bootstrap/"
          cp infra/n3w-t1/homeassistant/custom_components/n3w_mqtt_bootstrap/manifest.json "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/homeassistant/custom_components/n3w_mqtt_bootstrap/"
          cp tools/n3w_t1_clean_product_deployment_gate.py "$PAYLOAD/runtime-source/opt/HomeAssistant/tools/"
          cp tools/n3w_t1_broker_authenticated_readiness.py "$PAYLOAD/runtime-source/opt/HomeAssistant/tools/"
          cp infra/n3w-t1/broker-activation.env.example "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/"
          cp infra/n3w-t1/systemd/n3wfc4-broker-activation.service "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/systemd/"
          cp infra/n3w-t1/systemd/n3wfc4-services-activation.service "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/systemd/"
          cp infra/n3w-t1/NetworkManager/dispatcher.d/90-n3wfc4-broker-ingress-guard "$PAYLOAD/runtime-source/opt/HomeAssistant/infra/n3w-t1/NetworkManager/dispatcher.d/"
          cp tools/n3w_broker_ingress_guard.py "$PAYLOAD/runtime-source/usr/local/sbin/n3w-broker-ingress-guard"
          cp infra/n3w-t1/n3w-t1-provision "$PAYLOAD/runtime-source/usr/local/sbin/n3w-t1-provision"
          cp infra/n3w-t1/install-systemd-staged.sh "$PAYLOAD/runtime-source/usr/local/sbin/n3w-t1-systemd-staged-install"
          cp infra/n3w-t1/activate-systemd-production.sh "$PAYLOAD/runtime-source/usr/local/sbin/n3w-t1-production-activation-enable"
          cp infra/n3w-t1/systemd/n3wfc4-broker-ingress-guard.service "$PAYLOAD/runtime-source/etc/systemd/system/"
          cp infra/n3w-t1/systemd/n3wfc4-provision-resume.service "$PAYLOAD/runtime-source/etc/systemd/system/"

          python - "$PAYLOAD" "$SOURCE_HEAD" "$AUTHORIZATION_ID" "$MANAGER_IMAGE" "$MANAGER_IMAGE_ID" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          root = Path(sys.argv[1])
          head, authorization, manager_image, manager_id = sys.argv[2:]

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def normalized_hash(value):
              payload = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode()
              return hashlib.sha256(payload).hexdigest()

          config_keys = (
              "Entrypoint",
              "Cmd",
              "User",
              "Env",
              "WorkingDir",
              "Labels",
              "Healthcheck",
              "StopSignal",
              "Volumes",
              "ExposedPorts",
          )

          def config_contract(config):
              value = config if isinstance(config, dict) else {}
              result = {}
              sequence_fields = {"Entrypoint", "Cmd", "Env"}
              string_fields = {"User", "WorkingDir", "StopSignal"}
              mapping_fields = {
                  "Labels",
                  "Healthcheck",
                  "Volumes",
                  "ExposedPorts",
              }
              for key in config_keys:
                  observed = value.get(key)
                  if key in sequence_fields and observed is None:
                      observed = []
                  elif key in string_fields and observed is None:
                      observed = ""
                  elif key in mapping_fields and observed is None:
                      observed = {}
                  result[key] = observed
              return result

          def docker_archive_binding(path, image_ref):
              with tarfile.open(path, "r:*") as bundle:
                  manifest_member = bundle.getmember("manifest.json")
                  if not manifest_member.isfile():
                      raise RuntimeError("docker_archive_manifest_not_regular")
                  stream = bundle.extractfile(manifest_member)
                  if stream is None:
                      raise RuntimeError("docker_archive_manifest_unreadable")
                  manifest_bytes = stream.read()
                  manifest = json.loads(manifest_bytes)
                  matches = [
                      item
                      for item in manifest
                      if isinstance(item, dict)
                      and image_ref in (item.get("RepoTags") or [])
                  ]
                  if len(matches) != 1:
                      raise RuntimeError("docker_archive_tag_binding_invalid")
                  selected = matches[0]
                  config_path = selected.get("Config")
                  layers = selected.get("Layers")
                  if (
                      not isinstance(config_path, str)
                      or not isinstance(layers, list)
                      or not layers
                  ):
                      raise RuntimeError("docker_archive_record_invalid")
                  config_member = bundle.getmember(config_path)
                  if not config_member.isfile():
                      raise RuntimeError("docker_archive_config_not_regular")
                  config_stream = bundle.extractfile(config_member)
                  if config_stream is None:
                      raise RuntimeError("docker_archive_config_unreadable")
                  config_bytes = config_stream.read()
                  config_digest = hashlib.sha256(config_bytes).hexdigest()
                  config_leaf = Path(config_path).name.removesuffix(".json")
                  if config_leaf != config_digest:
                      raise RuntimeError("docker_archive_config_digest_path_mismatch")
                  config_doc = json.loads(config_bytes)
                  rootfs = config_doc.get("rootfs")
                  diff_ids = (
                      rootfs.get("diff_ids")
                      if isinstance(rootfs, dict)
                      else None
                  )
                  if not isinstance(diff_ids, list) or not diff_ids:
                      raise RuntimeError("docker_archive_rootfs_missing")
                  return {
                      "config_digest": "sha256:" + config_digest,
                      "config_contract": config_contract(
                          config_doc.get("config")
                      ),
                      "config_contract_sha256": normalized_hash(
                          config_contract(config_doc.get("config"))
                      ),
                      "rootfs_layers_sha256": normalized_hash(diff_ids),
                      "docker_archive_manifest_sha256": hashlib.sha256(
                          manifest_bytes
                      ).hexdigest(),
                      "docker_archive_record_sha256": normalized_hash(selected),
                  }

          images = {
              "manager": {
                  "image": manager_image,
                  "image_id": manager_id,
                  "platform": "linux/arm64",
                  "path": "artifact/greenhouse-manager-arm64.tar",
              },
              "homeassistant": {
                  "image": "local/n3w-homeassistant:2026.10.0-0c73235a",
                  "image_id": "sha256:b0e1ee82adfb19fa1ff3049034535633b1c4f0df6606721c0e77383854b99879",
                  "platform": "linux/arm64",
                  "path": "artifact/homeassistant-arm64.tar",
              },
              "broker": {
                  "image": "local/n3w-mosquitto:2.1.2-3184566d",
                  "image_id": "sha256:4c199d7c9d377d018313a2199f6839978f6fd2219c405ad664d0a830c14b9c7b",
                  "platform": "linux/arm64",
                  "path": "artifact/broker-arm64.tar",
              },
          }
          for record in images.values():
              path = root / record["path"]
              record["tar_sha256"] = sha(path)
              record["tar_size_bytes"] = path.stat().st_size
              inspected = json.loads(
                  subprocess.check_output(
                      ["docker", "image", "inspect", record["image"]],
                      text=True,
                  )
              )
              if (
                  not isinstance(inspected, list)
                  or len(inspected) != 1
                  or not isinstance(inspected[0], dict)
              ):
                  raise RuntimeError("image_inspect_shape_invalid")
              item = inspected[0]
              if item.get("Id") != record["image_id"]:
                  raise RuntimeError("image_config_digest_drift")
              if (
                  item.get("Architecture") != "arm64"
                  or item.get("Os") != "linux"
              ):
                  raise RuntimeError("image_platform_drift")
              rootfs = item.get("RootFS")
              layers = rootfs.get("Layers") if isinstance(rootfs, dict) else None
              if not isinstance(layers, list) or not layers:
                  raise RuntimeError("image_rootfs_layers_missing")
              archive_binding = docker_archive_binding(
                  path,
                  record["image"],
              )
              if archive_binding["config_digest"] != record["image_id"]:
                  raise RuntimeError("docker_archive_config_digest_drift")
              if (
                  archive_binding["rootfs_layers_sha256"]
                  != normalized_hash(layers)
              ):
                  raise RuntimeError("docker_archive_rootfs_drift")
              runtime_contract = config_contract(item.get("Config"))
              archive_contract = archive_binding.pop("config_contract")
              if (
                  archive_binding["config_contract_sha256"]
                  != normalized_hash(runtime_contract)
              ):
                  differing_fields = sorted(
                      key
                      for key in config_keys
                      if archive_contract.get(key)
                      != runtime_contract.get(key)
                  )
                  print(
                      "FRESH_CONFIG_CONTRACT_DIFF_FIELDS="
                      + ",".join(differing_fields)
                  )
                  raise RuntimeError("docker_archive_config_contract_drift")
              record.update(archive_binding)
              record["loaded_size_bytes"] = int(item["Size"])
          print("FRESH_CROSS_STORE_IMAGE_BINDING=PASS")
          print("FRESH_DOCKER_ARCHIVE_CONFIG_BINDING=PASS")

          image_lock = {
              "schema": "gh.n3w-t1-fresh-production-image-lock/1",
              "source_head": head,
              "manager": {
                  "source_sha": head,
                  "image": manager_image,
                  "image_id": manager_id,
                  "tar_sha256": images["manager"]["tar_sha256"],
                  "platform": "linux/arm64",
                  "entrypoint": ["greenhouse-manager"],
                  "user": "greenhouse",
                  "runtime_uid": 999,
                  "runtime_gid": 999,
                  "pull_policy": "never",
              },
              "homeassistant": {
                  "source_ref": "ghcr.io/home-assistant/home-assistant:2026.10.0",
                  "image": images["homeassistant"]["image"],
                  "manifest_digest": "sha256:0c73235a9140a9b02e4bf618d06d8c496b12ae70656ecddb0e02ad31ad122be4",
                  "image_id": images["homeassistant"]["image_id"],
                  "platform": "linux/arm64",
                  "entrypoint": ["/init"],
                  "effective_default_uid": 0,
                  "effective_default_gid": 0,
                  "pull_policy": "never",
              },
              "broker": {
                  "source_ref": "m.daocloud.io/docker.io/library/eclipse-mosquitto:2.1.2-alpine",
                  "image": images["broker"]["image"],
                  "manifest_digest": "sha256:3184566df484a083411a0e70e92c87a264b8f0648df632f10eb23d54d99f4549",
                  "image_id": images["broker"]["image_id"],
                  "platform": "linux/arm64",
                  "entrypoint": ["/docker-entrypoint.sh"],
                  "pull_policy": "never",
              },
          }

          records = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              records.append({
                  "path": path.relative_to(root).as_posix(),
                  "sha256": sha(path),
                  "size": path.stat().st_size,
              })

          transport_images = {
              label: {
                  "path": record["path"],
                  "tar_size_bytes": record["tar_size_bytes"],
                  "loaded_size_bytes": record["loaded_size_bytes"],
                  "image_ref": record["image"],
              }
              for label, record in images.items()
          }
          manifest = {
              "schema": "gh.n3w-t1-fresh-bootstrap-payload/1",
              "source_head": head,
              "authorization_id": authorization,
              "authorization_claimed": False,
              "authorization_consumed": False,
              "images": images,
              "image_lock": image_lock,
              "files": records,
              "transport": {
                  "schema": "gh.n3w-t1-fresh-transport/1",
                  "remote_staging_root": "/var/tmp",
                  "minimum_post_peak_free_bytes": 5 * 1024 * 1024 * 1024,
                  "payload_uncompressed_bytes": 0,
                  "image_load_order": ["homeassistant", "manager", "broker"],
                  "images": transport_images,
              },
              "secret_values_included": False,
              "production_service_start": False,
              "activation_authorized": False,
              "board_access": False,
          }
          data_size = sum(item["size"] for item in records)
          for _ in range(8):
              encoded = (json.dumps(manifest, sort_keys=True, indent=2) + "\n").encode()
              total = data_size + len(encoded)
              if manifest["transport"]["payload_uncompressed_bytes"] == total:
                  break
              manifest["transport"]["payload_uncompressed_bytes"] = total
          else:
              raise RuntimeError("payload_size_did_not_converge")
          (root / "payload-manifest.json").write_bytes(
              (json.dumps(manifest, sort_keys=True, indent=2) + "\n").encode()
          )
          PY

          python tools/n3w_t1_fresh_product_bootstrap.py             --payload-root "$PAYLOAD"             --phase self-check
          PYTHONDONTWRITEBYTECODE=1 python "$PAYLOAD/tools/n3w_t1_golden_master_build.py"             --payload-root "$PAYLOAD"             --release-id ci-golden-master             --phase self-check

          python - "$PAYLOAD" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          payload = Path(sys.argv[1])
          manifest = json.loads(
              (payload / "payload-manifest.json").read_text(encoding="utf-8")
          )
          lock = payload / "fresh-image-lock.json"
          lock.write_text(
              json.dumps(manifest["image_lock"], sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          env = {
              **os.environ,
              "GH_SYSTEM_ID": "freshci01",
              "GH_MQTT_USERNAME": "ghs_freshci01_manager",
              "GH_MQTT_CLIENT_ID": "gh-manager-freshci01",
              "GH_N3W_PAIRING_MANAGER_ID": "gh-manager-freshci01",
              "GH_N3W_PROVISIONING_USERNAME": "ghs_freshci01_provisioning",
              "GH_N3W_PROVISIONING_CLIENT_ID": "gh-provisioning-freshci01",
              "GH_MANAGER_IMAGE": manifest["images"]["manager"]["image"],
          }
          rendered = subprocess.check_output(
              [
                  "docker",
                  "compose",
                  "--profile",
                  "*",
                  "-f",
                  "infra/n3w-t1/production/docker-compose.fresh.yml",
                  "config",
                  "--format",
                  "json",
              ],
              text=True,
              env=env,
          )
          compose_json = payload / "fresh-compose.json"
          compose_json.write_text(rendered, encoding="utf-8")
          subprocess.run(
              [
                  "python",
                  "tools/n3w_t1_clean_product_deployment_gate.py",
                  "--compose-json",
                  str(compose_json),
                  "--image-lock-json",
                  str(lock),
              ],
              check=True,
          )
          lock.unlink()
          compose_json.unlink()
          print("FRESH_DEPLOYMENT_GATE=PASS")
          PY

          PYTHONDONTWRITEBYTECODE=1 sudo -E python - "$PAYLOAD" <<'PY'
          import hashlib
          import importlib.util
          import json
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          payload = Path(sys.argv[1]).resolve()
          tool_path = payload / "tools/n3w_t1_fresh_product_bootstrap.py"
          spec = importlib.util.spec_from_file_location("fresh_live", tool_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          manifest = json.loads(
              (payload / "payload-manifest.json").read_text(encoding="utf-8")
          )
          candidate = Path(tempfile.mkdtemp(prefix="n3w-fresh-rehearsal-"))
          candidate.rmdir()
          baseline_volumes = set(
              subprocess.check_output(
                  ["docker", "volume", "ls", "-q"],
                  text=True,
              ).split()
          )
          adapter = module.LiveFreshInstallerAdapters(
              payload,
              manifest,
              module.Runner(),
          )
          try:
              identity = adapter.create_identity(candidate)
              system_id = identity["system_id"]
              adapter.create_state(
                  candidate,
                  hashlib.sha256(system_id.encode()).hexdigest(),
              )
              adapter.create_broker(candidate, system_id)
