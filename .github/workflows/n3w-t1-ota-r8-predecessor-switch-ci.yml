name: T1 R8 predecessor switch CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/**"
      - "tests/tools/test_n3w_t1_ota_r8_predecessor_switch.py"
      - "docs/development/N3W_T1_OTA_V1_2_R8_PREDECESSOR_SWITCH_DESIGN_20261122.md"
      - ".github/workflows/n3w-t1-ota-r8-predecessor-switch-ci.yml"
  push:
    branches:
      - "review/t1-ota-r8-predecessor-switch-20261122"
    paths:
      - "tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/**"
      - "tests/tools/test_n3w_t1_ota_r8_predecessor_switch.py"
      - "docs/development/N3W_T1_OTA_V1_2_R8_PREDECESSOR_SWITCH_DESIGN_20261122.md"
      - ".github/workflows/n3w-t1-ota-r8-predecessor-switch-ci.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile predecessor switch sources
        run: |
          python -m py_compile \
            tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/contract.py \
            tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/executor.py \
            tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/remote_live.py \
            tools/execution_packages/n3w/t1_ota_r8_predecessor_switch/operator.py \
            tests/tools/test_n3w_t1_ota_r8_predecessor_switch.py
      - name: Run focused predecessor switch tests
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/tools/test_n3w_t1_ota_r8_predecessor_switch.py
