name: T1 R8 spare preflight CI

on:
  pull_request:
    paths:
      - "tools/execution_packages/n3w/t1_ota_r8_spare_preflight/preflight.py"
      - "tools/execution_packages/n3w/t1_ota_r8_bound_usb_readonly/verify.py"
      - "tests/tools/test_n3w_t1_ota_r8_spare_preflight.py"
      - "tests/tools/test_n3w_t1_ota_r8_bound_usb_readonly.py"
      - ".github/workflows/n3w-t1-ota-r8-spare-preflight-ci.yml"
  push:
    branches:
      - "review/t1-ota-r8-spare-preflight-20261122"
    paths:
      - "tools/execution_packages/n3w/t1_ota_r8_spare_preflight/preflight.py"
      - "tools/execution_packages/n3w/t1_ota_r8_bound_usb_readonly/verify.py"
      - "tests/tools/test_n3w_t1_ota_r8_spare_preflight.py"
      - "tests/tools/test_n3w_t1_ota_r8_bound_usb_readonly.py"
      - ".github/workflows/n3w-t1-ota-r8-spare-preflight-ci.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile focused R8 sources
        run: |
          python3 -m py_compile             tools/execution_packages/n3w/t1_ota_r8_spare_preflight/preflight.py             tools/execution_packages/n3w/t1_ota_r8_bound_usb_readonly/verify.py             tests/tools/test_n3w_t1_ota_r8_spare_preflight.py             tests/tools/test_n3w_t1_ota_r8_bound_usb_readonly.py
      - name: Run focused dependency-free tests
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          for path in (
              Path("tests/tools/test_n3w_t1_ota_r8_spare_preflight.py"),
              Path("tests/tools/test_n3w_t1_ota_r8_bound_usb_readonly.py"),
          ):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tests = [
                  getattr(module, name)
                  for name in sorted(dir(module))
                  if name.startswith("test_") and callable(getattr(module, name))
              ]
              for test in tests:
                  test()
              print(f"{path}: {len(tests)} tests PASS")
          PY
