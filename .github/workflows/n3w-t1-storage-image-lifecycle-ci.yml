name: N3W T1 storage headroom and image lifecycle CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-t1-storage-image-lifecycle-ci.yml"
      - "tools/n3w_t1_core_updater.py"
      - "tools/n3w_t1_core_updater_v2.py"
      - "tools/n3w_t1_core_updater_v2_common.py"
      - "tools/n3w_t1_core_updater_v2_state.py"
      - "tools/n3w_t1_core_updater_host.py"
      - "tools/n3w_t1_storage_image_lifecycle.py"
      - "tests/tools/test_n3w_t1_core_updater_a2.py"
      - "tests/tools/test_n3w_t1_storage_image_lifecycle.py"
      - "infra/n3w-t1/updater-releases/storage-image-lifecycle-policy.json"
      - "docs/development/N3W_T1_CORE_STACK_IMAGE_LIFECYCLE_AND_POST_ACCEPTANCE_CLEANUP_POLICY_20261109.md"
      - "docs/development/N3W_CURRENT_STATE.md"
      - "docs/development/N3W_CURRENT_STATE_INDEX.md"
      - "docs/development/N3W_PROJECT_WORKING_CONTEXT.md"
      - "docs/development/KNOWN_FAILURES_AND_REGRESSION_GUARDS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-t1-storage-image-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Compile storage and updater source
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/n3w_t1_core_updater.py \
            tools/n3w_t1_core_updater_finalize.py \
            tools/n3w_t1_core_updater_v2.py \
            tools/n3w_t1_core_updater_v2_common.py \
            tools/n3w_t1_core_updater_v2_state.py \
            tools/n3w_t1_core_updater_host.py \
            tools/n3w_t1_storage_image_lifecycle.py

      - name: Run focused regression tests
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<9"
          PYTHONPATH=tools python -m pytest -q \
            tests/tools/test_n3w_t1_core_updater_a2.py \
            tests/tools/test_n3w_t1_storage_image_lifecycle.py

      - name: Guard exact cleanup and no broad prune
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(
              Path("infra/n3w-t1/updater-releases/storage-image-lifecycle-policy.json")
              .read_text(encoding="utf-8")
          )
          assert policy["broad_docker_prune_allowed"] is False
          assert policy["cleanup"]["exact_image_id_only"] is True
          assert policy["cleanup"]["wildcard_delete_allowed"] is False
          assert policy["cleanup"]["docker_system_prune_allowed"] is False
          assert policy["cleanup"]["docker_image_prune_all_allowed"] is False
          assert policy["runtime_min_free_requirement"]["maintenance_reserve_is_runtime_minimum"] is False

          source = "\n".join(
              Path(path).read_text(encoding="utf-8")
              for path in (
                  "tools/n3w_t1_core_updater_v2.py",
                  "tools/n3w_t1_core_updater_host.py",
                  "tools/n3w_t1_storage_image_lifecycle.py",
              )
          )
          assert "docker system prune" not in source
          assert "docker image prune" not in source
          assert '("docker", "image", "rm", image_id)' in source
          print("STORAGE_IMAGE_LIFECYCLE_SOURCE_GUARD=PASS")
          PY
