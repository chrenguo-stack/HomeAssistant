name: N3W U13B P3 acceptance clean OTA source CI

on:
  pull_request:
    paths:
      - ".github/workflows/n3w-u13b-p3-acceptance-clean-ota-source-ci.yml"
      - "tools/execution_packages/n3w/r7a/u13b_p3_acceptance_clean_ota_source/**"
      - "tests/tools/test_n3w_t1_u13b_p3_acceptance_clean_ota_source.py"
      - "tools/n3w_t1_core_updater_ha_ipc.py"
      - "tools/n3w_t1_core_updater_ha_usb_state.py"
      - "tools/n3w_t1_core_updater_ha_prepare.py"
      - "tools/n3w_t1_core_updater_v2_common.py"
      - "infra/n3w-t1/upgrades/homeassistant-2026.10.3-u13b-physical.json"
      - "docs/development/N3W_T1_U13B_P3_ACCEPTANCE_ONLY_CLEAN_OTA_SOURCE_DESIGN_20261117.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3w-u13b-p3-clean-ota-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact non-live P3 source package
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python -m pip install "pytest>=8,<9"
          python -m py_compile             tools/execution_packages/n3w/r7a/u13b_p3_acceptance_clean_ota_source/executor.py             tools/n3w_t1_core_updater_ha_ipc.py             tools/n3w_t1_core_updater_ha_usb_state.py
          python tools/execution_packages/n3w/r7a/u13b_p3_acceptance_clean_ota_source/executor.py             --expected-package-commit "$SOURCE_HEAD"             --mode source-check
          python -m pytest -q             tests/tools/test_n3w_t1_u13b_p3_acceptance_clean_ota_source.py             tests/tools/test_n3w_t1_core_updater_ha_usb_r1.py::test_terminal_ha_usb_transaction_is_archived_before_next
