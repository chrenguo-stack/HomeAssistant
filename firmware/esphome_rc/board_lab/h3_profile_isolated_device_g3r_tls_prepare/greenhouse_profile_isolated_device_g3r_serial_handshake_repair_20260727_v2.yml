esphome:
  name: gh-2d9r-g3r-i2
  friendly_name: Greenhouse Stage 2D-9R G3R Serial Handshake Repair Candidate
  min_version: 2026.4.3

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  partitions: ../h3_profile_isolated_device_g3_prepare/stage2d9_g3_partitions_20260722_v65.csv
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - mqtt
        - nvs_flash
        - esp_hw_support
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_MBEDTLS_PSA_CRYPTO_C: y
      CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED: y
      CONFIG_MBEDTLS_CHACHA20_C: y
      CONFIG_MBEDTLS_POLY1305_C: y
      CONFIG_MBEDTLS_CHACHAPOLY_C: y
      CONFIG_MBEDTLS_HARDWARE_MPI: n
      CONFIG_MBEDTLS_X509_CRT_PARSE_C: y

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - greenhouse_pairing_client
      - greenhouse_profile_production_adapters
      - greenhouse_profile_lifecycle_controller
      - greenhouse_profile_isolated_acceptance
      - greenhouse_profile_isolated_device_driver
      - greenhouse_profile_isolated_device_g3_prepare
      - greenhouse_profile_isolated_device_g3r_executor
      - greenhouse_profile_isolated_device_g3r_ready_repeater

# The frozen V1 executor remains the sole command parser and NVS writer. A new
# read-only companion repeats only the observable PREPARE/VERIFY readiness state.
# The new build binding invalidates all earlier private commands, candidate
# digests, authorizations and immutable execution packages.
greenhouse_profile_isolated_device_g3r_executor:
  id: stage2d9r_g3r_serial_handshake_repair_executor
  partition_label: gh2d8_p2d9
  namespace_name: gh2d8_s2d9
  build_binding: "0a2c96b7615d9f222cf72fcf899b6caf3a7c875f"
  unlock_digest: "3650d44f8761f21dc1931fbd9b6ba6a1d9da92ffa469b3d4f98ee5411a6809e3"
  ca_pem_sha256: "cfcb6638ed61731270f3bf8e9e262c1512fbca8ff34d4b08b62186453233e963"

greenhouse_profile_isolated_device_g3r_ready_repeater:
  id: stage2d9r_g3r_ready_repeater
  partition_label: gh2d8_p2d9
  namespace_name: gh2d8_s2d9
  repeat_interval_ms: 1000
  repeat_window_ms: 180000
