esphome:
  name: gh-n3w-phase3-relay
  friendly_name: Greenhouse N3-W Phase 3 Generic Role Compile Target
  min_version: 2026.4.3

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - nvs_flash
        - esp_wifi

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - greenhouse_n3w_core

# Logical role label only. The same generic component is compiled for both
# Phase 3 role checks and contains no factory/customer/peer binding.
greenhouse_n3w_core:
