esphome:
  name: gh-n3w-phase4-generic
  friendly_name: Greenhouse N3-W Phase 4 Generic Physical Harness
  min_version: 2026.4.3

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - nvs_flash
        - esp_event
        - esp_netif
        - esp_wifi
        - esp_http_client

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# Generic first-use access point only. No customer/site STA credential is present
# in the public firmware source. Captive Portal writes the user's Wi-Fi choice at
# first use; later nodes repeat the same independent process.
wifi:
  reboot_timeout: 0s
  ap:
    ssid: "Greenhouse N3-W Setup"

captive_portal:

# MQTT is deliberately inert until gh.pair.credentials/2 has been authenticated,
# persisted, and acknowledged. The component replaces every runtime Broker field
# before enabling the client. Keep IDF network waits off the ESPHome main loop so
# loss of Direct Wi-Fi cannot starve the task watchdog. Lab logs remain on USB and
# are not forwarded through the same MQTT path that is disappearing.
mqtt:
  broker: 127.0.0.1
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  idf_send_async: true
  log_topic: null

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - greenhouse_n3w_core

greenhouse_n3w_core:
  id: n3w_phase4_core
  phase4_source_harness: true
  phase4_product_runtime: true
  phase4_lab_diagnostics: true

# Phase 4 lab-only observability. The payload includes the device-generated
# one-time pairing PoP and must stay in the private physical-session evidence root.
# It is never a factory constant and disappears after successful pairing ACK.
interval:
  - interval: 3s
    then:
      - lambda: |-
          const std::string pairing_payload = id(n3w_phase4_core).pairing_qr_payload();
          if (!pairing_payload.empty()) {
            ESP_LOGI(
                "phase4_lab",
                "PHASE4_PAIRING_QR_PAYLOAD=%s",
                pairing_payload.c_str());
          }

  # Role-neutral synthetic telemetry is intentionally confined to this lab target.
  # It exercises the real Direct -> Discovery -> RelayActive -> Direct state machine
  # without introducing a factory NODE_ID, SYSTEM_ID, peer MAC, LMK, or site secret.
  # boot_id and seq are allocated by the product component from its durable monotonic
  # boot-session state. The harness must never synthesize or randomize those values.
  #
  # n3w_u is intentionally compact because encrypted Relay telemetry plaintext is
  # capped at 1024 bytes. Lab-only key mapping:
  #   ok = synchronous encrypted-unicast submissions accepted by esp_now_send
  #   f  = synchronous encrypted-unicast submission failures
  #   fe = first failure DriverError code
  #   fr = first failure raw esp_err_t
  #   fc/fp = Wi-Fi current channel / encrypted peer channel at first failure
  #   sc/sp = Wi-Fi current channel / encrypted peer channel at first success
  - interval: 5s
    then:
      - lambda: |-
          if (!id(n3w_phase4_core).runtime_ready()) return;

          std::string boot_id;
          uint32_t current_seq = 0;
          if (!id(n3w_phase4_core).take_telemetry_identity(
                  &boot_id, &current_seq)) {
            return;
          }

          const uint64_t uptime_ms = static_cast<uint64_t>(millis());
          const auto path_before = id(n3w_phase4_core).path_state();
          const auto &latency = id(n3w_phase4_core).latency_diagnostics();
          const std::string telemetry =
              "{\"schema\":\"gh.telemetry/1\",\"node_id\":\"" +
              id(n3w_phase4_core).node_id() +
              "\",\"boot_id\":\"" + boot_id +
              "\",\"seq\":" + std::to_string(current_seq) +
              ",\"uptime_ms\":" + std::to_string(uptime_ms) +
              ",\"cap_hash\":\"phase4lab\",\"fw_version\":\"phase4-simple\"," +
              "\"reset_reason_raw\":" +
              std::to_string(id(n3w_phase4_core).reset_reason_raw()) +
              ",\"reset_reason\":\"" +
              std::string(id(n3w_phase4_core).reset_reason_name()) +
              "\",\"wdt_breadcrumb\":{" +
              "\"valid\":" +
              std::string(id(n3w_phase4_core).previous_rtc_breadcrumb_valid()
                              ? "true"
                              : "false") +
              ",\"stage\":" +
              std::to_string(id(n3w_phase4_core).previous_rtc_breadcrumb_stage()) +
              ",\"stage_name\":\"" +
              std::string(id(n3w_phase4_core).previous_rtc_breadcrumb_stage_name()) +
              "\",\"arg0\":" +
              std::to_string(id(n3w_phase4_core).previous_rtc_breadcrumb_arg0()) +
              ",\"arg1\":" +
              std::to_string(id(n3w_phase4_core).previous_rtc_breadcrumb_arg1()) +
              ",\"uptime_ms\":" +
              std::to_string(id(n3w_phase4_core).previous_rtc_breadcrumb_uptime_ms()) +
              ",\"marker_sequence\":" +
              std::to_string(
                  id(n3w_phase4_core).previous_rtc_breadcrumb_marker_sequence()) +
              "},\"n3w_latency\":{" +
              "\"wifi_down_ms\":" +
              std::to_string(latency.wifi_down_ms) +
              ",\"mqtt_down_ms\":" +
              std::to_string(latency.mqtt_down_ms) +
              ",\"direct_fail_first_ms\":" +
              std::to_string(latency.direct_fail_first_ms) +
              ",\"direct_fail_count\":" +
              std::to_string(latency.direct_fail_count) +
              ",\"discovery_enter_ms\":" +
              std::to_string(latency.discovery_enter_ms) +
              ",\"first_scan_ms\":" +
              std::to_string(latency.first_scan_ms) +
              ",\"relay_ad_seen_ms\":" +
              std::to_string(latency.relay_ad_seen_ms) +
              ",\"challenge_tx_ms\":" +
              std::to_string(latency.challenge_tx_ms) +
              ",\"challenge_submit_failure_count\":" +
              std::to_string(latency.challenge_submit_failure_count) +
              ",\"challenge_submit_first_driver_error\":" +
              std::to_string(latency.challenge_submit_first_driver_error) +
              ",\"challenge_submit_last_driver_error\":" +
              std::to_string(latency.challenge_submit_last_driver_error) +
              ",\"challenge_submit_first_error_raw\":" +
              std::to_string(latency.challenge_submit_first_error_raw) +
              ",\"challenge_submit_last_error_raw\":" +
              std::to_string(latency.challenge_submit_last_error_raw) +
              ",\"accept_rx_ms\":" +
              std::to_string(latency.accept_rx_ms) +
              ",\"relay_active_ms\":" +
              std::to_string(latency.relay_active_ms) +
              ",\"first_relay_tx_ms\":" +
              std::to_string(latency.first_relay_tx_ms) +
              "},\"n3w_u\":{" +
              "\"ok\":" +
              std::to_string(latency.unicast_submit_success_count) +
              ",\"f\":" +
              std::to_string(latency.unicast_submit_failure_count) +
              ",\"fe\":" +
              std::to_string(latency.unicast_submit_first_failure_driver_error) +
              ",\"fr\":" +
              std::to_string(latency.unicast_submit_first_failure_error_raw) +
              ",\"fc\":" +
              std::to_string(latency.unicast_submit_first_failure_current_channel) +
              ",\"fp\":" +
              std::to_string(latency.unicast_submit_first_failure_peer_channel) +
              ",\"sc\":" +
              std::to_string(latency.unicast_submit_first_success_current_channel) +
              ",\"sp\":" +
              std::to_string(latency.unicast_submit_first_success_peer_channel) +
              "}," +
              "\"measurements\":{},\"quality\":{}," +
              "\"power\":{\"source\":\"unknown\",\"low\":false}," +
              "\"phase4_lab\":true}";
          const bool accepted = id(n3w_phase4_core).send_telemetry_json(
              telemetry, boot_id, current_seq);
          const auto path_after = id(n3w_phase4_core).path_state();
          ESP_LOGI(
              "phase4_lab",
              "PHASE4_LAB_TELEMETRY seq=%u path_before=%u path_after=%u accepted=%s",
              static_cast<unsigned>(current_seq),
              static_cast<unsigned>(path_before),
              static_cast<unsigned>(path_after),
              accepted ? "true" : "false");
