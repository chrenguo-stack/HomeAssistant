esphome:
  name: gh-n3w-product-s5-relay-compile
  friendly_name: N3-W Product S5 Relay Compile Target
  min_version: 2026.4.3
  build_path: !env_var S5_BUILD_PATH
  # Frozen S5 is a regression target for the retired radio stack. Keep the
  # compatibility implementation opt-in here; active product configs must not
  # inherit this flag.
  build_flags:
    - "-DGREENHOUSE_N3W_ENABLE_LEGACY_RADIO=1"

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - nvs_flash
        - esp_wifi

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - greenhouse_n3w_core
      - greenhouse_n3w_product_core
      - greenhouse_n3w_product_runtime

greenhouse_n3w_core:

greenhouse_n3w_product_core:

greenhouse_n3w_product_runtime:
  id: n3w_product_integration
  role: relay
  execution_enabled: false
  pmk_hex: "000102030405060708090a0b0c0d0e0f"
  last_direct_channel: 6

# Child and Relay consume the same application component and differ only in
# post-registration role configuration. No peer MAC, NODE_ID, gateway binding,
# LMK, Wi-Fi credential, Broker credential, or production endpoint is present.
