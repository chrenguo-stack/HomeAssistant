esphome:
  name: gh-n3w-s5-relay-mgr-compile
  friendly_name: N3-W Product S5 Relay Manager Transport Compile Target
  min_version: 2026.4.3
  build_path: !env_var S5_BUILD_PATH

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - nvs_flash
        - esp_wifi

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# Compile the generic network and MQTT ownership needed by the concrete S5
# transport without configuring any Wi-Fi network. MQTT is disabled on boot and
# the loopback broker value is compile-only; no live connection is executed.
network:

mqtt:
  broker: "127.0.0.1"
  enable_on_boot: false
  discovery: false

external_components:
  - source:
      type: local
      path: ../../../components
    components:
      - greenhouse_n3w_core
      - greenhouse_n3w_product_core
      - greenhouse_n3w_product_runtime
      - greenhouse_n3w_s5_manager_transport

greenhouse_n3w_core:

greenhouse_n3w_product_core:

greenhouse_n3w_product_runtime:
  id: n3w_product_integration
  role: relay
  execution_enabled: false
  pmk_hex: "000102030405060708090a0b0c0d0e0f"
  last_direct_channel: 6

greenhouse_n3w_s5_manager_transport:
  id: n3w_product_manager_transport
  product_runtime_id: n3w_product_integration
  execution_enabled: false

# The concrete transport is compiled into this image but private runtime
# composition is intentionally not invoked. Public/factory behavior therefore
# remains inert-by-default.
