esphome:
  name: gh-n3w-production-core-compile
  friendly_name: Greenhouse N3-W Production Core Compile Probe
  min_version: 2026.4.3

esp32:
  board: esp32-c6-devkitm-1
  variant: ESP32C6
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - nvs_flash
        - esp_event
        - esp_netif
        - esp_wifi
        - esp_http_client

logger:
  level: WARN
  hardware_uart: USB_SERIAL_JTAG

wifi:
  reboot_timeout: 0s
  ap:
    ssid: "GH N3W Production Compile"

captive_portal:

# Compile-only probe. Runtime Broker fields remain inert until authenticated
# pairing material is installed by greenhouse_n3w_core.
mqtt:
  broker: 127.0.0.1
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  idf_send_async: true
  log_topic: null

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - greenhouse_n3w_core

# Production mode deliberately uses no Phase-4 lab switch. This target exists
# only to prove the product runtime compiles with the lab implementation gated
# out; it is not the final F1.0-RC2 production firmware target.
greenhouse_n3w_core:
  id: n3w_product_core
  product_runtime: true
