# N3-W production transport integration only.
#
# This package deliberately does not build or submit telemetry yet. Its only job
# is to attach the de-harnessed product runtime to the F1.0-RC2 whole-device
# baseline and provide the inert MQTT client that the runtime will reconfigure
# after authenticated Manager pairing.
mqtt:
  id: n3w_mqtt_client
  broker: 127.0.0.1
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  idf_send_async: true
  log_topic: null

greenhouse_n3w_product_core:
  id: n3w_product_core
  product_runtime: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(n3w_pairing_display_enabled) = true;
          const bool provisioned = id(n3w_product_core).provisioned();
          id(n3w_product_provisioned) = provisioned;

          if (!id(wifi_component).is_connected()) {
            id(n3w_pairing_display_ready) = false;
            if (!provisioned) {
              const std::string ap_ssid = App.get_name();
              id(setup_qr).set_value("WIFI:T:nopass;S:" + ap_ssid + ";;");
            }
            return;
          }

          if (provisioned || !id(n3w_product_core).pairing_handoff_ready()) {
            id(n3w_pairing_display_ready) = false;
            return;
          }

          const std::string payload = id(n3w_product_core).pairing_qr_payload();
          if (payload.empty()) {
            id(n3w_pairing_display_ready) = false;
            return;
          }

          id(pairing_qr).set_value(payload);
          id(n3w_pairing_display_ready) = true;
