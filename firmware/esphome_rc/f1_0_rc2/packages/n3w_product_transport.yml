mqtt:
  id: n3w_mqtt_client
  broker: 127.0.0.1
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  idf_send_async: true
  log_topic: null

greenhouse_n3w_core:
  id: n3w_product_core
  product_runtime: true
  firmware_version: "${project_version}"

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(n3w_pairing_display_enabled) = true;
          const bool provisioned = id(n3w_product_core).provisioned();
          id(n3w_product_provisioned) = provisioned;
          const int registration_display_state =
              id(n3w_product_core).registration_display_state_code();
          id(n3w_registration_display_state) = registration_display_state;
          id(n3w_registration_display_error) =
              id(n3w_product_core).registration_display_error_code();

          // Keep the product setup/registration surface physically visible.
          // After the bounded SUCCESS latch expires, provisioned nodes return
          // to the existing five-page cadence automatically.
          if (!provisioned || registration_display_state == 4 ||
              registration_display_state == 5) {
            id(display_page) = 4;
          }

          if (provisioned || !id(wifi_component).is_connected() ||
              !id(n3w_product_core).registration_display_ready()) {
            id(n3w_registration_qr_ready) = false;
            id(n3w_pairing_display_ready) = false;
            return;
          }

          const std::string payload = id(n3w_product_core).registration_qr_payload();
          if (payload.empty()) {
            id(n3w_registration_qr_ready) = false;
            id(n3w_pairing_display_ready) = false;
            return;
          }

          static std::string last_registration_payload;
          if (payload != last_registration_payload) {
            id(pairing_qr).set_value(payload);
            last_registration_payload = payload;
          }
          id(n3w_registration_qr_ready) = true;
          id(n3w_pairing_display_ready) = true;
