[Unit]
Requires=n3w-t1-ha-ota.service
After=n3w-t1-ha-ota.service

[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --project-name ${N3WFC4_COMPOSE_PROJECT_NAME} --env-file ${N3WFC4_COMPOSE_ENV_FILE} -f ${N3WFC4_COMPOSE_FILE} -f /opt/HomeAssistant/infra/n3w-t1/production/docker-compose.ha-ota.yml --profile application up --no-deps --no-log-prefix --abort-on-container-exit manager homeassistant
ExecStop=
ExecStop=/usr/bin/docker compose --project-name ${N3WFC4_COMPOSE_PROJECT_NAME} --env-file ${N3WFC4_COMPOSE_ENV_FILE} -f ${N3WFC4_COMPOSE_FILE} -f /opt/HomeAssistant/infra/n3w-t1/production/docker-compose.ha-ota.yml stop homeassistant manager
